 id:"b6",nav:"Boundaries",title:"Preserve, bound, release",type:"content",
 html:`<p class="lead">Three disciplines that hold a window together when something goes wrong.</p>
 <div class="visual-card"><div class="visual-title">Preserve evidence before correcting</div>
 <p>Logs, partial outputs, failed keys, timestamps and run identities may be essential to prove the failure mechanism and the recovery boundary. A corrected execution gets its own identity; the original failure stays part of the audit trail rather than being overwritten by the thing that fixed it.</p>
 </div>
 <div class="visual-card"><div class="visual-title">Use boundaries, not instinct</div>
 <p>Restart from the earliest point required to guarantee valid downstream output, not from the cheapest-looking step.</p>
 <div class="principle"><strong>The boundary test</strong><br>What is the earliest completed state whose inputs and evidence are still valid after the defect or change? Everything downstream of the first invalid state must be regenerated or independently re-proven.</div>
 </div>
 <div class="visual-card"><div class="visual-title">Handoffs become release points</div>
 <p>When one migration activity feeds another, the handoff states that the preceding checkpoint passed and identifies the exact released artefact.</p>
 <div class="quote">\u201cCustomer transformed output for RUN-CUST-01 is released to load. Input and output reconciliation passed. Source, reference and build identities match the cutover manifest. Controlled exceptions are unchanged. Evidence is stored in the run folder.\u201d</div>
 <p class="small">Parallel activity can continue if its inputs and outputs are demonstrably independent of the failed or changed component. Demonstrably is the word carrying the risk.</p>
 </div>`
},
{
 id:"b7",nav:"Technical is not final",title:"Reconcile live, and keep the two acceptances apart",type:"content",
 html:`<p class="lead">At each population-changing step, record input, output, exceptions and rejects, and any unexplained difference. Do not postpone reconciliation until Monday.</p>
 <div class="principle"><strong>The customer equation</strong><br>18,612 = 18,573 submitted + 34 approved pre-load exceptions + 5 approved exclusions.</div>
 <h3>Technical success is not cutover success</h3>
 <p>The target can accept every record while migration semantics are wrong. Post-load validation is not a formality to be completed on Monday if there is time; it is the step that decides whether any of this worked.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>A zero-reject result arrives at exactly the moment everyone most wants to hear good news, after hours of tension, late at night. That timing is not incidental to why it gets over-interpreted.</p></div></div>`
},
{
 id:"b8",nav:"The 42 arrive",title:"22:00 \u2013 The semantic defect",type:"mcq",
 _correctIndex:0,
 html:`<p class="lead">Validation reports 42 UK customers in the Belgian legal entity. The total count still matches. Go-live is Monday and the room has been here since six.</p>
 <h3>What is your immediate response?</h3>`,
 options:[
   {label:"Isolate the keys, confirm expected against actual context, protect downstream activity that depends on routing, and begin tracing without a cause.", correct:true, feedback:"Correct. The established case does not define the root cause and neither should you. Protecting dependent activity is the part most often forgotten, and it is the part that stops the problem spreading overnight."},
   {label:"Establish the root cause first and quickly, since every subsequent decision including recovery scope surely depends on understanding the mechanism properly.", correct:false, feedback:"Root cause does drive recovery scope and it is not the first action. Isolating the keys and protecting dependants happens while tracing proceeds, not after it."},
   {label:"Report it immediately to the Data Migration Lead so the programme can decide right away whether go-live remains viable on Monday.", correct:false, feedback:"The Lead does need to know, and they need decision-grade evidence rather than an alarm. Isolate and establish what remains valid first, which takes minutes."},
   {label:"Correct the 42 records in the target straight away so customer data is right for Monday, then investigate the mechanism during stabilisation later.", correct:false, feedback:"Repairing during diagnosis may hide the mechanism, leave other affected records undiscovered, and create a target state the migration process cannot reproduce."}
 ]
},
{
 id:"b9",nav:"Scope and pressure",title:"Decide what the finding invalidates, without lowering the threshold",type:"content",
 html:`<p class="lead">A semantic defect may invalidate only a bounded population, or it may reveal a wider mechanism. Determine the scope from evidence before recommending recovery.</p>
 <ol class="framework-checks">
   <li>Freeze the evidence and the key list.</li>
   <li>Confirm the expected UK context from controlled source and rule evidence.</li>
   <li>Confirm the actual Belgian target context.</li>
   <li>Check whether the 42 share a repeatable signature.</li>
   <li>Trace to the first divergence.</li>
   <li>Calculate the mechanism-based population where possible.</li>
   <li>Only then state a root cause, and only if proven.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Do not let the clock lower the proof threshold</div><p>If Monday is approaching, speed up investigation, communication and decision cadence. Speeding up is legitimate. Redefining wrong data as acceptable because time is short is not, and it is remarkably easy to do by accident at midnight.</p></div>`
},
{
 id:"b10",nav:"Evidence and recovery",title:"Give the Lead decision-grade evidence, then control the recovery",type:"content",
 html:`<div class="quote">\u201cCustomer load is technically complete: 18,573 accepted, zero rejects. Semantic validation has found 42 UK customers in the Belgian legal entity. Those keys are isolated and the exact root cause is not yet proven. I am tracing the first divergence and checking whether the mechanism extends beyond the 42. I recommend holding dependent acceptance for the affected routing scope until that evidence is complete.\u201d</div>
 <p class="small">Affected population, known impact, current cause status, what remains valid, recovery options, next evidence point. Wider Go or No-Go decisions remain outside your authority, and that boundary is easier to hold when the evidence you supply is good enough to decide with.</p>
 <h3>If correction is authorised</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Recovery control</th><th>Required evidence</th></tr></thead><tbody>
 <tr><td>Population</td><td>Exact affected keys or mechanism-based scope</td></tr>
 <tr><td>Correction</td><td>Approved code, reference or configuration change</td></tr>
 <tr><td>Baseline</td><td>New build and reference identity</td></tr>
 <tr><td>Boundary</td><td>Safe restart point</td></tr>
 <tr><td>Target treatment</td><td>Controlled update, delete or reload method</td></tr>
 <tr><td>Validation</td><td>Affected, regression and downstream checks</td></tr>
 <tr><td>Run identity</td><td>A separate recovery run</td></tr>
 </tbody></table></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Recovery_Run_Pack.xlsx</strong><p class="small">The seven recovery controls with the evidence each one requires, ready to complete inside a window.</p></div><a class="btn secondary" href="/assets/downloads/Recovery_Run_Pack.xlsx" download>Download</a></div>`
},
{
 id:"b11",nav:"Validate twice",title:"Validate the recovery twice, then close the incident",type:"content",
 html:`<p class="lead">Prove the affected population is corrected, and prove the recovery created no unexplained changes outside its intended scope.</p>
 <ul class="framework-checks">
   <li>The affected 42 now match their expected context.</li>
   <li>No affected key is missing or duplicated.</li>
   <li>The unaffected comparison population is unchanged except for approved effects.</li>
   <li>The population still reconciles.</li>
   <li>Dependent outputs are revalidated where relevant.</li>
 </ul>
 <p>If customer context, addresses or other parent data changed during recovery, recheck the dependent migration outputs rather than assuming they remain valid. A correction upstream can invalidate something downstream that never failed.</p>
 <div class="principle"><strong>Close the incident, not merely the ticket</strong><br>Closure requires corrected data, reconciliation, validation, updated evidence, downstream confirmation where needed, and a recorded control improvement or follow-up. A ticket can be closed in thirty seconds; an incident cannot.</div>`
},
{
 id:"b12",nav:"Into stabilisation",title:"From cutover into stabilisation",type:"content",
 html:`<p class="lead">Once the planned migration completes, your job shifts from executing a runbook to watching live data for migration-related defects and supporting rapid diagnosis.</p>
 <div class="tp-table-wrap"><table class="tp-table"><caption>The stabilisation baseline</caption><thead><tr><th>Baseline item</th><th>Record</th></tr></thead><tbody>
 <tr><td>Final accepted runs</td><td>Run IDs and builds</td></tr>
 <tr><td>Population</td><td>Accepted, exceptions and exclusions</td></tr>
 <tr><td>Open items</td><td>Known defects and decisions</td></tr>
 <tr><td>Validation</td><td>Passed and conditional checks</td></tr>
 <tr><td>Recovery history</td><td>Corrections and reruns</td></tr>
 <tr><td>Evidence index</td><td>Where the controlled proof lives</td></tr>
 </tbody></table></div>
 <p>This becomes the reference point for every early-life investigation. Without it, each Monday question restarts from nothing and gets answered from memory.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Support without becoming the permanent data helpdesk</div><p>Migration hypercare resolves migration-originated issues, transfers evidence and knowledge, and progressively hands routine ownership to the appropriate operational teams. A hypercare that never ends is usually one that never transferred anything.</p></div></div>`
},
{
 id:"b13",nav:"Whose defect",title:"Migration defect, application issue, or neither?",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">A user problem after go-live is not automatically a migration defect. Four evidence patterns, four different owners. Explore each, and answer the test underneath.</p>`,
 items: originPatterns,
 takeawayHtml:`<div class="principle"><strong>Diagnosis before correction, still</strong><br>The discipline does not relax after go-live. Changing correct migrated data in response to the wrong diagnosis is worse than the original report, because now nothing in the target matches what was approved.</div>`
},
{
 id:"b14",nav:"Watch",title:"Watch the right signals",type:"selectAll",
 html:`<p class="lead">Early-life support is mostly a question of where you are looking. Six signals worth monitoring. Explore each.</p>`,
 options: earlyLifeSignals,
 coaching: signalCoaching,
 hint:"Explore every signal before continuing.",
 closingHtml:`<div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Stabilisation_Triage.xlsx</strong><p class="small">Business key, expected state, actual state, first divergence, affected population and severity, one row per report.</p></div><a class="btn secondary" href="/assets/downloads/Stabilisation_Triage.xlsx" download>Download</a></div>`
},
{
 id:"b15",nav:"The capstone",title:"Consultant situations \u2013 Five moments from 18:40 to Monday",type:"situations",
 html:`<p class="lead">Five decisions from the window you have just worked through. In each one somebody is waiting, and in each one the comfortable answer is available immediately.</p>`,
 items: capstoneEvents,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Monday Morning Shortcut", name:"Owen", role:"Data Migration Consultant", project:"Insurance ERP",
   src:"/assets/audio/lesson6-fromfield-owen.mp3",
   reflection:"After your last go-live, how many reported defects turned out to be migration defects?"
 })}</div>`
},
{
 id:"b16",nav:"Final practical",title:"Build it \u2013 The execution-to-stabilisation evidence pack",type:"reflection",
 html:`<p class="lead">The final DMC practical. Produce the complete evidence pack for the window you have just run, demonstrating that you can operate the role rather than describe it.</p>
 <ol class="framework-checks">
   <li>Completed cutover run record, with planned against actual timings.</li>
   <li>Deviation log, and one decision-grade update.</li>
   <li>Population reconciliation.</li>
   <li>Technical load outcome.</li>
   <li>Semantic validation summary.</li>
   <li>The 42-record investigation evidence, without an invented root cause.</li>
   <li>Controlled recovery plan.</li>
   <li>Recovery and regression evidence.</li>
   <li>Stabilisation issue triage.</li>
   <li>Final migration handover and evidence index.</li>
 </ol>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">The pass standard</div><p>Another experienced consultant should be able to understand exactly what ran, what changed, what failed, what was recovered, what remains open, and why the final status is justified. Not whether you were busy. Whether the record stands on its own.</p></div></div>
 <p class="lead">Write the pack below. Prioritise the decision-grade update, the 42-record evidence and the final handover, which are where these packs usually thin out.</p>
 <textarea id="reflection" placeholder="RUN RECORD (planned vs actual): ...&#10;DEVIATIONS: ...&#10;RECONCILIATION: ...&#10;TECHNICAL OUTCOME: ...&#10;SEMANTIC VALIDATION: ...&#10;THE 42 - EVIDENCE: ...&#10;RECOVERY PLAN: ...&#10;STABILISATION TRIAGE: ...&#10;HANDOVER AND OPEN ITEMS: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Final_Migration_Evidence_Index.xlsx</strong><p class="small">Every artefact, its run identity and its location, so the whole pack can be navigated by somebody who was not there.</p></div><a class="btn secondary" href="/assets/downloads/Final_Migration_Evidence_Index.xlsx" download>Download</a></div>`,
 minLength:90,
 checks:[
   { test:/planned|actual|variance|18m|17m|42m|31m/i, strength:"Your run record compares planned against actual rather than only reporting what happened.", gap:"Record planned against actual timings, and explain material variance rather than just noting it." },
   { test:/18,?612|18,?573|34|reconcil/i, strength:"Your reconciliation uses the control equation rather than a single total.", gap:"Reconcile the population: 18,612 total, 18,573 submitted and accepted, 34 approved exceptions, 5 approved exclusions." },
   { test:/technically complete|not (yet )?accepted|semantic/i, strength:"You separated technical acceptance from migration acceptance in your outcome statement.", gap:"Keep the two acceptances apart. Technically complete and accepted are different statuses and only one was earned on the night." },
   { test:/not (yet )?(proven|established|known)|root cause .*(not|unknown)|do not know/i, strength:"Your 42-record evidence reports the finding without asserting a cause.", gap:"State that the root cause is not established, and what tracing you are doing, rather than proposing a mechanism." },
   { test:/regression|unaffected|outside .*(scope|population)|unchanged/i, strength:"Your recovery evidence proves the absence of unintended change, not only the intended one.", gap:"Prove the recovery twice: the affected population corrected, and the unaffected comparison population unchanged." },
   { test:/owner|closure condition|next action|open item|hand(ed|over)/i, strength:"Your handover gives open items owners, next actions and closure conditions.", gap:"Every unresolved item needs status, affected population, evidence, owner, next action and closure condition." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>Run record and deviations.</strong> Baseline confirmed before the first executable step: run identity, final source snapshot, approved rule and reference versions, promoted build, target environment and runbook version all recorded. Transform ran materially longer than either prior test cycle, at which point row progress, logs, resource state and error signatures were inspected: progressing steadily, no blocking error, no concentrated retry signature. Recorded as a deviation with evidence and a continue decision under observation, with a named next checkpoint rather than a clock-driven judgement.</div>
 <div class="quote"><strong>Reconciliation and technical outcome.</strong> Population reconciles by key: 18,612 source-cycle records resolving to 18,573 submitted, 34 approved pre-load exceptions and 5 approved exclusions, every key carrying exactly one status. The target accepted 18,573 with zero rejects. That is technical completion for the submitted population. It is not migration acceptance, and the pack says so in those words rather than reporting a green result and leaving the reader to infer the limit.</div>
 <div class="quote"><strong>The 42.</strong> Semantic validation found 42 UK customers in the Belgian legal entity with the total count still matching. Keys are isolated and frozen, expected UK context confirmed from controlled source and rule evidence, actual Belgian context confirmed in target. We are checking whether the 42 share a repeatable signature and tracing to the first divergence. Root cause is not established and the pack proposes none. Critically, the remaining records are not described as unaffected: until the mechanism is bounded, that cannot be demonstrated. Dependent acceptance for the affected routing scope is held meanwhile.</div>
 <div class="quote"><strong>Recovery and handover.</strong> Any correction runs as a separate recovery run with its own identity, an explicit mechanism-based population, a new build and reference identity, a proven restart boundary and a controlled target treatment. Recovery is validated twice: the affected population corrected, and an unaffected comparison population unchanged except for approved effects, with dependent outputs revalidated. Open items are handed over with status, affected keys, evidence, owner, next action and closure condition. Unresolved treatments remain unresolved: 45E has no approved target equivalent and CustomerGroup 99 is open for 18 German records, and both are transferred as controlled populations rather than post-go-live cleanup.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is the standard the whole programme has been building toward: a record that stands on its own, explains what was decided and why, and is honest about the one thing still unknown. Nobody reading it has to have been there.":"Check the 42 section and the handover. If the pack describes the other records as unaffected, or hands over open items without closure conditions, those are the two places an experienced reviewer will press first."}</div>`
},
{
 id:"b17",nav:"Handover",title:"Handover, closure, and the populations that are not defects",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><caption>Every unresolved item needs all eight</caption><thead><tr><th>Field</th><th>Purpose</th></tr></thead><tbody>
 <tr><td>Issue ID</td><td>Traceability</td></tr>
 <tr><td>Affected keys and count</td><td>Scope</td></tr>
 <tr><td>Current status</td><td>Known state</td></tr>
 <tr><td>Evidence</td><td>Reproducible proof</td></tr>
 <tr><td>Owner</td><td>Who acts next</td></tr>
 <tr><td>Next action</td><td>Specific work</td></tr>
 <tr><td>Closure condition</td><td>What proves done</td></tr>
 <tr><td>Operational impact</td><td>What the support team needs to know</td></tr>
 </tbody></table></div>
 <h3>When migration evidence is complete</h3>
 <p>An entity can move toward closure when the executed population reconciles, required validation passes, controlled exceptions are documented, defects are closed or formally handed over, final run and baseline identities are recorded, and the evidence is accessible and reproducible for authorised project and support teams.</p>
 <p class="small">Closure does not mean deleting the working trail. Retain the controlled run manifests, reconciliations, validation evidence, exception and defect records, and final baselines according to project requirements.</p>
 <h3>Watch more than the customer package</h3>
 <p>Bramwell's known control populations include 73 supplier classification conflicts, 286 product-site relationship exceptions, 126 fixed-asset depreciation-category exceptions, and 1,126 LegacyDocs files with unresolved business-record links. These are not automatically defects to clean up after go-live. They remain controlled populations whose approved treatment and ownership must be respected, and a well-meaning tidy-up is how a controlled exception becomes an unapproved change.</p>`
},
{
 id:"b18",nav:"Reflection",title:"Reflection \u2013 What would make you stop?",type:"reflection",
 html:`<p class="lead">During a pressured cutover, what evidence would make you personally recommend pausing your migration activity, even with senior stakeholders asking you to continue? State the evidence, the risk continuing creates, and what you would need to prove before restarting.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>This is the last reflection of the programme and it is deliberately the same shape as the first hard question in Lesson 2. The difference should be in how specific your answer is now: named evidence, a named consequence, and a named restart condition.</p></div></div>
 <textarea id="reflection" placeholder="The evidence that would make me recommend pausing..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:60,
 checks:[
   { test:/log|key|count|query|signature|identit|reconcil/i, strength:"You named specific evidence rather than a general sense that something is wrong.", gap:"Name the evidence you would point at. A recommendation to pause needs something a stakeholder can look at." },
   { test:/recover|reproduc|overwrit|spread|worse|harder|unpick|cannot prove/i, strength:"You stated what continuing would cost, in terms of what becomes unprovable or unrecoverable.", gap:"Say what continuing makes worse: what becomes harder to recover, or impossible to prove afterwards." },
   { test:/before .*(restart|resum|continu)|restart when|must be true|once .* (is|are) prov/i, strength:"You defined the restart condition, which turns a pause into a plan.", gap:"State what must be true before restarting. Without it, the pause ends when the pressure wins rather than when the evidence changes." },
   { test:/recommend|not mine|Lead|authority|decision/i, strength:"You framed it as a recommendation and kept the decision boundary clear.", gap:"Remember what you own. You recommend pausing and supply the evidence; the wider call belongs at leadership level." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The one I would hold hardest is being unable to distinguish partial output from complete output after a failure. The evidence is specific: the log does not identify where processing stopped, and the output file contains a record count that matches neither the input nor any checkpoint. What continuing costs is the ability to recover at all: load that mixture and I can no longer separate records that transformed correctly from records written mid-process, so the recovery population becomes the whole entity rather than a bounded set. Before restarting I need three things proven: which records completed, a restart boundary whose inputs and evidence are still valid, and a target state I can reconcile against. I would state that as a recommendation with the evidence attached, and be clear that the wider call about the window belongs to the Lead and to project leadership. My part is making sure they are deciding with an accurate picture rather than an optimistic one.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"Naming the restart condition alongside the evidence is what makes a pause survivable in a room full of people who want to continue. It turns an obstruction into a plan with a duration.":"Push on the restart condition and the boundary of your own authority. Both make the recommendation easier to accept, and both are what separate a professional pause from a refusal."}</div>`
},
{
 id:"b19",nav:"Summary",title:"Summary \u2013 Execute calmly, prove relentlessly",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Confirm the exact baseline before execution.</li>
   <li>Record actuals and evidence as the run progresses.</li>
   <li>Do not release downstream work before checkpoints pass.</li>
   <li>Treat timing variance as evidence, not panic.</li>
   <li>Record and control deviations.</li>
   <li>Preserve failed-run evidence.</li>
   <li>Use proven recovery boundaries.</li>
   <li>Keep independent work moving only when independence is proven.</li>
   <li>Reconcile live populations.</li>
   <li>Separate technical acceptance from migration acceptance.</li>
   <li>Do not invent root cause under pressure.</li>
   <li>Give leadership decision-grade evidence without taking their authority.</li>
   <li>Use separate controlled recovery runs.</li>
   <li>Validate recovery and regression.</li>
   <li>Revalidate dependencies after correction.</li>
   <li>Carry the final accepted baseline into stabilisation.</li>
   <li>Triage post-go-live issues before classifying them.</li>
   <li>Hand open items to operational owners deliberately.</li>
   <li>Close migration work with reproducible evidence, not merely a finished runbook.</li>
 </ul>
 <div class="tp-table-wrap"><table class="tp-table"><caption>The DMC5 standard</caption><thead><tr><th>Capability</th><th>You can</th></tr></thead><tbody>
 <tr><td>Prepare</td><td>Build a controlled cycle and cutover work package</td></tr>
 <tr><td>Execute</td><td>Run the sequence with evidence and checkpoints</td></tr>
 <tr><td>Recover</td><td>Manage failures and reruns safely</td></tr>
 <tr><td>Validate</td><td>Prove the technical and semantic outcome</td></tr>
 <tr><td>Cut over</td><td>Operate under live timing and dependency pressure</td></tr>
 <tr><td>Stabilise</td><td>Triage migration-originated issues and hand over cleanly</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>The one thing to remember</strong><br>A Data Migration Consultant is not someone who can make data move. They are someone who can make the right data move under control, prove what happened, diagnose what did not, communicate it clearly, and leave the project able to rely on the result.</div>`
},
{
 id:"b20",nav:"Programme complete",title:"Module and programme complete",type:"valuable",
 html:`<div class="complete"><div class="tick">\u2713</div>
 <p class="lead"><strong>You have completed DMC Module 5: Executing Cycles &amp; Cutover, and with it the Data Migration Consultant programme.</strong></p>
 <p>In this final lesson you operated through a live cutover window and into early stabilisation: executing against a controlled baseline, recording actual progress and evidence, responding safely to deviations, supporting technical decision-making without overstepping, validating the live result, managing recovery and reruns, handing migration evidence into support, and distinguishing genuine migration closure from simply reaching the end of the runbook.</p>
