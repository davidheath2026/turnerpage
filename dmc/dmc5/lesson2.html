 html:`<p class="lead">Readiness has already been established. Pre-flight asks one question: has anything material changed since?</p>

 </ol>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Then choose</th><th>When</th></tr></thead><tbody>
 <tr><td>CONTINUE</td><td>All six answered, nothing threatens correctness or recoverability</td></tr>
 <tr><td>HOLD FOR INVESTIGATION</td><td>Something is not understood, and waiting costs less than proceeding</td></tr>
 <tr><td>STOP AND CORRECT</td><td>A control has failed and continuing would spread the consequence</td></tr>
 <tr><td>ESCALATE A MATERIAL DECISION</td><td>The choice affects scope, sequence or release and is not yours</td></tr>
 </tbody></table></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Question six does most of the work</div><p>The first five establish what is true. The sixth is the one that decides, because a small issue you can still recover from cheaply becomes an expensive one three steps later.</p></div></div>`
},
{
 id:"b9",nav:"Continue or stop",title:"Stopping for the right reasons",type:"selectAll",
 html:`<p class="lead">Execution control is not about stopping constantly. It is about stopping for the right reasons. Six situations: explore each and see what the anomaly actually threatens.</p>`,
 options: continueOrStop,
 coaching: continueCoaching,
 hint:"Explore every situation before continuing.",
 closingHtml:`<div class="principle"><strong>The judgement underneath all six</strong><br>Ask what the anomaly threatens: correctness, reproducibility, recoverability, dependency sequence, or only convenience. Only the last one is a reason to carry on without thinking.</div>`
},
{
 id:"b10",nav:"Evidence and handoff",title:"Preserve the evidence, then hand off explicitly",type:"content",
 html:`<p class="lead">Do not overwrite the evidence from R01 when R02 begins.</p>
 <ul class="framework-checks">
   <li>Run-specific logs, reconciliation output and exception population.</li>
   <li>Run-specific load file or package.</li>
   <li>Timestamped or versioned validation evidence.</li>
   <li>Clear invalidation markers for abandoned outputs.</li>
 </ul>
 <p class="small">Recovery often depends on comparing the failed attempt with the corrected one. Deleting the first attempt removes the comparison that would have explained the second.</p>
 <h3>The handoff from transformation to load</h3>
 <div class="quote">\u201cTransformation complete for CUST-C3-R01. Ready population: 18,573 keys. Approved exceptions: 34. Approved exclusions: 5. Population and key-set reconciliation balanced. Package identity recorded. Reference and build identities match the manifest. Known unresolved treatments are not present as silent defaults. Pre-load validation evidence is in the run folder.\u201d</div>
 <h3>Then check the package itself before loading</h3>
 <ol class="framework-checks">
   <li>Confirm package or file identity.</li>
   <li>Confirm row and distinct-key counts.</li>
   <li>Confirm required columns and schema.</li>
   <li>Confirm target entity and context.</li>
   <li>Check for stale files in the load location.</li>
   <li>Confirm parameters and defaults.</li>
   <li>Confirm dependencies exist.</li>
   <li>Record the exact package consumed by the load.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Common failure</div><p>A perfectly validated file can still be loaded incorrectly, into the wrong entity, company, parameter set or target context. Validation proves the file. Step 4 proves where it is going.</p></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Package_Handoff.docx</strong><p class="small">The handoff statement above as a template, with the eight package-integrity checks alongside.</p></div><a class="btn secondary" href="/assets/downloads/Package_Handoff.docx" download>Download</a></div>`
},
{
 id:"b11",nav:"Checkpoint 3",title:"Checkpoint 3 \u2013 Target execution starts",type:"content",
 html:`<p class="lead">The load begins. The execution log should let you answer all seven of these at any moment.</p>
 <ul class="framework-checks">
   <li>How many records were submitted?</li>
   <li>How many have succeeded?</li>
   <li>How many rejected?</li>
   <li>How many are still processing?</li>
   <li>Are failures concentrated in one signature?</li>
   <li>Is progress continuing?</li>
   <li>Which run and package is producing these numbers?</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Live numbers need definitions</div><p>\u201c500 failed\u201d is meaningless until you know whether that means rejected records, error events, validation messages or a transient batch state. The four have very different implications and the console rarely distinguishes them for you.</p></div>`
},
{
 id:"b12",nav:"The first incident",title:"Ten minutes in, a cluster of rejections",type:"mcq",
 _correctIndex:0,
 html:`<p class="lead">Ten minutes into the run, the console shows a cluster of rejections for payment terms.</p>
 <div class="quote">\u201cShall we let it finish and sort them afterwards?\u201d</div>
 <h3>What determines your answer?</h3>`,
 options:[
   {label:"Whether the rejections are isolated and recoverable: confirm the values belong to the expected ready population, identify the dominant signature, establish whether it is systemic, and preserve the failing keys and logs.", correct:true, feedback:"Correct. The decision rests on the mechanism and the downstream risk, not on reluctance to stop. If the signature is isolated and the accepted records are independent, continuing may produce better evidence than stopping."},
   {label:"Whether the rejected volume is material: a small cluster can safely complete, while a large one indicates a systemic defect that warrants stopping immediately.", correct:false, feedback:"Volume is a weak proxy. A small cluster can be the visible edge of a systemic transformation defect, and a large isolated one can be entirely recoverable."},
   {label:"Whether the migration window allows time to stop, investigate and restart without threatening the dependent activities scheduled behind this load.", correct:false, feedback:"Schedule pressure is real and it is not the criterion. Deciding by the clock is how ambiguous runs get created, and those cost more window than the stop would have."},
   {label:"Whether the rejections relate to unresolved business treatments such as 45E, in which case they are expected and the load can safely continue.", correct:false, feedback:"Unresolved treatments should not have reached the ready population at all. Rejections on those values are evidence that something upstream let them through."}
 ]
},
{
 id:"b13",nav:"Continue, or not",title:"When continuing helps, when it is dangerous, and reading the clock",type:"content",
 html:`<div class="visual-card"><div class="visual-title">When continuing is useful</div>
 <p>A small, clearly isolated rejection signature affects records already classified as rerunnable exceptions. The accepted records are independent, and no downstream activity will consume the result until validation. Continuing may be reasonable if project controls permit it, and it produces a complete picture rather than a partial one.</p>
 </div>
 <div class="visual-card"><div class="visual-title">When continuing is dangerous</div>
 <ul class="framework-checks">
   <li>Wrong target company or legal entity.</li>
   <li>Systemic transformation defect, or uncontrolled reference baseline.</li>
   <li>Row multiplication, or an unknown source snapshot.</li>
   <li>Failure that corrupts downstream relationships.</li>
   <li>Logs cannot distinguish successful from unprocessed records.</li>
   <li>Continuation would overwrite evidence needed for recovery.</li>
 </ul>
 <p class="small">A stopped run is inconvenient. An ambiguous run can be far more expensive, because it may have to be repeated in full.</p>
 </div>
 <h3>Progress monitoring without dashboard hypnosis</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Signal</th><th>Question</th></tr></thead><tbody>
 <tr><td>Throughput</td><td>Is work progressing at a plausible rate?</td></tr>
 <tr><td>Error rate</td><td>Stable, increasing or clustered?</td></tr>
 <tr><td>Queue or backlog</td><td>Is processing moving or stalled?</td></tr>
 <tr><td>Database or resource signal</td><td>Does it explain the slowdown without implying data failure?</td></tr>
 <tr><td>Step duration</td><td>Compared with which previous controlled runs?</td></tr>
 <tr><td>Dependency readiness</td><td>Will the next step actually be able to start?</td></tr>
 </tbody></table></div>
 <p>Bramwell's recorded comparison timings across two cycles: extract 18 and 17 minutes, transform 42 and 31, validation 24 and 22, load 58 and 49. Use them as comparison evidence, not as service levels.</p>
 <div class="principle"><strong>Do not diagnose from elapsed time alone</strong><br>Check whether the population changed, whether environment or resource conditions differ, whether build or reference logic changed, whether throughput is still progressing, and whether errors are concentrated. Performance evidence should lead to investigation, not to an instant root-cause claim.</div>`
},
{
 id:"b14",nav:"Live status",title:"Live communication, and what technical completion means",type:"content",
 html:`<div class="quote">\u201cCustomer load CUST-C3-R01 is progressing. 12,400 of 18,573 submitted records are accepted so far; there is no final acceptance statement yet. Throughput is slower than the previous controlled run but continues steadily, with no concentrated rejection signature. We are monitoring to completion and will run population and semantic validation before releasing the result downstream.\u201d</div>
 <p class="small">State, evidence, next checkpoint. Note what it does not do: it does not call the migration complete while processing and validation are still open.</p>
 <h3>Then the loader reports 18,573 accepted, 0 rejected</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>What you know</th><th>What you do not yet know</th></tr></thead><tbody>
 <tr><td>The target execution technically accepted the full submitted population.</td><td>Whether every record landed in the correct semantic state, context and relationships.</td></tr>
 </tbody></table></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Zero rejects is the most persuasive number in migration and one of the least informative. It is a fact about the interface, not about the business, and the gap between those two is where the expensive defects live.</p></div></div>`
},
{
 id:"b15",nav:"Checkpoints 4 and 5",title:"Post-load reconciliation, then semantic validation",type:"content",
 html:`<h3>Checkpoint 4 \u2013 Immediate post-load reconciliation</h3>
 <ol class="framework-checks">
   <li>Confirm submitted equals accepted plus rejected plus any explicitly defined pending state.</li>
   <li>Compare the accepted key set with the submitted key set.</li>
   <li>Check for target duplicate keys.</li>
   <li>Check for unexpected target additions.</li>
   <li>Confirm non-submitted exception and exclusion keys did not leak into the target.</li>
   <li>Record run-specific outcome evidence.</li>
 </ol>
 <h3>Checkpoint 5 \u2013 Semantic validation</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Control</th><th>Question</th></tr></thead><tbody>
 <tr><td>Legal entity</td><td>Did each record land in the intended company and context?</td></tr>
 <tr><td>CustomerGroup</td><td>Does the target value match the approved expected treatment?</td></tr>
 <tr><td>Country</td><td>Does UK map to GB as expected?</td></tr>
 <tr><td>Payment terms</td><td>Are only approved treatments present?</td></tr>
 <tr><td>Addresses</td><td>Are the valid required delivery addresses available?</td></tr>
 <tr><td>Relationships</td><td>Do dependent references point to the intended target objects?</td></tr>
 <tr><td>Critical fields</td><td>Do selected high-risk fields match expected transformed values?</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Do not repair during diagnosis</div><p>When 42 UK customers turn up in the Belgian legal entity, moving them manually is the fastest-looking option and the worst one. It may hide the mechanism, leave other affected records undiscovered, and create a target state the migration process cannot reproduce. Find the earliest point where expected and actual diverge, then establish the full mechanism-based population.</p></div>`
},
{
 id:"b16",nav:"Status language",title:"Five statuses, and what each one releases",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">\u201cDone\u201d can mean execution finished, validation finished, business accepted, or simply that your part stopped. Explore the five controlled statuses and the question each one has to survive.</p>`,
 items: executionStatuses,
 takeawayHtml:`<div class="principle"><strong>Precision here is not pedantry</strong><br>Every one of these five is a different instruction to the people downstream. The vague word is the one that gets an order load started against customers nobody has validated.</div>`
},
{
 id:"b17",nav:"The run",title:"CUST-C3, 08:00 to 11:00",type:"guidedSteps",
 html:`<p class="lead">A full execution, event by event. Work forward through it: each decision only makes sense having seen what came before, which is also true on the day. This timeline is a training scenario rather than a record of the Bramwell cycle itself.</p>`,
 steps: executionTimeline,
 takeawayHtml:`<div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Live_Run_Log.xlsx</strong><p class="small">Run identity, step, expected versus actual, decision and evidence, one row per event.</p></div><a class="btn secondary" href="/assets/downloads/Live_Run_Log.xlsx" download>Download</a></div>`
},
{
 id:"b18",nav:"Console decisions",title:"Consultant situations \u2013 Five decisions at the console",type:"situations",
 html:`<p class="lead">Five moments during execution where somebody is waiting for an answer and the comfortable one is available immediately.</p>`,
 items: consoleSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Run That Looked Stuck", name:"Sam", role:"Data Migration Consultant", project:"Energy ERP",
   src:"/assets/audio/lesson2-fromfield-sam.mp3",
   reflection:"When a run last went slower than expected, did you check whether it was progressing, or just watch the clock?"
 })}</div>`
},
{
 id:"b19",nav:"Build the run log",title:"Build it \u2013 The live run log",type:"reflection",
 html:`<p class="lead">Produce the execution record for CUST-C3 across the morning you have just worked through. Another consultant should be able to reconstruct the run from it without asking you anything.</p>
 <h3>What it has to do</h3>
 <ol class="framework-checks">
   <li>Assign run IDs to each valid and abandoned attempt.</li>
   <li>Record the baseline identities consumed by each attempt.</li>
   <li>At every event, state expected versus actual.</li>
   <li>Choose CONTINUE, HOLD, STOP AND CORRECT, or ESCALATE.</li>
   <li>Record the evidence supporting each decision.</li>
   <li>Identify which outputs become invalid after the restart.</li>
   <li>Write the handoff into target load.</li>
   <li>Write the technical-completion update, then the semantic-defect update.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">The part most people skip</div><p>The 08:40 correction means the first attempt is abandoned. Mark it abandoned rather than deleted, retain its evidence, create a new run identity, regenerate downstream outputs rather than relabelling the old ones, and make sure every handoff references only the valid run. A rerun is a new execution event, not an edit to history.</p></div>
 <p class="lead">Write the run log below, including both attempts, and finish with the two updates.</p>
 <textarea id="reflection" placeholder="RUN IDENTITIES: ...&#10;&#10;EVENTS (expected vs actual, decision, evidence): ...&#10;&#10;INVALIDATED OUTPUTS: ...&#10;&#10;TECHNICAL COMPLETION UPDATE: ...&#10;&#10;SEMANTIC DEFECT UPDATE: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Deviation_Log.xlsx</strong><p class="small">Time and step, observation, evidence, impact, labelled hypothesis, decision, owner and resolution evidence.</p></div><a class="btn secondary" href="/assets/downloads/Deviation_Log.xlsx" download>Download</a></div>`,
 minLength:80,
 checks:[
   { test:/R0?2|second attempt|new run identit|abandon/i, strength:"You created a second run identity after the correction rather than continuing under the first.", gap:"The 08:40 correction abandons the first attempt. Give the corrected attempt its own run identity and mark the first abandoned, not deleted." },
   { test:/expected|actual|versus|vs/i, strength:"You recorded expected against actual at each event rather than only what happened.", gap:"At each event, state what you expected as well as what you observed. The gap between them is the finding." },
   { test:/invalid|superseded|regenerat|do not use/i, strength:"You identified which outputs became invalid after the restart.", gap:"Say which outputs the restart invalidates, and that they are regenerated rather than relabelled." },
   { test:/technically complete|validation in progress|not yet accepted|semantic/i, strength:"You separated technical completion from semantic acceptance in your updates.", gap:"Your two updates should use controlled status language: technically complete is not accepted." },
   { test:/42|legal entity|Belgi/i, strength:"Your semantic update reports the legal-entity finding without asserting a cause.", gap:"Report the 42 legal-entity mismatches, and say that root cause is not yet established rather than proposing one." },
   { test:/key|key.set|distinct/i, strength:"Your reconciliation is by key, not just by count.", gap:"Record key-set reconciliation at each checkpoint, not only row counts. The 08:25 event is the reason." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>Run identities.</strong> CUST-C3-R01, abandoned at 08:40 following the source-baseline correction, evidence retained. CUST-C3-R02, the valid attempt, consuming source snapshot SRC-CUST-C3-0600 corrected, the approved cycle reference version, and build B08 as accepted at 08:12 after impact assessment. All handoffs reference R02 only.</div>
 <div class="quote"><strong>Events.</strong> 08:00, expected build matches manifest, actual B08 differs from B07; decision HOLD pending impact check; evidence: manifest and change description. 08:12, change assessed and approved, affected population identified, affected controls retested; decision CONTINUE, manifest updated. 08:25, expected 18,612 rows and 18,612 distinct keys, actual 18,612 rows and 18,611 distinct keys; decision STOP AND CORRECT; evidence: duplicate key and missing key identified from staging logs. 09:10, transformation reconciles 18,573 ready plus 34 exceptions plus 5 exclusions to 18,612, by key as well as count; decision CONTINUE. 10:05, throughput below the previous controlled run, progressing steadily, no concentrated signature; decision CONTINUE under observation with next checkpoint at completion.</div>
 <div class="quote"><strong>Invalidated by the restart.</strong> All R01 staging output, its transformation output and any package generated from it. These are marked invalid and retained for comparison; the corrected outputs are regenerated under R02 rather than relabelled.</div>
 <div class="quote"><strong>Technical completion update.</strong> Customer load CUST-C3-R02 is technically complete: 18,573 submitted, 18,573 accepted, zero rejects. Count and key-set reconciliation passes. Status is VALIDATION IN PROGRESS, so this should not yet be treated as an accepted dependency for sales orders or any other downstream entity.</div>
 <div class="quote"><strong>Semantic defect update.</strong> Semantic validation has identified 42 UK customers in the Belgian legal entity. The acceptance claim is frozen. The 42 keys are captured with expected versus actual context, and we are establishing whether the divergence originates in source, transformed output, package routing or target behaviour, and whether other populations share the mechanism. Root cause is not established and I am not going to propose one yet. Customer migration is not accepted.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The tell for a strong run log is whether the abandoned attempt appears in it. A log that shows only the successful run is a tidier document and a much less useful one, because recovery usually depends on the comparison.":"Check two things. Does your log include the abandoned R01 and what it invalidated, and do your two updates use controlled status language rather than done? Both are where these logs usually thin out."}</div>`
},
{
 id:"b20",nav:"Anti-patterns",title:"Execution anti-patterns, and the stage-by-stage checklist",type:"content",
 html:`<ul class="framework-checks">
   <li>Starting with a different build from the readiness pack.</li>
   <li>Continuing after unexplained population loss.</li>
   <li>Using counts without keys.</li>
   <li>Overwriting failed-run evidence.</li>
   <li>Calling a load successful before semantic validation.</li>
   <li>Manually patching visible records before finding the mechanism.</li>
   <li>Starting dependent entities because the loader is green.</li>
   <li>Changing reference data mid-run without impact control.</li>
   <li>Treating every anomaly as either harmless or catastrophic.</li>
   <li>Communicating \u201cdone\u201d without defining the status.</li>
   <li>Rerunning under the same identity and losing lineage.</li>
 </ul>
 <div class="tp-table-wrap"><table class="tp-table"><caption>Consultant execution checklist</caption><thead><tr><th>Stage</th><th>Control</th></tr></thead><tbody>
 <tr><td>Pre-flight</td><td>Baseline unchanged, or the change explicitly controlled</td></tr>
 <tr><td>Run start</td><td>Unique run identity established</td></tr>
 <tr><td>Stage</td><td>Input, output and key reconciliation</td></tr>
 <tr><td>Transform</td><td>Ready, exception and exclusion partition balances</td></tr>
 <tr><td>Package</td><td>Exact artefact and target context verified</td></tr>
 <tr><td>Load</td><td>Submitted, success, reject and pending state monitored</td></tr>
 <tr><td>Deviation</td><td>Evidence and continue, hold or stop decision recorded</td></tr>
 <tr><td>Completion</td><td>Technical outcome captured</td></tr>
 <tr><td>Validation</td><td>Count, key, duplicate, semantic and relationship checks</td></tr>
 <tr><td>Handoff</td><td>Status and run identity explicit</td></tr>
 <tr><td>Restart</td><td>Old evidence retained, new run identity used</td></tr>
 </tbody></table></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Execution_Console.xlsx</strong><p class="small">The nine live controls from the start of this lesson, laid out as a working console for a real run.</p></div><a class="btn secondary" href="/assets/downloads/Execution_Console.xlsx" download>Download</a></div>`
},
{
 id:"b21",nav:"Reflection",title:"Reflection \u2013 When would you stop?",type:"reflection",
 html:`<p class="lead">Choose one situation in which you would stop a migration run even though stopping threatens the schedule. State the evidence you would need to justify it, what risk continuing creates, and what must be true before you restart.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>The third part is the one that separates a stop from a panic. A stop with no stated restart condition is just an unplanned pause, and it tends to end when somebody senior gets impatient rather than when the evidence changes.</p></div></div>
 <textarea id="reflection" placeholder="The situation I would stop for..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/evidence|log|key|count|query|signature/i, strength:"You named the evidence the stop would rest on rather than an instinct.", gap:"Say what evidence you would point at. A stop you cannot evidence will be overruled by whoever is under most schedule pressure." },
   { test:/recover|reproduc|overwrit|worse|harder|ambiguous/i, strength:"You framed the risk in terms of what continuing would cost, not just that it is wrong.", gap:"Say what continuing would make harder: recovery, reproducibility, or the ability to tell processed records from unprocessed ones." },
   { test:/before .*(restart|resume)|restart when|must be true|resume once/i, strength:"You defined the restart condition, which is what makes it a controlled stop.", gap:"State what must be true before you restart. Without that, the stop ends when somebody loses patience rather than when the evidence changes." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">I would stop when the package turns out to be writing into an unexpected target context, even mid-load with the window closing. The evidence is simple and hard to argue with: the target entity or company recorded in the load parameters does not match the one in the run manifest, and a sample of loaded keys confirms it. Continuing makes every minute worse, because the recovery boundary grows with the number of records placed somewhere they should not be, and eventually I cannot separate what was misplaced by this run from what was already there. Before restarting I need three things: the misplaced population identified by key, confirmation of how the wrong context was selected so it cannot happen again on the retry, and a clean or versioned output location so the corrected run cannot be confused with the abandoned one. Only then does a new run identity get created.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"Naming the restart condition is what turns this from a refusal into a plan, and it is the part that makes a stop survivable in front of people who want to continue.":"Push on the restart condition. A stop without one is an unplanned pause, and it will end for the wrong reason."}</div>`
},
{
 id:"b22",nav:"Summary",title:"Summary \u2013 Execute with evidence",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Give every execution attempt a unique identity.</li>
   <li>Protect the approved baseline at pre-flight.</li>
   <li>Reconcile each stage before handing work downstream.</li>
   <li>Use keys as well as counts.</li>
   <li>Distinguish expected variation from material deviation.</li>
   <li>Stop when correctness, reproducibility or recoverability is threatened.</li>
   <li>Preserve failed-run evidence.</li>
   <li>Make package handoffs explicit.</li>
   <li>Monitor progress without diagnosing from a single metric.</li>
   <li>Communicate live state, evidence and next checkpoint.</li>
   <li>Treat technical completion as a checkpoint, not acceptance.</li>
   <li>Run semantic validation after technically green loads.</li>
   <li>Freeze acceptance when new evidence contradicts it.</li>
   <li>Do not patch visible records before understanding mechanism and population.</li>
   <li>Control parallel dependent work.</li>
   <li>Use precise execution statuses.</li>
   <li>Treat a restart as a new execution event.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A controlled migration is not defined by whether the package finishes. It is defined by whether you can prove what ran, what happened at each stage, why you continued or stopped, what the target now contains, and which evidence makes the result safe to use.</div>`
},
{
 id:"b23",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
 html:`<div class="complete"><div class="tick">\u2713</div>
 <p class="lead"><strong>You have completed Executing a controlled migration.</strong></p>
 <p>You can now execute a migration work package under controlled conditions: following and challenging a runbook, establishing run identity, capturing evidence at checkpoints, reconciling each stage, distinguishing expected variation from material deviation, stopping when controls fail, managing technical handoffs, communicating live status, and leaving an execution record another consultant can reproduce and investigate.</p>
 </div>

 <div class="voice-row">
   <button id="valuableMicButton" class="btn secondary" type="button">Use microphone</button>
   <span id="valuableMicStatus" class="small"></span>
 </div>

 minLength:20,

}
];

const LESSON_CONFIG = {
