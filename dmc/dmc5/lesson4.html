{html:`<h4>Layers 1 and 2 \u2013 Population and key set</h4>
 <p><strong>Layer 1, population.</strong> The source-cycle equation holds: 18,612 equals 18,573 submitted plus 34 approved pre-load exceptions plus 5 approved exclusions. No records disappeared between source, exception handling, submission and target.</p>
 <p><strong>Layer 2, key set.</strong> Equal counts can hide substitutions, so compare the actual business-key sets rather than totals. Which submitted keys are absent from target? Which target keys were not in submitted scope? How many expected keys match exactly? Did exclusions or exceptions leak into the target?</p>
 <div class="callout experience"><div class="callout-label">Result</div><p>Both layers pass. Every submitted key is present, no unexpected keys appeared, and no exclusion leaked through.</p></div>`},
{html:`<h4>Layers 3 and 4 \u2013 Uniqueness, then field semantics</h4>
 <p><strong>Layer 3, uniqueness.</strong> One accepted source record can still create duplicate target representations if the target context or joins are wrong. Test the target grain explicitly rather than trusting the accepted count. This passes too.</p>
 <p><strong>Layer 4, field semantics.</strong> Compare the meaning of transformed fields, not merely whether they are populated.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Field</th><th>Validation</th></tr></thead><tbody>
 <tr><td>Country</td><td>UK source expectation becomes approved target GB</td></tr>

 <tr><td>Payment terms</td><td>No unapproved fallback for 45E</td></tr>
 <tr><td>Legal entity</td><td>Expected UK customer remains in UK target context</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Result</div><p>The last row fails. 42 UK customers have landed in the Belgian legal entity. The total target count still matches 18,573 exactly.</p></div>`},
{html:`<h4>Layers 5 and 6 \u2013 Relationships and negative controls</h4>
 <p><strong>Layer 5, relationships.</strong> Validate the links that make migrated records usable. A customer can exist while its required delivery address or downstream order relationship is broken, and nothing in the load result would say so.</p>
 <p><strong>Layer 6, negative validation.</strong> Prove that the things which must not happen did not happen.</p>
 <ul class="framework-checks">
   <li>No unapproved 45E to NET30 fallback.</li>
   <li>No CustomerGroup 99 defaulted to STANDARD without approval.</li>
   <li>No BILLING_ONLY addresses where excluded.</li>
   <li>No UK customers silently routed to Belgium.</li>
   <li>No duplicate target keys at the intended grain.</li>
 </ul>
 <p class="small">Notice the fourth negative control. It would have caught the 42 as a named, expected-to-be-zero check, rather than as a surprise during a semantic comparison.</p>`},
{html:`<h4>Layers 7 and 8 \u2013 Regression and business-critical invariants</h4>
 <p><strong>Layer 7, known-defect regression.</strong> After a fix, prove the original mechanism is corrected, prove the full affected population is corrected, and prove the change did not damage unaffected populations. For the delivery-address defect that means positive DELIVERY_PRIMARY, positive DELIVERY_SECONDARY, negative BILLING_ONLY, the full mechanism-based recovery population, and no unexplained changes outside it.</p>
 <p><strong>Layer 8, business-critical invariants.</strong> The handful of statements that must be true for the migration to be usable at all, tested as absolutes rather than sampled.</p>
 <div class="principle"><strong>What the eight layers just demonstrated</strong><br>Three layers of perfect results, then a material defect at layer 4. Counts can reconcile exactly while business meaning is wrong, and stopping after layer 3 is how that reaches production.</div>`}
];

 html:`<p class="lead">If a metric changes between cycles, explain the movement rather than reporting the endpoint.</p>

 <h3>After a fix, prove three things rather than one</h3>
 <div class="principle"><strong>Regression rule</strong><br>Prove the defect is fixed. Prove the full affected population is corrected. Prove the fix did not create unexplained changes elsewhere.</div>

 <div class="callout misconception"><div class="callout-label">A failed validation query creates false confidence</div><p>A beautifully written query pointed at the wrong legal entity, database, run or snapshot is not evidence. Validate the validator, every time, before you trust a clean result from it.</p></div>
 <h3>Unresolved values must survive validation</h3>
 <p>An unresolved source value should not disappear from reporting merely because the target accepted a fallback. Payment term 45E has no approved target equivalent, and CustomerGroup 99 remains unresolved. If either stops appearing in your validation output, that is a finding in itself: something has quietly resolved them without approval.</p>`
},
{
 id:"b11",nav:"Investigate",title:"Investigate unexplained differences properly",type:"content",
 html:`<div class="callout misconception"><div class="callout-label">The temptation</div><p>Adjusting the validation report until it turns green. It is quick, it is defensible sentence by sentence, and it produces a pack that proves nothing.</p></div>
 <ol class="framework-checks">
   <li>Reproduce the difference by key.</li>
   <li>Confirm expected state and source evidence.</li>
   <li>Confirm actual target state.</li>
   <li>Trace backwards through target load input, transformation and staging.</li>
   <li>Find the first divergence.</li>
   <li>Bound the mechanism-based population.</li>
   <li>Only then state root cause, and only if it is proven.</li>
 </ol>
 <p class="small">Step 6 before step 7 is the ordering that matters. A root cause stated before the population is bounded tends to define the population to fit itself.</p>`
},
{
 id:"b12",nav:"Triage board",title:"The validation triage board",type:"selectAll",
 html:`<p class="lead">Six statuses that keep a red result from becoming an undifferentiated problem pile. Explore each one and where it belongs.</p>`,
 options: triageStatuses,
 coaching: triageCoaching,
 hint:"Explore every status before continuing.",
 closingHtml:`<div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Difference_Triage.xlsx</strong><p class="small">Difference signature, affected keys, status, owner and the evidence that supports the classification.</p></div><a class="btn secondary" href="/assets/downloads/Difference_Triage.xlsx" download>Download</a></div>`
},
{
 id:"b13",nav:"Under pressure",title:"Scope, pressure, and not negotiating the evidence",type:"content",
 html:`<h3>Does this defect invalidate wider acceptance?</h3>
 <p>Assess the mechanism, the affected population, the business impact, the dependencies, and whether unaffected populations can be proven independently. That last one is the deciding question, and with an unknown mechanism the answer is usually no.</p>
 <h3>When the deadline approaches</h3>
 <div class="principle"><strong>Reduce noise, not proof</strong><br>Focus on the controls that establish population, critical semantics, relationships and known high-risk rules. Cutting the number of controls you report is reasonable. Cutting the controls that would have found something is not.</div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Do not negotiate the evidence</div><p>If a valid control fails, do not suppress it because the team wants green status. Reclassify only when there is evidence and appropriate approval. The pressure to do otherwise is rarely stated openly, which is exactly what makes it effective.</p></div></div>`
},
{
 id:"b14",nav:"Acceptance",title:"Three acceptance recommendations",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">A validation pack ends in one of three statements. Explore each, and answer the test underneath it against the pack you would write today.</p>`,
 items: acceptanceOptions,
 takeawayHtml:`<div class="principle"><strong>Acceptance status follows evidence, not schedule pressure</strong><br>The recommendation is yours to make on the evidence. What the project then does with it, including accepting a risk you have named, is a decision that belongs elsewhere.</div>`
},
{
 id:"b15",nav:"Validation decisions",title:"Consultant situations \u2013 Five validation decisions",type:"situations",
 html:`<p class="lead">Five moments in a validation exercise where the quick answer is available and the evidence does not support it.</p>`,
 items: validationSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Count That Passed", name:"Marcus", role:"Data Migration Consultant", project:"Logistics ERP",
   src:"/assets/audio/lesson4-fromfield-marcus.mp3",
   reflection:"In your last acceptance pack, was technical acceptance reported separately from business-semantic validation?"
 })}</div>`
},
{
 id:"b16",nav:"Acceptance pack",title:"Build it \u2013 The acceptance evidence pack",type:"reflection",
 html:`<p class="lead">Write the acceptance summary for the Bramwell customer cycle. Another competent person should be able to understand what was executed, what was expected, what actually happened, what differs, what remains unresolved, and what recommendation follows.</p>
 <div class="tp-table-wrap"><table class="tp-table"><caption>What the pack contains</caption><thead><tr><th>Section</th><th>Section</th></tr></thead><tbody>
 <tr><td>Population reconciliation</td><td>Negative controls</td></tr>
 <tr><td>Key-set comparison</td><td>Known-defect regression</td></tr>
 <tr><td>Duplicate control</td><td>Unresolved and approved exception register</td></tr>
 <tr><td>Semantic comparison summary</td><td>Difference investigation evidence</td></tr>
 <tr><td>Relationship checks</td><td>Acceptance recommendation</td></tr>
 </tbody></table></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">The trap in this one</div><p>Everything except the semantic layer passes. A pack that leads with the passing layers, and reaches the 42 in its ninth paragraph, is accurate and misleading. Lead with the fact that changes what happens next.</p></div></div>
 <p class="lead">Write the summary and the recommendation below.</p>
 <textarea id="reflection" placeholder="HEADLINE: ...&#10;POPULATION AND KEYS: ...&#10;SEMANTIC FINDINGS: ...&#10;UNRESOLVED: ...&#10;EVIDENCE LINEAGE: ...&#10;RECOMMENDATION: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Acceptance_Evidence_Summary.docx</strong><p class="small">The ten sections above, structured so the recommendation sits on top of its evidence.</p></div><a class="btn secondary" href="/assets/downloads/Acceptance_Evidence_Summary.docx" download>Download</a></div>`,
 minLength:70,
 checks:[
   { test:/42|legal entity|Belgi/i, strength:"You led with or clearly stated the semantic finding rather than burying it.", gap:"State the 42 legal-entity mismatches prominently. A pack that reaches them late is accurate and misleading." },
   { test:/18,?612|18,?573|34|reconcil/i, strength:"You reported the population reconciliation against the control equation.", gap:"Reconcile the population explicitly: 18,612 total, 18,573 submitted, 34 approved exceptions, 5 approved exclusions." },
   { test:/not yet accepted|NOT YET/i, strength:"Your recommendation is not yet accepted, which is the honest status for this evidence.", gap:"Choose a recommendation. A green result with an unresolved incorrect outcome is not yet accepted, not accepted with exceptions." },
   { test:/root cause .*(not|unknown|unestablish)|not (yet )?established|do not know/i, strength:"You reported the finding without asserting a cause you have not proven.", gap:"Say that root cause is not yet established rather than proposing one, and what you are doing to trace it." },
   { test:/45E|CustomerGroup 99|unresolved/i, strength:"Unresolved business treatments still appear in your pack rather than having quietly vanished.", gap:"Include 45E and CustomerGroup 99 as unresolved. If they stopped appearing, something resolved them without approval." },
   { test:/run|snapshot|reference version|build|cycle|lineage/i, strength:"Your evidence is tied to the specific run and baselines it validates.", gap:"Tie the validation to its cycle, run, source snapshot, reference version, build and target context." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>Headline.</strong> The customer cycle is NOT YET ACCEPTED. The load was technically clean and semantic validation found 42 UK customers in the Belgian legal entity, which is a material incorrect outcome and is not yet explained.</div>
 <div class="quote"><strong>Population, keys and uniqueness.</strong> All three reconcile. The source-cycle population of 18,612 resolves to 18,573 submitted, 34 approved pre-load exceptions and 5 approved exclusions. The submitted key set matches the accepted key set exactly, with no unexpected target keys and no exception or exclusion keys leaking into the target. Target grain shows no unexplained duplicates. The load reported 18,573 accepted and zero rejects, which is consistent with all of the above and proves none of what follows.</div>
 <div class="quote"><strong>Semantic findings.</strong> 42 UK customers have landed in the Belgian legal entity while the total count still matches. Root cause is not established: the evidence proves the wrong target context for those records, not why. We are reproducing the difference by key, confirming source expectation and actual target state, and tracing backwards through load input, transformation and staging to the first divergence. Until the mechanism is bounded, the 42 are recorded as INVESTIGATE rather than as a defect with a known population, and I cannot yet prove the other records were unaffected by the same mechanism.</div>
 <div class="quote"><strong>Unresolved and lineage.</strong> Payment term 45E has no approved target equivalent and CustomerGroup 99 remains unresolved; both appear in the exception register and neither has been defaulted. All validation results are tied to the cycle and run identity, source snapshot, reference version, package build and target context, and the queries were confirmed to be pointed at that context before the results were relied on. Recommendation: not yet accepted for the customer scope. This becomes acceptance, or acceptance with controlled exceptions, once the 42 are explained, their full affected population is bounded, and the unaffected population can be proven independently.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The sentence that makes this pack strong is the one admitting you cannot yet prove the other records were unaffected. It is uncomfortable, it is true, and it is what stops somebody carving out an acceptance you have not evidenced.":"Check your recommendation and your ordering. Not yet accepted is the honest status here, and the 42 should be in your first paragraph rather than your last."}</div>`
},
{
 id:"b17",nav:"Checklist",title:"The validation checklist, and the same discipline elsewhere",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Area</th><th>Proof</th></tr></thead><tbody>
 <tr><td>Population</td><td>Source, submitted, exception, exclusion and target outcomes reconcile</td></tr>
 <tr><td>Identity</td><td>Expected and actual key sets match</td></tr>
 <tr><td>Uniqueness</td><td>Target grain has no unexplained duplicates</td></tr>
 <tr><td>Semantics</td><td>Critical fields match approved expected outcomes</td></tr>
 <tr><td>Relationships</td><td>Required links survive migration</td></tr>
 <tr><td>Negative controls</td><td>Forbidden defaults, exclusions and routing do not occur</td></tr>
 <tr><td>Regression</td><td>Known fixes are proven across the full affected mechanism</td></tr>
 <tr><td>Evidence lineage</td><td>Validation tied to the exact cycle, run and baselines</td></tr>
 <tr><td>Differences</td><td>Every material mismatch classified and owned</td></tr>
 <tr><td>Recommendation</td><td>Acceptance status follows evidence, not schedule pressure</td></tr>
 </tbody></table></div>
 <h3>Beyond the customer example</h3>
 <p>The same layered proof applies across Bramwell's other domains. Supplier validation must preserve the unresolved classification conflict rather than silently normalising it. Product-site validation must identify the 286 relationships outside the approved reference set. Fixed-asset validation must keep the 126 depreciation-category exceptions visible. For Finance, reconciliation has to distinguish what is actually proven from what is still unknown: the established open-payables source control total is &pound;6,284,913.72, and no target result has been established against it.</p>
 <p class="small">In none of those cases does validation mean making the exception population disappear.</p>`
},
{
 id:"b18",nav:"Reflection",title:"Reflection \u2013 Which result would worry you more?",type:"reflection",
 html:`<p class="lead">Which validation result would worry you more: 100 technical rejects, or zero rejects with no semantic comparison? Explain what each result does and does not tell you.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Most people arrive at the second and it is worth working out why. One hundred rejects come with keys, a signature and a boundary. Zero rejects with no semantic comparison come with a number that feels like proof and is not evidence about anything except the interface.</p></div></div>
 <textarea id="reflection" placeholder="The result that would worry me more..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/key|signature|bounded|visible|known/i, strength:"You recognised that rejects come with evidence attached: keys, signature, a boundary.", gap:"Say what 100 rejects give you that zero rejects do not: identifiable records and a failure signature to work from." },
   { test:/nothing|does not (tell|prove)|only|interface|platform accepted/i, strength:"You were precise about what zero rejects actually establishes.", gap:"Say what zero rejects proves. It is a fact about the interface, not about whether the data is right." },
   { test:/false confidence|reassur|stop looking|move on|complacen/i, strength:"You identified the real risk: a green number stops people investigating.", gap:"Consider the behavioural effect. A green result ends the investigation, which is why an undetected defect behind one is worse than a visible failure." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Zero rejects with no semantic comparison, without much hesitation. A hundred rejects is a bad afternoon with everything I need in it: the failing keys, an error signature to group them by, a clear boundary between what worked and what did not, and a team that knows there is a problem. Zero rejects tells me one thing only, that the platform accepted what it was given, and it tells me nothing about whether the right records were given or whether their values mean what they should. The real damage is behavioural. A hundred rejects starts an investigation; zero rejects ends one. Everybody moves on, the dependent loads start, and whatever is wrong gets discovered later by somebody in the business who cannot find their customers.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The behavioural half is what makes this answer useful rather than merely correct: a green number does not just fail to detect the defect, it actively stops the search that would have.":"Push past what each result proves, to what each result causes. One of them starts an investigation and the other ends one, and that difference matters more than the numbers."}</div>`
},
{
 id:"b19",nav:"Summary",title:"Summary \u2013 A validated migration is an evidenced conclusion",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Treat technical acceptance as one layer, not as the result.</li>
   <li>Start validation from the expected state, written beforehand.</li>
   <li>Reconcile population, then key sets, then uniqueness.</li>
   <li>Compare field meaning, not merely whether fields are populated.</li>
   <li>Validate the relationships that make records usable.</li>
   <li>Run negative controls for defaults, exclusions and routing.</li>
   <li>Prove corrected defects across the full affected mechanism.</li>
   <li>Build a key-level comparison dataset with a difference signature.</li>
   <li>Classify differences rather than treating them as one pile.</li>
   <li>Spend effort where logic can silently change meaning.</li>
   <li>Use sampling for qualitative checks, never as population proof.</li>
   <li>Explain movements between cycles, not only endpoints.</li>
   <li>Keep unresolved values visible in validation output.</li>
   <li>Tie every result to its cycle, run, snapshot, reference and build.</li>
   <li>Validate the validator before trusting a clean result.</li>
   <li>Trace unexplained differences to the first divergence.</li>
   <li>Bound the population before stating a root cause.</li>
   <li>Reduce noise under pressure, never proof.</li>
   <li>Do not suppress a valid failing control to produce green status.</li>
   <li>Let the acceptance recommendation follow the evidence.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A successful load is an event. A validated migration is an evidenced conclusion: the intended population arrived in the intended state, with the intended meaning and relationships, and every unexplained difference is controlled.</div>`
},
{
