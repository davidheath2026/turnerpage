{html:`<h4>Steps 1 to 4 \u2013 Before anything is transformed</h4>
 <ol class="framework-checks">
   <li>Confirm the readiness gate and the run manifest.</li>
   <li>Confirm the environment and target prerequisites.</li>
   <li>Freeze and confirm the source and reference inputs.</li>
   <li>Execute extraction and staging, if they are in scope for this cycle.</li>

{html:`<h4>Steps 5 to 8 \u2013 Transform, then prove before you package</h4>

   <li>Generate the controlled load package.</li>
   <li>Perform pre-load package checks.</li>

 <tr><td>Source snapshot</td><td>Fixes the input population</td></tr>
 <tr><td>Mapping or rule version</td><td>Fixes the approved logic</td></tr>
 <tr><td>Reference version</td><td>Fixes the lookup baseline</td></tr>
 <tr><td>Package or build</td><td>Fixes the executable code</td></tr>
 <tr><td>Environment</td><td>Fixes the execution location</td></tr>
 <tr><td>Expected submitted count</td><td>Pre-run control</td></tr>
 <tr><td>Exception and exclusion sets</td><td>Explains the non-submitted population</td></tr>
 <tr><td>Dependencies</td><td>Defines prerequisites</td></tr>
 <tr><td>Validation pack</td><td>Defines proof</td></tr>
 <tr><td>Run owner and support</td><td>Defines operational responsibility</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>One page, twelve fields</strong><br>A run manifest stops the cycle existing only as scattered filenames, chat messages and somebody's memory.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Cycle_Run_Manifest.xlsx</strong><p class="small">The twelve fields above, ready to complete before a cycle starts.</p></div><a class="btn secondary" href="/assets/downloads/Cycle_Run_Manifest.xlsx" download>Download</a></div>`
},
{
 id:"b10",nav:"Readiness gates",title:"A useful gate is testable",type:"selectAll",
 html:`<p class="lead">Six gates that appear on readiness trackers everywhere. Every one of them can be ticked without evidence. Explore each to see what it should say instead.</p>`,
 options: weakGates,
 coaching: weakGateCoaching,
 hint:"Explore every gate before continuing.",
 closingHtml:`<div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">The test for a gate</div><p>Ask whether the gate could fail. If there is no result that would make you tick it red, it is not a gate, it is a heading.</p></div></div>`
},
{
 id:"b11",nav:"Dependencies",title:"Dependency readiness is data readiness",type:"content",
 html:`<p class="lead">Customer records may be ready in isolation and not executable in sequence.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Dependency</th><th>Question</th></tr></thead><tbody>
 <tr><td>Legal entity or company context</td><td>Does the target context exist and match expected routing?</td></tr>
 <tr><td>Payment terms</td><td>Do approved target values and configuration exist?</td></tr>
 <tr><td>Customer groups</td><td>Are approved references present?</td></tr>
 <tr><td>Addresses</td><td>Will the required delivery addresses be available?</td></tr>
 <tr><td>Sales owners or users</td><td>Are referenced identities available?</td></tr>
 <tr><td>Sites and warehouses</td><td>Are required target values and configurations loaded?</td></tr>
 </tbody></table></div>
 <div class="callout experience"><div class="callout-label">SO-78452, as a reminder</div><p>The open order for customer C10482 depends on the customer record, delivery address C10482-DEL-02, product PRD-44781, site UK01, warehouse WH-BRI, currency GBP, a payment-term treatment and delivery method STDROAD. Eight things, one order. Readiness is relational.</p></div>`
},
{
 id:"b12",nav:"Expected results",title:"Write the expected result before you can see the actual one",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Expected result</th><th>Example</th></tr></thead><tbody>
 <tr><td>Submitted population</td><td>18,573 customer records</td></tr>
 <tr><td>Technical rejects</td><td>Expected zero for the controlled ready population, subject to actual execution</td></tr>
 <tr><td>Non-submitted reconciliation</td><td>34 approved exceptions plus 5 exclusions</td></tr>
 <tr><td>Target uniqueness</td><td>One expected customer per business key and context</td></tr>
 <tr><td>Reference semantics</td><td>Expected CustomerGroup and other controlled values</td></tr>
 <tr><td>Legal entity</td><td>Customer appears in the intended target context</td></tr>
 <tr><td>Relationships</td><td>Required address and dependency links survive</td></tr>
 <tr><td>No unexplained extras</td><td>Target delta contains only the intended population</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Expected results are part of readiness</strong><br>Validation becomes far stronger when the expected state is written before the target result is visible. Afterwards, what you find has a way of becoming what you expected.</div>`
},
{
 id:"b13",nav:"Negative tests",title:"Prepare the tests for what must not happen",type:"content",
 html:`<p class="lead">For each material rule, define how you will prove it.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Rule or risk</th><th>Validation</th></tr></thead><tbody>
 <tr><td>Country UK to GB</td><td>Source-to-target semantic comparison by key</td></tr>
 <tr><td>CustomerGroup mapping</td><td>Expected versus actual target value by key and context</td></tr>
 <tr><td>Address eligibility</td><td>Positive DELIVERY_PRIMARY and DELIVERY_SECONDARY, negative BILLING_ONLY</td></tr>
 <tr><td>Legal entity routing</td><td>Expected entity versus actual entity invariant</td></tr>
 <tr><td>Duplicate prevention</td><td>Distinct key count and duplicate query</td></tr>
 <tr><td>Exception handling</td><td>Every non-ready key has a controlled reason and status</td></tr>
 </tbody></table></div>
 <h3>Then the negative tests</h3>
 <ul class="framework-checks">
   <li>BILLING_ONLY addresses must not appear where excluded.</li>
   <li>Unapproved 45E must not silently become NET30.</li>
   <li>Unmapped CustomerGroup values must not default to STANDARD.</li>
   <li>One source key must not multiply through a reference join.</li>
   <li>Records assigned to UK context must not silently land in Belgium.</li>
   <li>Approved exclusions must not re-enter through another path.</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Validating what is easy to count. Many dangerous migration defects produce no technical rejects at all. The 42 UK customers that later appeared under the Belgian legal entity are the case in point: every count matched.</p></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Validation_Pack.sql</strong><p class="small">Count, key-set, duplicate, semantic and negative controls, parameterised by cycle.</p></div><a class="btn secondary" href="/assets/downloads/Validation_Pack.sql" download>Download</a></div>`
},
{
 id:"b14",nav:"Six filenames",title:"The readiness pack that looks complete",type:"mcq",
 _correctIndex:3,
 html:`<p class="lead">A handover arrives. Six files, and nothing else.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Cycle folder</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Customer_Final.csv
Mapping_FINAL_v2.xlsx
Reference_latest.xlsx
LoadPackage.zip
Validation.sql
Exceptions.xlsx</code></pre></div>
 <h3>Before executing anything, what is the useful thing to do with this?</h3>`,
 options:[
   {label:"Open each file and inspect its contents in turn, since the filenames themselves are uninformative but the data inside them will establish what the cycle actually contains and where it came from.", correct:false, feedback:"Inspection helps and it cannot recover identity. Opening Reference_latest.xlsx tells you what is in it, not whether it is the approved version for this cycle."},
   {label:"Ask the person who handed it over to walk you through what each file is, where it came from, and why it was named the way it was.", correct:false, feedback:"Worth doing, and it produces recollection rather than evidence. What you need has to survive that person being unavailable next week."},
   {label:"Rename all six files to include dates and versions, so that the cycle has a controlled naming convention in place before anything is executed.", correct:false, feedback:"Renaming applies labels you cannot substantiate. A date in a filename you added yourself is not a source identity."},
   {label:"Write down what the filenames cannot answer: the source snapshot, approved decisions, reference version, build, environment, exception population and dependencies.", correct:true, feedback:"Correct. The gap is not information, it is identity. Naming what cannot be proven from the handover is what turns a vague unease into a list somebody can close."}
 ]
},
{
 id:"b15",nav:"Exceptions and logging",title:"Design exception handling and logging before the run",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Question</th><th>Readiness answer</th></tr></thead><tbody>
 <tr><td>Where do rejected or unready records go?</td><td>A controlled exception output or table</td></tr>
 <tr><td>What identifies them?</td><td>Business key plus run and cycle identity</td></tr>
 <tr><td>How are reasons classified?</td><td>A stable reason or signature</td></tr>
 <tr><td>Can they be rerun independently?</td><td>A defined recovery mechanism</td></tr>
 <tr><td>Can they disappear silently?</td><td>Reconciliation prevents it</td></tr>
 <tr><td>Who reviews business exceptions?</td><td>A defined owner and process</td></tr>
 <tr><td>What happens to approved exclusions?</td><td>Separate controlled status, never mixed with defects</td></tr>
 </tbody></table></div>
 <h3>And the log that makes a restart possible</h3>
 <p>Cycle and run ID, step name, start and end timestamps, input, output and reject counts, source, reference and build identities, status, error signature, checkpoint or restart state, and operator context where relevant.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">The operational question</div><p>If the run stops after transformation, can you prove what completed, which output belongs to that run, and where a safe restart could begin? Design exception handling now, because the alternative is designing it at 02:00 while people wait.</p></div></div>`
},
{
 id:"b16",nav:"The sequence",title:"Rehearse the run in operational order",type:"guidedSteps",
 html:`<p class="lead">Fourteen steps, written the way the cycle will actually happen rather than the way it is usually described. Work forward through them one group at a time.</p>`,
 steps: runSequence,

},
{
 id:"b17",nav:"Stop conditions",title:"A runbook needs brakes",type:"selectAll",
 html:`<p class="lead">Seven conditions that should stop a cycle. Explore each one to see what the response actually is, because \u201ckeep going and see what happens\u201d is not a migration control.</p>`,
 options: stopConditions,
 coaching: stopConditionCoaching,

 closingHtml:`<div class="principle"><strong>Decide these before the run</strong><br>A stop condition discovered during execution is not a stop condition. It is an argument, held under time pressure, in front of people who want to continue.</div>`
},
{
 id:"b18",nav:"Partial readiness",title:"What can continue when one area is not ready",type:"content",
 html:`<p class="lead">Not every unresolved item has to stop the whole cycle.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Situation</th><th>Possible controlled treatment</th></tr></thead><tbody>
 <tr><td>Small explicit unresolved population</td><td>Isolate under the approved exception process, if cycle rules permit</td></tr>
 <tr><td>Dependency absent for one subset</td><td>Hold the dependent subset; continue the unaffected population if safe</td></tr>
 <tr><td>Reference ambiguity affects all records</td><td>Likely blocks entity release until resolved</td></tr>
 <tr><td>Validation pack incomplete</td><td>Execution may be technically possible, but acceptance is not controlled</td></tr>
 <tr><td>Source baseline changed after preparation</td><td>Reassess the population and the impacted readiness evidence</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Consultant recommendation, project decision</strong><br>You provide evidence and safe options. Wider release and scope decisions may belong to the Data Migration Lead or project leadership, and saying so in the recommendation is part of making it usable.</div>
 <h3>What a readiness review sounds like</h3>
 <div class="quote">\u201cCustomer cycle population reconciles to 18,612: 18,573 intended for submission, 34 approved pre-load exceptions and 5 approved exclusions. Source, reference and package identities are fixed in the run manifest. High-risk transformation and negative controls pass. Remaining decision-dependent records are not silently defaulted. Validation is prepared for count, key-set, CustomerGroup, legal entity and address dependencies. One open dependency remains.\u201d</div>
 <p class="small">Lead with what is ready, what is not, and what evidence supports the statement. Do not read the checklist aloud.</p>`
},
{
 id:"b19",nav:"The readiness lab",title:"Consultant situations \u2013 Five moments in the lab",type:"situations",
 html:`<p class="lead">You have a practice cycle folder: a source extract with 18,612 rows, exception and exclusion files, a candidate submitted file, mapping and reference files with conflicting timestamps, a run manifest with fields missing, validation SQL copied from the previous cycle, an address dependency report, and a Teams message. Execution is possible throughout. That is the difficulty.</p>`,
 items: labSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The File That Changed at 07:12", name:"Priya", role:"Data Migration Consultant", project:"Healthcare ERP",

   reflection:"When an input changed late on your last cycle, did anything in your evidence record that it had?"
 })}</div>`
},
{
 id:"b20",nav:"Build the pack",title:"Build it \u2013 The pre-execution evidence summary",type:"reflection",
 html:`<p class="lead">Produce the summary you would hand to the Data Migration Lead, and the recommendation that goes at the bottom of it.</p>
 <div class="tp-table-wrap"><table class="tp-table"><caption>The three available recommendations</caption><thead><tr><th>Recommendation</th><th>Meaning</th></tr></thead><tbody>
 <tr><td>READY TO EXECUTE</td><td>All defined readiness gates pass for the stated scope</td></tr>
 <tr><td>READY WITH CONTROLLED EXCEPTIONS</td><td>Execution can proceed for the explicit ready population under agreed exception controls</td></tr>
 <tr><td>NOT READY TO EXECUTE</td><td>A material baseline, population, dependency or validation gap makes execution unsafe or unprovable</td></tr>
 </tbody></table></div>
 <h3>Your summary should cover</h3>
 <ol class="framework-checks">
   <li>Cycle and scope.</li>
   <li>Population, with the control equation reconciled by key.</li>
   <li>Source, mapping, reference and build identities.</li>
   <li>Dependencies checked, and any that remain open.</li>
   <li>Validation prepared, including negative controls.</li>
   <li>Unresolved treatments, stated rather than defaulted.</li>
   <li>The recommendation, with the exact evidence it rests on.</li>
   <li>What belongs to you, and what belongs to the Lead.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">No green by instinct</div><p>The recommendation must cite the specific evidence that passed and failed. It is a technical-readiness recommendation, not the programme's Go or No-Go authority, and the sentence should make that boundary audible.</p></div>
 <textarea id="reflection" placeholder="Cycle: ...&#10;Population: ...&#10;Baselines: ...&#10;Dependencies: ...&#10;Validation: ...&#10;Unresolved: ...&#10;Recommendation: ...&#10;What belongs to the Lead: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Pre_Execution_Evidence_Summary.docx</strong><p class="small">The eight-section summary, short at the front because the evidence pack sits underneath it.</p></div><a class="btn secondary" href="/assets/downloads/Pre_Execution_Evidence_Summary.docx" download>Download</a></div>`,
 minLength:70,
 checks:[
   { test:/18,?612|18,?573|34|control equation/i, strength:"You reconciled the population against the control equation rather than quoting a single total.", gap:"State the population as the equation: source cycle population, approved exceptions, approved exclusions and submitted records." },
   { test:/key|key.set|by key/i, strength:"You reconciled by key rather than by count alone.", gap:"Say that the reconciliation is by key set, not just by count. Two files of 18,573 rows can hold different customers." },
   { test:/snapshot|version|build|identit|manifest/i, strength:"You named the baseline identities rather than describing the files.", gap:"Name the source snapshot, mapping version, reference version and build identity. Identity is what makes the run reproducible." },
   { test:/negative|must not|semantic|invariant/i, strength:"Your validation includes semantic or negative controls, not just counts.", gap:"Include at least one negative control: what must not happen, such as unapproved 45E silently becoming NET30." },
   { test:/unresolved|not defaulted|no default|explicit|exception control/i, strength:"You kept unresolved treatments visible rather than defaulting them.", gap:"State that unresolved values remain explicit and are not defaulted to make the count complete." },
   { test:/belongs|Lead|leadership|not mine|recommendation.*(not|rather than).*(go|authority)/i, strength:"You marked the boundary between your recommendation and the programme's decision.", gap:"Say what is yours to recommend and what remains the Lead's or the programme's decision." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>Cycle and population.</strong> Customer cycle C3. The source-cycle population is 18,612 and it reconciles by key, not only by count: 18,573 keys intended for submission, 34 approved pre-load exceptions and 5 approved exclusions. Every source key carries exactly one controlled pre-execution status, there are no overlaps between the three sets, and no key is unclassified.</div>
 <div class="quote"><strong>Baselines and dependencies.</strong> The source snapshot is fixed and identified rather than selected by filename. The approved mapping version, reference version and package build are recorded in the run manifest, and the reference was chosen because it is the approved version for this cycle rather than because it is the newest file present. Dependencies are checked for the stated customer scope; the delivery-address reconciliation is not complete, so the dependent downstream activity is held while customer execution itself proceeds.</div>
 <div class="quote"><strong>Validation and unresolved treatments.</strong> Validation points at this cycle rather than the previous one, and covers count, key set, duplicates, CustomerGroup semantics and legal-entity routing, with negative controls: BILLING_ONLY addresses must not appear, 45E must not silently become NET30, unmapped CustomerGroup values must not default to STANDARD. The 18 CustomerGroup 99 records and the 45E population remain unresolved and explicitly classified. Nothing has been defaulted to make the submitted count look complete.</div>
 <div class="quote"><strong>Recommendation.</strong> READY WITH CONTROLLED EXCEPTIONS for the stated customer scope, on the evidence above. The open address dependency and the held downstream activity are the two things that could change that. This is a technical-readiness recommendation; the release decision and any change to cycle sequence remain with the Data Migration Lead and project leadership, and I can supply the affected populations and impact for either.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The marker of a strong summary here is that it is short at the front and specific underneath. If a reader could tell from your first paragraph what would have to change for your recommendation to move, it is doing its job.":"Check two things. Did you reconcile by key rather than by count, and does your recommendation cite the evidence it rests on rather than asserting a colour? Both are where these summaries usually thin out."}</div>`
},
{
 id:"b21",nav:"What readiness is not",title:"What readiness is not, and the anti-patterns that imitate it",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Not enough</th><th>Why</th></tr></thead><tbody>
 <tr><td>\u201cThe package executes on my machine.\u201d</td><td>Does not prove controlled inputs or the target environment</td></tr>
 <tr><td>\u201cCounts match last cycle.\u201d</td><td>The population may have changed entirely</td></tr>
 <tr><td>\u201cThe business knows about the exceptions.\u201d</td><td>Does not prove approved treatment or status</td></tr>
 <tr><td>\u201cThe mapping workbook is complete.\u201d</td><td>Does not prove implementation or reference version</td></tr>
 <tr><td>\u201cNo rejects in test.\u201d</td><td>Does not prove semantic correctness</td></tr>
 <tr><td>\u201cWe have a rollback plan.\u201d</td><td>Does not make an unready run ready</td></tr>
 <tr><td>\u201cEveryone is comfortable.\u201d</td><td>Confidence is not evidence</td></tr>
 </tbody></table></div>
 <h3>Ten readiness anti-patterns</h3>
 <ul class="framework-checks">
   <li>Selecting files by \u201clatest\u201d.</li>
   <li>Changing mappings after validation without impact analysis.</li>
   <li>Treating exception counts without keys as reconciliation.</li>
   <li>Reusing last cycle's validation unchanged.</li>
   <li>Allowing unresolved values to default so counts stay complete.</li>
   <li>Assuming target prerequisites exist.</li>
   <li>Running before expected results are defined.</li>
   <li>Mixing approved exclusions with defects.</li>
   <li>Not recording source, reference and build identities.</li>
   <li>Discovering stop conditions during execution.</li>
 </ul>
 <h3>The same discipline, beyond the customer package</h3>
 <p>A Bramwell supplier cycle would need the 73 classification conflicts to remain visible, including unresolved S20418. A product-site cycle would need the 286 relationships outside the approved target reference set explicitly controlled. A fixed-asset cycle would need the 126 depreciation-category exceptions, including unresolved DEP-07, represented in its expected-result model. In none of those cases does readiness mean forcing the population to zero.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Technical_Readiness_Checklist.xlsx</strong><p class="small">Fourteen areas with the evidence each one requires, from scope through to communication.</p></div><a class="btn secondary" href="/assets/downloads/Technical_Readiness_Checklist.xlsx" download>Download</a></div>`
},
{
 id:"b22",nav:"Reflection",title:"Reflection \u2013 Would you press Run?",type:"reflection",
 html:`<p class="lead">What is the smallest missing piece of readiness evidence that would make you refuse to execute a migration package, even when you were confident the package itself would run successfully? Name it, and explain why that particular gap is the one you would not accept.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>The interesting answers are usually small: an unidentifiable reference version, an expected result nobody wrote down, a source file that might have been replaced. Each is trivial to fix beforehand and close to unrecoverable afterwards, which is what makes them worth refusing over.</p></div></div>
 <textarea id="reflection" placeholder="The smallest thing I would refuse to run without..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/identit|version|snapshot|which (file|reference|build)/i, strength:"You picked a gap about identity, which is the category that becomes unrecoverable once the run has happened.", gap:"Consider whether your chosen gap is about identity: which source, which reference, which build actually executed." },
   { test:/afterward|later|cannot|unprovable|reproduce|prove/i, strength:"You explained the consequence in terms of what could not be proven afterwards.", gap:"Say what specifically becomes impossible after the run if that evidence is missing." },
   { test:/small|minor|trivial|cheap|five minutes|quick/i, strength:"You noticed the asymmetry: cheap to fix beforehand, expensive afterwards.", gap:"Note how long the gap would take to close before the run, against what it costs after it." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">An unidentifiable reference version. It sounds like the smallest thing on the list and it is the one I would not run without, because every other gap can be reconstructed afterwards and this one cannot. If the run completes and I cannot say which reference baseline executed, then every value it produced is unexplainable: I cannot tell an approved mapping from an accidental one, I cannot tell whether a change was applied, and I cannot reproduce the result to check. Fixing it before the run is ten minutes of recording an identity. Fixing it afterwards is not possible at all, only rerunning is, and by then the output has usually gone somewhere.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The strongest answers name something that costs minutes beforehand and cannot be recovered afterwards. That asymmetry is the whole argument for readiness work, and it is more persuasive than any checklist.":"Push on the consequence. Not just what is missing, but what you would be unable to prove once the run has happened and the output has moved on."}</div>`
},
{
 id:"b23",nav:"Summary",title:"Summary \u2013 Control the run before it starts",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Define the exact cycle population before execution.</li>
   <li>Reconcile by key, not only by count.</li>
   <li>Freeze and identify the source baseline.</li>
   <li>Detect source drift against your preparation evidence.</li>
   <li>Fix the mapping, transformation and reference baselines.</li>
   <li>Keep unresolved business values visible.</li>
   <li>Treat reference data as executable logic.</li>
   <li>Identify the exact technical build and environment.</li>
   <li>Use a run manifest to bind the cycle together.</li>
   <li>Make readiness gates testable.</li>
   <li>Check relational dependencies.</li>
   <li>Write expected results before seeing actual results.</li>
   <li>Prepare semantic and negative validation, not only counts.</li>
   <li>Design exception handling and logging before the run.</li>
   <li>Rehearse the operational sequence.</li>
   <li>Define stop conditions in advance.</li>
   <li>Separate what can continue from what genuinely blocks execution.</li>
   <li>Base the readiness recommendation on evidence.</li>
   <li>Do not confuse technical executability with migration readiness.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A controlled migration cycle should be explainable before it starts: these are the records, this is the source, these are the approved rules and references, this is the build, these are the exceptions, this is what we expect to happen, and this is how we will know whether it did.</div>`
},
