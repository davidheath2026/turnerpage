const recoverySteps = [
{html:`<h4>Steps 1 to 4 \u2013 Approve, identify, fix, invalidate</h4>
 <ol class="framework-checks">
   <li>Approve or confirm the correction and the recovery scope.</li>
   <li>Create a new rerun ID and manifest.</li>
   <li>Fix the source, reference and build baselines.</li>
   <li>Invalidate the stale affected outputs.</li>
 </ol>
 <p>Step 4 is the one people leave until later and then forget. The corrected transform produces a new file while the failed run's output sits in the same outbound folder, and something downstream picks by timestamp.</p>
 <div class="principle"><strong>A corrected build needs a new identity</strong><br>Do not overwrite PKG-CUST-R3-B07 and keep calling it B07. Publish the corrected executable under a new build identity and tie the rerun manifest to it. The same applies to changed references, mapping baselines and output files.</div>`},
{html:`<h4>Steps 5 to 8 \u2013 Generate the population, execute, reconcile</h4>
 <ol class="framework-checks" start="5">
   <li>Generate the controlled rerun key set.</li>
   <li>Execute from the proven recovery boundary.</li>
   <li>Capture step counts and errors.</li>
   <li>Reconcile rerun input to outcomes.</li>
 </ol>
 <p>Step 5 comes after step 3 for a reason. A rerun population built before the baselines are fixed describes records under logic that is about to change.</p>
 <p class="small">A rerun population should be a controlled key set, not a WHERE clause improvised under pressure. You should be able to explain why every rerun key is included and why every non-rerun key is excluded.</p>`},
{html:`<h4>Steps 9 to 12 \u2013 Prove it, then close it</h4>
 <ol class="framework-checks" start="9">
   <li>Run semantic and regression validation.</li>
   <li>Compare corrected versus original outcomes.</li>
   <li>Confirm no unintended changes outside scope.</li>
   <li>Close only when the evidence pack is complete.</li>
 </ol>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Step 11 is the one that gets skipped</div><p>A green rerun proves the intended records changed. It says nothing about whether anything else moved. The strongest recovery evidence shows both the intended change and the absence of unexplained change, and only the second half requires an unaffected control population.</p></div></div>`}
];

const recoverySituations = [

     {label:"Thirty-seven, and all 37 should receive identical recovery treatment so the population is handled consistently and can be proven as a single set.", correct:false, feedback:"The population is 37 and the treatment is not uniform. Forcing identical handling would mean rerunning 36 records that were never attempted."}

 },

   options:[

 },

   question:"A stakeholder wants the failed records rerun immediately, with diagnosis deferred. How do you answer?",

     {label:"Say it is possible only if you can prove the failures are the complete affected population, the correction is valid, target replay behaviour is safe and the rerun will not combine with stale outputs.", correct:true, feedback:"Correct. Name the four conditions, say which are currently unproven, and offer containment while the recovery boundary is established. That is an answer the stakeholder can work with rather than a refusal."},

{

 html:`<p class="lead">The customer load reports a problem. The fastest response looks obvious: fix it and run the package again.</p>
 <div class="callout experience"><div class="callout-label">Before you begin</div><p>Four things are all true at once on a failed migration, and each one breaks a different assumption behind \u201cjust run it again\u201d.</p></div>
 <ul class="framework-checks">

   <li>A run can complete technically while its outputs are semantically invalid.</li>

{
 id:"b7",nav:"What committed",title:"Determine what already committed",type:"content",
 html:`<p class="lead">A package fails after processing 12,000 of 18,573 intended records. The log says failed. That alone tells you nothing about the target state.</p>
 <ul class="framework-checks">
   <li>Did the target commit each record independently?</li>
   <li>Was the operation transactional by batch?</li>
   <li>Did a checkpoint persist?</li>
   <li>Were any child records created?</li>
   <li>Would replay update, ignore or duplicate existing keys?</li>
   <li>Did the integration layer acknowledge records before the failure?</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Never infer target state from process state</div><p>A failed process can leave partial successful data behind. Query the target and reconcile actual committed keys. The process log describes what the process believed it was doing, which is a different thing.</p></div>
 <div class="tp-table-wrap"><table class="tp-table"><caption>Execution-state reconciliation</caption><thead><tr><th>State</th><th>Meaning</th></tr></thead><tbody>
 <tr><td>Expected input</td><td>Population intended for this run</td></tr>
 <tr><td>Committed success</td><td>Keys proven present and accepted in target from this run</td></tr>
 <tr><td>Controlled rejection</td><td>Keys explicitly rejected with a reason</td></tr>
 <tr><td>Not attempted</td><td>Keys never submitted or processed</td></tr>
 <tr><td>Unknown</td><td>Keys whose state cannot yet be proven</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>The control equation</strong><br>Every expected key must resolve to exactly one execution state. Unknown is a diagnostic status, not a number to hide, and a recovery planned while keys remain unknown is a recovery planned in the dark.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Failure_State_Reconciliation.xlsx</strong><p class="small">Five states, one row per expected key, with the control equation built in.</p></div><a class="btn secondary" href="/assets/downloads/Failure_State_Reconciliation.xlsx" download>Download</a></div>`
},

{
 id:"b9",nav:"Stale outputs",title:"Stale outputs are a recovery defect",type:"content",
 html:`<p class="lead">You correct the transformation and regenerate the customer file. The downstream address package from the failed run is still sitting in the outbound folder.</p>
 <div class="callout misconception"><div class="callout-label">The risk</div><p>The team combines corrected and stale artefacts from different logical runs, and the result looks entirely normal. Nothing errors, nothing rejects, and the output is a blend of two executions nobody intended to merge.</p></div>
 <ol class="framework-checks">
   <li>Invalidate the affected downstream artefacts.</li>
   <li>Generate new outputs under a new run and build identity.</li>
   <li>Prevent old files from being selected by \u201clatest\u201d.</li>
   <li>Tie validation to the corrected run identity.</li>
   <li>Record which prior artefacts are superseded.</li>
 </ol>
 <p class="small">Step 3 is the one that needs a mechanism rather than a note. Timestamps change for reasons that have nothing to do with correctness, including somebody copying a folder.</p>`
},
{
 id:"b10",nav:"Rerun population",title:"Construct the rerun population explicitly",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Field</th><th>Purpose</th></tr></thead><tbody>
 <tr><td>Business key</td><td>Identifies the record</td></tr>
 <tr><td>Original run ID</td><td>Links the failed execution</td></tr>
 <tr><td>Failure mechanism or reason</td><td>Explains inclusion</td></tr>
 <tr><td>Recovery action</td><td>Transform, load or revalidate</td></tr>
 <tr><td>Dependency scope</td><td>Identifies child and downstream regeneration</td></tr>
 <tr><td>Corrected build and reference</td><td>Defines the recovery baseline</td></tr>
 <tr><td>Rerun ID</td><td>Links the new execution</td></tr>
 <tr><td>Expected result</td><td>Defines the proof</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Population principle</strong><br>You should be able to explain why every rerun key is included and why every non-rerun key is excluded. A rerun population is a controlled key set, not a WHERE clause improvised under pressure.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Rerun_Population.xlsx</strong><p class="small">The eight fields above, one row per recovery key.</p></div><a class="btn secondary" href="/assets/downloads/Rerun_Population.xlsx" download>Download</a></div>`
},
{
 id:"b11",nav:"Fix the mechanism",title:"Fix the mechanism, then test before you rerun",type:"content",
 html:`<p class="lead">For the address defect, the correct change is not \u201cinclude C10482-DEL-02\u201d.</p>
 <div class="quote">Implement the approved business rule: exclude BILLING_ONLY. Then test DELIVERY_PRIMARY, DELIVERY_SECONDARY and BILLING_ONLY behaviour across the population.</div>
 <div class="callout misconception"><div class="callout-label">Regression danger</div><p>A fix that restores the seven examples but changes another address class is not a successful correction. It is a second defect, introduced during recovery, and it will be harder to find because everyone has stopped looking.</p></div>
 <h3>Re-test before the operational rerun</h3>
 <ul class="framework-checks">
   <li>A positive case that previously failed.</li>
   <li>A positive case that already worked.</li>
   <li>A negative case that must remain excluded.</li>
   <li>Boundary, NULL and unknown values where relevant.</li>
   <li>Population-level count and key reconciliation.</li>
   <li>Reference zero, one and more-than-one behaviour.</li>
   <li>Downstream dependency expectations.</li>
 </ul>
 <p class="small">The second item matters as much as the first. Do not discover whether the fix works by applying it directly to the live recovery population.</p>`
},
{
 id:"b12",nav:"Which population",title:"Failed records, or the affected population?",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">Five observed situations, five different answers to the same question. Explore each, and answer the test underneath before you move on.</p>`,
 items: rerunPopulationLogic,
 takeawayHtml:`<div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Only the first and fourth of these five ever justify a narrow population, and both depend on proving something rather than assuming it. The other three are the cases where the visible failures are a sample.</p></div></div>`
},
{
 id:"b13",nav:"Dependencies and limits",title:"Dependencies widen recovery, and a rerun cannot manufacture approval",type:"content",
 html:`<p class="lead">Correcting a customer or an address may invalidate downstream entities.</p>
 <div class="callout experience"><div class="callout-label">SO-78452</div><p>The order depends on customer C10482, delivery address C10482-DEL-02, product PRD-44781, site UK01, warehouse WH-BRI, currency GBP, a payment-term treatment and delivery method STDROAD. If an upstream dependency changes, establish whether the dependent order output, load or validation must be regenerated.</p></div>
 <h3>And one thing a rerun cannot do</h3>
 <ul class="framework-checks">
   <li>45E still has no approved target equivalent.</li>
   <li>CustomerGroup 99 remains unresolved for 18 German records.</li>
 </ul>
 <div class="principle"><strong>Recovery rule</strong><br>A rerun can correct technical execution. It cannot manufacture business approval. Keep unresolved records controlled according to the agreed exception and release treatment, however convenient it would be for the recovery to close them.</div>`
},
{
 id:"b14",nav:"The recovery run",title:"Run the recovery as a new controlled execution",type:"guidedSteps",
 html:`<p class="lead">Twelve steps, in order. The ordering is the content here: several of these are commonly done in the wrong sequence, and each time it produces a recovery nobody can prove. Work forward through them.</p>`,
 steps: recoverySteps,
 takeawayHtml:`<div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Recovery_Run_Manifest.xlsx</strong><p class="small">Inputs, corrected build, recovery scope, dependencies and expected result for a rerun execution.</p></div><a class="btn secondary" href="/assets/downloads/Recovery_Run_Manifest.xlsx" download>Download</a></div>`
},
{
 id:"b15",nav:"Prove what changed",title:"Prove what changed, and what did not",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Comparison</th><th>Question</th></tr></thead><tbody>
 <tr><td>Before versus after, affected keys</td><td>Did the intended records change as expected?</td></tr>
 <tr><td>Unaffected control population</td><td>Did anything outside scope change?</td></tr>
 <tr><td>Counts and key sets</td><td>Are records missing, duplicated or substituted?</td></tr>
 <tr><td>Semantic values</td><td>Are the target values now correct?</td></tr>
 <tr><td>Dependencies</td><td>Are child and related outcomes still valid?</td></tr>
 <tr><td>Exceptions</td><td>Did unresolved records remain explicit?</td></tr>
 <tr><td>Run identities</td><td>Can every result be traced to the corrected execution?</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Delta proof</strong><br>The strongest recovery evidence shows both the intended change and the absence of unexplained change. Most recovery packs contain only the first half.</div>
 <h3>The zero-reject trap, one more time</h3>
 <p>Bramwell later records 18,573 submitted and accepted with zero rejects, and validation then finds 42 UK customers in the Belgian legal entity. A technically clean run can still require controlled correction and rerun. Recovery is driven by correctness, not by loader status, and the root cause of that 42-record issue is not established in the case study.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Before_After_Delta.sql</strong><p class="small">Affected-key comparison plus an unaffected control population, so the pack can prove both halves.</p></div><a class="btn secondary" href="/assets/downloads/Before_After_Delta.sql" download>Download</a></div>`
},
{
 id:"b16",nav:"Cause unknown",title:"You can contain a problem before you can explain it",type:"mcq",
 _correctIndex:0,
 html:`<p class="lead">A semantic defect has appeared. Root cause is genuinely unknown and will stay unknown for some hours. People want to know what you are doing in the meantime.</p>
 <h3>What can you legitimately do right now?</h3>`,
 options:[
   {label:"Freeze the affected outputs, identify the observed wrong keys, compare expected against actual routing, prevent dependent release, and collect source, transformed and target evidence.", correct:true, feedback:"Correct. Containment protects the project while diagnosis continues. Every item on that list is provable now and none of them commits you to an explanation you cannot yet support."},
   {label:"Declare a working root cause so the team has a shared hypothesis to organise around, clearly labelled as provisional until the evidence confirms it.", correct:false, feedback:"A provisional root cause becomes the root cause by lunchtime. Label the hypothesis in your own notes; do not declare it as the project's working answer."},
   {label:"Treat the observed wrong keys as the affected population, so that containment has a defined scope while the investigation continues.", correct:false, feedback:"The observed keys are what validation happened to check. Assuming they are the full population is the specific error this whole lesson is built around."},
   {label:"Patch the visibly affected target records so the immediate business impact is removed, then close the defect once the mechanism is understood.", correct:false, feedback:"Patching before the mechanism is known may hide it, leaves other affected records undiscovered, and creates target state the migration process cannot reproduce."}
 ]
},
{
 id:"b17",nav:"Second failure",title:"When a rerun fails again, and what closure requires",type:"content",
 html:`<ol class="framework-checks">
   <li>Do not stack another uncontrolled retry.</li>
   <li>Compare the failure signature with the original.</li>
   <li>Determine whether the correction failed or a new issue appeared.</li>
   <li>Preserve both run identities and outputs.</li>
   <li>Recalculate the execution-state reconciliation.</li>
   <li>Check whether reference, source or configuration changed between attempts.</li>
   <li>Reassess the recovery boundary.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Forcing the second failure into the original diagnosis because it happened during recovery. A second failure is new evidence. It may share nothing with the first except its timing.</p></div>
 <div class="tp-table-wrap"><table class="tp-table"><caption>The recovery evidence pack</caption><thead><tr><th>Artefact</th><th>Content</th></tr></thead><tbody>
 <tr><td>Failure record</td><td>Observed event, impact, run ID</td></tr>
 <tr><td>Frozen evidence</td><td>Logs, outputs, source, reference and build identities</td></tr>
 <tr><td>Root-cause evidence</td><td>First divergence and mechanism</td></tr>
 <tr><td>Affected-population output</td><td>Mechanism-based key set</td></tr>
 <tr><td>Correction record</td><td>Approved technical change</td></tr>
 <tr><td>Regression tests</td><td>Positive, negative and population controls</td></tr>
 <tr><td>Rerun manifest</td><td>Inputs, build, scope, dependencies</td></tr>
 <tr><td>Rerun reconciliation</td><td>Input, success, reject and unknown states</td></tr>
 <tr><td>Before and after delta</td><td>Intended and unintended changes</td></tr>
 <tr><td>Closure evidence</td><td>Semantic validation and downstream confirmation</td></tr>
 </tbody></table></div>`
},
{
 id:"b18",nav:"Recovery decisions",title:"Consultant situations \u2013 Five recovery decisions",type:"situations",
 html:`<p class="lead">Five moments in a recovery, each with a tempting shortcut that would create duplicate, stale or unprovable target data. The first two use training scenarios rather than the Bramwell cycle itself.</p>`,
 items: recoverySituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Rerun That Needed a Boundary", name:"Elena", role:"Data Migration Consultant", project:"Utilities ERP",
   src:"/assets/audio/lesson3-fromfield-elena.mp3",
   reflection:"After your last failed run, how did you decide what to rerun? Was the boundary proven, or assumed?"
 })}</div>`
},
{
 id:"b19",nav:"Write the recommendation",title:"Build it \u2013 The recovery recommendation",type:"reflection",
 html:`<p class="lead">Write the recovery recommendation for the address defect, in the structure a reviewer will expect.</p>
 <ol class="framework-checks">
   <li>Failure and impact.</li>
   <li>What is proven.</li>
   <li>First divergence and mechanism.</li>
   <li>Full affected population, and how it was derived.</li>
   <li>Target execution state.</li>
   <li>The correction.</li>
   <li>Recovery boundary.</li>
   <li>Rerun population.</li>
   <li>Dependencies.</li>
   <li>Validation and proof.</li>
   <li>Remaining uncertainty.</li>
   <li>Recommendation.</li>
 </ol>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">What it is judged on</div><p>Not length. Whether another consultant could reconstruct the recovery from it, and whether the population came from the mechanism rather than the defect ticket.</p></div></div>
 <textarea id="reflection" placeholder="FAILURE AND IMPACT: ...&#10;WHAT IS PROVEN: ...&#10;MECHANISM: ...&#10;AFFECTED POPULATION: ...&#10;RECOVERY BOUNDARY: ...&#10;VALIDATION: ...&#10;REMAINING UNCERTAINTY: ...&#10;RECOMMENDATION: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Recovery_Evidence_Pack.docx</strong><p class="small">The twelve-section structure above, with the ten evidence artefacts listed against it.</p></div><a class="btn secondary" href="/assets/downloads/Recovery_Evidence_Pack.docx" download>Download</a></div>`,
 minLength:80,
 checks:[
   { test:/mechanism|predicate|eligibility|BILLING_ONLY|DELIVERY_SECONDARY/i, strength:"You named the mechanism rather than the symptom.", gap:"State the mechanism: the eligibility predicate retains DELIVERY_PRIMARY instead of excluding BILLING_ONLY." },
   { test:/not (just|merely|only) the seven|full affected|derived from the mechanism|exposed to/i, strength:"Your population is derived from the mechanism, not from the seven reported examples.", gap:"Say explicitly that the affected population comes from the faulty mechanism rather than the seven reported keys." },
   { test:/raw stag|staging is valid|transformation|boundary/i, strength:"You justified the recovery boundary from proven evidence rather than defaulting to a full re-extract.", gap:"Justify the boundary: raw staging is valid, the defect enters at transformation, so recovery restarts there." },
   { test:/regression|positive|negative|primary.*secondary|test/i, strength:"Your correction includes regression coverage across address classes, not just the failing case.", gap:"Include regression tests covering primary, secondary and billing-only behaviour, so the fix cannot break another class." },
   { test:/invalidat|supersed|new (build|run) identit|regenerat/i, strength:"You invalidated the stale downstream outputs and used a new identity for the corrected run.", gap:"Say that affected downstream outputs are invalidated and the recovery runs under a new build and run identity." },
   { test:/unchanged|outside (the )?(recovery )?(scope|population)|no unexplained|control population/i, strength:"Your closure proves the absence of unintended change, not just the intended one.", gap:"Closure needs proof that nothing outside the recovery population changed. Add the unaffected control comparison." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>Mechanism and population.</strong> The missing-address defect is introduced in transformation by an eligibility predicate that retains DELIVERY_PRIMARY rather than excluding BILLING_ONLY, so valid DELIVERY_SECONDARY rows are silently dropped. C10482-DEL-02 is present in raw staging, absent from transformed output and absent from the exception output, which is what proves the loss is silent rather than controlled. The full affected population has been derived from the faulty mechanism rather than from the seven reported examples, and is larger than those seven.</div>
 <div class="quote"><strong>Boundary and correction.</strong> Raw staging is valid, so a source re-extract is not required and would introduce unrelated change risk. Recovery restarts from transformation, the last proven-good boundary, under a new build identity rather than overwriting the existing one. The corrected rule implements the approved intent: exclude BILLING_ONLY. Regression tests cover a previously failing secondary address, a primary address that already worked, and a billing-only address that must remain excluded, so the fix cannot repair one class by breaking another.</div>
 <div class="quote"><strong>Dependencies and stale outputs.</strong> Affected downstream outputs from the failed run are invalidated rather than deleted, and regenerated under the corrected run identity so nothing can combine artefacts from two logical runs. Dependent order outputs that reference the corrected addresses are reassessed for regeneration, since an upstream address change can invalidate a dependent load that did not itself fail.</div>
 <div class="quote"><strong>Proof and remaining uncertainty.</strong> Closure requires key reconciliation across the recovery population, semantic address validation, and proof that nothing changed outside the recovery scope, using an unaffected control population. Unresolved business treatments stay controlled: the rerun corrects technical execution and cannot manufacture approval for 45E or CustomerGroup 99. Recommendation: proceed with the mechanism-based recovery from the transformation boundary, and do not close until the delta shows both the intended change and the absence of unexplained change.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The two things that separate a strong recovery pack from a plausible one are both present here: the population comes from the mechanism, and closure proves what did not change as well as what did.":"Check the population and the closure. If your population is the seven reported keys, or your closure only proves the intended records changed, the pack has the two most common gaps."}</div>`
},
{
 id:"b20",nav:"Anti-patterns",title:"Recovery anti-patterns and the consultant checklist",type:"content",
 html:`<ul class="framework-checks">
   <li>Rerun immediately because the package failed.</li>
   <li>Use the visible rejected keys as the whole affected population.</li>
   <li>Patch target records without correcting the source logic.</li>
   <li>Overwrite failed-run evidence.</li>
   <li>Assume \u201cprocessed\u201d means committed.</li>
   <li>Assume the package is idempotent.</li>
   <li>Mix stale and corrected outputs.</li>
   <li>Reuse the same build or run identity after correction.</li>
   <li>Rerun through unresolved business mappings.</li>
   <li>Validate only that the rerun completed.</li>
   <li>Close the incident without proving unaffected data stayed unchanged.</li>
 </ul>
 <div class="tp-table-wrap"><table class="tp-table"><caption>Consultant recovery checklist</caption><thead><tr><th>Area</th><th>Question</th></tr></thead><tbody>
 <tr><td>Containment</td><td>Have uncontrolled retries and downstream use stopped?</td></tr>
 <tr><td>Evidence</td><td>Is the failed run reproducible from preserved identities and logs?</td></tr>
 <tr><td>State</td><td>What actually committed to target?</td></tr>
 <tr><td>Mechanism</td><td>Where is the first proven divergence?</td></tr>
 <tr><td>Population</td><td>Which records are exposed to that mechanism?</td></tr>
 <tr><td>Correction</td><td>Does the fix address the rule rather than the examples?</td></tr>
 <tr><td>Regression</td><td>Have positive, negative and population tests passed?</td></tr>
 <tr><td>Boundary</td><td>What is the last known-good restart point?</td></tr>
 <tr><td>Idempotency</td><td>What happens to already-processed records?</td></tr>
 <tr><td>Outputs</td><td>Are stale downstream artefacts invalidated?</td></tr>
 <tr><td>Dependencies</td><td>What else must be regenerated or revalidated?</td></tr>
 <tr><td>Rerun</td><td>Is the recovery population explicit and versioned?</td></tr>
 <tr><td>Proof</td><td>Did intended records change and unaffected records stay stable?</td></tr>
 <tr><td>Closure</td><td>Could another consultant reconstruct the recovery?</td></tr>
 </tbody></table></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>Recovery_Checklist.xlsx</strong><p class="small">The fourteen areas above, with space for the evidence that answers each question.</p></div><a class="btn secondary" href="/assets/downloads/Recovery_Checklist.xlsx" download>Download</a></div>`
},
{
 id:"b21",nav:"Reflection",title:"Reflection \u2013 How narrow is too narrow?",type:"reflection",
 html:`<p class="lead">Think of a defect where only five records visibly fail. What evidence would you need before agreeing to rerun only those five? What would make you widen the recovery population, or move the restart boundary further back?</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>The useful version of this answer names the evidence that would justify the narrow scope, not just the instinct to be cautious. Narrow is often correct. It is correct when proven, and dangerous when merely convenient.</p></div></div>
 <textarea id="reflection" placeholder="I would rerun only those five if..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/mechanism|cause|record.specific|inside (the|each)/i, strength:"You tied the narrow scope to the mechanism being genuinely record-specific.", gap:"Say what would have to be true about the mechanism for five to be the whole population." },
   { test:/widen|broaden|more|exposed|shared|same (rule|reference|logic)/i, strength:"You named what would make you widen the population.", gap:"Name a specific finding that would widen it: a shared rule, a shared reference version, a shared routing path." },
   { test:/prove|evidence|query|test|confirm/i, strength:"You framed the decision around provable evidence rather than caution.", gap:"Say what evidence you would produce. Narrow is correct when proven, not when it feels proportionate." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">I would rerun only the five if I could show the cause sits inside each of those records rather than in logic that touched others: each one failing for a reason present in its own data, with the transformation proven correct against a control sample that passed. The evidence would be a query listing every record that went through the same rule, reference version and routing path, showing that only those five meet the failing condition. What would make me widen it is any of three findings: that the other records shared the faulty reference version even though they happened to resolve correctly, that the rule itself was wrong rather than the data, or that some of the population had not yet reached the failing step, in which case they are exposed rather than passing. The last of those is the one I would most easily miss, because those records look fine by virtue of not having been tried yet.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The strongest answers include the records that have not reached the failing step yet. They look healthy for the worst possible reason, and they are the most commonly omitted part of a recovery population.":"Push on what would widen it. A record that got the right answer for the wrong reason, or one that has not been attempted yet, both belong in the exposed set even though neither has failed."}</div>`
},
{
 id:"b22",nav:"Summary",title:"Summary \u2013 Recovery is controlled change",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Stabilise before retrying.</li>
   <li>Preserve the failed state as evidence.</li>
   <li>Classify the failure before choosing recovery.</li>
   <li>Separate symptom, mechanism and affected population.</li>
   <li>Find the last known-good boundary.</li>
   <li>Prove target commit state rather than inferring it from logs.</li>
   <li>Understand idempotency before replay.</li>
   <li>Invalidate stale downstream outputs.</li>
   <li>Construct an explicit rerun key set.</li>
   <li>Fix the mechanism, not the examples.</li>
   <li>Regression-test before the operational rerun.</li>
   <li>Use new identities for corrected builds and runs.</li>
   <li>Let the mechanism determine the population.</li>
   <li>Reassess dependencies that widen recovery.</li>
   <li>Do not use reruns to bypass unresolved business decisions.</li>
   <li>Prove intended change and the absence of unintended change.</li>
   <li>Treat zero rejects as technical evidence, not semantic proof.</li>
   <li>Contain safely when root cause is still unknown.</li>
   <li>If recovery fails again, treat it as new evidence.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A rerun is a new controlled migration execution, not a second press of the same button. You should know exactly why each record is being rerun, from which proven boundary, under which corrected baseline, what target state already exists, and what evidence will prove recovery.</div>`
},
