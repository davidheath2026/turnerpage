{
 id:"b2",nav:"Five questions",title:"What every problem update has to answer",type:"content",
 html:`<p class="lead">Five questions, in this order. Most weak updates answer the third one at length and skip the second entirely.</p>
 <ol class="framework-checks">
   <li>What happened?</li>
   <li>What is affected now?</li>
   <li>What is proven about cause?</li>
   <li>What are we doing?</li>
   <li>When is the next control point?</li>
 </ol>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Stakeholders usually need the consequence before the mechanism. Translate the technical observation into the migration activity, population or dependency affected, and you will find most of the technical detail was never needed in that message at all.</p></div></div>
 <div class="principle"><strong>Bad news has a clock</strong><br>The longer a material issue is known but uncommunicated, the fewer options the project has. Early visibility is a control, not an admission of failure.</div>`
},

 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak</th><th>Controlled</th></tr></thead><tbody>
 <tr><td>\u201cI do not know why.\u201d</td><td>Cause is not yet confirmed. I am comparing current progress and database waits with the last successful run.</td></tr>
 <tr><td>\u201cNot sure how long it will take.\u201d</td><td>I cannot give a reliable completion time until we know whether processing is progressing or blocked. I will update in 15 minutes.</td></tr>
 <tr><td>\u201cWe are investigating.\u201d</td><td>We have bounded the issue to transformation and are checking slow progress, blocking and stalled-component evidence.</td></tr>
 </tbody></table></div>
 <p>The left column is not dishonest. It is unusable, which in an incident amounts to much the same thing.</p>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Waiting for a root cause before communicating feels responsible. It converts a communication problem into an operational one: the people who could have protected the plan find out when there is less plan left to protect.</p></div>`

},
{
 id:"b12",nav:"Both directions",title:"When somebody minimises, and when somebody catastrophises",type:"content",
 html:`<div class="visual-card"><div class="visual-title">\u201cIt is only 18 records\u201d</div>
 <div class="quote">\u201cIt is 18 records, and the count is small. The issue is that their target treatment is unresolved, so they cannot currently be represented on an approved basis. We can isolate them rather than hold the entire ready population, provided that matches the release controls.\u201d</div>
 <p class="small">Scale and materiality are different. A small population can still represent a critical customer, a dependency, a legal entity or a control failure.</p>
 </div>
 <div class="visual-card"><div class="visual-title">\u201cSo the migration is broken?\u201d</div>
 <div class="quote">\u201cNo. We have a defined issue affecting this population. I can tell you what is currently affected, what remains controlled and what we are checking next.\u201d</div>
 <p class="small">Three sentences, in that order: the denial, the boundary, the next step.</p>
 </div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>These two look like opposite problems and they are the same one. Both people are estimating severity from tone rather than evidence, and both are corrected by giving them the population and the boundary instead of a counter-tone.</p></div></div>`
},
{
 id:"b13",nav:"Green and wrong",title:"A green load can still carry bad news",type:"content",
 html:`<p class="lead">A later customer cycle submits and accepts 18,573 records with zero rejects. Post-load validation then finds 42 UK customers under the Belgian legal entity.</p>
 <div class="quote">\u201cThe customer load completed with 18,573 accepted records and zero technical rejects, but post-load validation identified 42 UK customers in the wrong legal entity. The load is technically successful but not yet semantically accepted. We have frozen the 42 keys and are tracing expected entity, transformed value, package context and target result. Exact technical cause is not yet established.\u201d</div>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Leading with zero rejects. It is a real result and it is not the material new fact. Open with the defect and the acceptance figure stops looking like an attempt to soften it.</p></div>
 <p class="small">The cause of the 42-customer defect has not been established. Every update about it says so, and none of them speculates about package context in a way a reader could mistake for a finding.</p>`
},
{
 id:"b14",nav:"Whose fault",title:"What if you caused it, or another team might have?",type:"content",
 html:`<div class="visual-card"><div class="visual-title">When it was you</div>
 <div class="quote">\u201cI have identified that the change I introduced to the transformation is responsible for the new defect. I have preserved the failing evidence, stopped further use of that output, and am preparing the correction and impact population now. I will provide recovery scope and test evidence before the rerun.\u201d</div>
 <p class="small">Personal accountability is useful. The project needs control, not self-punishment, and a long apology delays the part people actually need.</p>
 </div>
 <div class="visual-card"><div class="visual-title">When it might have been somebody else</div>
 <div class="callout misconception"><div class="callout-label">Weak</div><p>\u201cThe source team sent us bad data again.\u201d</p></div>
 <div class="quote">\u201cThe current extract contains 23 payment-term exceptions that were not present in the previous cycle. We have isolated the new keys and are confirming whether they reflect source changes, mapping coverage or another cause before assigning corrective ownership.\u201d</div>
 </div>`
},
{
 id:"b15",nav:"Missed commitments",title:"Communicating a missed commitment",type:"content",
 html:`<p class="lead">You said the exception analysis would be ready by 12:00. At 11:40 you know it will not be.</p>
 <div class="callout misconception"><div class="callout-label">Poor</div><p>Wait until 12:05 and apologise.</p></div>
 <div class="quote">\u201cThe exception analysis will not be complete by 12:00. The key-level comparison exposed an unaccounted population that I need to resolve before the result is reliable. I expect the controlled output by 13:00; if that changes, I will update at 12:30.\u201d</div>
 <div class="principle"><strong>Early reset</strong><br>As soon as a commitment is no longer credible, reset it with a reason, an impact and a new control point. Twenty minutes of notice is worth more than any apology delivered five minutes late.</div>
 <h3>Give the reason at the right level</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak reason</th><th>Useful reason</th></tr></thead><tbody>
 <tr><td>\u201cIt took longer than expected.\u201d</td><td>The source-to-stage key comparison exposed an unaccounted population, so I held the report until reconciliation is complete.</td></tr>
 <tr><td>\u201cThe system was slow.\u201d</td><td>Transformation throughput fell below the established run rate, delaying validation start.</td></tr>
 <tr><td>\u201cWe had issues.\u201d</td><td>The first package was invalidated after the reference baseline changed and had to be regenerated.</td></tr>
 <tr><td>\u201cWaiting on the business.\u201d</td><td>The 45E target treatment remains unapproved; the affected population is isolated pending a Finance decision.</td></tr>
 </tbody></table></div>`
},
{
 id:"b16",nav:"Dates",title:"Never manufacture a date",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Evidence state</th><th>Appropriate answer</th></tr></thead><tbody>
 <tr><td>Cause unknown</td><td>Give the next diagnostic control point, not a fix date</td></tr>
 <tr><td>Cause proven, impact unknown</td><td>Give an impact-analysis checkpoint</td></tr>
 <tr><td>Correction built, tests running</td><td>Give an evidence-based recovery window</td></tr>
 <tr><td>Rerun underway with stable throughput</td><td>Give a range based on the observed rate</td></tr>
 <tr><td>External business decision required</td><td>Give the decision dependency and its owner</td></tr>
 </tbody></table></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>\u201cI will know more at 15:00\u201d is sometimes the strongest commitment available, and it is one you can actually keep. A checkpoint you hit builds more confidence than an ETA you miss, even though the ETA sounds better when you give it.</p></div></div>`
},
{
 id:"b17",nav:"The ladder",title:"The update ladder, and the log that holds it together",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Stage</th><th>Responsible communication</th></tr></thead><tbody>
 <tr><td>Symptom</td><td>Observed condition and current impact</td></tr>
 <tr><td>Bounded investigation</td><td>Where the failure can and cannot be</td></tr>
 <tr><td>Leading hypothesis</td><td>Candidate cause, clearly labelled</td></tr>
 <tr><td>Root cause proven</td><td>Mechanism and affected-population analysis</td></tr>
 <tr><td>Correction ready</td><td>The change, plus regression and recovery plan</td></tr>
 <tr><td>Recovery executed</td><td>Results and residual failures</td></tr>
 <tr><td>Closure</td><td>Cause, scope, correction and proof</td></tr>
 </tbody></table></div>
 <p>Each rung has its own honest message. Skipping to a rung you have not reached is how a hypothesis becomes a root cause in somebody else's status report.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Update-Log.xlsx</strong><p class="small">Time, status, evidence change, impact and next update, so successive messages stay consistent without relying on memory.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Update-Log.xlsx" download>Download</a></div>`
},
{
 id:"b18",nav:"Two formats",title:"The one-minute verbal update and the written incident update",type:"content",
 html:`<div class="visual-card"><div class="visual-title">Said out loud, in under a minute</div>
 <div class="quote">\u201cCustomer transformation is running significantly slower than the previous successful cycle. It is progressing, so we do not currently have a failed or stalled process. The slowdown is concentrated in the lookup step and validation has not yet started. Current completion estimate is 15:20 to 15:40 based on observed throughput. We are comparing the lookup and reference baseline with the prior run and will update again at 15:00.\u201d</div>
 </div>
 <div class="tp-table-wrap"><table class="tp-table"><caption>Written incident update</caption><thead><tr><th>Field</th><th>Content</th></tr></thead><tbody>
 <tr><td>Issue</td><td>Customer transformation runtime exceeds expected window</td></tr>
 <tr><td>Current impact</td><td>Dependent validation delayed</td></tr>
 <tr><td>Evidence</td><td>Process progressing; slowdown concentrated in lookup step; blocking ruled out</td></tr>
 <tr><td>Cause status</td><td>Not yet confirmed</td></tr>
 <tr><td>Action</td><td>Compare build, reference, input and component throughput with last good run</td></tr>
 <tr><td>Timing</td><td>Current range only if the evidence supports it</td></tr>
 <tr><td>Next update</td><td>A specific time or control point</td></tr>
 <tr><td>Owner</td><td>Migration technical owner or consultant as appropriate</td></tr>
 </tbody></table></div>
 <h3>What not to put in a stakeholder message</h3>
 <ul class="framework-checks">
   <li>Every hypothesis you considered.</li>
   <li>Raw blame or speculation.</li>
   <li>An ETA you do not believe.</li>
   <li>Technical detail that does not change the recipient's action.</li>
   <li>\u201cAll good\u201d when validation is incomplete.</li>
   <li>\u201cCritical\u201d merely to gain attention, or \u201cminor\u201d merely to reduce it.</li>
   <li>A root cause copied from somebody else's guess.</li>
 </ul>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Incident-Update-Template.docx</strong><p class="small">The eight written fields, with the one-minute verbal shape on the reverse.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Incident-Update-Template.docx" download>Download</a></div>`
},
{
 id:"b19",nav:"Rewrite clinic",title:"The bad-news rewrite clinic",type:"selectAll",
 html:`<p class="lead">Seven sentences that get sent on real programmes every week. Explore each one to see what it needs to become before you send it.</p>`,
 options: rewriteClinic,
 coaching: rewriteCoaching,
 hint:"Explore every statement before continuing.",
 closingHtml:`<div class="principle"><strong>What all seven share</strong><br>Each one is quicker to type than the controlled version, and each one produces a follow-up conversation longer than the time it saved.</div>`
},
{
 id:"b20",nav:"Escalation",title:"Escalation is not failure, and noise is not escalation",type:"content",
 html:`<p class="lead">Escalate when any of these is true.</p>
 <ul class="framework-checks">
   <li>Material downstream activities are affected.</li>
   <li>A business decision blocks migration readiness.</li>
   <li>Recovery requires changing an agreed sequence or scope.</li>
   <li>The same control failure is recurring.</li>
   <li>The available recovery window is shrinking.</li>
   <li>The issue crosses team ownership.</li>
   <li>Current evidence contradicts a project assumption used for planning.</li>
 </ul>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Handle locally</th><th>Needs broader visibility</th></tr></thead><tbody>
 <tr><td>Single test-row reject with a known correction and no schedule impact</td><td>Population-wide rule defect with a downstream dependency</td></tr>
 <tr><td>Routine rerun inside the agreed window</td><td>Recovery that pushes dependent activities</td></tr>
 <tr><td>Known exception already controlled</td><td>New unresolved population affecting readiness</td></tr>
 <tr><td>Minor investigation with no material impact</td><td>Uncertain issue consuming contingency or decision time</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>The materiality test</strong><br>Escalate because the project needs awareness or a decision, not because the issue feels stressful. You supply evidence and impact; the Data Migration Lead and project leadership own wider prioritisation and Go or No-Go.</div>`
},
{
 id:"b21",nav:"Recovery and closure",title:"The recovery update, and closure without triumphalism",type:"content",
 html:`<div class="quote">\u201cThe address-rule correction has been deployed under a new controlled build. The affected population was selected from the proven faulty mechanism rather than only the seven reported examples. Corrected outputs and dependent packages were regenerated from the valid recovery boundary. Positive, negative and regression checks passed for the recovered population, and downstream address dependencies were revalidated. Residual exceptions remain separately controlled.\u201d</div>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak close</th><th>Strong close</th></tr></thead><tbody>
 <tr><td>\u201cAll sorted!\u201d</td><td>The proven affected population has been recovered and reconciled to controlled outcomes; regression checks passed and no unexplained changes were found outside recovery scope.</td></tr>
 <tr><td>\u201cIssue closed.\u201d</td><td>Root cause, correction, recovery evidence and residual-status records are complete; the defect can now be closed under the project process.</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>A cheerful close feels like the reward for a hard day. It also quietly asks people to take your word for it, immediately after a period where your word was all they had. Prove the recovery rather than announcing it.</p></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Recovery-Closure-Template.docx</strong><p class="small">Cause, correction, recovery boundary, regression evidence and residual status, in the order a reviewer will want them.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Recovery-Closure-Template.docx" download>Download</a></div>`
},
{
 id:"b22",nav:"Three kinds of bad news",title:"Build it \u2013 Three kinds of bad news",type:"reflection",
 html:`<p class="lead">Three synthetic scenarios, each needing a different kind of message.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Scenario</th><th>What makes it awkward</th></tr></thead><tbody>
 <tr><td>A technical delay with unknown cause</td><td>The ETA keeps moving and you have no mechanism</td></tr>
 <tr><td>A business-decision dependency</td><td>A small but important population is blocked by somebody else's decision</td></tr>
 <tr><td>A green load with a post-load semantic defect</td><td>Every technical indicator says success</td></tr>
 </tbody></table></div>
 <h3>For each one, produce</h3>
 <ol class="framework-checks">
   <li>The first update, before root cause is known.</li>
   <li>Current impact, stated without exaggeration.</li>
   <li>What belongs in technical notes rather than the stakeholder message.</li>
   <li>Your response to pressure for a definitive cause or date.</li>
   <li>The updated message when evidence contradicts your earlier hypothesis or estimate.</li>
   <li>The escalation message, if materiality increases.</li>
   <li>The recovery or closure message once evidence supports it.</li>
   <li>A replacement for one blame-shaped, defensive or falsely reassuring sentence.</li>
 </ol>
 <p class="lead">Pick the scenario you find hardest and write its full sequence below, including the update that has to contradict an earlier one.</p>
 <textarea id="reflection" placeholder="SCENARIO: ...&#10;&#10;FIRST UPDATE: ...&#10;&#10;WHEN THE EVIDENCE CHANGES: ...&#10;&#10;CLOSURE: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Bad-News-Rewrite-Exercise.docx</strong><p class="small">Poor statements on the left, space to rewrite on the right, with the rewrite objective for each.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Bad-News-Rewrite-Exercise.docx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/not (yet )?(confirmed|proven|established)|cause is not|unknown/i, strength:"Your first update states cause status honestly rather than skipping it.", gap:"Say explicitly in the first update whether cause is proven, bounded, hypothesised or unknown." },
   { test:/next update|will update|by \d|at \d|checkpoint/i, strength:"You gave a next control point rather than leaving the reader waiting.", gap:"Every update needs a time you will come back. Add one to each message." },
   { test:/earlier|previously|that rate|no longer|has changed|revised/i, strength:"Your revised message explains what changed since the last one, which is what keeps a sequence credible.", gap:"When you revise an estimate or hypothesis, say what the earlier one rested on and why it no longer holds." },
   { test:/impact|affect|delayed|blocked|dependen/i, strength:"You stated current impact in migration terms rather than technical ones.", gap:"Say which migration activity, population or dependency is affected right now." },
   { test:/isolate|controlled|outside ready|regression|reconcil|proof/i, strength:"Your closure proves recovery rather than announcing it.", gap:"Close with evidence: what was reconciled, what regression passed, what residual status remains." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>First update, green load with a semantic defect.</strong> The customer load completed technically: all submitted records were accepted with no rejects. Post-load validation has found a population in the wrong legal entity, which the load result does not detect. Acceptance proves the target took the records, not that the business placement is right. Those keys are frozen and we are tracing expected entity, transformed value, package context and target result. Cause is not established and I am not going to guess at it. Next update at 16:00.</div>
 <div class="quote"><strong>When the evidence contradicts me.</strong> My 14:40 estimate assumed the throughput observed at 14:25 would hold. It has not, so that window is no longer credible and I am replacing rather than defending it. The current range is later, and I have moved the downstream sequence on that basis rather than leaving it planned against a number I no longer believe. I would rather reset this now than have somebody discover it at the old deadline.</div>
 <div class="quote"><strong>Closure.</strong> The proven affected population has been recovered and reconciled to controlled outcomes. The population was selected from the faulty mechanism rather than from the reported examples, so the recovery covers records nobody had reported. Regression checks passed and no unexplained changes were found outside the recovery scope. Residual exceptions remain separately controlled and are listed in the record. On that basis the defect can be closed under the project process.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The hardest sentence in this exercise is the one that replaces your own earlier estimate. If you wrote it without defending the old number, you have the discipline this lesson is actually teaching.":"Check your revised update. If it explains the situation but not what changed since your previous message, the reader is left to reconcile the two themselves, and they will assume the worst."}</div>`
},
{
 id:"b23",nav:"Under pressure",title:"Consultant situations \u2013 Five moments under pressure",type:"situations",
 html:`<p class="lead">Five points in a deteriorating afternoon where somebody wants something from you that the evidence cannot support.</p>`,
 items: pressureSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Update Before the Diagnosis", name:"Sam", role:"Data Migration Consultant", project:"Energy ERP",
   src:"/assets/audio/lesson4-fromfield-sam.mp3",
   reflection:"When something last went wrong on your project, how long was it before anyone outside your team knew?"
 })}</div>`
},
{
 id:"b24",nav:"Checklist",title:"Communication checklist for defects and delays",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Check</th><th>Question</th></tr></thead><tbody>
 <tr><td>Early</td><td>Have I communicated soon enough for the project to react?</td></tr>
 <tr><td>Fact</td><td>What exactly is observed?</td></tr>
 <tr><td>Impact</td><td>What activity or population is affected now?</td></tr>
 <tr><td>Cause status</td><td>Is cause proven, bounded, hypothesised or unknown?</td></tr>
 <tr><td>Ownership</td><td>Who owns the next action, without unsupported blame?</td></tr>
 <tr><td>Timing</td><td>Is my estimate evidence-based?</td></tr>
 <tr><td>Next point</td><td>When will I update again?</td></tr>
 <tr><td>Audience</td><td>Have I removed technical noise without removing material uncertainty?</td></tr>
 <tr><td>Alternatives</td><td>Can unaffected work continue safely?</td></tr>
 <tr><td>Consistency</td><td>Does this update explain what changed since the previous one?</td></tr>
 <tr><td>Escalation</td><td>Does somebody else need to know or decide?</td></tr>
 <tr><td>Closure</td><td>Can I prove recovery rather than merely report green status?</td></tr>
 </tbody></table></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Delay-Impact-Assessment.xlsx</strong><p class="small">Affected activity, dependent work, contingency consumed and the decision point, for when a delay needs sizing rather than describing.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Delay-Impact-Assessment.xlsx" download>Download</a></div>`
},
{
 id:"b25",nav:"Reflection",title:"Reflection \u2013 What makes bad news trustworthy?",type:"reflection",
 html:`<p class="lead">Think of a project update you would trust even if the news were poor. What would make you believe the person giving it? Write three behaviours, and translate each one into something a Data Migration Consultant can actually do.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Most people arrive at the same short list: they told me early, their story did not change shape, and they distinguished what they knew from what they thought. Each of those is a habit rather than a personality, which is the useful part.</p></div></div>
 <textarea id="reflection" placeholder="The person I would trust..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/early|before|soon|straight away|immediately/i, strength:"You identified timing, which is the behaviour that costs the most to practise.", gap:"Consider how early that person told you, and what it would take for you to match it." },
   { test:/consistent|same story|changed|contradict/i, strength:"You noticed consistency across successive updates.", gap:"Think about whether their story kept its shape as evidence changed, and how they managed that." },
   { test:/know|not know|unknown|proven|guess|certain/i, strength:"You picked up the separation of what was known from what was believed.", gap:"Name how that person signalled the difference between what they had proven and what they suspected." },
   { test:/I would|I will|next time|translate|means I/i, strength:"You translated at least one behaviour into something you can actually do.", gap:"Turn each behaviour into a concrete action: not \u201cbe honest\u201d but \u201csend the first update before I have a cause\u201d." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Three things. She told us before she had an explanation, which meant we heard it from her rather than from a missed deadline; for me that translates into sending the first update the moment the window is exceeded, not once I understand why. Her updates never changed shape, only content, because she kept a log and each message said what had changed since the last; for me that means writing the log during the incident, when it feels like a distraction. And she was explicit about the boundary between proven and suspected, every time, even when the suspicion was almost certainly right; for me that means labelling the hypothesis in the same sentence I raise it, rather than hoping the caveat is implied.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The translations are what make this useful. Trustworthiness under pressure is three or four repeatable habits, not a disposition you either have or lack.":"Push each behaviour into a specific action you could be observed doing during your next incident. \u201cCommunicate clearly\u201d is not something anyone can check."}</div>`
},
{
 id:"b26",nav:"Summary",title:"Summary \u2013 Say it early, say what you know, keep updating",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Communicate material problems before you have every answer.</li>
   <li>State event, impact, cause status, response and next control point.</li>
   <li>Translate technical observations into migration impact.</li>
   <li>Do not turn hypotheses into facts.</li>
   <li>Pair uncertainty with the next evidence you are checking.</li>
   <li>Base estimates on observed evidence and state the assumption.</li>
   <li>Revise estimates when evidence changes, and say what changed.</li>
   <li>Compress technical detail without hiding uncertainty.</li>
   <li>Use neutral accountability rather than blame.</li>
   <li>Distinguish defect mechanism, root cause and control weakness.</li>
   <li>Treat unresolved business decisions as readiness issues, not technical failures.</li>
   <li>Offer controlled alternatives when pressured to just make it work.</li>
   <li>Resist both minimisation and catastrophising.</li>
   <li>Reset missed commitments before the deadline becomes fiction.</li>
   <li>Use checkpoints when a reliable estimate is unavailable.</li>
   <li>Keep successive updates consistent, with a log rather than memory.</li>
   <li>Escalate material impact, not stress.</li>
   <li>Close only when recovery and proof support the claim.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>People can cope with bad migration news. What damages confidence is late news, changing stories, invented certainty, and problems that appear to have no owner or next step. Be the consultant whose updates stay useful while the situation is still unclear.</div>`
},
{
