 id:"b2",nav:"Why it fails",title:"Seven things wrong with a message containing no false statements",type:"content",
 html:`<p class="lead">It is worth being precise about what went wrong, because the instinct to rewrite it as \u201cmore detail\u201d fixes almost none of it.</p>
 <ul class="framework-checks">
   <li><strong>\u201cMuch better\u201d</strong> hides the important fact that 23 exceptions are new.</li>
   <li><strong>\u201cPayment-term issues\u201d</strong> does not say what is actually invalid.</li>
   <li><strong>\u201cOnly 214\u201d</strong> minimises a population that may still block migration.</li>
   <li><strong>\u201cCan you fix them?\u201d</strong> assumes the problem belongs in source data.</li>
   <li><strong>No identifier</strong> for the affected records, so the SME cannot start.</li>
   <li><strong>No date, decision or next step</strong>, so nothing forces a response.</li>
   <li><strong>No separation</strong> of existing backlog from newly introduced defects.</li>
 </ul>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page principle</div><p>A finding is not communicated well because it is accurate. It is communicated well when the recipient understands what happened, why it matters and what they need to do next, without the evidence being distorted.</p></div></div>`
},

 html:`<p class="lead">Most poor migration communication is one strong finding compressed into a single sentence. Pull it apart first.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Part</th><th>Question</th><th>Bramwell example</th></tr></thead><tbody>
 <tr><td>Fact</td><td>What does the evidence prove?</td><td>214 active customers currently have no valid payment terms.</td></tr>
 <tr><td>Movement</td><td>What changed?</td><td>Down from 760, but 23 are new exceptions.</td></tr>

 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Statement</th><th>Type</th><th>Problem if mislabelled</th></tr></thead><tbody>
 <tr><td>214 active customers have no valid payment terms</td><td>Fact</td><td>Low, if the evidence is controlled</td></tr>

 <div class="principle"><strong>Language discipline</strong><br>Use \u201cthe evidence shows\u201d for proven facts, \u201cthis suggests\u201d for supported interpretation, and \u201cI recommend\u201d for your proposed action. Do not let them sound interchangeable.</div>`

 id:"b9",nav:"Movement",title:"Communicating movement without telling a false success story",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Finding</th><th>Bad interpretation</th><th>Better communication</th></tr></thead><tbody>
 <tr><td>760 to 214 payment-term exceptions</td><td>\u201c546 fixed\u201d</td><td>Net reduction of 546, but 23 current exceptions are new. Cohort movement must be separated.</td></tr>
 <tr><td>94 to 91 blank tax classifications</td><td>\u201cNearly solved\u201d</td><td>Only three fewer blanks; the issue is largely unchanged.</td></tr>
 <tr><td>31 to 7 missing delivery addresses</td><td>\u201c24 addresses fixed\u201d</td><td>Observed count reduced by 24; validate whether the remaining seven and any newly affected keys reflect the same mechanism.</td></tr>
 <tr><td>108 to 18 unrecognised CustomerGroup</td><td>\u201c90 corrected\u201d</td><td>Net reduction of 90; confirm current keys and approved mappings before attributing the movement.</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>A lower count proves fewer exceptions exist today. It does not prove which records were corrected, and it certainly does not prove the same records are involved. Trend is not lineage. Compare business keys before saying what happened to individual records.</p></div>`
},
{
 id:"b10",nav:"Uncertainty",title:"Communicating uncertainty without sounding weak",type:"content",
 html:`<p class="lead">Consultants tend to fail in one of two directions: overstating certainty, or hiding behind vague language. Both cost credibility, and the second costs more.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak</th><th>Too certain</th><th>Controlled</th></tr></thead><tbody>
 <tr><td>\u201cThere seems to be some sort of issue with addresses.\u201d</td><td>\u201cThe source addresses are wrong.\u201d</td><td>Seven key accounts are missing delivery addresses in target. The raw rows exist; investigation is currently bounded to transformation or immediate downstream processing.</td></tr>
 <tr><td>\u201cMaybe the mapping changed.\u201d</td><td>\u201cThe mapping is definitely wrong.\u201d</td><td>The current evidence is consistent with a reference-version difference; I am checking the reference baseline used by the failed run.</td></tr>
 <tr><td>\u201cI am not sure why the load failed.\u201d</td><td>\u201cThe target is broken.\u201d</td><td>The target message is generic. The submitted population reconciles; the next step is to compare rejected and accepted records by package and target context.</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Controlled uncertainty</strong><br>Say what is known, what is not yet known, and what evidence you are checking next. That sounds professional because it is precise, not because it pretends certainty.</div>`
},
{
 id:"b11",nav:"Hypothesis vs cause",title:"10:25 \u2013 The project manager wants an update",type:"mcq",
 _correctIndex:3,
 html:`<p class="lead">At 10:20 you notice something. Seven key accounts are missing delivery addresses in target. The raw rows exist. No exception was recorded. You suspect a filter is excluding DELIVERY_SECONDARY addresses, but you have not yet opened the transformation logic.</p>
 <div class="callout experience"><div class="callout-label">10:25</div><p>The project manager messages: \u201cAny update on the address problem? I have a call at 11.\u201d</p></div>
 <h3>What do you send?</h3>`,
 options:[
   {label:"\u201cWe found the root cause. DELIVERY_SECONDARY addresses are being filtered out.\u201d", correct:false, feedback:"This is the most tempting option and the most damaging. You have a strong hypothesis and no proof. If the PM repeats it on an 11am call and the mechanism turns out to be different, the correction costs far more than the delay would have."},
   {label:"\u201cStill investigating, nothing confirmed yet. I will come back to you when I know more.\u201d", correct:false, feedback:"Nothing here is untrue, and nothing here is useful. You have genuinely established something firm, and withholding it leaves the PM to guess at the severity before their call."},
   {label:"\u201cSeven addresses are missing. It is probably a filter issue but I cannot confirm yet, so treat that as unconfirmed for now.\u201d", correct:false, feedback:"Closer, and the hedge is honest. But the useful part, the bounding evidence that rules out source absence, is missing, so the PM gets a guess with a disclaimer rather than a fact."},
   {label:"\u201cThe seven reported addresses exist in raw staging but are absent from transformed output, with no exception recorded. That bounds the failure to transformation or its immediate controls. A filter condition is the leading hypothesis and is being checked now. I will confirm the affected population once the mechanism is proven.\u201d", correct:true, feedback:"Correct. This is not evasive. It gives the PM proven evidence, a bounded failure, a clearly labelled hypothesis and a next step, which is more than enough for an 11am call."}
 ]
},
{
 id:"b12",nav:"Proven root cause",title:"Communicate root cause only when you can prove it",type:"content",
 html:`<p class="lead">Later that morning the implemented filter is inspected and compared against the approved rule. Now the evidence supports a different kind of message.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Evidence</th><th>Finding</th></tr></thead><tbody>
 <tr><td>Approved intent</td><td>Exclude BILLING_ONLY</td></tr>
 <tr><td>Implemented logic</td><td>Retain DELIVERY_PRIMARY only</td></tr>
 <tr><td>Affected example</td><td>C10482-DEL-02 = DELIVERY_SECONDARY</td></tr>
 <tr><td>Raw stage</td><td>Present</td></tr>
 <tr><td>Transformed stage</td><td>Absent</td></tr>
 <tr><td>Exception</td><td>None</td></tr>
 </tbody></table></div>
 <div class="quote">\u201cRoot cause is confirmed. The address transformation implemented the approved rule incorrectly: it retained only DELIVERY_PRIMARY rather than excluding BILLING_ONLY. That silently removed valid DELIVERY_SECONDARY addresses, including C10482-DEL-02. We are now calculating the full affected population from the faulty mechanism, correcting the rule, and preparing regression tests to prove BILLING_ONLY remains excluded and previously correct addresses remain stable.\u201d</div>
 <p class="small">Same investigation, ninety minutes apart. The language changed because the evidence changed, not because the tone needed lifting.</p>`
},
{
 id:"b13",nav:"Why are you sending it?",title:"Every finding should lead to a decision, an action or controlled awareness",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Purpose</th><th>Example</th></tr></thead><tbody>
 <tr><td>Decision</td><td>Approve the target treatment for a source code</td></tr>
 <tr><td>Action</td><td>Correct authoritative source values</td></tr>
 <tr><td>Investigation</td><td>Provide evidence or access needed to test a hypothesis</td></tr>
 <tr><td>Awareness</td><td>Tell the Data Migration Lead a material issue exists and what is being done</td></tr>
 <tr><td>Confirmation</td><td>Verify that an agreed business rule has been understood correctly</td></tr>
 <tr><td>Closure</td><td>Show that cause, correction and proof are complete</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Copying people in feels diligent and often is not. If you send a finding without knowing why that recipient needs it, you have created noise and added your name to it. Decide what response you need before you write.</p></div>`
},
{
 id:"b14",nav:"One answerable question",title:"Ask one answerable question, and do not ask the business to approve your guess",type:"content",
 html:`<div class="visual-card"><div class="visual-title">Asking an SME about CustomerGroup</div>
 <div class="callout misconception"><div class="callout-label">Poor</div><p>\u201cCan you confirm the customer-group mapping?\u201d</p></div>
 <div class="quote">\u201cFor source CustomerGroup 99 we have 18 German customer records and no approved final target mapping. Which target CustomerGroup should these records use, or should they remain outside the migration-ready population until a decision is made?\u201d</div>
 <ul class="framework-checks">
   <li>Names the source value.</li>
   <li>States the affected context and population.</li>
   <li>States what is currently unresolved.</li>
   <li>Asks for a decision the SME is qualified to make.</li>
   <li>Does not steer them toward a convenient technical answer.</li>
 </ul>
 </div>
 <div class="visual-card"><div class="visual-title">Source Terms = 45E</div>
 <p>Several target payment terms look plausible. One of them would make your load work today.</p>
 <div class="callout misconception"><div class="callout-label">Leading</div><p>\u201c45E looks like NET30. Can you confirm we should use NET30?\u201d</p></div>
 <div class="quote">\u201cSource payment term 45E has no approved target equivalent in the current mapping. The target contains several plausible terms, but the migration team cannot infer the intended business treatment. What target payment term should represent 45E, and is that decision valid for all customers using it or only a defined subset?\u201d</div>
 </div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>The leading question usually gets a yes. That is exactly the problem with it. An SME who agrees with your suggestion has not made a decision, they have accepted one, and the difference becomes visible the first time somebody asks who approved NET30.</p></div></div>`
},
{
 id:"b15",nav:"Choosing a channel",title:"Teams message, email, defect or meeting?",type:"expandableList",
 layout:"grid",
 html:`<p class="lead">Channel follows purpose. Explore each one, including what it quietly costs you.</p>`,
 items: channelOptions,
 takeawayHtml:`<div class="principle"><strong>Channel follows purpose</strong><br>Use the lightest channel that still preserves the evidence and decision trail you need. Lightest, not fastest.</div>`
},
{
 id:"b16",nav:"Defect note vs update",title:"A technical defect note is not a stakeholder update",type:"content",
 html:`<p class="lead">For the address defect, the technical work item might contain this.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Defect work item</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Entity:               CustomerAddress
Observed:             C10482-DEL-02 present raw, absent transformed, no exception
Source purpose:       DELIVERY_SECONDARY
Approved rule:        exclude BILLING_ONLY
Implemented condition: AddressPurpose = 'DELIVERY_PRIMARY'
Root cause:           transformation eligibility logic implements rule incorrectly
Impact query:         attached
Build fix:            &lt;version&gt;
Regression:           DELIVERY_PRIMARY stable; BILLING_ONLY excluded
Recovery population:  &lt;controlled reference&gt;</code></pre></div>
 <p>The project manager does not need that block in a status message. The developer does. Sending the wrong one to either person wastes their time in a different way.</p>`
},
{
 id:"b17",nav:"Five-line update",title:"The five-line consultant update",type:"content",
 html:`<p class="lead">When time is short, five questions in order will carry almost any migration update.</p>
 <ol class="framework-checks">
   <li>What happened?</li>
   <li>How many, and which population?</li>
   <li>What do we know about cause?</li>
   <li>What is the impact?</li>
   <li>What happens next, by whom, by when?</li>
 </ol>
 <div class="quote">\u201cSeven key accounts are currently missing delivery addresses in target. The source and raw records exist, so this is not presently a source-missing-data issue. The failure has been bounded to transformation and the filter logic is under review. Orders referencing the missing addresses may be affected; the full downstream impact is not yet established. I will confirm root cause and affected population after the transformation check, then provide the recovery plan.\u201d</div>
 <p class="small">Five sentences. Every one of them does a different job, and none of them claims more than the evidence supports.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Five-Line-Update-Template.docx</strong><p class="small">The five-question shape with prompts, ready to fill in under time pressure.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Five-Line-Update-Template.docx" download>Download</a></div>`
},
{
 id:"b18",nav:"Rewrite clinic",title:"The rewrite clinic",type:"selectAll",
 html:`<p class="lead">Seven phrases that come out of consultants' mouths every week on every programme. Explore each one to see precisely what it costs the recipient before you use it yourself.</p>`,
 options: rewriteClinicItems,
 coaching: rewriteClinicCoaching,
 hint:"Explore every phrase before continuing.",
 closingHtml:`<div class="principle"><strong>What these seven have in common</strong><br>Not one of them is a lie. Each replaces a population, a boundary or a consequence with a verdict, and the recipient has to come back to you to get the missing piece.</div>`
},
{
 id:"b19",nav:"Conversion exercise",title:"Build it \u2013 Turn one evidence pack into four communications",type:"reflection",
 html:`<p class="lead">This is the desk work. You receive the following raw technical note from a Run C2 CustomerGroup profile.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Run C2 technical note</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>CustomerGroup profile:
  STANDARD     14,982
  KEY           1,936
  EXPORT        1,244
  INTERNAL        260
  STD              61
  'STANDARD '      29
  99               18

Cross-reference:
  STANDARD    -> approved
  KEY         -> approved
  EXPORT      -> approved
  INTERNAL    -> approved
  STD         -> no approval recorded
  'STANDARD ' -> controlled whitespace rule
  99          -> unresolved

Action needed before release.</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Watch this</div><p>STD looks like STANDARD. It is 61 records away from a tidy answer. There is no approved treatment recorded for STD, so asking the SME to confirm a mapping you have already chosen would be asking them to approve your guess. Expose the decision instead.</p></div>
 <h3>Produce four outputs from this one evidence pack</h3>
 <ol class="framework-checks">
   <li><strong>Developer message:</strong> specify the technical evidence you need back.</li>
   <li><strong>SME question:</strong> only the business decision they need to make.</li>
   <li><strong>Data Migration Lead update:</strong> scale, risk and next action.</li>
   <li><strong>Defect or decision-register note:</strong> preserving evidence and approval status.</li>
 </ol>
 <p class="lead">Write all four below, labelled. Then compare against the model.</p>
 <textarea id="reflection" placeholder="DEVELOPER: ...&#10;&#10;SME: ...&#10;&#10;DML: ...&#10;&#10;REGISTER: ..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Finding-Message-Canvas.docx</strong><p class="small">Four labelled panels for the same finding, so the evidence stays fixed while the level changes.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Finding-Message-Canvas.docx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/61|STD/i, strength:"You handled the 61 STD records as their own case rather than folding them into STANDARD.", gap:"Address the 61 STD records explicitly. They have no approved treatment recorded, which makes them a decision rather than a mapping." },
   { test:/18|99/i, strength:"You separated the 18 unresolved CustomerGroup 99 records as a business decision.", gap:"Name the 18 records on source value 99 and say plainly that no approved final target mapping exists for them." },
   { test:/whitespace|trailing|29/i, strength:"You treated the 29 trailing-space rows as already covered by a controlled rule.", gap:"Say that the 29 trailing-space STANDARD rows are covered by the controlled whitespace treatment, so nobody spends a decision on them." },
   { test:/do not (apply|default)|no default|without default|similarity/i, strength:"You told the developer not to apply a similarity or default mapping.", gap:"Instruct the developer explicitly not to apply a similarity or default mapping to unresolved values." },
   { test:/ready|outside|pending|unresolved/i, strength:"You stated what happens to the unresolved populations in the meantime.", gap:"Say what status the unresolved records hold until a decision is recorded, rather than leaving it implied." }
 ],
   modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote"><strong>Developer.</strong> Three CustomerGroup source values need distinct treatment and must not be collapsed. The 29 rows carrying a trailing space fall under the controlled whitespace rule. The 18 rows on value 99 are unresolved. The 61 rows on STD have no approved treatment recorded. For STD and 99 separately, confirm the transformed value and the reference-match status and version. Apply no similarity or default mapping to either.</div>
 <div class="quote"><strong>SME.</strong> Eighteen German customer records carry source CustomerGroup 99, and no approved final target mapping exists for that value. Which target CustomerGroup should represent 99, or should those records stay outside the ready population until a decision is recorded? A separate 61 records use source value STD, and there is no approved treatment recorded for that value either.</div>
 <div class="quote"><strong>Data Migration Lead.</strong> CustomerGroup exceptions have reduced materially, but two source values remain decision-dependent: 18 records on 99 and 61 on STD. The 29 trailing-space rows are covered by a controlled normalisation rule and need no decision. Both unresolved populations stay outside ready status until an approved treatment is recorded.</div>
 <div class="quote"><strong>Decision register.</strong> Open entry, CustomerGroup target treatment. Source values awaiting decision: 99 (18 records, German customers) and STD (61 records). Approved values in scope: STANDARD, KEY, EXPORT, INTERNAL. Controlled rule already applied: trailing-space STANDARD, 29 records. Required on approval: the agreed target value, whether it applies to the whole population or a defined subset, the approver, and the date and version from which it applies.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is the real skill of the lesson: one evidence pack, four recipients, nothing invented and nothing quietly resolved on the way through. The STD trap in particular is where most consultants hand the business a guess to rubber-stamp.":"You have the structure. Check that STD and 99 stayed separate decisions rather than one, and that you asked the SME what the value should be rather than whether your suggestion is acceptable."}</div>`
},
{
 id:"b20",nav:"Pushback",title:"Consultant situations \u2013 Five moments of pushback",type:"situations",
 html:`<p class="lead">Five moments where the pressure is not technical. Each one is a real conversation you will have on a programme, and in each the tempting answer is the one that costs you later.</p>`,
 items: pushbackSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Number That Needed a Verb", name:"Priya", role:"Data Migration Consultant", project:"Healthcare ERP",
   src:"/assets/audio/lesson1-fromfield-priya.mp3",
   reflection:"Think of the last count you sent to a stakeholder. Did it tell them whether to decide, investigate, accept or simply be aware?"
 })}</div>`
},
{
 id:"b21",nav:"Quality checklist",title:"The communication quality checklist",type:"content",
 html:`<p class="lead">Run this before sending anything that carries a migration finding.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Check</th><th>Question</th></tr></thead><tbody>
 <tr><td>Truth</td><td>Have I said only what the evidence supports?</td></tr>
 <tr><td>Audience</td><td>Does this person have the detail they need, not the detail I happen to have?</td></tr>
 <tr><td>Purpose</td><td>Do I know what I want them to decide, do or understand?</td></tr>
 <tr><td>Population</td><td>Have I stated the relevant count, keys or context?</td></tr>
 <tr><td>Movement</td><td>If I mention a trend, have I avoided assuming cohort identity?</td></tr>
 <tr><td>Uncertainty</td><td>Have I separated proven fact from hypothesis?</td></tr>
 <tr><td>Ownership</td><td>Am I asking the right person to act on the right problem?</td></tr>
 <tr><td>Decision</td><td>Is the question specific enough to answer?</td></tr>
 <tr><td>Evidence</td><td>Can the recipient inspect the supporting detail?</td></tr>
 <tr><td>Timing</td><td>Is the required response linked to a real migration dependency?</td></tr>
 <tr><td>Tone</td><td>Is it clear, neutral and useful rather than blaming or defensive?</td></tr>
 <tr><td>Record</td><td>Does an important decision need to be captured somewhere more durable than chat?</td></tr>
 </tbody></table></div>
 <div class="visual-card"><div class="visual-title">Write for action, not self-protection</div>
 <div class="callout misconception"><div class="callout-label">Defensive</div><p>\u201cBased on the information currently available and subject to further validation, it appears possible that there may be an issue affecting a subset of customer addresses, although further analysis is required before any definitive conclusion can be reached.\u201d</p></div>
 <div class="quote">\u201cSeven key accounts are missing delivery addresses in target. Their raw-stage rows exist and no exception was recorded. I am checking transformation next because that is the first unproven checkpoint.\u201d</div>
 <p class="small">The first message protects the writer. The second protects the migration. Precision is safer than padding.</p>
 </div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC4_Communication-Quality-Checklist.pdf</strong><p class="small">The twelve checks on one page, for the thirty seconds before you press send.</p></div><a class="btn secondary" href="/assets/downloads/DMC4_Communication-Quality-Checklist.pdf" download>Download</a></div>`
},
{
 id:"b22",nav:"Reflection",title:"Reflection \u2013 What do people need from you?",type:"reflection",
 html:`<p class="lead">Think of a technically strong consultant who is difficult to work with. Not incompetent, not unpleasant. Just hard work. What do they make other people do that they should have done themselves?</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Typical answers: interpreting raw output, working out what the actual question is, finding the affected records, separating fact from guess, chasing missing context, translating technical detail for somebody else. Each one is a small tax, paid by somebody else, every time.</p></div></div>
 <textarea id="reflection" placeholder="The consultant I am thinking of..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/interpret|work out|translate|decipher|figure out/i, strength:"You identified interpretation work being pushed onto the recipient.", gap:"Name at least one thing the recipient had to work out for themselves that the consultant could have done." },
   { test:/question|ask|chase|follow.?up|come back/i, strength:"You noticed the follow-up round-trips that a better message would have avoided.", gap:"Consider what follow-up question people always had to ask this consultant, and why." },
   { test:/guess|assum|fact|evidence|certain/i, strength:"You touched on the fact-versus-guess separation, which is where trust is actually won.", gap:"Think about whether that consultant made it clear which parts of what they said were proven and which were inference." },
   { test:/me|myself|I (do|did|have|am|catch|notice)/i, strength:"You turned the question back on your own practice, which is the harder half of it.", gap:"Name one of these behaviours you recognise in your own recent communication, however small." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The consultant I have in mind was rarely wrong, which made it harder to raise. Every message was a raw output with a sentence on top, so somebody else worked out the population, the question and whether it was even theirs. Nothing was labelled as proven or suspected, so we treated everything as provisional, including the parts that were solid. The round-trip cost was two messages on average before anyone could act. I recognise a version of it in myself when I am busy: I send the count and leave the meaning to the reader, which is exactly the tax I am describing.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"The useful move here is the last one: naming the same behaviour in your own recent work. Everyone can see it in somebody else.":"Push one step further and name a recent message of your own that left interpretation work for the recipient. That is where this lesson turns into practice."}</div>`
},
{
 id:"b23",nav:"Summary",title:"Summary \u2013 Make the evidence usable",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Separate fact, movement, impact, decision or action, and evidence.</li>
   <li>Distinguish facts from inference and from recommendations.</li>
   <li>Change the communication for the recipient, never the truth.</li>
   <li>Use headline, detail and evidence as three layers.</li>
   <li>Give counts their denominators and their context.</li>
   <li>Do not turn a net improvement into a false story about individual records.</li>
   <li>State uncertainty precisely: what is known, what is not, what evidence comes next.</li>
   <li>Never communicate a hypothesis as a proven root cause.</li>
   <li>Ask an SME one answerable business question.</li>
   <li>Do not ask the business to approve the guess that suits your load.</li>
   <li>Use the right channel for clarification, decisions, defects and status.</li>
   <li>Keep technical defect detail out of the stakeholder headline.</li>
   <li>Lead with the fact most likely to change the recipient's next action.</li>
   <li>Protect stakeholders from work that does not belong to them.</li>
   <li>Write for action, not for self-protection.</li>
   <li>Preserve important decisions in a controlled record.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>Your technical finding is not finished when you understand it. It is finished when the right person can understand the evidence, make the right decision or action, and later see exactly what was agreed.</div>`
},

<script>
(function(){
 const learner=JSON.parse(localStorage.getItem('tpCurrentLearner')||localStorage.getItem('tpLearner')||'{}');
 if(!learner.name) return;
 const first=learner.name.split(' ')[0];
 document.querySelectorAll('[data-tp-name]').forEach(el=>el.textContent=first);
 const h1=document.querySelector('h1');
 if(h1 && !document.getElementById('tpGreeting')){
   const d=document.createElement('div');
   d.id='tpGreeting';
   d.style.cssText='margin:0 0 12px;font-size:1rem;color:#0b7f8e;font-weight:600';
   d.textContent='Welcome back, '+first+'.';
   h1.parentNode.insertBefore(d,h1);
 }
})();
