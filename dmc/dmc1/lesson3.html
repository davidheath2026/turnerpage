const pipelineLabSteps = [
{html:`<h4>Lab part 1 \u2014 Scaffold the SSIS package</h4>
 <p>Create a package called <code>10_Customers.dtsx</code>. The package name is illustrative. The important point is that another consultant can understand its scope without opening every task.</p>
 <p>In Control Flow, create sequence containers or clearly grouped tasks for:</p>
 <ol class="framework-checks">
   <li>[00 Initialise]</li>
   <li>[10 Pre-flight]</li>
   <li>[20 Land raw]</li>
   <li>[30 Transform and route]</li>
   <li>[40 Reconcile]</li>
   <li>[50 Output]</li>
   <li>[90 Complete]</li>
 </ol>
 <p>Inside <code>[30 Transform and route]</code>, add a Data Flow Task. The data flow should read the controlled raw/staging source from Lesson 2, apply the approved transformation logic and produce clean and exception paths.</p>
 <div class="callout misconception"><div class="callout-label">Do not over-engineer the first package</div><p>The objective is a readable execution skeleton with real controls. A package with 70 tiny tasks is not automatically more professional than one with seven well-defined stages.</p></div>
 <h4>Naming that helps during a failed run</h4>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak name</th><th>Better name</th><th>Why</th></tr></thead><tbody>
 <tr><td>Execute SQL Task 1</td><td>SQL \u2014 Create run record</td><td>Failure message immediately has meaning</td></tr>
 <tr><td>Data Flow Task</td><td>DFT \u2014 Transform customers</td><td>Identifies entity and purpose</td></tr>
 <tr><td>Script Task 3</td><td>SCR \u2014 Validate input filename</td><td>Makes custom-code purpose visible</td></tr>
 <tr><td>Sequence Container 2</td><td>SC \u2014 Transform and route</td><td>Shows logical execution boundary</td></tr>
 <tr><td>File System Task</td><td>FST \u2014 Archive completed input</td><td>Explains operational effect</td></tr>
 </tbody></table></div>`},
{html:`<h4>Lab part 2 \u2014 Parameterise the execution</h4>
 <p>A package that only works after somebody edits filenames, SQL filters and output paths is not truly repeatable.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Parameter / configuration</th><th>Example</th><th>Why it varies</th></tr></thead><tbody>
 <tr><td>CycleId</td><td>CYCLE_02</td><td>Migration rehearsal / cycle</td></tr>
 <tr><td>RunId</td><td>generated at execution</td><td>Distinguishes technical executions</td></tr>
 <tr><td>InputPath</td><td>controlled inbound location</td><td>Environment / cycle</td></tr>
 <tr><td>OutputPath</td><td>controlled outbound location</td><td>Environment / cycle</td></tr>
 <tr><td>ReferenceVersion</td><td>approved reference baseline</td><td>Business decision baseline</td></tr>
 <tr><td>Environment</td><td>DEV / TEST / PROD-like</td><td>Connections and destinations</td></tr>
 <tr><td>EntityEnabled</td><td>true / false where required</td><td>Controlled execution scope</td></tr>
 </tbody></table></div>
 <p>In SSIS, project or package parameters, variables and expressions can provide these values. Do not hard-code a cycle identifier into five tasks and hope somebody remembers to change all five.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Example output naming pattern</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Customers_&lt;CycleId&gt;_&lt;RunId&gt;.csv

Example:
Customers_CYCLE_02_20260906T081500.csv</code></pre></div>
 <div class="principle"><strong>Why RunId in output identity?</strong><br>It helps distinguish reruns. Whether the final business handoff filename retains RunId depends on the project, but the execution evidence should always identify which run created the file.</div>`},
{html:`<h4>Lab part 3 \u2014 Add pre-flight controls before moving rows</h4>
 <p>A common weak pipeline starts moving data as soon as a file exists. A stronger pipeline asks whether the input is the one it expected.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Pre-flight control</th><th>Example evidence</th><th>Failure behaviour</th></tr></thead><tbody>
 <tr><td>Input exists</td><td>File or object present</td><td>Stop if mandatory input absent</td></tr>
 <tr><td>Input identity</td><td>Expected entity, cycle, file pattern</td><td>Stop on wrong or ambiguous input</td></tr>
 <tr><td>Input freshness / version</td><td>Timestamp / extract identifier</td><td>Stop or escalate stale input</td></tr>
 <tr><td>Required configuration</td><td>Connections, reference version, output path</td><td>Stop before data movement</td></tr>
 <tr><td>Previous run state</td><td>No conflicting active execution</td><td>Prevent overlapping runs unless designed for it</td></tr>
 <tr><td>Destination readiness</td><td>Staging or output location available</td><td>Stop before partial processing</td></tr>
 </tbody></table></div>
 <p>The exact controls vary by source. A database extract will not have the same checks as a CSV file, but the principle is the same: validate prerequisites before consuming the data.</p>
 <div class="callout misconception"><div class="callout-label">The stale-file failure</div><p>Suppose the expected filename is always <code>Customers.csv</code>. Yesterday's file is still in the inbound folder. A file-exists check passes. File existence proves almost nothing about identity. Add evidence that distinguishes the intended extract: cycle/extract ID, timestamp, checksum, manifest, source control record or another project-appropriate mechanism.</p></div>`},
{html:`<h4>Lab part 4 \u2014 Build the data flow and preserve both outcomes</h4>
 <p>The transformation layer from Lessons 1 and 2 now becomes a controlled data flow.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Conceptual data flow</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Raw customer source
  -> Standardise approved syntax
  -> Approved lookups / derivations
  -> Validation / rule checks
  -> Conditional routing
       -> Load-ready
       -> Exception evidence</code></pre></div>
 <p>For Bramwell, established examples include: UK \u2192 GB, NOR \u2192 NO, BEL \u2192 BE and GER \u2192 DE through the approved country cross-reference; ZZZ remains unresolved and must not silently become a target country; 45E remains unresolved and must not silently become NET30 or NET45; and 27 customer names exceed the 60-character target limit \u2014 the pipeline may identify them, but it must not invent truncation approval.</p>
 <p>In SSIS this may use Lookup, Derived Column, Conditional Split, Data Conversion and destinations. The exact components are secondary to the behaviour: approved values continue, unresolved values remain visible, and the original source evidence can still be traced.</p>
 <h4>A row-level exception is not automatically a package failure</h4>
 <p>Imagine a lab run with 1,000 synthetic customer rows. 986 are load-ready and 14 contain unresolved business values. Those numbers are training data, not new Bramwell facts.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Condition</th><th>Possible treatment</th><th>Reason</th></tr></thead><tbody>
 <tr><td>Known business exception with approved routing</td><td>Route row to exception output; pipeline may continue</td><td>The process is behaving as designed</td></tr>
 <tr><td>Unexpected transformation component error</td><td>Fail affected data flow/package unless controlled recovery exists</td><td>Technical execution is not trustworthy</td></tr>
 <tr><td>Reference table unavailable</td><td>Stop transformation</td><td>Required prerequisite missing</td></tr>
 <tr><td>Reconciliation does not balance</td><td>Stop output generation</td><td>Population cannot be proven</td></tr>
 <tr><td>Output destination inaccessible</td><td>Fail output stage and run</td><td>Required deliverable not produced</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Separate two questions</strong><br>Did the pipeline execute correctly? Did the data meet migration readiness rules? A technically successful run can legitimately expose business exceptions. A technically failed run cannot be declared successful because some rows happened to transform.</div>`},
{html:`<h4>Lab part 5 \u2014 Capture counts at control points</h4>
 <p>Do not wait until the end and record only \u201c18,xxx rows output.\u201d Capture enough counts to explain population movement through the pipeline.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Control point</th><th>Useful count</th></tr></thead><tbody>
 <tr><td>Raw landed</td><td>Rows received; distinct business keys</td></tr>
 <tr><td>Transformation input</td><td>Rows presented to transformation</td></tr>
 <tr><td>Clean path</td><td>Distinct records currently load-ready</td></tr>
 <tr><td>Exception path</td><td>Distinct affected records and number of exception events</td></tr>
 <tr><td>Approved exclusions</td><td>Distinct records deliberately outside load population</td></tr>
 <tr><td>Output</td><td>Rows/keys written to load-ready artefact</td></tr>
 <tr><td>Final reconciliation</td><td>Accounted vs unaccounted source population</td></tr>
 </tbody></table></div>
 <p>If one customer can have three rule failures, exception-event count and exception-customer count are different controls. Lesson 2 established this grain issue; the pipeline must preserve it.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Example run evidence (illustrative)</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>RunId: 20260906T081500
CycleId: CYCLE_02
RawRows: 1000
ReadyKeys: 986
ExceptionKeys: 14
ExceptionEvents: 19
Exclusions: 0
UnaccountedKeys: 0
RunStatus: CompletedWithBusinessExceptions</code></pre></div>
 <p class="small">The status vocabulary should be defined by the project. The example demonstrates that a run can be technically complete while business exceptions remain.</p>`},
{html:`<h4>Lab part 6 \u2014 Make precedence constraints express intent</h4>
 <p>In SSIS, precedence constraints determine whether downstream work executes on Success, Failure or Completion, optionally with expressions. Use them to express real migration conditions.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Dependency</th><th>Good rule</th></tr></thead><tbody>
 <tr><td>Pre-flight \u2192 Land raw</td><td>Success only</td></tr>
 <tr><td>Land raw \u2192 Validate raw</td><td>Success only</td></tr>
 <tr><td>Validate raw \u2192 Transform</td><td>Success plus any required validation expression/flag</td></tr>
 <tr><td>Transform \u2192 Reconcile</td><td>Success only, including successful exception persistence</td></tr>
 <tr><td>Reconcile \u2192 Output</td><td>Success only when reconciliation control passes</td></tr>
 <tr><td>Output \u2192 Complete</td><td>Success only</td></tr>
 <tr><td>Any critical stage \u2192 Mark failed</td><td>Failure path or central error handling</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Completion is not success</div><p>A task that has finished may have failed. A yellow/completion path can be useful for cleanup or logging, but it is dangerous if used where successful data processing is required.</p></div>
 <h4>Conditional execution</h4>
 <p>Sometimes execution depends on a control value as well as technical success. For example, output generation may require <code>ReconciliationPassed = TRUE</code>. In SSIS this can be expressed through precedence-constraint expressions; other tools provide equivalent conditional branches.</p>
 <p class="small">Keep conditions visible and explainable. A hidden expression buried in a task property can be as hard to operate as a manual instruction if nobody knows it exists.</p>`}
];

 id:"b2",nav:"A pipeline controls work",title:"Teach \u2014 A pipeline controls work, not just data",type:"content",
 html:`<p class="lead">ETL is often expanded as Extract, Transform, Load. On a migration project, that description is incomplete. The consultant also has to control what happens before, between and after those data movements.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Concern</th><th>Data-flow question</th><th>Control-flow question</th></tr></thead><tbody>
 <tr><td>Input</td><td>How do rows enter the process?</td><td>Is this the correct file/extract/cycle before we start?</td></tr>
 <tr><td>Transformation</td><td>How are fields converted, looked up or derived?</td><td>Should transformation run if landing or prerequisite validation failed?</td></tr>
 <tr><td>Exceptions</td><td>Where do rejected rows go?</td><td>Can business exceptions coexist with a technically successful run?</td></tr>
 <tr><td>Validation</td><td>What values/counts are checked?</td><td>Which validation failure must stop output generation?</td></tr>
 <tr><td>Output</td><td>How is target-shaped data produced?</td><td>How do we prevent duplicate or stale output?</td></tr>
 <tr><td>Evidence</td><td>What row-level evidence is retained?</td><td>How do we know which run completed, failed or was rerun?</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Core principle</strong><br>A migration pipeline is a controlled execution path. The transformations matter, but the pipeline is what makes them repeatable, observable and safe to operate.</div>
 <h3>Data flow and control flow</h3>
 <p>Most ETL and orchestration technologies separate these ideas even when the product terminology differs.</p>
 <ul class="framework-checks">
   <li><strong>Data flow</strong> \u2014 movement and row-level transformation. SSIS: Data Flow Task. Elsewhere: copy/dataflow/notebook/query activity.</li>
   <li><strong>Control flow</strong> \u2014 order and conditions between units of work. SSIS: Control Flow + precedence constraints. Elsewhere: pipeline activities + dependencies.</li>
   <li><strong>Container/group</strong> \u2014 a logical execution boundary. SSIS: Sequence Container. Elsewhere: activity group/sub-pipeline/job.</li>
   <li><strong>Configuration</strong> \u2014 values that vary by environment or run. SSIS: parameters, variables, expressions. Elsewhere: parameters/config/secrets.</li>
   <li><strong>Event/failure path</strong> \u2014 what happens when execution fails. SSIS: OnError / failure precedence. Elsewhere: failure branch/handler/exception path.</li>
 </ul>
 <p class="small">The DMC skill is not memorising product vocabulary. It is being able to look at any orchestration technology and ask the same control questions.</p>`
},
{
 id:"b3",nav:"Design the dependency map",title:"Design before you drag tasks onto a canvas",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">Before opening SSIS, draw the Bramwell customer process as a dependency model. Explore each stage below and ask yourself the design test: for every arrow between stages, can you say why the next stage is allowed to run?</p>`,

 <p class="small">This is deliberately simpler than a full production architecture. Logging, restart checkpoints and performance controls deepen in Lessons 5 and 6. Here the goal is to make the basic execution dependable.</p>`
},

{
 id:"b5",nav:"Diagnose it",title:"Diagnose it \u2014 A pipeline that looks automated but is unsafe",type:"selectAll",
 html:`<p class="lead">A colleague proposes this customer package: Load Customers.csv \u2192 Transform Customers \u2192 Write Customers.csv \u2192 Send completion email.</p>
 <ul class="framework-checks">
   <li>Input path hard-coded to <code>C:\\Migration\\Cycle2\\Customers.csv</code></li>
   <li>Output path hard-coded to <code>C:\\Migration\\Cycle2\\Output\\Customers.csv</code></li>
   <li>Country lookup uses INNER JOIN</li>
   <li>Lookup no-match rows are not captured</li>
   <li>Package uses Completion constraints between all tasks</li>
   <li>No RunId</li>
   <li>No pre-flight extract identity check</li>
   <li>No reconciliation step</li>
   <li>Rerun overwrites the existing output file</li>
 </ul>
 <p>Select every operational risk you can find before reading the mentor review.</p>`,
 options: unsafePipelineRisks,
 coaching: unsafePipelineCoaching,
 hint:"Explore every risk before continuing.",
 closingHtml:`<div class="principle"><strong>Mentor review, in full</strong><br>The package can consume a stale or wrong file; requires code edits for another cycle; can silently drop unmatched country rows; has no exception evidence; allows downstream work after failed tasks because Completion is used indiscriminately; cannot distinguish executions; does not prove population balance; can overwrite prior evidence; may send a completion email after a failed upstream task; and has no explicit rerun strategy.</div>`
},
{
 id:"b6",nav:"Design for reruns",title:"Reruns \u2014 Design the second execution before the first",type:"content",
 html:`<p class="lead">Migration pipelines are repeated by design. A rehearsal, defect fix or infrastructure failure can all require another execution. The time to decide what a rerun means is before the first failure.</p>
 <ul class="framework-checks">
   <li><strong>Can raw landing be repeated safely?</strong> Avoid duplicate source rows or mixed RunIds.</li>
   <li><strong>Can transformation be repeated for one RunId?</strong> Avoid duplicate staged or output records.</li>
   <li><strong>Does output overwrite, version or reject duplicates?</strong> Protect prior evidence and handoff integrity.</li>
   <li><strong>Which completed stages can be reused?</strong> Avoid unnecessary re-extraction or reprocessing.</li>
   <li><strong>What must be invalidated after a mapping or reference change?</strong> Prevent stale transformed results.</li>
   <li><strong>Can one failed entity be rerun without all entities?</strong> Supports controlled recovery at scale.</li>
   <li><strong>How is rerun status recorded?</strong> Distinguishes original failure from recovery execution.</li>
 </ul>
 <div class="principle"><strong>Idempotence in plain English</strong><br>If a step is run twice with the same intended input, does it leave a correct controlled result rather than duplicating or corrupting it? Not every migration step can be perfectly idempotent, but you should know the answer before relying on reruns.</div>
 <p class="small">Lesson 5 goes much deeper into logging, errors and restartability. Here you only need to design enough state and separation that a targeted recovery is possible rather than accidental.</p>`
},
{
 id:"b7",nav:"Failure drill",title:"Failure drill \u2014 Transformation succeeded, output failed",type:"mcq",
 _correctIndex:0,
 html:`<div class="callout experience">
 <div class="callout-label">The scenario</div>
 <p>The customer transformation succeeds. Output creation fails because the outbound location is unavailable. The raw and transformed data are still valid for the same RunId.</p>
 </div>
 <h3>What's the strongest recovery?</h3>`,
 options:[
   {label:"Confirm the raw and transformed evidence for this RunId is still valid, then attempt a controlled restart from the proven transformed state rather than re-running extraction and transformation.", correct:true, feedback:"Correct. Do not automatically rerun extraction and transformation. Determine whether controlled restart from the proven state is safe, then use it."},
   {label:"Delete all output from this run and restart the entire pipeline from the beginning to be safe.", correct:false, feedback:"That throws away proven, valid work. A weak recovery deletes everything and starts again; a stronger design restarts from the last proven state."},
   {label:"Mark the run as failed and wait for someone to manually recreate the output file outside the pipeline.", correct:false, feedback:"That reintroduces manual, unrecorded work into what should be a controlled pipeline, exactly the hidden-knowledge problem this lesson is built to remove."},
   {label:"Retry the output step repeatedly on a timer until the destination becomes available, without checking whether the upstream state is still valid.", correct:false, feedback:"Retrying blindly without checking whether the upstream evidence is still valid risks producing output against stale or changed data."}
 ]
},
{
 id:"b8",nav:"Do it yourself",title:"Do it yourself \u2014 Supplier pipeline challenge",type:"reflection",
 html:`<p class="lead">You now inherit a synthetic supplier migration flow: a raw supplier extract, approved reference tables, a transformation query and a target-shaped output specification. The business rules are training material and do not add new Bramwell canon. The current process is manual: load extract, run three SQL scripts, inspect rejects, export CSV.</p>
 <h3>Your task</h3>
 <ol class="framework-checks">
   <li>Draw the supplier pipeline from pre-flight to completion. Show every stage and dependency.</li>
   <li>Choose which values are parameters or configuration rather than hard-coded values.</li>
   <li>Define the minimum pre-flight checks.</li>
   <li>Place the supplied transformation SQL inside an appropriate pipeline stage.</li>
   <li>Route clean and exception populations deliberately.</li>
   <li>Define at least five row/control counts and their grain.</li>
   <li>Define which conditions are business exceptions and which are process failures.</li>
   <li>Add a reconciliation gate before output creation.</li>
   <li>Define what happens if output creation fails after transformation succeeds.</li>
   <li>Define how a rerun is identified and how duplicate output is prevented.</li>
   <li>Write the operator handover: how to start the run, how to tell whether it completed, and what not to rerun blindly.</li>
 </ol>
 <h3>Benchmark</h3>
 <ul class="framework-checks">
   <li>No downstream output is produced after a failed critical prerequisite or failed reconciliation.</li>
   <li>Unmatched or invalid business values remain visible rather than disappearing through joins or defaults.</li>
   <li>Run-specific values are configuration, not scattered literals.</li>
   <li>The pipeline distinguishes technical execution status from business-data readiness.</li>
   <li>Every execution leaves enough evidence to identify its input, counts, output and status.</li>
   <li>The rerun design protects prior evidence and avoids duplicate output.</li>
   <li>The design is understandable without knowing SSIS-specific jargon.</li>
 </ul>
 <p class="lead">Write your operator handover below.</p>
 <textarea id="reflection" placeholder="To run the supplier pipeline..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Control-Total-Matrix-Template.xlsx</strong><p class="small">Count, grain, source and pass/fail purpose, ready to fill in.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Control-Total-Matrix-Template.xlsx" download>Download</a></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Rerun-Decision-Sheet-Template.xlsx</strong><p class="small">What can restart, from where, under which evidence.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Rerun-Decision-Sheet-Template.xlsx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/parameter|config|hard-?cod/i, strength:"You addressed which values are parameters rather than hard-coded.", gap:"Name a specific value, like CycleId or a file path, that should be configuration rather than hard-coded." },
   { test:/pre-?flight|identity|before.*(load|process|start)/i, strength:"You addressed a pre-flight check before data moves.", gap:"State a specific pre-flight check you'd run before the pipeline touches any supplier data." },
   { test:/exception|failure|business.*(exception|failure)/i, strength:"You distinguished business exceptions from process failures.", gap:"State one example of a business exception and one example of a process failure, and how the pipeline should treat each differently." },
   { test:/reconcil/i, strength:"You addressed a reconciliation gate before output.", gap:"State what reconciliation gate sits between transformation and output creation." },
   { test:/rerun|duplicate|restart/i, strength:"You addressed how a rerun is identified and duplicate output prevented.", gap:"State how the pipeline would recognise a rerun and stop it from producing duplicate output." },
   { test:/handover|start the run|how to tell|operator/i, strength:"You wrote this as an operator handover, not just a design note.", gap:"Write this so a different consultant could actually start and monitor the run from your note alone." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">To run the supplier pipeline: confirm CycleId, RunId and the input path are set as parameters, not edited by hand. Pre-flight checks confirm the extract file exists, matches the expected supplier identity and cycle, and that the output location is reachable before anything loads. Raw supplier rows land unchanged; the supplied transformation runs inside the Transform stage and routes unresolved reference values to a visible exception output rather than defaulting them. A reconciliation gate confirms load-ready plus exception plus approved exclusions equals the raw input count before output is created; if it doesn't balance, output is blocked. If output creation fails after transformation succeeds, do not re-run extraction: check the proven transformed state is still valid for this RunId and restart from there. A rerun is identified by RunId, and output is versioned by RunId rather than overwritten, so no prior evidence is lost. To start a run: trigger with the correct CycleId; to confirm completion, check the RunStatus and reconciliation flag, not just that every task shows green.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This reads like a genuine operator handover \u2014 another consultant could actually run this without needing to ask you anything first.":"You have the right structure. Make sure a different consultant could actually execute your handover as written, not just understand your design in principle."}</div>`
},
{
 id:"b9",nav:"Consultant situations",title:"Consultant situations \u2014 Pipeline judgement under pressure",type:"situations",
 html:`<p class="lead">Five moments where a pipeline's behaviour needs a judgement call, not just a glance at the run log.</p>`,
 items: pipelineSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Package Only One Person Could Run", name:"Sam", role:"Data Migration Consultant", project:"Energy ERP",
   src:"/assets/audio/PackageOnlyOnePersonCouldRun-Sam.mp3",
   reflection:"What control or habit in this story would you carry into your own migration work?"
 })}</div>
 <div class="principle"><strong>Field lesson</strong><br>A migration pipeline is controlled when the required sequence and failure behaviour are explicit, not when it merely contains automated tasks.</div>`
},
{
 id:"b10",nav:"Reflection",title:"Reflection \u2014 What would you automate first?",type:"reflection",
 html:`<p class="lead">Think of a multi-step technical process you have run manually. Identify the two places where another consultant could most easily use the wrong input, run the wrong sequence, miss a failure or create duplicate output.</p>
 <p>Write which controls you would automate first and what evidence the automated process should leave behind.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers prioritise risk and repeatability, not automation for its own sake. The best first control may be a pre-flight validation or reconciliation gate rather than another transformation component.</p></div></div>
 <textarea id="reflection" placeholder="The two places most likely to go wrong are..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/wrong input|identity|pre-?flight/i, strength:"You identified a specific risk around using the wrong input.", gap:"Name a specific point where the wrong input could get used without anyone noticing." },
   { test:/sequence|order|dependency/i, strength:"You identified a specific risk around running steps in the wrong order.", gap:"Name a specific step that depends on another finishing first, and what would happen if that order broke." },
   { test:/evidence|log|record|prove/i, strength:"You named specific evidence the automated process should leave behind.", gap:"State exactly what evidence an automated version of this control should record, not just that it should be automated." },
   { test:/first|priorit/i, strength:"You made an explicit priority call about what to automate first.", gap:"Say clearly which control you'd build first, and why it beats the alternatives." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The two riskiest points are: starting the process against whichever file happens to be sitting in the folder, and running the reconciliation check manually, if at all, so a mismatch is easy to miss under time pressure. I'd automate the input identity check first, before any transformation logic, since a wrong input poisons everything downstream. It should leave behind the file identity it checked, what it expected, and a clear pass/fail, not just proceed silently. The reconciliation gate would come second.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This prioritises exactly right: catching a bad input early beats adding more transformation sophistication.":"You have good instincts. Make sure you're picking the control that reduces the most risk first, not just the one that's easiest to automate."}</div>`
},
{
 id:"b11",nav:"Summary",title:"Summary \u2014 From working scripts to a controlled migration execution",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Design the execution path before building tool-specific tasks.</li>
   <li>Separate data flow from control flow.</li>
   <li>Make prerequisites and dependencies explicit.</li>
   <li>Parameterise cycle, run, environment, input, output and reference context.</li>
   <li>Validate input identity before consuming data.</li>
   <li>Preserve clean and exception outcomes deliberately.</li>
   <li>Capture counts at meaningful control points and at the correct grain.</li>
   <li>Distinguish business exceptions from process failures.</li>
   <li>Use success, failure and completion paths intentionally.</li>
   <li>Put reconciliation before output release.</li>
   <li>Design rerun behaviour before the first failure.</li>
   <li>Leave enough run evidence that another consultant can operate and challenge the process.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A migration pipeline is not successful because all the boxes ran. It is successful when the correct input was processed in the correct sequence, every population is accounted for, failures behaved as designed and the execution can be proved afterwards.</div>`
},
