// ---------- Worked example: guided steps (CUS-001 through CUS-007) ----------
const workedExampleSteps = [
{html:`<h4>CUS-001: direct does not mean thought-free</h4>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Mapping ID</th><th>Source</th><th>Target</th><th>Approved mapping note</th></tr></thead>
 <tbody><tr><td>CUS-001</td><td>CustNo</td><td>CustomerNumber</td><td>Direct</td></tr></tbody></table></div>
 <p>The mapping says "Direct". The build specification still needs to protect the key. A direct mapping with no key-quality control is not build-ready.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Design item</th><th>Decision</th></tr></thead><tbody>
 <tr><td>Population</td><td>Active customers in approved migration scope</td></tr>
 <tr><td>Input</td><td>Source Customer.CustNo</td></tr>
 <tr><td>Output</td><td>CustomerNumber</td></tr>
 <tr><td>Pattern</td><td>Direct</td></tr>
 <tr><td>Rule</td><td>Copy CustNo exactly after source extraction</td></tr>
 <tr><td>Controls</td><td>Not NULL; unique within migration scope; target length/type compatible</td></tr>
 <tr><td>Exception</td><td>Reject/hold any row without a usable source customer key</td></tr>
 <tr><td>Traceability</td><td>Mapping CUS-001</td></tr>
 <tr><td>Minimum tests</td><td>Normal key; blank key; duplicate key; maximum-length key</td></tr>
 </tbody></table></div>`},
{html:`<h4>CUS-002: target length creates a design decision</h4>
 <p>Bramwell has 27 customer names longer than the target 60-character limit. The approved mapping says Name → CustomerName, but that alone does not authorise truncation.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Possible implementation</th><th>Status</th></tr></thead><tbody>
 <tr><td>LEFT(Name,60)</td><td>Not automatically valid. It silently loses data unless shortening/truncation is explicitly approved.</td></tr>
 <tr><td>Reject rows over 60</td><td>Controlled interim behaviour if no approved shortening treatment exists and the field is mandatory.</td></tr>
 <tr><td>Apply approved shortening rule</td><td>Valid only when the business rule is explicit and testable.</td></tr>
 <tr><td>Ignore target length and let load fail</td><td>Poor design. The constraint is already known and should be controlled before load.</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: validation pattern, not an approved transformation</span><button class="tp-code-copy" type="button" data-copy>Copy</button></div><pre><code>SELECT CustNo, Name, LEN(Name) AS NameLength
FROM raw.Customer
WHERE LEN(Name) &gt; 60;</code></pre></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Consultant judgement</div><p>A known target constraint must become either approved transformation logic or an explicit exception rule. Do not let the developer invent the business treatment.</p></div></div>`},
{html:`<h4>CUS-006: reference translation needs more than a lookup name</h4>
 <p>Approved country examples are UK → GB, NOR → NO, BEL → BE and GER → DE. ZZZ remains unresolved.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Source Country</th><th>Target CountryCode</th><th>Build status</th></tr></thead><tbody>
 <tr><td>UK</td><td>GB</td><td><span class="tp-tag tp-tag--good">Approved match</span></td></tr>
 <tr><td>NOR</td><td>NO</td><td><span class="tp-tag tp-tag--good">Approved match</span></td></tr>
 <tr><td>BEL</td><td>BE</td><td><span class="tp-tag tp-tag--good">Approved match</span></td></tr>
 <tr><td>GER</td><td>DE</td><td><span class="tp-tag tp-tag--good">Approved match</span></td></tr>
 <tr><td>ZZZ</td><td>None approved</td><td><span class="tp-tag tp-tag--warn">Exception / decision required</span></td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: controlled reference pattern</span><button class="tp-code-copy" type="button" data-copy>Copy</button></div><pre><code>SELECT c.CustNo, c.Country, x.TargetCountryCode
FROM raw.Customer c
LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountryCode = c.Country
 AND x.Status = 'Approved';</code></pre></div>
 <p>A LEFT JOIN is useful because it keeps unmatched source rows visible. The consultant must also decide what happens if the cross-reference contains duplicate approved matches for one source code. "First row wins" is not a valid control.</p>
 <div class="callout misconception"><div class="callout-label">Build behaviour</div><p>No approved match → route the customer to a reviewable exception with SourceCountry retained. Multiple approved matches → fail/reference-quality exception. Never default ZZZ to a plausible country.</p></div>`},
{html:`<h4>CUS-003: unresolved business decisions must survive into the build design</h4>
 <p>Payment term 45E has no approved target equivalent. NET30 has previously appeared as an uncertain staging value but is not approved. The build specification must protect that fact.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Condition</th><th>Required behaviour</th></tr></thead><tbody>
 <tr><td>Approved source term has one approved target match</td><td>Translate using controlled reference</td></tr>
 <tr><td>Source term is blank</td><td>Route according to approved missing-data rule; do not manufacture a term</td></tr>
 <tr><td>Source term = 45E</td><td><span class="tp-tag tp-tag--warn">Remain unresolved</span> until Finance approves treatment</td></tr>
 <tr><td>Source term has no approved reference row</td><td>Exception with source value and reason</td></tr>
 <tr><td>Source term has more than one approved reference row</td><td>Reference-quality failure / stop affected path</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: conceptual output</span><button class="tp-code-copy" type="button" data-copy>Copy</button></div><pre><code>CASE
  WHEN p.TargetPaymentTerm IS NOT NULL THEN p.TargetPaymentTerm
  ELSE NULL
END AS PaymentTerms

-- Exception reason is generated separately when no approved match exists.</code></pre></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Do not encode uncertainty</div><p>A developer should never need to infer that an unresolved mapping means "use the most common value". The design should make the unresolved state explicit and visible.</p></div></div>`},
{html:`<h4>CUS-005: conditional logic needs a complete truth table</h4>
 <p>A mapping note such as "1 = Active, 0 = Inactive" looks clear until you find blank, 2 or X in the source. Build-ready logic defines the complete observed domain and the behaviour for anything outside the approved domain.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Source Status</th><th>Approved target</th><th>Expected handling</th></tr></thead><tbody>
 <tr><td>1</td><td>Active</td><td><span class="tp-tag tp-tag--good">Clean output</span></td></tr>
 <tr><td>0</td><td>Inactive</td><td><span class="tp-tag tp-tag--good">Clean output</span></td></tr>
 <tr><td>NULL</td><td>No rule shown</td><td><span class="tp-tag tp-tag--warn">Exception / decision</span> unless approved otherwise</td></tr>
 <tr><td>2</td><td>No rule shown</td><td><span class="tp-tag tp-tag--warn">Exception / investigate</span></td></tr>
 <tr><td>X</td><td>No rule shown</td><td><span class="tp-tag tp-tag--warn">Exception / investigate</span></td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL</span><button class="tp-code-copy" type="button" data-copy>Copy</button></div><pre><code>CASE
  WHEN Status = '1' THEN 'Active'
  WHEN Status = '0' THEN 'Inactive'
  ELSE NULL
END AS CustomerStatus</code></pre></div>
 <p>The ELSE NULL is not the business treatment by itself. It simply allows the pipeline to expose unapproved conditions so they can be routed and reported.</p>
 <div class="callout misconception"><div class="callout-label">Important boundary</div><p>This lesson does not invent Bramwell's final CustomerGroup derivation. Eighteen German records with source CustomerGroup 99 remain unresolved in the programme case study. Where the rule is not approved, the build specification records the gap rather than completing it fictionally.</p></div>`},
{html:`<h4>CUS-007: derivations require order, scope and fall-through</h4>
 <p>CustomerGroup has no direct source field. It must be derived from approved business classification logic. A derivation specification must show:</p>
 <ul class="framework-checks">
   <li>all source inputs used in the derivation</li>
   <li>the order in which conditions are evaluated</li>
   <li>whether conditions are mutually exclusive</li>
   <li>what happens when more than one condition is true</li>
   <li>what happens when none are true</li>
   <li>which reference/decision approved the rule</li>
   <li>how each branch will be tested</li>
 </ul>`}
];

{
 id:"b2",nav:"Teach: mapping vs build logic",title:"What changes when a mapping becomes build logic?",type:"content",
 html:`<p class="lead">A mapping workbook answers a business question: what should source data become in the target? Build logic has to answer several additional engineering questions.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Mapping view</th><th>Build-logic view</th></tr></thead><tbody>
 <tr><td>Source field</td><td>Which physical table/file/column and which population?</td></tr>
 <tr><td>Target field</td><td>Exact output column/type/constraint and target context</td></tr>
 <tr><td>Transformation description</td><td>Exact deterministic logic or controlled reference used</td></tr>
 <tr><td>Default / blank treatment</td><td>Approved value, explicit exception or exclusion?</td></tr>
 <tr><td>Lookup</td><td>What table/version/key is authoritative? What if no row matches? What if two rows match?</td></tr>
 <tr><td>Derivation</td><td>What conditions, order of precedence and fall-through behaviour apply?</td></tr>
 <tr><td>"Direct"</td><td>Does type, format, length or NULL behaviour still require handling?</td></tr>
 <tr><td>Sign-off</td><td>What test proves the implemented result matches the approved intent?</td></tr>
 </tbody></table></div>
 <p>A consultant therefore does not copy mapping text into code. They perform a controlled translation from business design into build design.</p>
 <div class="principle"><strong>Core distinction</strong><br>Mapping tells you the intended relationship. Migration logic makes that relationship executable, observable and testable.</div>`
},
{
 id:"b3",nav:"Teach: the model",title:"The Mapping-to-Build model",type:"content",
 html:`<p class="lead">For every non-trivial mapping, define seven things before implementation.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>#</th><th>Build question</th><th>Why it matters</th></tr></thead><tbody>
 <tr><td>1</td><td>Population</td><td>Which records does the rule apply to?</td></tr>
 <tr><td>2</td><td>Input</td><td>Which source value(s) and context drive the rule?</td></tr>
 <tr><td>3</td><td>Pattern</td><td>Direct, cleanse, lookup, conditional, derive, combine, split, aggregate, sequence or exclude?</td></tr>
 <tr><td>4</td><td>Rule</td><td>What exact approved logic produces the target value?</td></tr>
 <tr><td>5</td><td>Exception</td><td>What happens when the rule cannot produce a valid answer?</td></tr>
 <tr><td>6</td><td>Traceability</td><td>Which MappingID / decision / reference version proves why this rule exists?</td></tr>
 <tr><td>7</td><td>Tests</td><td>Which positive, negative and boundary cases prove the implementation?</td></tr>
 </tbody></table></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page principle</div><p>If you cannot describe the rule without saying "probably", "normally", "whatever the target expects" or "we can default it", you do not yet have build-ready logic.</p></div></div>
 <h3>Common transformation patterns</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Pattern</th><th>Example</th><th>Typical implementation idea</th><th>Main control risk</th></tr></thead><tbody>
 <tr><td>Direct</td><td>CustNo → CustomerNumber</td><td>Select/copy value</td><td>Type/length/NULL assumptions</td></tr>
 <tr><td>Syntactic cleanse</td><td>Trim surrounding spaces</td><td>TRIM / Derived Column / Power Query</td><td>Changing meaning while "cleaning"</td></tr>
 <tr><td>Reference lookup</td><td>UK → GB</td><td>Controlled cross-reference</td><td>Unmatched or ambiguous references</td></tr>
 <tr><td>Conditional mapping</td><td>Status 1 → Active</td><td>CASE / Conditional Split</td><td>Unspecified fall-through</td></tr>
 <tr><td>Derivation</td><td>CustomerGroup from classification</td><td>Rule with ordered conditions</td><td>Hidden precedence/default</td></tr>
 <tr><td>Combine</td><td>Address lines → FullAddress</td><td>Concatenation with NULL handling</td><td>Delimiters, length, ordering</td></tr>
 <tr><td>Split</td><td>Legacy composite code → multiple fields</td><td>Parser / substring / reference</td><td>Malformed values</td></tr>
 <tr><td>Exclusion</td><td>Out-of-scope historical records</td><td>Approved population filter</td><td>Accidental data loss</td></tr>
 <tr><td>Validation only</td><td>Name ≤ 60 chars</td><td>Rule does not alter value</td><td>Silent truncation</td></tr>
 </tbody></table></div>`
},

{
 id:"b5",nav:"Build the artefact",title:"Build the artefact: the Mapping-to-Build Specification",type:"content",
 html:`<p class="lead">A professional handover does not require a 40-page technical design for every entity. It does require enough structured detail that the implementation is deterministic and reviewable.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Field</th><th>What to capture</th></tr></thead><tbody>
 <tr><td>MappingID</td><td>Stable link to approved mapping</td></tr>
 <tr><td>Source object/field</td><td>Physical source and data type</td></tr>
 <tr><td>Source population</td><td>Scope/filter/legal entity/context</td></tr>
 <tr><td>Target field</td><td>Exact output field and target constraint</td></tr>
 <tr><td>Pattern</td><td>Direct / cleanse / lookup / conditional / derive / combine / exclude / validate</td></tr>
 <tr><td>Rule logic</td><td>Precise rule in plain language, pseudocode or query logic</td></tr>
 <tr><td>Reference dependency</td><td>Controlled lookup/table and version where applicable</td></tr>
 <tr><td>Exception behaviour</td><td>Route, reject, hold, exclude or fail; never hidden</td></tr>
 <tr><td>Evidence fields</td><td>Source key/value, intermediate value, reason, RuleID/RunID as appropriate</td></tr>
 <tr><td>Positive tests</td><td>Normal approved conditions</td></tr>
 <tr><td>Negative tests</td><td>Unmatched, invalid, missing, ambiguous conditions</td></tr>
 <tr><td>Boundary tests</td><td>Lengths, NULLs, exact thresholds, legal-entity context</td></tr>
 <tr><td>Approval/status</td><td>Approved / unresolved / implementation query</td></tr>
 <tr><td>Build owner / notes</td><td>Enough for implementation/handover</td></tr>
 </tbody></table></div>
 <h3>A completed example: CountryCode</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Specification field</th><th>CUS-006 design</th></tr></thead><tbody>
 <tr><td>MappingID</td><td>CUS-006</td></tr>
 <tr><td>Source</td><td>Customer.Country</td></tr>
 <tr><td>Population</td><td>Active customers in migration scope</td></tr>
 <tr><td>Target</td><td>CountryCode</td></tr>
 <tr><td>Pattern</td><td>Controlled reference lookup</td></tr>
 <tr><td>Rule</td><td>Translate using approved CountryCrossRef on exact normalised source code</td></tr>
 <tr><td>Reference</td><td>CountryCrossRef, approved rows only</td></tr>
 <tr><td>No match</td><td>Route exception COUNTRY_CODE_UNRESOLVED</td></tr>
 <tr><td>Multiple match</td><td>Reference-quality failure; no arbitrary output</td></tr>
 <tr><td>Evidence</td><td>CustNo, raw Country, normalised Country, reference version, exception reason</td></tr>
 <tr><td>Tests</td><td>UK→GB; NOR→NO; BEL→BE; GER→DE; ZZZ→exception; blank→exception; duplicate reference→failure</td></tr>
 <tr><td>Status</td><td>Approved except unresolved source values such as ZZZ</td></tr>
 </tbody></table></div>
 <h3>Turn the specification into executable test cases</h3>
 <p>A mapping rule is not complete until you can state the expected result for representative inputs.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Test ID</th><th>Input</th><th>Expected output</th><th>Expected route</th><th>Purpose</th></tr></thead><tbody>
 <tr><td>TC-CUS006-01</td><td>UK</td><td>GB</td><td><span class="tp-tag tp-tag--good">Clean</span></td><td>Normal approved lookup</td></tr>
 <tr><td>TC-CUS006-02</td><td>NOR</td><td>NO</td><td><span class="tp-tag tp-tag--good">Clean</span></td><td>Normal approved lookup</td></tr>
 <tr><td>TC-CUS006-03</td><td>ZZZ</td><td>NULL / no target value</td><td><span class="tp-tag tp-tag--warn">Exception</span></td><td>Unresolved source code</td></tr>
 <tr><td>TC-CUS006-04</td><td>blank</td><td>NULL / no target value</td><td><span class="tp-tag tp-tag--warn">Exception</span></td><td>Missing mandatory reference</td></tr>
 <tr><td>TC-CUS006-05</td><td>UK with two approved ref rows</td><td>No output</td><td><span class="tp-tag tp-tag--bad">Reference failure</span></td><td>Ambiguous control baseline</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Testing principle</strong><br>Do not only test examples that prove the rule works. Test the conditions that prove the rule fails safely.</div>
 <h3>Your working templates</h3>
 <p>Both templates below use the CUS-006 example as their worked row, so you can see the expected format before completing your own.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Mapping-to-Build-Specification-Template.xlsx</strong><p class="small">One row per MappingID: population, rule, reference, exceptions, evidence and tests.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Mapping-to-Build-Specification-Template.xlsx" download>Download</a></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Transformation-Test-Matrix-Template.xlsx</strong><p class="small">Positive, negative and boundary test cases, grouped by MappingID.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Transformation-Test-Matrix-Template.xlsx" download>Download</a></div>`
},

 html:`<p class="lead">A useful design keeps successful transformed values and exceptions related, traceable and reconcilable.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Output</th><th>Minimum fields</th></tr></thead><tbody>
 <tr><td>Customer_LoadReady</td><td>CustomerNumber, CustomerName, PaymentTerms, CustomerStatus, CountryCode, other approved target fields, Run/Version context</td></tr>

 <tr><td>Transformation_Control</td><td>InputRows, CleanRows, ExceptionRows, excluded rows if approved, reference version / build version</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Population control</span><button class="tp-code-copy" type="button" data-copy>Copy</button></div><pre><code>InputRows = CleanRows + ExceptionRows + ApprovedExclusions

-- The equation is a design expectation. The exact implementation
-- is introduced further in DMC1/DMC2.</code></pre></div>`
},

{
 id:"b9",nav:"Where the logic lives",title:"Where should the logic live?",type:"content",
 html:`<p class="lead">Turning mapping into logic does not mean every rule belongs in the same technical layer. Choose the location deliberately.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Possible location</th><th>Good use</th><th>Watch for</th></tr></thead><tbody>
 <tr><td>Source/extract query</td><td>Source-specific filtering or simple projection when controlled</td><td>Hiding transformation logic inside extraction; altering raw evidence</td></tr>
 <tr><td>Raw/staging SQL</td><td>Set-based standardisation, joins, reusable views</td><td>Mixing raw and transformed state; hard-coded business values</td></tr>
 <tr><td>ETL tool</td><td>Visible lookups, routing, type conversion, orchestration-aware transformations</td><td>Over-complex scripts; hidden defaults</td></tr>
 <tr><td>Power Query / prototype</td><td>Exploration, SME-visible logic, proof of expected transformation</td><td>Prototype becoming ungoverned production logic</td></tr>
 <tr><td>Reference table</td><td>Approved code translations and cross-references</td><td>Duplicate/expired/unapproved rows</td></tr>
 <tr><td>Target configuration</td><td>System-derived/defaulted behaviour explicitly designed to occur in target</td><td>Assuming configuration exists or is consistent across contexts</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Decision rule</strong><br>The best location is the one that keeps the rule controlled, testable, maintainable, performant enough and traceable to approved intent. "We always do transformations in SSIS" and "do it all in SQL" are both too simplistic.</div>
 <h3>Questions before putting a rule into code</h3>
 <ul class="framework-checks">
   <li>Is the business decision actually approved?</li>
   <li>Is this syntactic handling or semantic business logic?</li>
   <li>Does the rule depend on a controlled reference that can change independently?</li>
   <li>Will another entity need the same rule?</li>
   <li>Can the rule be tested independently?</li>
   <li>Can an unmatched or unexpected condition be exposed rather than hidden?</li>
   <li>Does the chosen layer preserve raw evidence?</li>
   <li>Will the implementation still be understandable during a failed cycle at 02:00?</li>
 </ul>`
},
{

 ],
 modelAnswerHtml:`<h3>Turner Page model answer (partial \u2014 illustrative, not exhaustive)</h3>
 <div class="quote">VEN-003 (Country) is a controlled reference lookup, same pattern as CUS-006: safe for V2001, V2002 and V2005 using the same approved CountryCrossRef values used throughout this lesson, but V2004's ZZZ has no approved match and must route to Vendor_Exceptions. VEN-005 (VendorGroup) is a derivation: safe for TRADE and MANUFACTURER vendors in an approved country, but V2003 is VendorType SERVICE, which has no row at all in VendorGroupClassificationMatrix, so it cannot be safely derived and must be held as an exception, not guessed from VendorType alone. VEN-006 (PaymentTerms) is a reference lookup: safe for P30 and P45, but V2003's PX has no approved row in ApprovedVendorPaymentTerms and must stay unresolved. VEN-007 (VendorStatus) is conditional: Y/N map cleanly to Blocked/Active, but V2005's LegacyBlocked value of X is outside that domain and needs its own exception path, not a default to either value. Handover: VEN-001, VEN-002 and VEN-004 (subject to TaxRegistration's blank value on V2002 being checked against the approved missing-data rule) are ready to build. VEN-003, VEN-005, VEN-006 and VEN-007 are ready to build for the covered domain, with V2003 and V2004 held as controlled exceptions pending the business owner's decision on SERVICE-type classification, the PX payment term and the ZZZ country.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is genuinely build-ready thinking: you treated the gaps in the lab references as decisions to escalate, not problems to quietly solve yourself.":"You have solid material here. Go back through V2002 (blank TaxRegistration), V2003 (SERVICE type, PX terms) and V2004 (ZZZ country) specifically \u2014 each one is deliberately unresolved by the lab references, and a build-ready design has to say so explicitly rather than pick a plausible value."}</div>`
},
{
 id:"b11",nav:"When mappings change",title:"When the mapping changes after build starts",type:"content",
 html:`<p class="lead">Real projects do not freeze forever. A business decision may change after the first build or test cycle. The consultant's job is to change the controlled chain, not patch the output.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Change</th><th>Required response</th></tr></thead><tbody>
 <tr><td>New country mapping approved</td><td>Update controlled reference/version; rerun relevant tests; quantify affected population</td></tr>
 <tr><td>Target length changed</td><td>Update target constraint, design and test boundary cases</td></tr>
 <tr><td>New status value appears</td><td>Analyse population; obtain business treatment; extend rule only after approval</td></tr>
 <tr><td>45E treatment finally approved</td><td>Update payment-term reference/decision record; implement; retest affected population; preserve prior unresolved evidence</td></tr>
 <tr><td>CustomerGroup rule revised</td><td>Version the rule; identify every entity/output using it; regression test impacted populations</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Change-control habit</strong><br>A mapping change should be traceable from decision → mapping/reference → build logic → tests → cycle output. If you only edit the SQL, the migration design and the build have already diverged.</div>`
},
{
 id:"b12",nav:"Consultant situations",title:"Consultant situations: build or go back for a decision?",type:"situations",
 html:`<p class="lead">For each situation, decide whether to build it or take it back for a decision before you see the discussion.</p>`,
 items: consultantSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Mapping That Wasn't Buildable", name:"Priya", role:"Data Migration Consultant", project:"Healthcare ERP",
   src:"/assets/audio/MappingWasntBuildable-Priya.mp3",
   reflection:"Have you ever started writing test cases for a mapping everyone called signed off, and found a value the mapping never actually addressed? What did you do?"
 })}</div><div class="principle"><strong>The pattern across all four</strong><br>Technical determinism is not business authority, frequency is not a rule, and an ambiguous reference should never be resolved by accident. When in doubt, take it back.</div>`
},
{
 id:"b13",nav:"Reflection",title:"Reflection: what would make you refuse to build?",type:"reflection",
 html:`<p class="lead">Imagine you are handed a signed mapping workbook tomorrow. Which three types of ambiguity would make you stop and seek clarification before implementing a rule? For each one, state the evidence you would bring back to the business or Data Migration Lead.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers focus on semantic ambiguity, incomplete scope/conditions, unresolved references, target constraints and missing exception behaviour. "I need more detail" is weaker than showing exactly which rows or conditions cannot yet produce a deterministic approved target result.</p></div></div>
 <textarea id="reflection" placeholder="The three types of ambiguity that would make me stop and seek clarification are..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/semantic|meaning|ambigu/i, strength:"You identified semantic ambiguity as a trigger to stop.", gap:"Name a case of genuine semantic ambiguity, such as a value or field whose business meaning isn't actually clear." },
   { test:/condition|scope|domain|truth table/i, strength:"You identified incomplete conditions or scope as a trigger to stop.", gap:"Name a case where the conditions or scope of a rule are incomplete, such as an undocumented status value." },
   { test:/reference|lookup|unresolved|unmatched/i, strength:"You identified an unresolved reference as a trigger to stop.", gap:"Name a case involving an unresolved or ambiguous reference, such as a missing or duplicated lookup match." },
   { test:/evidence|bring back|escalat|business|dml|lead/i, strength:"You named the evidence you would actually bring back to the business or DML.", gap:"For each ambiguity, state specifically what evidence you would bring back, not just that you would ask." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">First, a genuinely ambiguous business meaning, such as a legacy code nobody can currently explain, where I would bring back the exact source values and their frequency. Second, an incomplete condition set, such as a status field with observed values the mapping note never mentions, where I would bring back the full observed domain against the documented domain. Third, an unresolved or ambiguous reference, such as a cross-reference with duplicate approved rows for one source code, where I would bring back the specific conflicting rows rather than picking one myself.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is precise, evidence-led thinking, exactly what a Data Migration Lead needs to be handed to make a fast decision.":"You have the right instinct. Make sure each ambiguity comes with the concrete evidence you would actually bring back, not just a description of the problem."}</div>`
},
{
 id:"b14",nav:"Summary",title:"Summary: the mapping is the start of the build conversation",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Translate each mapping into population, input, pattern, rule, exception, traceability and tests.</li>
   <li>Treat "direct" fields as still subject to key, type, length and NULL controls.</li>
   <li>Use controlled references for approved code translations rather than hidden hard-coding.</li>
   <li>Make no-match and multi-match behaviour explicit.</li>
   <li>Do not convert unresolved business decisions into technical defaults.</li>
   <li>Build complete truth tables for conditional rules, including unexpected inputs.</li>
   <li>Specify derivations with condition order, scope and fall-through behaviour.</li>
   <li>Choose the technical layer deliberately rather than by habit.</li>
   <li>Create tests that prove safe failure as well as successful transformation.</li>
   <li>Keep mapping, build logic, references and tests traceable as decisions change.</li>
   <li>A clean-looking output is not evidence of correct logic if exceptions have been hidden.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A professional Data Migration Consultant does not merely receive mappings and start coding. They turn approved intent into deterministic, testable and traceable migration logic, and they refuse to manufacture answers where the business design is still unresolved.</div>`
},
{
