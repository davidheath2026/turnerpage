const stagingSteps = [
{html:`<h4>Build a controlled raw customer table</h4>
 <p>The following SQL is deliberately simple. The point is the migration design around it.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: raw layer</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>CREATE TABLE raw.Customer (
  CycleId varchar(20) NOT NULL,
  RunId varchar(50) NOT NULL,
  SourceRowNo int NULL,
  CustNo varchar(30) NULL,
  Name varchar(250) NULL,
  Terms varchar(30) NULL,
  Rep varchar(50) NULL,
  Status varchar(10) NULL,
  Country varchar(20) NULL,
  SourceFile varchar(260) NULL,
  LoadedAt datetime2 NOT NULL DEFAULT sysdatetime()
);</code></pre></div>
 <p>Notice what is absent: no target country, no cleaned customer name, no guessed payment term. The table represents received evidence.</p>
 <h4>Prove the population before transforming it</h4>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: population control</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  CycleId,
  COUNT(*) AS RowsReceived,
  COUNT(DISTINCT CustNo) AS DistinctCustomerKeys,
  SUM(CASE WHEN CustNo IS NULL OR LTRIM(RTRIM(CustNo)) = ''
      THEN 1 ELSE 0 END) AS BlankCustomerKeys
FROM raw.Customer
WHERE CycleId = @CycleId
GROUP BY CycleId;</code></pre></div>
 <p>The result should trigger questions, not automatic fixes.</p>
 <ul class="framework-checks">
   <li><strong>Rows = distinct keys:</strong> may mean no duplicate CustNo in this population. Does not prove CustNo is the correct business key in every context.</li>
   <li><strong>Rows &gt; distinct keys:</strong> one or more keys repeat. Does not prove the repeated records are disposable duplicates.</li>
   <li><strong>Blank keys &gt; 0:</strong> some rows cannot currently be identified by CustNo. Does not prove those rows should simply be deleted.</li>
   <li><strong>Current count differs from prior cycle:</strong> the population moved. Does not prove the new extract is wrong.</li>
 </ul>
 <h4>Return duplicate rows, not just a duplicate count</h4>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: return the duplicate rows</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>WITH DuplicateKeys AS (
  SELECT CustNo
  FROM raw.Customer
  WHERE CycleId = @CycleId
  GROUP BY CustNo
  HAVING COUNT(*) > 1
)
SELECT c.*
FROM raw.Customer c
JOIN DuplicateKeys d
  ON d.CustNo = c.CustNo
WHERE c.CycleId = @CycleId
ORDER BY c.CustNo, c.SourceRowNo;</code></pre></div>
 <div class="principle"><strong>Why this matters</strong><br>\u201cFive duplicate keys\u201d is a metric. The actual rows are evidence. You need the rows to determine whether the cause is a duplicate entity, a one-to-many source structure, repeated extraction, bad scope logic or something else.</div>`},
{html:`<h4>Explain the movement between two cycles</h4>
 <p>The current 18,612-row population is 82 rows larger than the earlier 18,530 population. Do not stop at 18,612 minus 18,530 equals 82. A net movement can hide additions and removals.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: new and missing keys</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>-- Keys present now but not in the earlier cycle
SELECT cur.CustNo
FROM raw.Customer cur
LEFT JOIN raw.Customer prev
  ON prev.CustNo = cur.CustNo
  AND prev.CycleId = @PreviousCycle
WHERE cur.CycleId = @CurrentCycle
  AND prev.CustNo IS NULL;

-- Keys present earlier but not now
SELECT prev.CustNo
FROM raw.Customer prev
LEFT JOIN raw.Customer cur
  ON cur.CustNo = prev.CustNo
  AND cur.CycleId = @CurrentCycle
WHERE prev.CycleId = @PreviousCycle
  AND cur.CustNo IS NULL;</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Net change is not population movement</div><p>A net increase of 82 could be 82 additions and zero removals, 100 additions and 18 removals, or many other combinations. Never invent the composition. Query it.</p></div>
 <h4>Compare changed records separately from new or missing records</h4>
 <p>Once key membership is understood, compare fields that matter to migration. A row can exist in both cycles but still have changed materially.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: material field changes</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  cur.CustNo,
  prev.Terms AS PreviousTerms, cur.Terms AS CurrentTerms,
  prev.Country AS PreviousCountry, cur.Country AS CurrentCountry,
  prev.Status AS PreviousStatus, cur.Status AS CurrentStatus
FROM raw.Customer cur
JOIN raw.Customer prev
  ON prev.CustNo = cur.CustNo
  AND prev.CycleId = @PreviousCycle
WHERE cur.CycleId = @CurrentCycle
  AND (
    ISNULL(cur.Terms,'') <> ISNULL(prev.Terms,'')
    OR ISNULL(cur.Country,'') <> ISNULL(prev.Country,'')
    OR ISNULL(cur.Status,'') <> ISNULL(prev.Status,'')
  );</code></pre></div>
 <p class="small">This is a starting comparison, not a universal change-detection design. NULL handling, data types and meaningful field comparisons should reflect the project.</p>`},
{html:`<h4>Use controlled reference data without losing unmatched rows</h4>
 <p>Bramwell's established country cross-reference includes UK \u2192 GB, NOR \u2192 NO, BEL \u2192 BE and GER \u2192 DE. ZZZ remains unresolved.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: reference table</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>CREATE TABLE ref.CountryCrossRef (
  SourceCountryCode varchar(20) NOT NULL,
  TargetCountryCode varchar(20) NOT NULL,
  ApprovalStatus varchar(20) NOT NULL,
  ReferenceVersion varchar(30) NOT NULL
);</code></pre></div>
 <p class="small">The table structure is a training implementation pattern, not a new Bramwell business fact. The business facts are the approved mappings themselves.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: preserve unmatched rows</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  c.CustNo, c.Country AS SourceCountry, x.TargetCountryCode,
  CASE WHEN x.SourceCountryCode IS NULL
       THEN 'COUNTRY_CODE_UNRESOLVED' ELSE NULL END AS CountryException
FROM raw.Customer c
LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountryCode = LTRIM(RTRIM(c.Country))
  AND x.ApprovalStatus = 'Approved'
  AND x.ReferenceVersion = @ReferenceVersion
WHERE c.CycleId = @CycleId;</code></pre></div>
 <div class="principle"><strong>Why LEFT JOIN?</strong><br>Because the migration question is: which source rows do not have an approved reference? An INNER JOIN would remove those rows from the result and could make the output look cleaner than the evidence warrants.</div>
 <h4>Detect ambiguous references as well as missing references</h4>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: ambiguous reference check</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  SourceCountryCode, COUNT(*) AS ApprovedMatches
FROM ref.CountryCrossRef
WHERE ApprovalStatus = 'Approved'
  AND ReferenceVersion = @ReferenceVersion
GROUP BY SourceCountryCode
HAVING COUNT(*) <> 1;</code></pre></div>
 <p class="small">A lookup can fail in two directions: zero approved matches or more than one approved match. Both need deliberate behaviour.</p>`},
{html:`<h4>Create a transformed view without rewriting raw evidence</h4>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: transformed view</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>CREATE VIEW stage.vCustomer_Transformed AS
SELECT
  c.CycleId, c.RunId,
  c.CustNo AS CustomerNumber,
  c.Name AS CustomerName,
  c.Terms AS SourcePaymentTerm,
  c.Status AS SourceStatus,
  c.Country AS SourceCountry,
  x.TargetCountryCode AS CountryCode
FROM raw.Customer c
LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountryCode = LTRIM(RTRIM(c.Country))
  AND x.ApprovalStatus = 'Approved';</code></pre></div>
 <p>This view is intentionally incomplete. Payment terms such as 45E still need approved reference logic, and customer names over 60 characters still need an approved treatment. The correct design exposes those gaps instead of making the SQL look finished.</p>
 <h4>NULL, blank and whitespace are not automatically the same business condition</h4>
 <ul class="framework-checks">
   <li><strong>NULL</strong> \u2014 no value stored. Was the source field absent, unknown or not applicable?</li>
   <li><strong>'' (empty string)</strong> \u2014 did the source explicitly supply blank?</li>
   <li><strong>' ' (whitespace)</strong> \u2014 formatting artefact, or meaningful source behaviour?</li>
   <li><strong>'45E' (populated code)</strong> \u2014 does it resolve to an approved target value?</li>
 </ul>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: separate NULL, empty and whitespace</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  SUM(CASE WHEN Terms IS NULL THEN 1 ELSE 0 END) AS NullTerms,
  SUM(CASE WHEN Terms = '' THEN 1 ELSE 0 END) AS EmptyTerms,
  SUM(CASE WHEN Terms IS NOT NULL AND Terms <> ''
      AND LTRIM(RTRIM(Terms)) = ''
      THEN 1 ELSE 0 END) AS WhitespaceTerms
FROM raw.Customer
WHERE CycleId = @CycleId;</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Do not clean by reflex</div><p>TRIM can be perfectly appropriate as an approved syntactic standardisation. But updating raw data in place destroys the distinction between received evidence and transformed value.</p></div>`}
];

 id:"b2",nav:"SQL answers questions",title:"Teach \u2014 SQL answers migration questions",type:"content",
 html:`<p class="lead">Useful migration SQL starts with a question. The query is simply the quickest controlled way to obtain evidence.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Migration question</th><th>SQL pattern</th><th>What you learn</th></tr></thead><tbody>
 <tr><td>How many rows did we receive?</td><td><code>COUNT(*)</code></td><td>Raw population</td></tr>
 <tr><td>Does the key population equal the row population?</td><td><code>COUNT(DISTINCT key)</code></td><td>Possible duplicates or repeated keys</td></tr>
 <tr><td>Which keys repeat?</td><td><code>GROUP BY ... HAVING COUNT(*) &gt; 1</code></td><td>Affected duplicate population</td></tr>
 <tr><td>Which records are new this cycle?</td><td>LEFT JOIN / NOT EXISTS / EXCEPT</td><td>Population movement</td></tr>
 <tr><td>Which records disappeared?</td><td>Reverse comparison</td><td>Potential scope or source movement</td></tr>
 <tr><td>Which source values do not resolve?</td><td>LEFT JOIN to approved reference + IS NULL</td><td>Unmatched reference population</td></tr>
 <tr><td>Which values dominate or look unusual?</td><td><code>GROUP BY</code> + <code>COUNT</code></td><td>Distribution and rare values</td></tr>
 <tr><td>Which rows violate a known target constraint?</td><td>WHERE / CASE / length or range checks</td><td>Pre-load exceptions</td></tr>
 <tr><td>Do clean, exception and exclusion totals reconcile?</td><td>Aggregate counts</td><td>Population control</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Consultant habit</strong><br>Do not begin with \u201cWhich SQL should I write?\u201d Begin with \u201cWhat do I need to prove?\u201d A simple query that answers the right migration question is more valuable than clever SQL that produces an impressive but unexplained result.</div>
 <h3>The five SQL habits a DMC needs constantly</h3>
 <ul class="framework-checks">
   <li>Filter explicitly. A count without its scope can be worse than no count.</li>
   <li>Keep the business key visible. You need to trace affected rows, not only quote totals.</li>
   <li>Return the affected records after measuring them. Someone will need to investigate.</li>
   <li>Preserve unmatched rows when the question is about completeness or reference coverage.</li>
   <li>Make cycle and run context part of the evidence so tomorrow's result is not confused with today's.</li>
 </ul>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_SQL-Migration-Cheatsheet.pdf</strong><p class="small">The migration-question-to-SQL-pattern table above, as a quick reference.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_SQL-Migration-Cheatsheet.pdf" download>Download</a></div>`
},
{
 id:"b3",nav:"Staging preserves evidence",title:"Teach \u2014 A staging layer should preserve evidence",type:"content",
 html:`<p class="lead">A staging database is not just somewhere to put data before loading it. It is the working evidence base of the migration. A good design lets you answer three questions quickly: what did the source actually send, what did our migration logic do to it, and what are we proposing to load?</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Layer</th><th>Purpose</th><th>Bramwell customer example</th><th>Rule</th></tr></thead><tbody>
 <tr><td>Raw</td><td>Preserve received source values</td><td>CustNo, Name, Terms, Rep, Status, Country</td><td>Do not overwrite source evidence</td></tr>
 <tr><td>Transform / stage</td><td>Apply approved, traceable logic</td><td>Normalised values, lookups, derived fields</td><td>Keep logic attributable to MappingID/RuleID</td></tr>
 <tr><td>Exception</td><td>Retain rows/fields that cannot be safely transformed</td><td>Unresolved 45E; ZZZ; overlength names if no approved treatment</td><td>Explain why the row is not load-ready</td></tr>
 <tr><td>Load-ready / export</td><td>Produce target-shaped approved output</td><td>CustomerNumber, CustomerName, PaymentTerms, CustomerStatus, CountryCode</td><td>Only approved results</td></tr>
 <tr><td>Control / metadata</td><td>Record cycle, run, source, counts and build/reference context</td><td>CycleId, RunId, timestamps, source file, row counts</td><td>Make repeated executions distinguishable</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Raw means raw</div><p>If you trim, translate, default or repair values in the raw layer, you weaken your ability to prove what the source supplied. Preserve the received value and create transformed values separately.</p></div>
 <h3>CycleId, RunId and source identity</h3>
 <p>Migration work repeats. The same entity can be extracted and processed many times. The minimum metadata depends on project architecture, but the design must distinguish the business cycle from an individual technical execution.</p>
 <ul class="framework-checks">
   <li><strong>CycleId</strong> \u2014 which migration cycle or rehearsal the data belongs to. Used to compare earlier and later customer populations.</li>
   <li><strong>RunId</strong> \u2014 one technical execution of an entity or process. Ties exceptions and control totals to the exact run.</li>
   <li><strong>SourceFile / ExtractId</strong> \u2014 which received source artefact produced the rows. Proves whether two runs used the same input.</li>
   <li><strong>LoadedAt / ExtractedAt</strong> \u2014 when evidence was received or landed. Helps diagnose stale or mixed-cycle data.</li>
   <li><strong>BuildVersion</strong> \u2014 which transformation implementation ran. Relates changed results to code changes.</li>
   <li><strong>ReferenceVersion</strong> \u2014 which controlled lookup baseline was used. Explains mapping-result changes.</li>
 </ul>
 <p>These columns are controls, not decoration. Without them, a table called Customer_Final may be impossible to interpret two weeks later.</p>`
},

 html:`<p class="lead">Work through the staging flow in order. Each step builds on the evidence the last one produced \u2014 don't skip ahead.</p>`,

{
 id:"b5",nav:"Build it",title:"Build it \u2014 Exceptions and reconciliation",type:"content",
 html:`<p class="lead">A useful staging flow does not merely produce a load-ready table. It can explain why records or fields are not load-ready.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Exception</th><th>Established Bramwell example</th><th>Required evidence</th></tr></thead><tbody>
 <tr><td>Unresolved payment term</td><td>45E has no approved target equivalent</td><td>CustNo, source Terms, Rule/Mapping ID, reason</td></tr>
 <tr><td>Unresolved country</td><td>ZZZ has no approved target mapping</td><td>CustNo, source Country, reference version, reason</td></tr>
 <tr><td>Target length conflict</td><td>27 customer names exceed 60 characters</td><td>CustNo, source Name, actual length, target limit</td></tr>
 <tr><td>Ambiguous reference</td><td>More than one approved reference match</td><td>Source value, matching reference rows, reference version</td></tr>
 <tr><td>Missing key</td><td>Blank or unusable CustNo</td><td>Source row identity, received values, reason</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: example country exceptions</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  c.CycleId, c.RunId, c.CustNo,
  'CUS-006' AS MappingId, 'Country' AS SourceField,
  c.Country AS SourceValue, 'COUNTRY_CODE_UNRESOLVED' AS ExceptionCode
FROM raw.Customer c
LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountryCode = LTRIM(RTRIM(c.Country))
  AND x.ApprovalStatus = 'Approved'
WHERE c.CycleId = @CycleId
  AND x.SourceCountryCode IS NULL;</code></pre></div>
 <p>The exception output should be understandable without reopening the transformation code.</p>
 <h3>Reconcile the staging flow</h3>
 <p>Counts are controls only when the populations are defined consistently.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Conceptual control equation</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Input population
  = Load-ready population
  + Exception population
  + Approved exclusions

-- If records can have multiple field-level exceptions,
-- do NOT equate exception-row count with distinct
-- affected-record count.</code></pre></div>
 <ul class="framework-checks">
   <li><strong>Raw row count:</strong> how many rows did we receive for this cycle or run?</li>
   <li><strong>Distinct business keys:</strong> how many identifiable customers are represented?</li>
   <li><strong>Load-ready distinct keys:</strong> how many customers can currently be submitted?</li>
   <li><strong>Exception distinct keys:</strong> how many customers are blocked or held?</li>
   <li><strong>Exception rows:</strong> how many individual rule failures exist?</li>
   <li><strong>Approved exclusions:</strong> which records are intentionally outside the submitted population?</li>
   <li><strong>Unaccounted population:</strong> is any source key neither ready, exceptioned nor approved for exclusion?</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Important</div><p>One customer can fail more than one rule. Therefore 214 exception rows do not necessarily mean 214 affected customers unless the exception design guarantees one row per customer. Reconcile at the grain that matches the control.</p></div>`
},
{
 id:"b6",nav:"Diagnose it",title:"Diagnose it \u2014 Review SQL that produces a dangerously clean result",type:"selectAll",
 html:`<p class="lead">A colleague proposes the following query because it creates a target-shaped customer file in one step.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: submitted for review</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  c.CustNo AS CustomerNumber,
  LEFT(LTRIM(RTRIM(c.Name)),60) AS CustomerName,
  ISNULL(p.TargetPaymentTerm,'NET30') AS PaymentTerms,
  CASE WHEN c.Status='1' THEN 'Active' ELSE 'Inactive' END AS CustomerStatus,
  ISNULL(x.TargetCountryCode,'GB') AS CountryCode
FROM raw.Customer c
INNER JOIN ref.PaymentTermCrossRef p
  ON p.SourcePaymentTerm = c.Terms
LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountryCode = c.Country
WHERE c.CycleId = @CycleId;</code></pre></div>
 <p>Before reading the mentor review, select every way this query can hide or manufacture a migration result.</p>`,
 options: staleQueryDefects,
 coaching: staleQueryCoaching,
 hint:"Explore every defect before continuing.",
 closingHtml:`<div class="callout misconception"><div class="callout-label">The INNER JOIN trap in this example</div><p>Because the payment-term table is INNER JOINed, a customer with no matching payment-term reference is removed from the result. The later <code>ISNULL(p.TargetPaymentTerm,'NET30')</code> cannot rescue a row that no longer exists.</p></div>
 <div class="principle"><strong>Consultant skill</strong><br>Be able to read SQL well enough to understand population behaviour. You do not need to be a database engineer to notice that a join has changed the grain or silently removed source rows.</div>`
},
{
 id:"b7",nav:"Do it yourself",title:"Do it yourself \u2014 Build the Bramwell staging control pack",type:"reflection",
 html:`<p class="lead">Using the staging patterns from this lesson, produce a small staging control pack against a synthetic subset of Bramwell customer rows.</p>
 <ol class="framework-checks">
   <li>Load the supplied current and previous customer extracts into a raw layer without changing source values.</li>
   <li>Record CycleId, RunId and source-file identity.</li>
   <li>Prove row count, distinct CustNo count and blank-key count for both cycles.</li>
   <li>Return any duplicate-key rows.</li>
   <li>Produce lists of new keys and missing keys between cycles. Do not infer the composition from the net difference.</li>
   <li>Compare Terms, Country and Status for customers present in both cycles.</li>
   <li>Join Country to the approved country reference while preserving unmatched values such as ZZZ.</li>
   <li>Create an exception query for unresolved country values.</li>
   <li>Create a separate query that exposes customer names longer than 60 characters without truncating them.</li>
   <li>Demonstrate that 45E remains unresolved rather than defaulting it.</li>
   <li>Produce a control summary showing raw, load-ready, exception and approved-exclusion populations at the correct grain.</li>
   <li>Write a short handover note explaining what the staging flow proves, what remains unresolved and which query the next consultant should run first on the next extract.</li>
 </ol>
 <h3>Deliverables</h3>
 <ul class="framework-checks">
   <li><strong>01_RawPopulation.sql</strong> \u2014 counts, distinct keys, blanks, duplicate extraction.</li>
   <li><strong>02_CycleComparison.sql</strong> \u2014 new, missing and materially changed keys.</li>
   <li><strong>03_ReferenceCoverage.sql</strong> \u2014 approved matches, unmatched and ambiguous references.</li>
   <li><strong>04_Exceptions.sql</strong> \u2014 business-readable exception evidence.</li>
   <li><strong>05_Reconciliation.sql</strong> \u2014 defined population controls at the correct grain.</li>
   <li><strong>Staging Design Sheet</strong> \u2014 layer purpose, tables/views, keys, metadata, reference dependencies.</li>
   <li><strong>Handover note</strong> \u2014 what changed, what is safe, what is unresolved, what to rerun.</li>
 </ul>
 <p class="lead">Write your handover note below \u2014 what would you tell the next consultant who picks this up?</p>
 <textarea id="reflection" placeholder="This staging flow proves..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Staging-Design-Sheet-Template.xlsx</strong><p class="small">Layer purpose, tables/views, keys, metadata and reference dependencies, ready to fill in.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Staging-Design-Sheet-Template.xlsx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/raw|preserve|evidence|overwrit/i, strength:"You addressed preserving raw evidence rather than overwriting it.", gap:"State explicitly that raw values are preserved untouched, with transformed values kept separately." },
   { test:/key|duplicate|grain/i, strength:"You addressed key-level proof rather than just row counts.", gap:"Name what you'd check to prove the business key and grain, not just the row count." },
   { test:/45e|zzz|unresolved/i, strength:"You named a specific unresolved item (45E or ZZZ) and kept it visible rather than defaulted.", gap:"Name a specific unresolved value, like 45E or ZZZ, and confirm it stays visible rather than being defaulted away." },
   { test:/reconcil|control total|grain/i, strength:"You addressed reconciliation at the correct grain.", gap:"State how raw, load-ready, exception and exclusion populations reconcile, and at what grain." },
   { test:/rerun|next|handover|another consultant/i, strength:"You wrote this as a genuine handover, telling the next consultant what to run first.", gap:"Say what the very next consultant to touch this should do first, not just what you did." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Raw customer rows for both cycles are preserved untouched, tagged with CycleId, RunId and source file. Row count, distinct key count and blank-key count are proven for both cycles; the current extract's five repeated keys are returned as rows, not just a count. New and missing keys between cycles are listed directly from a key comparison, not inferred from the net +82. Country resolves through the approved cross-reference with ZZZ left visible as an unresolved exception; 45E remains unresolved rather than defaulted to NET30. Load-ready, exception and exclusion populations reconcile against the raw count at the customer-key grain. Next consultant: rerun 01_RawPopulation.sql first against the new extract before touching anything else.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This reads like a genuine handover note, not a status report \u2014 exactly what the next consultant on this project would need.":"You have the right structure. Make sure every unresolved item stays visibly unresolved in your note, and that the next consultant would know exactly which query to run first."}</div>`
},

{
 id:"b9",nav:"Nuance",title:"Nuance \u2014 Write SQL for the next consultant, not for applause",type:"content",
 html:`<ul class="framework-checks">
   <li>Prefer readable stages over one enormous statement when intermediate evidence matters.</li>
   <li>Use meaningful aliases and names that reveal source, stage and target meaning.</li>
   <li>Parameterise cycle, run and reference context rather than editing literals before every execution.</li>
   <li>Keep controlled reference translations in data or configuration where practical, rather than scattering CASE expressions through code.</li>
   <li>Comment unusual logic and link it to a MappingID, RuleID or an approved decision.</li>
   <li>Know when a view is enough and when a materialised staging table is useful for evidence, performance or restartability.</li>
   <li>Do not add indexes, hints or clever optimisations before you know the actual volume and bottleneck. Production-readiness performance comes later in DMC1.</li>
   <li>Use project architecture deliberately. SQL is a tool inside the migration solution, not the solution by itself.</li>
 </ul>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">What this lesson does not ask you to become</div><p>You are not being trained as a database administrator. A Data Migration Consultant does, however, need enough SQL fluency to interrogate populations independently, challenge suspicious outputs, understand join behaviour, build controlled transformations and communicate evidence to developers and business SMEs.</p></div></div>
 <div class="to-record">${TPKit.fromField({
   title:"The Count That Hid the Change", name:"Marcus", role:"Data Migration Consultant", project:"Logistics ERP",
   src:"/assets/audio/CountThatHidTheChange-Marcus.mp3",
   reflection:"What control or habit in this story would you carry into your own migration work?"
 })}</div>`
},
{
 id:"b10",nav:"Reflection",title:"Reflection \u2014 Would you trust this staging database?",type:"reflection",
 html:`<p class="lead">You inherit a database containing Customer_Final, Customer_Final2, Customer_Test_New and Customer_Clean_Final. There is no CycleId, RunId, source-file metadata or obvious raw table.</p>
 <p>Write what evidence you would establish before using it, which risks concern you most, which conventions you would introduce first, and how you would avoid breaking an execution already in progress.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers begin by identifying the current source of truth and execution context before renaming or rebuilding anything. Good control is not the same as tidying somebody else's database on sight.</p></div></div>
 <textarea id="reflection" placeholder="Before using this database, I would first establish..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:60,
 checks:[
   { test:/source of truth|which.*(current|correct|authoritative)/i, strength:"You addressed identifying the current source of truth before changing anything.", gap:"State how you'd work out which of the four tables, if any, is actually the current source of truth." },
   { test:/execution|in progress|breaking|running/i, strength:"You addressed not breaking an execution already in progress.", gap:"State how you'd check for or avoid disrupting a migration execution that might already be running against these tables." },
   { test:/risk|concern/i, strength:"You named a specific risk this setup creates.", gap:"Name a specific risk this naming pattern creates, not just that it's untidy." },
   { test:/convention|cycleid|runid|metadata/i, strength:"You named a specific convention you'd introduce, such as CycleId or RunId.", gap:"Name a specific convention, like CycleId or RunId, you'd introduce and why." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Before touching anything, I'd establish which of the four tables, if any, is currently being read by a live process, and confirm that with whoever owns the schedule \u2014 not just by inspecting timestamps. My biggest concern is that "Final" and "Clean_Final" both sound authoritative, so a wrong guess could point new work at stale data. I would not rename or drop anything yet. I'd introduce CycleId and RunId on any new work I add, and start a parallel, clearly-labelled raw table for whatever the true current source turns out to be, rather than assuming I can silently repurpose an existing one.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is exactly the right instinct: establish, don't tidy. Renaming somebody else's tables on sight, however messy, is how executions get broken.":"You have good instincts here. Make sure your answer stays focused on establishing the current state safely, rather than jumping straight to how you'd reorganise the database."}</div>`
},
{
 id:"b11",nav:"Summary",title:"Summary \u2014 SQL and staging habits that make a DMC useful",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Start with the migration question, then write the query.</li>
   <li>Prove raw populations before transformation.</li>
   <li>Separate row counts from distinct-key counts and understand the grain.</li>
   <li>Compare cycles by new, missing and changed keys, not only net totals.</li>
   <li>Preserve received source values in a raw layer.</li>
   <li>Use CycleId, RunId and source identity so repeated executions remain distinguishable.</li>
   <li>Use controlled reference data and expose zero-match and multi-match conditions.</li>
   <li>Understand how JOIN choice changes the population.</li>
   <li>Keep NULL, blank and whitespace behaviour explicit.</li>
   <li>Create exception evidence that explains why data is not load-ready.</li>
   <li>Reconcile at the correct grain and remember that one record may have multiple exceptions.</li>
   <li>Write SQL that another consultant can read, challenge and rerun.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A staging layer is valuable when it lets you prove what arrived, what changed, what your migration logic did and why every record is either ready, excepted or deliberately excluded.</div>`
},
