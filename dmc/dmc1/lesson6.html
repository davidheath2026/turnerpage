{html:`<h4>Lab part 1 \u2014 Remove environment assumptions from the build</h4>
 <p>Open the Bramwell customer process and search for values that would force a code or package edit when moving from development to the migration environment.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Hard-coded assumption</th><th>Production-ready treatment</th></tr></thead><tbody>
 <tr><td>Server/database name inside SQL or task</td><td>Environment connection/configuration</td></tr>
 <tr><td><code>C:\\Migration\\Cycle2\\Customers.csv</code></td><td>Input root + cycle/file configuration</td></tr>
 <tr><td>Output folder in package expression</td><td>Controlled output configuration</td></tr>
 <tr><td>Reference version literal</td><td>Approved reference-version parameter</td></tr>
 <tr><td>CycleId embedded in WHERE clause</td><td>Cycle/run parameter</td></tr>
 <tr><td>Email recipient embedded in script</td><td>Environment/notification configuration if used</td></tr>
 <tr><td>Password/API key in package or script</td><td>Approved secret/credential mechanism</td></tr>
 <tr><td>DEV-specific table/schema name</td><td>Environment abstraction or deployment configuration</td></tr>
 </tbody></table></div>
 <p>The transformation rule itself should not change simply because the package moves environment. If UK \u2192 GB is approved, that rule remains the rule. Connections, paths and operational values are what normally vary.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Illustrative configuration</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Environment: MIG_TEST
CycleId: CYCLE_02
InputRoot: \\\\migration\\inbound\\cycle02
OutputRoot: \\\\migration\\outbound\\cycle02
ReferenceVersion: REF_CYCLE02_APPROVED
BuildVersion: CUST_1.8
MaxAllowedRuntimeMin: 75</code></pre></div>
 <p class="small">These are training implementation values, not new Bramwell facts.</p>
 <div class="principle"><strong>Configuration is evidence too</strong><br>Record the configuration baseline used by the run. If two executions produce different results, you need to know whether code, input, reference data or configuration changed.</div>
 <div class="callout misconception"><div class="callout-label">Avoid configuration sprawl</div><p>Externalising every literal can make a process harder to understand. Externalise values that legitimately vary by environment, cycle or controlled business baseline. Keep stable transformation logic in the controlled build.</p></div>`},
{html:`<h4>Lab part 2 \u2014 Know exactly what you deployed</h4>
 <p>A surprisingly common migration failure begins with the sentence: \u201cI thought that fix was in this version.\u201d</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Control</th><th>Minimum evidence</th></tr></thead><tbody>
 <tr><td>Build version</td><td>Unique version/release identifier</td></tr>
 <tr><td>Source control</td><td>Committed code/package baseline</td></tr>
 <tr><td>Approved change</td><td>Defect/mapping/change reference where applicable</td></tr>
 <tr><td>Deployment target</td><td>Environment and deployment time</td></tr>
 <tr><td>Deployed by</td><td>Traceable operator/process</td></tr>
 <tr><td>Smoke test</td><td>Evidence that deployed package connects and basic controls run</td></tr>
 <tr><td>Rollback/recovery</td><td>Known previous deployable version or defined recovery approach</td></tr>
 </tbody></table></div>
 <h4>Build version in the run evidence</h4>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Example run evidence</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>RunId: C2-CUST-004
Entity: Customer
BuildVersion: CUST_1.8
ReferenceVer: REF_CYCLE02_APPROVED
Environment: MIG_TEST
RunStatus: Started</code></pre></div>
 <p class="small">If the run log says only \u201cCustomer package,\u201d you have lost an important diagnostic dimension.</p>
 <div class="principle"><strong>Change-control principle</strong><br>A migration defect fix is not complete when the developer changes the package. It is complete when the approved change is built, tested, deployed, identifiable and its affected controls are retested.</div>`},
{html:`<h4>Lab part 3 \u2014 Operationalise the run</h4>
 <p>Create an operator runbook for the customer process. It should not duplicate every technical detail in the package. It should tell a competent consultant what to check, execute, observe and do when something is wrong.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Runbook section</th><th>What it should contain</th></tr></thead><tbody>
 <tr><td>Purpose/scope</td><td>Entity and intended cycle/output</td></tr>
 <tr><td>Prerequisites</td><td>Input, references, environment/access, upstream dependencies</td></tr>
 <tr><td>Configuration</td><td>CycleId, paths, reference/build version, approved parameters</td></tr>
 <tr><td>Start procedure</td><td>How to initiate the controlled run</td></tr>
 <tr><td>Expected checkpoints</td><td>Major stages and expected evidence</td></tr>
 <tr><td>Controls</td><td>Population, reconciliation and exception checks</td></tr>
 <tr><td>Expected outputs</td><td>Artefact/table identity and location</td></tr>
 <tr><td>Failure response</td><td>Where evidence is, when to stop, recovery decision route</td></tr>
 <tr><td>Completion</td><td>What must be true before status is Complete/Ready</td></tr>
 <tr><td>Handover/escalation</td><td>What evidence to provide and to whom</td></tr>
 </tbody></table></div>
 <h4>Pre-flight checklist</h4>
 <ul class="framework-checks">
   <li>Correct build version deployed.</li>
   <li>Correct cycle/environment configuration loaded.</li>
   <li>Expected source input present and identity proven.</li>
   <li>Approved reference baseline available.</li>
   <li>Required upstream dependencies complete.</li>
   <li>No conflicting execution active.</li>
   <li>Staging/output destinations available.</li>
   <li>Sufficient storage/capacity where relevant.</li>
   <li>Operator has required access without using developer credentials.</li>
   <li>Previous failed/partial output cannot be mistaken for the new run.</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Runbook test</div><p>Give the runbook to a consultant who did not build the package. If they must phone the developer to discover the input path, expected controls or meaning of a failure state, the handover is incomplete.</p></div>`}
];

 id:"b2",nav:"Working build to process",title:"Teach \u2014 From working build to operational process",type:"content",
 html:`<p class="lead">A development build proves that the logic can work. Production readiness asks whether the process can be trusted when the conditions become less forgiving.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Dimension</th><th>Working build</th><th>Production-ready migration process</th></tr></thead><tbody>
 <tr><td>Configuration</td><td>Developer edits paths/connections</td><td>Environment/run values supplied through controlled configuration</td></tr>
 <tr><td>Deployment</td><td>Latest local copy is used</td><td>Known build version is promoted and identifiable</td></tr>
 <tr><td>Execution</td><td>Developer knows the sequence</td><td>Operator can follow a runbook and pipeline controls</td></tr>
 <tr><td>Failure</td><td>Developer investigates interactively</td><td>Failure evidence and recovery boundaries are designed</td></tr>
 <tr><td>Data control</td><td>Output appears correct</td><td>Population, exception and output controls are repeatable</td></tr>
 <tr><td>Performance</td><td>Runtime feels acceptable</td><td>Runtime is measured against the migration window with headroom</td></tr>
 <tr><td>Security</td><td>Credentials may exist in local setup</td><td>Secrets/access follow project controls</td></tr>
 <tr><td>Support</td><td>Original developer is needed</td><td>Another competent consultant can diagnose and operate it</td></tr>
 <tr><td>Change</td><td>Code is edited when needed</td><td>Changes are versioned, tested and linked to approved rules</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Production-ready does not mean perfect</strong><br>It means the process is controlled enough for its intended migration cycle and risk. A one-off 5,000-row reference load and a 185,000-product transformation may justify different engineering effort. Apply discipline proportionately.</div>`

{
 id:"b3",nav:"The readiness gate",title:"Readiness gate \u2014 Seven questions before release",type:"content",
 html:`<ol class="framework-checks">
   <li>Can we prove exactly which build and configuration will run?</li>
   <li>Can it move between environments without changing transformation code?</li>
   <li>Can another consultant execute it from documented inputs and controls?</li>
   <li>Can we detect and diagnose failure without reconstructing the process from memory?</li>
   <li>Can we rerun or recover without silently duplicating, losing or overwriting evidence?</li>
   <li>Does it complete inside the required migration window with sensible headroom?</li>
   <li>Can we prove that repeated execution produces the intended controlled result?</li>
 </ol>
 <div class="principle"><strong>The release question</strong><br>Do not ask only \u201cDoes it work?\u201d Ask \u201cCan we operate, repeat, explain and recover it under migration-cycle conditions?\u201d</div>`

 id:"b5",nav:"Performance lab",title:"Performance lab \u2014 Runtime is a migration requirement",type:"content",
 html:`<p class="lead">Bramwell's earlier Core case recorded customer transformation times of 42 minutes in Cycle 1 and 31 minutes in Cycle 2. Those established figures show why runtime should be measured across cycles rather than guessed.</p>
 <p>For this lab, the production-readiness team sets a training requirement: the customer transformation stage should complete within 35 minutes in the test environment. That 35-minute threshold is a lab assumption, not Bramwell canon.</p>
 <p>A new build takes 54 minutes.</p>
 <div class="principle"><strong>Your job</strong><br>Do not start optimising random components. Establish where the additional time is being spent and whether the change is caused by data volume, transformation design, reference access, blocking operations, destination behaviour, environment or another factor.</div>
 <h3>Establish a performance baseline</h3>
 <ul class="framework-checks">
   <li><strong>Input rows</strong> \u2014 runtime comparisons need volume context.</li>
   <li><strong>Stage start/end</strong> \u2014 find the slow stage.</li>
   <li><strong>Rows per stage</strong> \u2014 identify expansion, reduction or unexpected grain.</li>
   <li><strong>Reference sizes</strong> \u2014 large or changed lookups can alter behaviour.</li>
   <li><strong>Source read time</strong> \u2014 separate extraction from transformation.</li>
   <li><strong>Transformation time</strong> \u2014 measure logic cost.</li>
   <li><strong>Destination write time</strong> \u2014 separate the output bottleneck.</li>
   <li><strong>Environment/build/reference version</strong> \u2014 make runs comparable.</li>
   <li><strong>Resource/engine diagnostics when needed</strong> \u2014 explain the bottleneck after localisation.</li>
 </ul>
 <div class="tp-table-wrap"><table class="tp-table tp-table--mono"><thead><tr><th>Stage</th><th>Build 1.7</th><th>Build 1.8</th></tr></thead><tbody>
 <tr><td>Read staged customers</td><td>4m</td><td>4m</td></tr>
 <tr><td>Country/payment lookups</td><td>6m</td><td>27m</td></tr>
 <tr><td>Derived transformations</td><td>12m</td><td>12m</td></tr>
 <tr><td>Exception routing</td><td>3m</td><td>3m</td></tr>
 <tr><td>Write transformed output</td><td>6m</td><td>8m</td></tr>
 <tr><td><strong>TOTAL</strong></td><td><strong>31m</strong></td><td><strong>54m</strong></td></tr>
 </tbody></table></div>
 <p>The evidence localises the regression to the lookup stage. Now investigate that stage instead of redesigning the entire pipeline.</p>`
},

 <div class="callout-label">The finding</div>
 <p>The lab reveals that Build 1.8 replaced a small controlled reference lookup with a query that repeatedly calls a remote reference source for each data-flow execution partition.</p>

 ]

{
 id:"b7",nav:"Blocking operations",title:"Blocking and expensive transformations",type:"content",
 html:`<p class="lead">In SSIS and similar tools, some operations require substantial buffering, sorting or whole-set processing. Sort, Aggregate, certain Merge patterns and custom scripts can become expensive at scale. That does not make them forbidden.</p>
 <ul class="framework-checks">
   <li><strong>Do we need this operation?</strong> Keep it if it implements a real migration requirement.</li>
   <li><strong>Can the source/staging layer provide the data already ordered or indexed appropriately?</strong> Consider it if controlled and demonstrably faster.</li>
   <li><strong>Can a reference be loaded once rather than repeatedly queried?</strong> Often useful where freshness or version is controlled.</li>
   <li><strong>Is custom script doing work a standard component or SQL layer can do clearly?</strong> Simplify if it improves maintainability and performance.</li>
   <li><strong>Are we processing rows that should have been excluded by approved scope earlier?</strong> Correct the population design, not merely the component.</li>
   <li><strong>Can independent entities or stages run in parallel?</strong> Only after dependency and resource contention are understood.</li>
 </ul>
 <p class="small">Do not repeat simplistic rules such as \u201ctransformations always belong in the Data Flow\u201d or \u201cnever transform in source SQL.\u201d Choose the layer that is controlled, testable, traceable, maintainable and performant enough.</p>
 <h3>Create a performance evidence sheet</h3>
 <ul class="framework-checks">
   <li><strong>RunId / CycleId</strong> \u2014 identify the execution.</li>
   <li><strong>Entity</strong> \u2014 Customer.</li>
   <li><strong>BuildVersion</strong> \u2014 compare releases.</li>
   <li><strong>InputRows</strong> \u2014 normalise runtime against volume.</li>
   <li><strong>StageName</strong> \u2014 localise time.</li>
   <li><strong>Start / End / Duration</strong> \u2014 measure.</li>
   <li><strong>RowsIn / RowsOut</strong> \u2014 spot grain or population anomalies.</li>
   <li><strong>Environment</strong> \u2014 avoid invalid comparisons.</li>
   <li><strong>ReferenceVersion</strong> \u2014 identify baseline changes.</li>
   <li><strong>Result</strong> \u2014 pass/fail against the agreed window.</li>
   <li><strong>Comment</strong> \u2014 explain the anomaly or change.</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Headroom matters</div><p>A process that takes 59 minutes in a 60-minute slot is not comfortably ready. Migration windows contain variability, dependencies and recovery needs. The appropriate headroom is project-specific, but zero margin is a risk worth surfacing.</p></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Performance-Evidence-Template.xlsx</strong><p class="small">The eleven-field structure above, ready to fill in for any stage timing comparison.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Performance-Evidence-Template.xlsx" download>Download</a></div>`
},
{
 id:"b8",nav:"Repeatability test",title:"Repeatability test \u2014 Same controlled input, same controlled result",type:"content",
 html:`<p class="lead">Run the customer process twice using the same synthetic lab input, build, configuration and approved reference baseline. Use a separate attempt/run identity so evidence is preserved. Compare: raw/source population and distinct keys; load-ready population; exception population and exception reasons; key transformed field distributions; output business keys; output content or a deterministic comparison/hash where appropriate; reconciliation status; unexpected duplicates; runtime variation.</p>
 <h3>SQL comparison patterns</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: keys present in one run but not the other</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>-- Keys in Run A but not Run B
SELECT CustomerNumber
FROM output.Customer
WHERE RunId = @RunA
EXCEPT
SELECT CustomerNumber
FROM output.Customer
WHERE RunId = @RunB;

-- Keys in Run B but not Run A
SELECT CustomerNumber
FROM output.Customer
WHERE RunId = @RunB
EXCEPT
SELECT CustomerNumber
FROM output.Customer
WHERE RunId = @RunA;</code></pre></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: field-level comparison</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  a.CustomerNumber,
  a.CountryCode AS RunA_Country,
  b.CountryCode AS RunB_Country
FROM output.Customer a
JOIN output.Customer b
  ON b.CustomerNumber = a.CustomerNumber
WHERE a.RunId = @RunA
  AND b.RunId = @RunB
  AND ISNULL(a.CountryCode,'') <> ISNULL(b.CountryCode,'');</code></pre></div>
 <div class="principle"><strong>Determinism with nuance</strong><br>Some outputs legitimately contain generated timestamps, sequence values or environment-specific identifiers. Define which fields should be stable and which are expected to vary. Do not call a process non-repeatable because an execution timestamp changed.</div>`
},
{
 id:"b9",nav:"The second run differs",title:"Diagnose it \u2014 The second run differs",type:"content",
 html:`<p class="lead">The repeatability test produces the same row count but 42 customer records have different target values between runs.</p>
 <p>What should you compare before changing code?</p>
 <ol class="framework-checks">
   <li>Input identity and content.</li>
   <li>Build version.</li>
   <li>Reference version and reference contents.</li>
   <li>Configuration/parameters.</li>
   <li>Execution order and any time-dependent logic.</li>
   <li>Non-deterministic joins or ambiguous reference matches.</li>
   <li>Target/output behaviour such as generated defaults.</li>
   <li>Environment differences.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Counts are not repeatability</div><p>Two runs can both contain 18,612 rows and still disagree on which values were produced. Repeatability needs key- and field-level evidence for the transformations that matter.</p></div>`
},
{
 id:"b10",nav:"Security and access",title:"Security and access \u2014 Enough for a DMC to control",type:"content",
 html:`<p class="lead">A Data Migration Consultant is not expected to design enterprise security architecture, but should recognise unsafe operational practices.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak practice</th><th>Better practice</th></tr></thead><tbody>
 <tr><td>Password stored in SQL/script/package text</td><td>Use project-approved credential/secret mechanism</td></tr>
 <tr><td>Developer personal account runs scheduled migration</td><td>Use approved execution identity/service mechanism</td></tr>
 <tr><td>Everyone has write access to raw evidence</td><td>Restrict write access appropriately; preserve evidence</td></tr>
 <tr><td>Output share is open to broad users</td><td>Limit access to migration/business need</td></tr>
 <tr><td>Credentials copied into runbook</td><td>Reference the approved access process, not the secret</td></tr>
 <tr><td>Production-like access granted without testing</td><td>Verify operator permissions before the migration window</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Operational lesson</strong><br>A perfectly designed pipeline can still fail at cutover because the execution account cannot read the source or write the destination. Access is a pre-flight dependency and should be tested before the window.</div>`
},
{
 id:"b11",nav:"The readiness review",title:"Production-readiness review \u2014 Bramwell customer process",type:"content",
 html:`<p class="lead">Use the following review as the final worked assessment of DMC1. Each area is marked Ready, Ready with action, or Not ready \u2014 and backed by evidence, not a tick.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Area</th><th>Evidence required</th></tr></thead><tbody>
 <tr><td>Mapping logic</td><td>Build traceable to approved mapping/rules; unresolved values remain exceptions</td></tr>
 <tr><td>Staging</td><td>Raw evidence preserved; run/cycle identity; controlled references</td></tr>
 <tr><td>Pipeline</td><td>Dependencies, pre-flight, reconciliation and output gates explicit</td></tr>
 <tr><td>Transformations</td><td>No hidden defaults; boundary, no-match and multi-match behaviour tested</td></tr>
 <tr><td>Logging</td><td>Run/step/exception evidence sufficient for diagnosis</td></tr>
 <tr><td>Recovery</td><td>Known checkpoints; partial-output and rerun behaviour tested</td></tr>
 <tr><td>Configuration</td><td>Environment/cycle values externalised appropriately</td></tr>
 <tr><td>Deployment</td><td>Build version identifiable and promotion controlled</td></tr>
 <tr><td>Performance</td><td>Measured against required window with risk/headroom understood</td></tr>
 <tr><td>Repeatability</td><td>Same controlled baseline produces expected equivalent result</td></tr>
 <tr><td>Access</td><td>Execution identity and destinations tested</td></tr>
 <tr><td>Runbook</td><td>Another consultant can operate and escalate from evidence</td></tr>
 </tbody></table></div>
 <h3>A readiness decision is evidence-based</h3>
 <div class="callout misconception"><div class="callout-label">Weak</div><p>\u201cCustomers are ready. We have run them several times.\u201d</p></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Stronger</div><p>\u201cCustomer build CUST_1.8 has passed functional, reconciliation, recovery and repeatability tests in the migration test environment. Runtime is 33 minutes against the 35-minute lab threshold, so performance headroom remains a risk to track. The runbook and configuration pack have been executed by a second consultant. Unresolved business exceptions remain reported separately.\u201d</p></div></div>
 <p class="small">The 35-minute threshold and CUST_1.8 label are lab values. The structure of the statement is the lesson: claim, evidence, residual risk.</p>`
},
{
 id:"b12",nav:"Do it yourself",title:"Do it yourself \u2014 Make a migration process production-ready",type:"reflection",
 html:`<p class="lead">The independent lab supplies a synthetic product migration process that currently works only on its developer's laptop. Product volume may use a training subset; do not treat lab counts as Bramwell canon. The process has these deliberate weaknesses:</p>
 <ul class="framework-checks">
   <li>Hard-coded development connection and local input/output paths.</li>
   <li>No build version in execution evidence.</li>
   <li>Manual editing of CycleId before each run.</li>
   <li>One large transformation with no stage timings.</li>
   <li>A lookup that queries a remote source repeatedly.</li>
   <li>Output overwritten on every execution.</li>
   <li>Developer credentials required.</li>
   <li>No operator runbook.</li>
   <li>No repeatability test.</li>
   <li>Runtime close to the available training window.</li>
 </ul>
 <h3>Your task</h3>
 <ol class="framework-checks">
   <li>Separate stable transformation logic from environment/cycle configuration.</li>
   <li>Define the deployment/version evidence required.</li>
   <li>Create a pre-flight checklist.</li>
   <li>Instrument stage timings and row counts.</li>
   <li>Use evidence to identify the main performance bottleneck.</li>
   <li>Propose an optimisation that preserves migration controls.</li>
   <li>Define the output-versioning/replacement behaviour.</li>
   <li>Define the approved execution-access requirement without storing credentials in the artefact.</li>
   <li>Execute or simulate two controlled repeatability runs and compare them.</li>
   <li>Produce a production-readiness assessment with evidence and residual risks.</li>
   <li>Write an operator handover that another consultant can follow.</li>
 </ol>
 <h3>Required artefacts</h3>
 <ul class="framework-checks">
   <li><strong>Configuration matrix</strong> \u2014 environment/cycle/run values and ownership.</li>
   <li><strong>Deployment record</strong> \u2014 build/version/environment evidence.</li>
   <li><strong>Pre-flight checklist</strong> \u2014 prerequisites before execution.</li>
   <li><strong>Performance evidence sheet</strong> \u2014 stage timings, volumes and comparison.</li>
   <li><strong>Optimisation note</strong> \u2014 measured bottleneck, change, retest result.</li>
   <li><strong>Repeatability comparison</strong> \u2014 key/field/count evidence across controlled runs.</li>
   <li><strong>Production-readiness checklist</strong> \u2014 evidence-backed status by readiness dimension.</li>
   <li><strong>Operator runbook</strong> \u2014 execute, observe, stop, recover, complete.</li>
   <li><strong>Handover note</strong> \u2014 known limitations, unresolved risks and next action.</li>
 </ul>
 <p class="lead">Write your production-readiness assessment below, in the claim/evidence/residual-risk structure from this lesson.</p>
 <textarea id="reflection" placeholder="Product build..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Repeatability-Comparison-Template.xlsx</strong><p class="small">Key, field and count evidence across two controlled runs, ready to fill in.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Repeatability-Comparison-Template.xlsx" download>Download</a></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC1_Production-Readiness-Checklist.xlsx</strong><p class="small">The twelve-area readiness board from this lesson, ready to fill in with evidence.</p></div><a class="btn secondary" href="/assets/downloads/DMC1_Production-Readiness-Checklist.xlsx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/config|environment|hard-?cod/i, strength:"You addressed separating configuration from stable transformation logic.", gap:"Name a specific value that should move from hard-coded to configuration." },
   { test:/build version|deploy/i, strength:"You addressed build/version/deployment evidence.", gap:"State what build or version evidence should exist in the run record." },
   { test:/bottleneck|performance|timing|stage/i, strength:"You addressed localising the performance bottleneck with evidence, not guesswork.", gap:"State how you'd localise the bottleneck to a specific stage before proposing a fix." },
   { test:/repeatab|two.*run|compare/i, strength:"You addressed proving repeatability across two controlled runs.", gap:"State what you'd compare between two controlled runs, beyond just row counts." },
   { test:/risk|residual/i, strength:"You named a specific residual risk rather than declaring the process simply ready.", gap:"Name a specific residual risk you'd report alongside your readiness claim." },
   { test:/handover|runbook|another consultant/i, strength:"You wrote this so another consultant could actually operate the process from it.", gap:"Say what a different consultant would need from your handover to actually run this themselves." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Product build PROD_1.0 has passed functional and reconciliation tests against the synthetic lab dataset. Connection strings, input/output paths and CycleId are now configuration, not hard-coded; the run record captures BuildVersion and Environment. The remote lookup was identified as the main bottleneck through stage timings and replaced with a locally cached, version-controlled reference. Two controlled repeatability runs produced identical business keys and matching field values, with only the execution timestamp expected to differ. Runtime is within the training window with acceptable headroom. Residual risk: the pre-flight checklist has not yet been executed by a second consultant, so operability by someone other than the builder is not yet proven. Handover: run PreflightCheck.sql, confirm the configuration matrix values for the target environment, then start via RunCustomerProcess with the approved BuildVersion.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This reads like a genuine production-readiness assessment: claim, evidence and an honestly reported residual risk, not a blanket 'it's ready.'":"You have the right structure. Make sure you're naming a specific residual risk rather than declaring the process simply ready, and that your handover gives a different consultant enough to actually start the run."}</div>`
},
{
 id:"b13",nav:"Ready enough?",title:"Consultant situations \u2014 Ready enough?",type:"situations",
 html:`<p class="lead">Six moments where "ready" isn't a simple yes or no.</p>`,
 items: readySituations,
 takeawayHtml:`<div class="principle"><strong>The pattern across all six</strong><br>None of these are solved by picking the more comfortable-sounding answer. Each one needs the same discipline: report what's actually proven, name the residual risk, and let evidence, not hope, carry the readiness claim.</div>`
},
{
 id:"b14",nav:"The DMC1 production pack",title:"The DMC1 production pack",type:"content",
 html:`<p class="lead">By the end of Module 1, you should have a coherent set of project-usable artefacts rather than six disconnected lessons.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>From lesson</th><th>Artefact / capability</th></tr></thead><tbody>
 <tr><td>L1 \u2014 Mapping to logic</td><td>Mapping-to-Build Specification + transformation test matrix</td></tr>
 <tr><td>L2 \u2014 SQL and staging</td><td>Staging design + SQL control pack</td></tr>
 <tr><td>L3 \u2014 ETL pipeline</td><td>Pipeline diagram + parameter/pre-flight/control-total pack</td></tr>
 <tr><td>L4 \u2014 Robust transformations</td><td>Transformation rule catalogue + boundary/lookup test evidence</td></tr>
 <tr><td>L5 \u2014 Logging/restartability</td><td>Run/step/exception logging + recovery evidence pack</td></tr>
 <tr><td>L6 \u2014 Production readiness</td><td>Configuration, deployment, performance, repeatability and operator handover pack</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Module-level outcome</strong><br>A candidate completing DMC1 should be able to take an approved mapping and build a controlled migration process that another consultant can understand, execute, diagnose, recover and prepare for a real migration cycle.</div>
 <div class="to-record">${TPKit.fromField({
   title:"The Build That Worked on One Laptop", name:"Nadia", role:"Data Migration Consultant", project:"Public Sector ERP",
   src:"/assets/audio/BuildThatWorkedOnOneLaptop-Nadia.mp3",
   reflection:"What control or habit in this story would you carry into your own migration work?"
 })}</div>`
},
{
 id:"b15",nav:"Reflection",title:"Reflection \u2014 Would you put your name against this build?",type:"reflection",
 html:`<p class="lead">Choose the production-readiness dimension you would be least willing to compromise under time pressure: configuration, deployment traceability, operational control, failure recovery, performance, repeatability, access or handover.</p>
 <p>Explain why, then identify one dimension where you think proportional compromise may sometimes be reasonable on a real migration project.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers recognise that production readiness is risk-based rather than perfection-based, while still identifying controls whose absence would make the process impossible to trust.</p></div></div>
 <textarea id="reflection" placeholder="The dimension I would be least willing to compromise is..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/configuration|deployment|operational control|failure recovery|performance|repeatab|access|handover/i, strength:"You named a specific readiness dimension as your line.", gap:"Name one specific dimension \u2014 configuration, deployment, recovery, performance, repeatability, access or handover \u2014 as the one you wouldn't compromise." },
   { test:/because|since|reason/i, strength:"You explained why that dimension is the one you'd hold the line on.", gap:"Explain why that particular dimension matters more to you than the others." },
   { test:/proportional|compromise|reasonable|trade.?off/i, strength:"You identified a dimension where proportional compromise could be reasonable.", gap:"Name a second dimension where some compromise might be reasonable on a real project, and why." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The dimension I'd be least willing to compromise is failure recovery: without proven recovery evidence, every other control's benefit disappears the moment something goes wrong at 2am. A dimension where proportional compromise can be reasonable is performance headroom on a genuinely low-volume, low-risk entity, where a tighter margin might be an acceptable, explicitly reported risk rather than a blocking issue.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is exactly the risk-based thinking the lesson is built around: not every dimension needs the same rigour, but some genuinely can't be traded away.":"You have good instincts. Make sure your reasoning is about risk and consequence, not just which control feels most technically interesting to you."}</div>`
},
{
 id:"b16",nav:"Summary",title:"Summary \u2014 Production-ready means operable and provable",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Functional correctness is necessary but not sufficient.</li>
   <li>Externalise values that genuinely vary by environment, cycle or controlled baseline.</li>
   <li>Know exactly which build and configuration executed.</li>
   <li>Deploy through a controlled, identifiable process.</li>
   <li>Give operators a runbook focused on prerequisites, controls, outputs and failure behaviour.</li>
   <li>Measure runtime by stage and compare like with like.</li>
   <li>Optimise the measured bottleneck without weakening migration meaning or controls.</li>
   <li>Test repeatability using the same controlled baseline and compare more than row counts.</li>
   <li>Treat access and credentials as operational prerequisites.</li>
   <li>Use evidence to state readiness and residual risk.</li>
   <li>Make the process supportable by someone other than its original developer.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>A migration process becomes production-ready when it stops being a developer's working solution and becomes a controlled project process that can be configured, deployed, operated, measured, repeated, recovered and explained from evidence.</div>`
},
{
 id:"b17",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
 html:`<div class="complete"><div class="tick">\u2713</div>
