const blocks=[
{

 </tbody></table></div>
 <p>A colleague says: \u201cGreat. We can send the customer file to the ETL team.\u201d</p>
 <h3>What is missing from that conclusion?</h3>`,

   {label:"Nothing. Quality improved, so the data is migration-ready.", correct:false, feedback:"Improvement is not the same as readiness. Every one of those \u201clater\u201d figures is still a real, unresolved population."},
   {label:"A final Excel cleanup to remove the remaining bad rows.", correct:false, feedback:"Removing rows manually hides exactly the population that needs to stay visible as a controlled exception, not disappear."},
   {label:"A controlled release view that proves population, applies only approved treatments, identifies every unresolved/excluded record, validates target-facing constraints and reconciles the output to the input.", correct:true, feedback:"Correct. Migration-ready does not mean perfect source data. It means the population has been processed through approved rules and every record is accounted for in a controlled outcome."},
   {label:"A sign-off saying the source data is 100% correct.", correct:false, feedback:"Nobody could honestly sign that off given the figures above, and it isn't what readiness actually requires."}
 ]
},
{
 id:"b2",nav:"Ready at record level",title:"Define \u2018migration-ready\u2019 at record level",type:"content",
 html:`<p class="lead">Avoid a vague dataset-level label such as Ready/Not Ready until you can explain what happened to each record.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Record status</th><th>Meaning</th></tr></thead><tbody>
 <tr><td>READY</td><td>Passes the agreed release rules and can proceed to migration build/load preparation</td></tr>
 <tr><td>EXCEPTION</td><td>In scope, but one or more unresolved conditions prevent release</td></tr>
 <tr><td>APPROVED_EXCLUSION</td><td>Explicitly outside the released population under an approved scope/exclusion decision</td></tr>
 <tr><td>BLOCKED</td><td>Cannot be assessed/released because a prerequisite or control has failed</td></tr>
 <tr><td>PENDING_DECISION</td><td>Optional separate status where the project wants to distinguish unresolved business decisions from other exceptions</td></tr>
 </tbody></table></div>
 <p>Projects may use different labels. The important design is that statuses are mutually understandable, traceable and reconcilable.</p>
 <div class="principle"><strong>A useful equation</strong><br>Input population = Ready + Exception + Approved exclusion + other explicitly controlled status populations at the agreed record grain.</div>`
},
{
 id:"b3",nav:"The release gate",title:"Build the release gate from rules, not optimism",type:"content",
 html:`<p class="lead">You receive a release-rule sheet. Some checks block a record, some flag a warning, and some are dataset-level controls.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Control</th><th>Level</th><th>Example outcome</th></tr></thead><tbody>
 <tr><td>Business key present/unique</td><td>Record / population</td><td>Block duplicate or missing key according to approved design</td></tr>
 <tr><td>Mandatory target field resolved</td><td>Record</td><td>Exception if unresolved</td></tr>
 <tr><td>Approved reference coverage</td><td>Record</td><td>Exception for no match; control failure for ambiguity</td></tr>
 <tr><td>Target length/type constraint</td><td>Record</td><td>Exception unless approved treatment exists</td></tr>
 <tr><td>Relationship prerequisite</td><td>Record / entity</td><td>Exception or blocked depending on dependency</td></tr>
 <tr><td>Population reconciliation</td><td>Dataset</td><td>Release blocked if unexplained gap/duplication</td></tr>
 <tr><td>Reference integrity</td><td>Dataset</td><td>Release blocked if approved reference is ambiguous</td></tr>
 <tr><td>Build/reference version recorded</td><td>Dataset</td><td>Release blocked if baseline cannot be identified</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Severity belongs in the rule design</div><p>Do not decide during execution that a failed check is \u2018only a warning\u2019 because the deadline is close.</p></div>`
},
{
 id:"b4",nav:"One controlled release view",title:"Create one controlled release view",type:"content",
 html:`<p class="lead">A useful pattern is to preserve source and cleansed values, calculate rule outcomes, and derive a release status without deleting the evidence.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: derive release status from evidence</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  c.RunId, c.CustNo,
  c.Name_Source, c.Name_Cleansed,
  c.Terms_Source, c.PaymentTerms_Target,
  c.Country_Source, c.Country_Target,
  c.CustomerGroup_Source, c.CustomerGroup_Target,
  CASE
    WHEN c.BusinessKeyIssue = 1 THEN 'EXCEPTION'
    WHEN c.ReferenceAmbiguity = 1 THEN 'BLOCKED'
    WHEN c.UnresolvedIssueCount > 0 THEN 'EXCEPTION'
    WHEN c.ApprovedExclusion = 1 THEN 'APPROVED_EXCLUSION'
    ELSE 'READY'
  END AS ReleaseStatus
FROM stage.CustomerAssessed c
WHERE c.RunId = @RunId;</code></pre></div>
 <p>The exact fields and precedence are project-specific. The key idea is that the release status is reproducible from controlled evidence.</p>
 <div class="callout misconception"><div class="callout-label">Do not filter first and explain later</div><p>If you create the \u2018clean file\u2019 by selecting only rows that happen to look valid, you still need an accounted population showing what was left out and why.</p></div>`
},
{
 id:"b5",nav:"Exception grain again",title:"Exception grain matters again",type:"content",
 html:`<p class="lead">One customer can have several unresolved issues. Therefore:</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Measure</th><th>Example interpretation</th></tr></thead><tbody>
 <tr><td>Exception events</td><td>How many rule failures were recorded</td></tr>
 <tr><td>Exception records</td><td>How many distinct customers are affected</td></tr>
 <tr><td>Ready records</td><td>How many customers can proceed</td></tr>
 <tr><td>Approved exclusions</td><td>How many customers were intentionally removed from release</td></tr>
 <tr><td>Blocked records</td><td>How many cannot be assessed because a prerequisite/control failed</td></tr>
 </tbody></table></div>
 <p>Never reconcile input records to exception-event rows.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: release status counts</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT ReleaseStatus, COUNT(*) AS CustomerRecords
FROM stage.CustomerRelease
WHERE RunId = @RunId
GROUP BY ReleaseStatus;</code></pre></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: events vs distinct customers</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  COUNT(*) AS ExceptionEvents,
  COUNT(DISTINCT CustNo) AS ExceptionCustomers
FROM err.CustomerException
WHERE RunId = @RunId;</code></pre></div>`
},
{
 id:"b6",nav:"The readiness board",title:"The Bramwell readiness board",type:"content",
 html:`<p class="lead">Use established Bramwell facts without pretending that unresolved populations are already solved.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Finding</th><th>Release implication</th></tr></thead><tbody>
 <tr><td>214 active customers remain without valid payment terms</td><td>Affected records cannot receive an invented target term; unresolved treatment remains visible</td></tr>
 <tr><td>23 of those payment-term exceptions are new</td><td>Separate regression/new issues from carried backlog</td></tr>
 <tr><td>91 blank tax classifications remain</td><td>Apply the approved target/readiness rule; do not infer treatment here</td></tr>
 <tr><td>7 key accounts still missing delivery addresses at that point in the case</td><td>Relationship readiness remains an issue until corrected/retested</td></tr>
 <tr><td>18 unrecognised CustomerGroup records remain</td><td>Known unresolved group population; do not invent mapping</td></tr>
 <tr><td>27 customer names exceed target 60 characters</td><td>Constraint remains unresolved unless approved treatment exists</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Important</div><p>These issue populations can overlap. Do not add them together and call the total \u2018bad customers.\u2019 Build distinct record-level status from the actual evidence.</p></div>`
},
{
 id:"b7",nav:"Wrong population",title:"Release gate incident \u2014 100% valid columns, wrong population",type:"content",
 html:`<p class="lead">A release file passes every field-level rule. Row count also looks plausible. You compare the business keys to the controlled input and find that 42 customers are absent while 42 different customers appear twice. The total count is unchanged.</p>
 <div class="callout misconception"><div class="callout-label">Decision</div><p>Block release. Field validity and total row count cannot compensate for population identity failure.</p></div>
 <h3>Key-level reconciliation</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: input keys missing from release</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT CustNo
FROM stage.CustomerInput
WHERE RunId = @RunId
EXCEPT
SELECT CustNo
FROM stage.CustomerRelease
WHERE RunId = @RunId;</code></pre></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: unexpected release keys</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT CustNo
FROM stage.CustomerRelease
WHERE RunId = @RunId
EXCEPT
SELECT CustNo
FROM stage.CustomerInput
WHERE RunId = @RunId;</code></pre></div>
 <h3>Duplicate control</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: duplicate release keys</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT CustNo, COUNT(*) AS Rows
FROM stage.CustomerRelease
WHERE RunId = @RunId
GROUP BY CustNo
HAVING COUNT(*) > 1;</code></pre></div>
 <div class="principle"><strong>Reconciliation principle</strong><br>Counts tell you how much. Keys tell you who. Migration release needs both.</div>`
},
{
 id:"b8",nav:"Target-facing validation",title:"Target-facing validation before handover",type:"content",
 html:`<p class="lead">The analysis layer should validate what it can against known target requirements before handing data to the build/load process.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Check</th><th>Question</th></tr></thead><tbody>
 <tr><td>Mandatory fields</td><td>Will the target require a value?</td></tr>
 <tr><td>Lengths</td><td>Will values fit without unapproved truncation?</td></tr>
 <tr><td>Types/formats</td><td>Can the target-facing representation be produced safely?</td></tr>
 <tr><td>Reference values</td><td>Does the target value exist and is it approved?</td></tr>
 <tr><td>Key uniqueness</td><td>Does output satisfy target/business grain?</td></tr>
 <tr><td>Relationships</td><td>Are required parents/children represented?</td></tr>
 <tr><td>Legal-entity context</td><td>Will the record enter the correct target context?</td></tr>
 <tr><td>Derived values</td><td>Can the output be traced to an approved rule?</td></tr>
 </tbody></table></div>
 <p>This does not replace target-system load validation. It prevents avoidable failures from being discovered only after the file reaches the load tool.</p>`
},
{
 id:"b9",nav:"Field-level lineage",title:"Create a field-level lineage view",type:"content",
 html:`<p class="lead">A migration-ready output should be explainable. For important fields, you should be able to answer: where did this value come from?</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Target field</th><th>Source/evidence</th><th>Treatment</th><th>Traceability</th></tr></thead><tbody>
 <tr><td>CustomerNumber</td><td>CustNo</td><td>Direct</td><td>Mapping ID</td></tr>
 <tr><td>CustomerName</td><td>Name</td><td>Direct or approved treatment</td><td>Mapping/rule ID</td></tr>
 <tr><td>CountryCode</td><td>Country</td><td>Approved cross-reference</td><td>CUS-006 + reference version</td></tr>
 <tr><td>PaymentTerms</td><td>Terms</td><td>Approved cross-reference</td><td>Mapping ID + reference version</td></tr>
 <tr><td>CustomerStatus</td><td>Status</td><td>Approved conditional rule</td><td>Mapping/rule ID</td></tr>
 <tr><td>CustomerGroup</td><td>Source attributes</td><td>Approved reference/derivation</td><td>Rule/reference version</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Lineage does not require a giant data catalogue</strong><br>For migration, practical lineage means another consultant can trace an important target value back to source evidence, the rule/reference that changed it, and the run that produced it.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Field-Lineage-Template.xlsx</strong><p class="small">The six-field lineage shape above, ready to extend for any release.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Field-Lineage-Template.xlsx" download>Download</a></div>`
},
{
 id:"b10",nav:"Ready and exception outputs",title:"Produce separate ready and exception outputs",type:"content",
 html:`<p class="lead">Do not make business reviewers search the load-ready file to discover what is missing.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: ready population</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT *
FROM stage.CustomerRelease
WHERE RunId = @RunId
  AND ReleaseStatus = 'READY';</code></pre></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: exception population</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  r.CustNo, e.ExceptionCode, e.SourceField, e.SourceValue, e.MappingId
FROM stage.CustomerRelease r
JOIN err.CustomerException e
  ON e.RunId = r.RunId
  AND e.CustNo = r.CustNo
WHERE r.RunId = @RunId
  AND r.ReleaseStatus = 'EXCEPTION';</code></pre></div>
 <p>The exception output is a work queue and an audit trail. It should contain enough context for the next action without becoming a copy of every source column.</p>`
},
{
 id:"b11",nav:"Release control totals",title:"Release control totals",type:"content",
 html:`<p class="lead">A compact release-control record might contain:</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Control</th><th>Value</th></tr></thead><tbody>
 <tr><td>RunId</td><td>controlled execution ID</td></tr>
 <tr><td>Input records</td><td>count</td></tr>
 <tr><td>Ready records</td><td>count</td></tr>
 <tr><td>Exception records</td><td>distinct record count</td></tr>
 <tr><td>Approved exclusions</td><td>count</td></tr>
 <tr><td>Blocked records</td><td>count</td></tr>
 <tr><td>Unaccounted records</td><td>must be zero</td></tr>
 <tr><td>Duplicate release keys</td><td>must meet approved expectation, usually zero at customer grain</td></tr>
 <tr><td>Reference version</td><td>controlled baseline</td></tr>
 <tr><td>Rule/build version</td><td>controlled baseline</td></tr>
 <tr><td>Release status</td><td>Ready / Not ready / Ready with controlled exceptions according to project design</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">The reconciliation equation</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>Unaccounted =
    InputRecords
  - ReadyRecords
  - ExceptionRecords
  - ApprovedExclusions
  - BlockedRecords</code></pre></div>
 <div class="callout misconception"><div class="callout-label">This arithmetic has a precondition</div><p>It is only valid if the status populations are mutually exclusive at the same record grain. If records can hold multiple statuses, redesign the reconciliation view before using the equation.</p></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Release-Control-Sheet-Template.xlsx</strong><p class="small">The eleven-control structure above, ready to fill in for any release.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Release-Control-Sheet-Template.xlsx" download>Download</a></div>`
},
{
 id:"b12",nav:"Ready with exceptions",title:"What does \u2018ready with exceptions\u2019 mean?",type:"content",
 html:`<div class="callout misconception"><div class="callout-label">Relationship readiness can qualify a technically valid release</div><p>Bramwell has 286 product-site relationships that reference warehouse/location combinations outside the approved target reference set. A product record can pass its own field checks and still be operationally unusable through an unresolved relationship. Migration-ready therefore includes the dependencies required for the target process, not only the validity of the row being handed over.</p></div>
 <p class="lead">Projects sometimes allow an entity to proceed while a controlled subset remains outside the load. That can be legitimate, but the phrase must not become a loophole.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Required evidence</th><th>Why</th></tr></thead><tbody>
 <tr><td>Exact excluded/exception population</td><td>Know what will not migrate in this release</td></tr>
 <tr><td>Reason per record</td><td>No silent loss</td></tr>
 <tr><td>Business/project acceptance where required</td><td>Risk is consciously accepted</td></tr>
 <tr><td>Dependency impact assessed</td><td>Excluded parent may break children/transactions</td></tr>
 <tr><td>Reconciliation adjusted explicitly</td><td>Counts still account</td></tr>
 <tr><td>Recovery/future treatment defined</td><td>Exception does not vanish after the cycle</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>DMC boundary</strong><br>The consultant provides the evidence and implements the controlled release behaviour. Wider acceptance of material business exceptions belongs to the authorised project decision-makers.</div>`
},
{
 id:"b13",nav:"Handover is part of the output",title:"Handover is part of the output",type:"content",
 html:`<p class="lead">A migration-ready file without context is not a migration-ready handover.</p>
 <h3>The five-minute handover</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Handover item</th><th>What the receiver needs</th></tr></thead><tbody>
 <tr><td>What is this?</td><td>Entity, cycle, scope and grain</td></tr>
 <tr><td>Which population?</td><td>Input, ready, exception, exclusion counts</td></tr>
 <tr><td>Which baseline?</td><td>Input identity, build/rule/reference versions</td></tr>
 <tr><td>What remains unresolved?</td><td>Exception populations and decisions outstanding</td></tr>
 <tr><td>What should happen next?</td><td>Load/build action, validation expectation, escalation if controls fail</td></tr>
 <tr><td>Where is the evidence?</td><td>Control totals, exception output, lineage/rule pack</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Weak handover</div><p>\u201cCustomer_Final_v7.xlsx is ready. Please load.\u201d</p></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Stronger handover</div><p>\u201cCustomer Cycle 2 release was produced from the controlled Cycle 2 input under the recorded rule/reference baseline. The attached control sheet reconciles the input to Ready, Exception and Approved Exclusion populations at customer-key grain. Unresolved records are in the exception file with rule IDs; no unresolved value has been defaulted. Load only the Ready output and return target rejects against RunId and CustomerNumber.\u201d</p></div></div>`
},
{
 id:"b14",nav:"The release simulation",title:"The release simulation",type:"guidedSteps",
 html:`<p class="lead">Five evidence panels from a synthetic customer release, revealed one at a time. You'll decide whether the release can proceed \u2014 and you're free to revise that judgement as each new panel arrives.</p>`,
 steps: releaseSimulationSteps,
 firstLabel:"Reveal Panel A",
 closingHtml:`<div class="callout misconception"><div class="callout-label">Final decision</div><p>Not ready. Several individually reassuring metrics cannot overcome ambiguous reference integrity, duplicate-key evidence and an unprovable reference baseline.</p></div>
 <div class="principle"><strong>Why this matters</strong><br>Panel C's clean reconciliation and Panel A's strong completeness both looked like good news in isolation. Neither one, on its own, told you about the ambiguous reference mapping, the duplicate key or the unprovable baseline \u2014 and any one of those three is enough to block release by itself.</div>`
},
{
 id:"b15",nav:"Repair the release",title:"Repair the release, not the symptoms",type:"content",
 html:`<p class="lead">For the simulation above, a strong recovery plan is:</p>
 <ol class="framework-checks">
   <li>Stop distribution of the current output.</li>
   <li>Resolve the duplicate approved reference mapping and create a controlled reference version.</li>
   <li>Investigate the duplicate ready business key and determine whether the release grain or transformation is wrong.</li>
   <li>Identify the last valid upstream state produced under a known rule/reference baseline.</li>
   <li>Rerun the affected assessment/transformation from the correct boundary.</li>
   <li>Regenerate ready and exception outputs.</li>
   <li>Repeat population, key, reference-integrity and target-facing controls.</li>
   <li>Record the exact build/reference/input identities in the release record.</li>
   <li>Issue a new handover and mark the earlier output superseded.</li>
 </ol>
 <div class="principle"><strong>Notice what this plan does not do</strong><br>It doesn't delete the duplicate row and republish. It doesn't quietly pick one of the two approved mappings. It goes back to the actual cause \u2014 the reference ambiguity \u2014 and reruns from there.</div>`
},
{
 id:"b16",nav:"Independent lab",title:"Independent lab \u2014 Build a Migration-Ready Data Pack",type:"reflection",
 html:`<p class="lead">You receive a synthetic supplier dataset that has already been profiled and partially cleansed. The source pack includes approved rules, unresolved decisions, a cross-reference set and a deliberately incomplete release workbook. This is training data and does not create Bramwell supplier canon.</p>
 <h3>Required work</h3>
 <ol class="framework-checks">
   <li>Define the supplier release grain and record statuses.</li>
   <li>Translate the supplied readiness rules into record-level tests.</li>
   <li>Build a release view preserving source, cleansed and target-facing values where relevant.</li>
   <li>Route each record to Ready, Exception, Approved Exclusion or Blocked.</li>
   <li>Produce an exception-event output and a distinct exception-record summary.</li>
   <li>Validate reference coverage and reference uniqueness.</li>
   <li>Validate at least two target-facing constraints.</li>
   <li>Reconcile the input population to mutually exclusive release statuses.</li>
   <li>Test ready-output key uniqueness.</li>
   <li>Create a field-lineage sheet for the six most important target fields.</li>
   <li>Produce a Release Control Sheet with input/build/reference identities.</li>
   <li>Write a concise handover to the migration-build consultant.</li>
 </ol>
 <h3>Required artefacts</h3>
 <ul class="framework-checks">
   <li><strong>Migration_Ready_Output</strong> \u2014 only records that pass the controlled release gate.</li>
   <li><strong>Exception_Output</strong> \u2014 unresolved record/rule evidence.</li>
   <li><strong>Release_Status_Register</strong> \u2014 one record-level status per source business key.</li>
   <li><strong>Release_Control_Sheet</strong> \u2014 population and baseline reconciliation.</li>
   <li><strong>Field_Lineage</strong> \u2014 important target fields to source/rule/reference.</li>
   <li><strong>Release_Test_Evidence</strong> \u2014 key, reference, constraint and reconciliation checks.</li>
   <li><strong>Handover_Note</strong> \u2014 what to load, what not to load, what remains unresolved.</li>
 </ul>
 <p class="lead">Write your handover note to the migration-build consultant below.</p>

{
 id:"b17",nav:"The model decision",title:"Model release decision",type:"content",
 html:`<div class="callout misconception"><div class="callout-label">Poor</div><p>\u201cThe data quality score is 98.7%, so the supplier file is ready.\u201d</p></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Strong</div><p>\u201cThe supplier release is ready for migration build for the controlled Ready population. All input business keys are accounted for across mutually exclusive release statuses, the Ready output is unique at supplier grain, all released reference values have exactly one approved match, and target-facing mandatory/length checks pass. The exception population remains outside the release and is supplied separately with rule IDs and owners. The Release Control Sheet records the input, rule and reference baselines used.\u201d</p></div></div>
 <p class="small">The difference isn't length or formality. It's that the strong version is a claim backed by specific, checkable evidence \u2014 the poor version is a single number standing in for all of it.</p>`
},

 <div class="quote">Five things that would make me refuse: no reconciliation showing every input key has an accounted-for outcome; no proof the ready output is unique at the intended business-key grain; no separate exception file with rule IDs, only a vague "some records were removed"; no record of which rule/reference version produced the output; and no way to trace an important field, like CountryCode, back to its source value and the rule that changed it. Any one of these missing is a reason to pause, not just proceed cautiously.</div>`,

{
 id:"b20",nav:"Summary",title:"Summary \u2014 Make readiness provable",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Define migration readiness at record level before applying a dataset-level label.</li>
   <li>Use explicit, mutually understandable release statuses.</li>
   <li>Build release gates from approved rules and prerequisites.</li>
   <li>Preserve source, cleansed and target-facing evidence.</li>
   <li>Keep exception-event counts separate from distinct affected-record counts.</li>
   <li>Do not add overlapping issue populations and call the total bad records.</li>
   <li>Reconcile counts and business keys.</li>
   <li>Validate known target-facing constraints before handover.</li>
   <li>Trace important target values to source, rule and reference evidence.</li>
   <li>Produce separate ready and exception outputs.</li>
   <li>Record input, rule/build and reference baselines.</li>
   <li>Treat \u2018ready with exceptions\u2019 as a controlled decision, not a euphemism for incomplete analysis.</li>
   <li>Include a concise operational handover with every released dataset.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>Analysis becomes migration-ready only when every in-scope record has a controlled outcome and the released population can be reproduced, reconciled and explained from evidence.</div>`
},
