 id:"b3",nav:"The mapping grain",title:"The hidden question \u2014 What is the mapping grain?",type:"content",
 html:`<p class="lead">Suppose source code STD appears in two legal entities. In one it means Standard Customer. In another it is an old internal category. A table keyed only by SourceCode cannot represent both meanings safely.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Possible grain</th><th>When it may be sufficient</th></tr></thead><tbody>
 <tr><td>SourceCode</td><td>Meaning is globally unique across the migration scope</td></tr>
 <tr><td>SourceSystem + SourceCode</td><td>Same code differs between source systems</td></tr>
 <tr><td>LegalEntity + SourceCode</td><td>Meaning differs by company/legal entity</td></tr>
 <tr><td>SourceCode + EffectiveDate</td><td>Meaning changes over time</td></tr>
 <tr><td>SourceType + Country + SourceCode</td><td>Business context determines meaning</td></tr>
 <tr><td>Composite business attributes</td><td>Derived mapping requires multiple inputs</td></tr>
 </tbody></table></div>
 <p>The mapping grain is the smallest set of attributes required to identify exactly one approved target outcome.</p>
 <div class="principle"><strong>Design test</strong><br>If two legitimate source records can share your lookup key but require different target values, your lookup grain is incomplete.</div>
 <h3>Detect ambiguity before the data flow does</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: ambiguity at the intended grain</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  LegalEntity, SourceCode, COUNT(*) AS ApprovedMappings
FROM ref.CustomerGroupCrossRef
WHERE ApprovalStatus = 'Approved'
GROUP BY LegalEntity, SourceCode
HAVING COUNT(*) > 1;</code></pre></div>
 <p>A zero-row result is one piece of evidence that the approved reference is unique at the intended grain. It does not prove the business mapping itself is correct.</p>`
},

 id:"b4",nav:"Rebuild the table",title:"Rebuild the reference table",type:"content",

 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: controlled reference structure</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>CREATE TABLE ref.MigrationCrossReference (
  ReferenceSet varchar(100) NOT NULL,
  SourceSystem varchar(50) NULL,
  LegalEntity varchar(30) NULL,
  SourceValue varchar(200) NOT NULL,
  TargetValue varchar(200) NULL,
  ApprovalStatus varchar(30) NOT NULL,
  EffectiveFrom date NULL,
  EffectiveTo date NULL,
  ReferenceVersion varchar(50) NOT NULL,
  DecisionReference varchar(100) NULL,
  Notes varchar(1000) NULL
);</code></pre></div>
 <p>Depending on the project, ownership, approver, timestamps and target descriptions may sit in the same table or in controlled metadata. The design goal is traceability, not maximum column count.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Field</th><th>Why it matters</th></tr></thead><tbody>
 <tr><td>ReferenceSet</td><td>Separates Country, PaymentTerms, CustomerGroup, UOM, etc.</td></tr>
 <tr><td>SourceSystem / LegalEntity</td><td>Adds mapping context where required</td></tr>
 <tr><td>SourceValue</td><td>Preserves the source code/value</td></tr>
 <tr><td>TargetValue</td><td>Approved target outcome, nullable while unresolved</td></tr>
 <tr><td>ApprovalStatus</td><td>Prevents draft guesses being treated as production mappings</td></tr>
 <tr><td>Effective dates</td><td>Supports time-bounded meaning when genuinely needed</td></tr>
 <tr><td>ReferenceVersion</td><td>Ties a migration run to a controlled baseline</td></tr>
 <tr><td>DecisionReference</td><td>Links the row to evidence/approval</td></tr>
 </tbody></table></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_MigrationCrossReference.sql</strong><p class="small">The controlled reference table definition above, ready to adapt.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_MigrationCrossReference.sql" download>Download</a></div>`

 id:"b5",nav:"Approval status & outcomes",title:"Approval status is part of the lookup logic",type:"content",
 html:`<p class="lead">A dangerous implementation joins to whatever happens to be in the table.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Weak</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountry = c.Country</code></pre></div>
 <p>A stronger implementation explicitly selects the controlled baseline.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">Stronger</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>LEFT JOIN ref.CountryCrossRef x
  ON x.SourceCountry = c.Country
  AND x.ApprovalStatus = 'Approved'
  AND x.ReferenceVersion = @ReferenceVersion</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Why this matters</div><p>A draft row, superseded row or analyst suggestion must not silently become production migration logic simply because it exists in the same spreadsheet/table.</p></div>
 <h3>The three lookup outcomes</h3>
 <p>Every controlled lookup should be designed to distinguish three outcomes.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Outcome</th><th>Meaning</th><th>Migration behaviour</th></tr></thead><tbody>
 <tr><td>0 approved matches</td><td>Unresolved / missing reference</td><td>Route to exception or stop according to rule criticality</td></tr>
 <tr><td>1 approved match</td><td>Deterministic approved result</td><td>Continue</td></tr>
 <tr><td>&gt;1 approved matches</td><td>Ambiguous reference</td><td>Treat as control failure; do not choose arbitrarily</td></tr>
 </tbody></table></div>
 <h3>SQL pattern that exposes all three</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: distinguish 0, 1 and >1 matches</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>WITH MatchCounts AS (
  SELECT
    c.CustNo, c.Country,
    COUNT(x.TargetCountry) AS ApprovedMatches,
    MAX(x.TargetCountry) AS CandidateTarget
  FROM stage.Customer c
  LEFT JOIN ref.CountryCrossRef x
    ON x.SourceCountry = c.Country
    AND x.ApprovalStatus = 'Approved'
    AND x.ReferenceVersion = @ReferenceVersion
  WHERE c.RunId = @RunId
  GROUP BY c.CustNo, c.Country
)
SELECT
  CustNo, Country, ApprovedMatches,
  CASE WHEN ApprovedMatches = 1 THEN CandidateTarget ELSE NULL END AS TargetCountry,
  CASE
    WHEN ApprovedMatches = 0 THEN 'COUNTRY_UNRESOLVED'
    WHEN ApprovedMatches > 1 THEN 'COUNTRY_AMBIGUOUS'
    ELSE 'APPROVED'
  END AS LookupOutcome
FROM MatchCounts;</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Do not let MAX hide ambiguity</div><p><code>MAX(TargetValue)</code> is only used above after counting matches. Using MIN/MAX alone to force one result from multiple mappings is a silent data defect.</p></div>`

 html:`<p class="lead">Consultants are often taught to prefer LEFT JOIN because it preserves unmatched source rows. That is useful, but not sufficient.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Failure</th><th>LEFT JOIN protects you?</th></tr></thead><tbody>
 <tr><td>No reference match</td><td><span class="tp-tag tp-tag--good">Yes, source row remains visible</span></td></tr>
 <tr><td>Two approved reference matches</td><td><span class="tp-tag tp-tag--bad">No, source row can duplicate</span></td></tr>
 <tr><td>Wrong but approved mapping</td><td><span class="tp-tag tp-tag--bad">No</span></td></tr>
 <tr><td>Stale reference version</td><td><span class="tp-tag tp-tag--bad">No</span></td></tr>
 <tr><td>Missing legal-entity context</td><td><span class="tp-tag tp-tag--bad">No</span></td></tr>
 <tr><td>Source value contains whitespace/case variation</td><td><span class="tp-tag tp-tag--warn">Only if normalisation strategy is designed</span></td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Lookup quality has two sides</strong><br>Profile the source coverage and profile the reference integrity.</div>`

 id:"b8",nav:"Normalised keys",title:"Normalised keys \u2014 Helpful, but preserve the source",type:"content",
 html:`<p class="lead">Reference matching often needs a controlled comparison key.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: source preserved, match key added</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  Country AS Country_Source,
  UPPER(LTRIM(RTRIM(Country))) AS Country_MatchKey
FROM raw.Customer;</code></pre></div>
 <p>The match key may improve technical consistency, but the source value remains evidence. Do not use aggressive normalisation that can collapse genuinely different codes without proving equivalence.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Normalisation</th><th>Usually low semantic risk?</th><th>Caution</th></tr></thead><tbody>
 <tr><td>Trim outer whitespace</td><td>Often</td><td>Whitespace can occasionally be meaningful</td></tr>
 <tr><td>Upper/lower case</td><td>Often for codes</td><td>Not safe for every identifier/system</td></tr>
 <tr><td>Remove punctuation</td><td>Depends</td><td>Can collapse distinct values</td></tr>
 <tr><td>Remove leading zeros</td><td>High risk</td><td>May change identifier meaning</td></tr>
 <tr><td>Convert text to number</td><td>High risk</td><td>Can lose formatting/key semantics</td></tr>
 <tr><td>Translate synonyms</td><td>Business mapping</td><td>Requires approval</td></tr>
 </tbody></table></div>`
},
{
 id:"b9",nav:"Effective dates",title:"Effective dates \u2014 Use only when the business meaning needs them",type:"content",
 html:`<p class="lead">Not every reference table needs effective dating. Adding dates to everything creates complexity without control value.</p>
 <p>Use effective dates when a source value legitimately maps differently at different points in time, or when the migration needs to reproduce a historical business rule.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: effective-date filter</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>... AND @AsOfDate >= x.EffectiveFrom
    AND (@AsOfDate < x.EffectiveTo OR x.EffectiveTo IS NULL)</code></pre></div>
 <div class="principle"><strong>Overlap test</strong><br>If two approved rows are effective for the same source key and date, the reference is ambiguous. Test for overlaps before migration execution.</div>`
},
{
 id:"b10",nav:"Version the baseline",title:"Version the reference baseline",type:"content",
 html:`<p class="lead">During a migration cycle, reference data changes. A new country code is approved. Finance resolves a payment-term mapping. A target user is created. The migration process needs to answer: which version did this run use?</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Pattern</th><th>Control</th></tr></thead><tbody>
 <tr><td>Snapshot/version table</td><td>Run uses a named immutable reference version</td></tr>
 <tr><td>Effective-status release</td><td>Only rows in approved release are visible to migration</td></tr>
 <tr><td>Reference extract file</td><td>File identity/hash/version recorded with run</td></tr>
 <tr><td>Database view over controlled rows</td><td>View filters approved release; release ID logged</td></tr>
 </tbody></table></div>
 <p>The exact mechanism varies. The principle does not: a rerun must not accidentally use a different mapping baseline without the change being visible.</p>
 <div class="principle"><strong>Connection to DMC1</strong><br>BuildVersion + ReferenceVersion + InputIdentity together explain much of why two technically similar runs can produce different results.</div>`
},
{
 id:"b11",nav:"Change during a cycle",title:"Reference change during a cycle",type:"content",
 html:`<p class="lead">A source value that was unresolved yesterday is approved today. What happens next?</p>
 <ol class="framework-checks">
   <li>Record the decision and update the controlled reference baseline.</li>
   <li>Create or promote a new reference version according to project control.</li>
   <li>Identify the affected source population.</li>
   <li>Determine which transformed outputs/checkpoints were produced under the old baseline.</li>
   <li>Rerun from the appropriate transformation boundary.</li>
   <li>Retest the affected mapping and regression controls.</li>
   <li>Reconcile the new output and confirm the old exception population moved as expected.</li>
   <li>Record which run used which reference version.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Do not patch the target rows</div><p>If the migration result should change because a reference decision changed, rerun the controlled logic from a valid boundary rather than manually editing the output.</p></div>`
},
{
 id:"b12",nav:"Coverage dashboard",title:"Cross-reference coverage dashboard",type:"content",
 html:`<p class="lead">For each important reference set, report coverage at the correct grain.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Reference set</th><th>Source distinct values</th><th>Approved matched</th><th>Unresolved</th><th>Ambiguous</th><th>Affected records</th></tr></thead><tbody>
 <tr><td>Country</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td></tr>
 <tr><td>PaymentTerms</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td></tr>
 <tr><td>CustomerGroup</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td></tr>
 <tr><td>SalesOwner</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td><td>profile result</td></tr>
 </tbody></table></div>
 <p>Do not confuse distinct source values with affected records. One unresolved code can affect thousands of customers; fifty unresolved codes may affect only fifty.</p>
 <div class="principle"><strong>Prioritisation</strong><br>Coverage work should consider both the number of unresolved codes and the business population affected by them.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_CrossReference-Coverage.xlsx</strong><p class="small">The coverage dashboard shape above, ready to fill in with real profile results.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_CrossReference-Coverage.xlsx" download>Download</a></div>`
},
{
 id:"b13",nav:"The Bramwell queue",title:"Bramwell reference queue \u2014 What can you actually resolve?",type:"selectAll",
 html:`<div class="callout misconception"><div class="callout-label">A mismatch that is not yours to turn into a lookup</div><p>Supplier S20418, Nordvik Components AS, is STRATEGIC in the legacy ERP and STANDARD in SupplierClass.accdb. That is evidence of conflicting business classification, not permission to create a technical cross-reference. Procurement owns supplier-classification meaning. Finance owns finance/payment meaning. The migration team should expose the conflict and implement the approved treatment, not decide which source wins.</p></div>
 <p class="lead">Explore each item in the queue below. This exercise deliberately contains fewer "answers" than rows \u2014 a strong consultant leaves unresolved items unresolved when the evidence does not support a mapping.</p>`,
 options: bramwellQueueItems.map(i => i.title),
 coaching: bramwellQueueItems.map(i => `<strong>${i.short}</strong><br>${i.detail}`),
 hint:"Explore every item before continuing.",
 closingHtml:`<div class="principle"><strong>The point of this exercise</strong><br>Four items are genuinely approved. Six are not \u2014 and leaving those six visibly unresolved is the correct, credit-worthy answer, not a sign of an incomplete reference.</div>`
},
{
 id:"b14",nav:"Identity is different",title:"Identity cross-references are different",type:"content",
 html:`<p class="lead">Some references translate codes. Others connect identities: source customer to target customer, legacy sales rep to target user, source supplier to target supplier. Identity matching can require stronger evidence than code mapping.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Identity method</th><th>Risk</th></tr></thead><tbody>
 <tr><td>Stable shared identifier</td><td>Strong when genuinely shared and unique</td></tr>
 <tr><td>Approved legacy-to-target ID table</td><td>Strong if generated/controlled during migration</td></tr>
 <tr><td>Name-only match</td><td>High risk; names change and duplicate</td></tr>
 <tr><td>Email match</td><td>Useful in some domains, but not always unique/stable</td></tr>
 <tr><td>Composite attributes</td><td>Can be strong if designed and tested</td></tr>
 <tr><td>Fuzzy match</td><td>Investigation aid, not automatic approval without governance</td></tr>
 </tbody></table></div>
 <div class="callout misconception"><div class="callout-label">Do not turn fuzzy similarity into identity truth</div><p>A 96% name similarity can suggest a candidate. It does not prove that two records represent the same business entity.</p></div>`
},
{
 id:"b15",nav:"SME workbook design",title:"Cross-reference workbook design for SMEs",type:"content",
 html:`<p class="lead">Business users may prefer Excel for reviewing unresolved mappings. That is fine if the workbook is treated as a controlled decision interface rather than the production truth.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Column</th><th>Purpose</th></tr></thead><tbody>
 <tr><td>ReferenceSet</td><td>Country / Terms / Group / etc.</td></tr>
 <tr><td>Context</td><td>Legal entity/source system where needed</td></tr>
 <tr><td>SourceValue</td><td>Exact observed source value</td></tr>
 <tr><td>SourceDescription</td><td>Human-readable source meaning if available</td></tr>
 <tr><td>AffectedRecords</td><td>Impact</td></tr>
 <tr><td>SuggestedTarget</td><td>Optional consultant suggestion, clearly not approval</td></tr>
 <tr><td>TargetDescription</td><td>Helps business judge meaning</td></tr>
 <tr><td>Decision</td><td>Approved / Reject / Remain unresolved</td></tr>
 <tr><td>ApprovedTarget</td><td>Only populated for approved mapping</td></tr>
 <tr><td>DecisionOwner</td><td>Authority</td></tr>
 <tr><td>DecisionDate</td><td>Traceability</td></tr>
 <tr><td>DecisionReference</td><td>Meeting/ticket/sign-off evidence</td></tr>
 <tr><td>Comments</td><td>Reason/context</td></tr>
 </tbody></table></div>
 <p>After approval, ingest the decisions into the controlled reference store and validate them. Do not point production ETL directly at an SME workbook sitting in somebody's Downloads folder.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_SME-Reference-Decision-Workbook.xlsx</strong><p class="small">The thirteen-column decision-interface shape above, ready to populate for any unresolved reference set.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_SME-Reference-Decision-Workbook.xlsx" download>Download</a></div>`
},
{
 id:"b16",nav:"The poisoned workbook",title:"The poisoned workbook challenge",type:"selectAll",
 html:`<p class="lead">You're given a synthetic cross-reference workbook containing twelve defects, before it's released. Explore each one below \u2014 all twelve are genuinely present.</p>`,
 options: poisonedWorkbookDefects,
 coaching: poisonedWorkbookCoaching,
 hint:"Explore every defect before continuing.",
 closingHtml:`<div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Poisoned-Workbook-Exercise.xlsx</strong><p class="small">The synthetic twelve-defect workbook itself, for hands-on practice finding each one.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Poisoned-Workbook-Exercise.xlsx" download>Download</a></div>`
},
{
 id:"b17",nav:"The release note",title:"Write the release note",type:"reflection",
 html:`<p class="lead">Having found the twelve defects, produce the required output for releasing a corrected reference version.</p>
 <ol class="framework-checks">
   <li>State the intended mapping grain.</li>
   <li>List every integrity defect found.</li>
   <li>Separate reference-table defects from unresolved source coverage.</li>
   <li>Produce a query/check for duplicate approved mappings.</li>
   <li>Produce a query/check for target-domain validity.</li>
   <li>Produce a query/check for source coverage.</li>
   <li>Identify which defects block release of the reference set.</li>
   <li>Create a corrected reference version without deleting the original evidence.</li>
   <li>Write a release note describing what changed.</li>
   <li>Prove that the corrected lookup does not change source row count at the intended grain.</li>
 </ol>
 <p class="lead">Write your release note below.</p>
 <textarea id="reflection" placeholder="This reference release corrects..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Reference-Release-Note-Template.docx</strong><p class="small">Grain, defects found, defects blocking release and what changed, ready to fill in.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Reference-Release-Note-Template.docx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/grain/i, strength:"You stated the intended mapping grain.", gap:"State explicitly what the intended mapping grain is for this reference set." },
   { test:/block|release/i, strength:"You identified which defects block release.", gap:"State which of the twelve defects actually block release, versus which are lower-severity." },
   { test:/original evidence|without delet|preserve/i, strength:"You addressed preserving the original evidence when creating the corrected version.", gap:"State how the corrected reference version is created without deleting the original, defective one." },
   { test:/row count|grain.*(same|unchanged)|does not change/i, strength:"You addressed proving the corrected lookup doesn't change source row count at the intended grain.", gap:"State how you'd prove the corrected lookup produces the same source row count as before, at the intended grain." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Intended grain: LegalEntity + SourceValue. Defects found span both reference-table integrity (duplicate approved mapping, draft row marked Approved, overlapping effective dates, silently edited Cycle 1 mapping, missing decision evidence, invalid target value, expired row still active) and source coverage (one omitted unmatched code). Of these, the duplicate approved mapping, the mis-marked draft row, the overlapping effective dates and the invalid target value block release outright; the rest are logged for correction but don't block. The corrected version is released as a new ReferenceVersion; the original rows remain in the table, superseded rather than deleted. Row-count proof: rerunning the lookup against the same staged population before and after the correction returns an identical row count at the LegalEntity + SourceValue grain, confirming the fix resolved ambiguity without silently duplicating or dropping any source row.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is a genuine release note: grain stated, defects separated by severity and type, evidence preserved, and the row-count proof that closes the loop.":"You have the right structure. Make sure you're separating which defects actually block release from which are lower-severity, and that you can prove the row count didn't move."}</div>`
},
{
 id:"b18",nav:"Independent lab",title:"Independent lab \u2014 The supplier classification conflict",type:"reflection",
 html:`<p class="lead">Not every reference conflict is yours to resolve into a lookup. Bramwell's supplier population gives you a real one to practise on.</p>
 <div class="callout experience">
 <div class="callout-label">The evidence</div>
 <p>SupplierClass.accdb, maintained by Procurement, contains 73 active suppliers whose classification conflicts with the legacy ERP value. One of them is named: Supplier S20418, Nordvik Components AS, active in Norway, appears in both systems. In the legacy ERP its classification is STRATEGIC. In SupplierClass.accdb it is STANDARD.</p>
 </div>
 <p>6,420 active suppliers are in scope for the migration; 1,184 of them have bank-payment details required for the target operating model. No blanket "winning source" has been established between the legacy ERP and SupplierClass.accdb for classification conflicts generally.</p>
 <h3>Your task</h3>
 <ol class="framework-checks">
   <li>State the mapping grain a SupplierClassification cross-reference would need, given that the same supplier can carry two different classifications from two different systems.</li>
   <li>Write the SQL you'd use to find every supplier where the two sources disagree, not just confirm S20418 is one of them.</li>
   <li>Decide whether S20418's conflict is a lookup problem, a cleansing problem, or something else entirely \u2014 and say why.</li>
   <li>Identify who actually has authority to resolve it, and who does not.</li>
   <li>Write the one-sentence question you'd put to that authority, tied to the specific evidence above.</li>
   <li>State what the migration team should do with all 73 conflicting suppliers in the meantime, including S20418.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">The trap this exercise sets</div><p>It would be technically easy to write <code>COALESCE(ERPClassification, SupplierClassAccdbValue)</code> and call the conflict resolved. Doing so would silently pick one business authority's answer over another's, on a question neither the migration team nor either single source owns outright.</p></div>
 <p class="lead">Write your answer below \u2014 particularly the question you'd put to the right authority.</p>
 <textarea id="reflection" placeholder="The mapping grain this reference needs is..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/grain/i, strength:"You stated the mapping grain this reference would need.", gap:"State what grain a SupplierClassification cross-reference needs, given the same supplier can carry two source classifications." },
   { test:/73|every supplier|all.*conflict/i, strength:"You addressed finding all 73 conflicting suppliers, not just S20418.", gap:"Describe how you'd find every supplier where the two sources disagree, not just confirm the one named example." },
   { test:/procurement|finance|authority|owner/i, strength:"You identified who actually has authority over supplier-classification meaning.", gap:"Name who owns supplier-classification meaning (Procurement) versus who doesn't (the migration team, or Finance)." },
   { test:/coalesce|pick one|choose|arbitrar/i, strength:"You explicitly avoided picking one source's answer over the other's.", gap:"State explicitly that you would not default or pick one source's classification over the other's without approval." },
   { test:/question|ask/i, strength:"You wrote a specific question tied to the evidence.", gap:"Write the actual one-sentence question you'd put to Procurement, referencing S20418 specifically." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The mapping grain would need to be Supplier + SourceSystem, since the same SupplierNo can legitimately carry two different classification values depending on which system is asked. Finding every conflict means joining the legacy ERP classification to SupplierClass.accdb on SupplierNo and returning every row where the values differ, not just checking S20418 individually. This isn't a lookup problem or a cleansing problem \u2014 it's a business classification conflict between two systems, and Procurement owns supplier-classification meaning, not the migration team and not Finance. The question to Procurement: "For supplier S20418, Nordvik Components AS, the legacy ERP shows STRATEGIC and SupplierClass.accdb shows STANDARD \u2014 which is the approved classification, and does the same rule apply to the other 72 conflicting suppliers?" Until that's answered, all 73 stay visible as a controlled exception, not defaulted to either source.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is exactly the discipline the S20418 case demands: a real conflict between two legitimate authorities, routed to the right owner rather than resolved by whoever happened to write the query.":"You have the right instinct. Make sure you've named who actually owns this decision, and that your question is specific enough Procurement could actually answer it."}</div>`
},
{
 id:"b19",nav:"SQL toolkit",title:"SQL controls worth keeping in your toolkit",type:"content",
 html:`<h3>Duplicate approved mappings</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT ReferenceSet, LegalEntity, SourceValue, COUNT(*) AS Cnt
FROM ref.MigrationCrossReference
WHERE ApprovalStatus = 'Approved'
  AND ReferenceVersion = @ReferenceVersion
GROUP BY ReferenceSet, LegalEntity, SourceValue
HAVING COUNT(*) > 1;</code></pre></div>
 <h3>Unresolved source values</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  s.SourceValue, COUNT(*) AS AffectedRecords
FROM stage.SourcePopulation s
LEFT JOIN ref.MigrationCrossReference x
  ON x.ReferenceSet = @ReferenceSet
  AND x.SourceValue = s.SourceValue
  AND x.ApprovalStatus = 'Approved'
  AND x.ReferenceVersion = @ReferenceVersion
WHERE x.SourceValue IS NULL
GROUP BY s.SourceValue
ORDER BY AffectedRecords DESC;</code></pre></div>
 <h3>Target-domain validation</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT x.SourceValue, x.TargetValue
FROM ref.MigrationCrossReference x
LEFT JOIN target_ref.ValidTargetValue t
  ON t.TargetValue = x.TargetValue
WHERE x.ReferenceSet = @ReferenceSet
  AND x.ApprovalStatus = 'Approved'
  AND x.ReferenceVersion = @ReferenceVersion
  AND t.TargetValue IS NULL;</code></pre></div>
 <div class="principle"><strong>Toolkit mindset</strong><br>These are patterns, not sacred schemas. Adapt them to the project, but keep the questions: uniqueness, coverage, target validity, context and version.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Reference-Integrity-Checks.sql</strong><p class="small">The three checks above, ready to adapt to any reference set.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Reference-Integrity-Checks.sql" download>Download</a></div>`
},
{
 id:"b20",nav:"When to stop the run",title:"Consultant judgement \u2014 When should a missing mapping stop the run?",type:"situations",
 html:`<p class="lead">Not every unresolved lookup has the same operational consequence. Six conditions, six different treatments.</p>`,
 items: stopTheRunSituations,
 takeawayHtml:`<div class="to-record">${TPKit.fromField({
   title:"The Lookup That Multiplied Customers", name:"Farah", role:"Data Migration Consultant", project:"Telecoms ERP",
   src:"/assets/audio/LookupThatMultipliedCustomers-Farah.mp3",
   reflection:"What control or habit in this story would you carry into your own migration work?"
 })}</div>
 <div class="callout misconception"><div class="callout-label">Important distinction</div><p>\u2018No match because the source value is unresolved\u2019 and \u2018no match because the reference service failed to load\u2019 are not the same incident.</p></div>`
},
{
 id:"b21",nav:"Reflection",title:"Reflection \u2014 The most dangerous lookup",type:"reflection",
 html:`<p class="lead">Which is more dangerous: a lookup that returns NULL for an unresolved value, or a lookup that always returns something? Explain the conditions under which your answer could change.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers recognise that visible failure is often safer than plausible wrong data, while also considering mandatory relationships, controlled defaults and the quality of the reference itself.</p></div></div>
 <textarea id="reflection" placeholder="I think the more dangerous lookup is..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:50,
 checks:[
   { test:/plausible|wrong data|hide|invisible/i, strength:"You addressed why a lookup that always returns something can be more dangerous than one that returns NULL.", gap:"State why a lookup that always returns a plausible-looking value can hide a problem more effectively than one that visibly fails." },
   { test:/mandatory|critical|relationship/i, strength:"You considered mandatory or critical relationships as a condition that could change your answer.", gap:"Name a condition, like a mandatory relationship, where a NULL result might actually be the more dangerous choice." },
   { test:/default|approved|control/i, strength:"You addressed the role of controlled defaults in your reasoning.", gap:"State how a properly approved, controlled default changes this trade-off compared to an invented one." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">In general, a lookup that always returns something is more dangerous, because plausible-looking wrong data is much harder to catch than a visible failure \u2014 nobody investigates a field that already has a value in it. But that flips for a genuinely mandatory relationship with no approved controlled-default design: there, a NULL that blocks the record might cause more operational disruption than a well-understood, approved default would. The deciding factor isn't NULL versus a value \u2014 it's whether whatever the lookup returns is actually traceable back to an approved decision.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This captures the real nuance: it's not NULL versus a value that matters, it's whether the result is traceable to an approved decision.":"You have good instincts. Make sure you're naming the specific condition that would flip your answer, not just picking one side as always safer."}</div>`
},
{
 id:"b22",nav:"Summary",title:"Summary \u2014 A lookup is a controlled decision engine",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Define the mapping grain before building the lookup.</li>
   <li>Store context when the same source code can mean different things.</li>
   <li>Separate draft, approved, superseded and unresolved reference states.</li>
   <li>Tie migration runs to a controlled reference version.</li>
   <li>Design explicitly for zero, one and multiple approved matches.</li>
   <li>Preserve source values and use normalised match keys carefully.</li>
   <li>Profile reference integrity as well as source coverage.</li>
   <li>Do not use defaults to manufacture 100% coverage.</li>
   <li>Validate approved targets against the target domain.</li>
   <li>Use effective dates only when business meaning genuinely changes over time.</li>
   <li>Treat reference changes as controlled migration changes and rerun from the correct boundary.</li>
   <li>Report distinct unresolved codes and affected-record impact separately.</li>
   <li>Use SME workbooks as decision interfaces, then ingest approved decisions into controlled reference data.</li>
   <li>Treat identity matching more cautiously than simple code translation.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>The purpose of a cross-reference is not to make every source value match. It is to make every approved mapping explicit, deterministic and traceable, while making every unresolved or ambiguous value impossible to hide.</div>`
},
{
 id:"b23",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
 html:`<div class="complete"><div class="tick">\u2713</div>
 <p class="lead"><strong>You have completed Reference data, lookups and cross-references.</strong></p>
 <p>You can now design and operate controlled migration cross-references: define the mapping grain, build versioned reference structures, detect missing and ambiguous matches, preserve unresolved values, apply legal-entity and effective-date context, prove coverage before loading, and manage reference changes without turning lookup tables into uncontrolled spreadsheets.</p>

 ${TPKit.promiseCard({title:"Learning that builds real consulting capability"})}
 <h3>What is the single most valuable thing you learned?</h3>
