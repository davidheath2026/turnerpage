 { title:"Same key, differing attribute: C30422, Nordvik Service AS",

const hypothesisItems = [

     {label:"The source population, scope, or extraction logic may have changed. Compare business keys between the two snapshots before assuming what changed.", correct:true, feedback:"Correct. \u201cMay have changed\u201d keeps every explanation open, and key-level comparison is exactly the evidence that would distinguish between them."},
     {label:"The net movement of +82 is small enough, relative to 18,530, that it can safely be treated as ordinary noise.", correct:false, feedback:"Not quite. A net figure tells you almost nothing about what actually moved. Small net change is fully compatible with large, important gross change underneath it."},
     {label:"The extraction must have used the same criteria as before, since the file is described in the same way as last time.", correct:false, feedback:"The file being described the same way is exactly the kind of assumption this lesson is built to catch. A description isn't evidence of matching extraction logic."}

     {label:"The source system itself must simply be over 120 years old, which would neatly explain where these dates come from.", correct:false, feedback:"That invents a specific, implausible cause rather than gathering evidence. 1899 is a classic default/sentinel value in many systems; that's a hypothesis to check, not the explanation to assume."}
   ]

     {label:"These values are rare enough across the file that they should simply be deleted from the dataset before migration.", correct:false, feedback:"Rarity is a reason to inspect, not a reason to delete. Deleting real customer records because their CustomerGroup value is uncommon would quietly shrink the population without an approved decision behind it."},

{
 id:"b1",nav:"The handover",title:"The handover \u2014 \u201cHere's the customer file\u201d",type:"mcq",
 _correctIndex:2,
 html:`<div class="callout experience">
 <div class="callout-label">Before you begin</div>
 <p>You join the Bramwell project and are given a file called <code>Customer_Master_Final.xlsx</code>. It contains 18,612 rows and 34 columns. You are told it is \u201cthe customer data for the next migration cycle.\u201d</p>
 <p>You also know from earlier Bramwell work that an earlier agreed active-customer source population was 18,530. You do not yet know why the new file contains 18,612 rows, whether the scope changed, whether the file contains one row per customer, or whether every column comes from the same authoritative source.</p>
 </div>
 <div class="principle"><strong>Your first 30 minutes</strong><br>You are not being asked to fix the data. You are being asked to establish what you actually have.</div>
 <h3>Which action gives you the strongest starting position?</h3>`,

 id:"b3",nav:"Grain before quality",title:"Grain before quality",type:"content",
 html:`<p class="lead">Before counting blanks or invalid codes, determine what one row represents.</p>
 <p>You inspect <code>CustNo</code> and find 18,607 distinct non-blank values across 18,612 rows.</p>
 <div class="callout misconception"><div class="callout-label">What can you conclude?</div><p>Only that row count and distinct CustNo count differ. You cannot yet conclude that five rows are duplicate customers.</p></div>
 <p>Possible explanations include: true duplicate customer records; multiple records for one customer because the file grain includes another dimension; repeated extraction rows; multiple legal-entity representations; blank or formatting differences in keys; a file assembled from more than one source; or a legitimate one-to-many structure accidentally labelled as customer master.</p>
 <h3>Return the evidence, not just the count</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: find repeated keys</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT CustNo, COUNT(*) AS RowCount
FROM raw.CustomerInvestigation
GROUP BY CustNo
HAVING COUNT(*) > 1
ORDER BY RowCount DESC, CustNo;</code></pre></div>
 <p>Then return the full repeated rows, including fields that may explain the grain: legal entity, status, site, source marker, created date or any other relevant column present in the dataset.</p>
 <div class="principle"><strong>The DMC question</strong><br>\u201cWhy are there repeated keys?\u201d is more useful than \u201cHow many duplicates do we have?\u201d</div>`
},
{

{
 id:"b5",nav:"Scope is a data question",title:"Scope is a data question",type:"content",
 html:`<p class="lead">The file is described as active customers. Test that claim against the fields available.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: distribution of Status</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT Status, COUNT(*) AS Rows
FROM raw.CustomerInvestigation
GROUP BY Status
ORDER BY Status;</code></pre></div>
 <p>Suppose the training result contains status values <code>1</code>, <code>0</code>, blank and <code>X</code>. You already know from DMC1 that only approved status logic should drive target treatment. Here the immediate question is earlier: why are non-active or unexplained statuses present in a file described as active customers?</p>
 <h3>Scope evidence matrix</h3>
 <ul class="framework-checks">
   <li><strong>What population was requested?</strong> Approved scope statement or extraction requirement.</li>
   <li><strong>What filter was actually applied?</strong> Source query, report criteria or extraction logic.</li>
   <li><strong>What does Status mean?</strong> Source-system definition or SME confirmation.</li>
   <li><strong>Are inactive rows intentionally included?</strong> A scope decision, not an assumption.</li>
   <li><strong>Are there legal-entity or country restrictions?</strong> The approved migration scope.</li>
   <li><strong>Are recently created customers included?</strong> Extract timing and cut-off.</li>
   <li><strong>Are deleted, blocked or test customers present?</strong> Source flags and the scope rule.</li>
 </ul>
 <div class="callout misconception"><div class="callout-label">Important distinction</div><p>A data-quality issue is a bad or unsuitable value within the intended population. A scope issue means the wrong population is being analysed in the first place. Do not spend days cleansing records that should never have been in scope.</p></div>`
},
{
 id:"b6",nav:"The +82 movement",title:"The population changed by 82. Investigate the movement.",type:"content",
 html:`<p class="lead">The earlier approved active-customer population was 18,530. The later dataset has 18,612 rows. As DMC1 established, +82 is only a net movement.</p>
 <p>For this investigation, compare business keys between the earlier and current snapshots.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: key-level cycle comparison</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>-- New keys in current dataset
SELECT cur.CustNo
FROM raw.Customer_Current cur
LEFT JOIN raw.Customer_Previous prev
  ON prev.CustNo = cur.CustNo
WHERE prev.CustNo IS NULL;

-- Keys no longer present
SELECT prev.CustNo
FROM raw.Customer_Previous prev
LEFT JOIN raw.Customer_Current cur
  ON cur.CustNo = prev.CustNo
WHERE cur.CustNo IS NULL;</code></pre></div>
 <p>The actual comparison results are supplied separately \u2014 this walkthrough doesn't presume what the +82 movement is actually made up of.</p>
 <div class="principle"><strong>What you are trying to establish</strong><br>Did the business population genuinely change, did extraction logic change, did scope change, or did the dataset structure change? Those causes require different responses.</div>`

 id:"b7",nav:"Structure before semantics",title:"Structure before semantics",type:"content",
 html:`<p class="lead">Now inspect the 34 columns. You are not yet deciding whether every value is good. First understand the physical and structural behaviour of the fields.</p>
 <ul class="framework-checks">
   <li><strong>What data type does the file appear to contain?</strong> Numeric, date or text parse success.</li>
   <li><strong>What is the maximum observed length?</strong> <code>MAX(LEN(field))</code></li>
   <li><strong>How often is the field populated?</strong> NULL and blank counts.</li>
   <li><strong>How many distinct values exist?</strong> <code>COUNT(DISTINCT field)</code></li>
   <li><strong>Does the field behave like a key?</strong> Uniqueness plus nullability.</li>
   <li><strong>Does it contain mixed formats?</strong> Pattern or category grouping.</li>
   <li><strong>Does Excel infer a misleading type?</strong> Compare the displayed value with the raw import.</li>
   <li><strong>Does the column contain formulas?</strong> Inspect workbook or formula behaviour before export.</li>
   <li><strong>Are there hidden columns or rows?</strong> Workbook structural inspection.</li>
   <li><strong>Are headings stable and unique?</strong> A column-name audit.</li>
 </ul>
 <p>Excel is especially capable of making source data look cleaner than it is: dates can be reinterpreted, leading zeroes can disappear, long identifiers can display in scientific notation and formula cells can hide the underlying dependency.</p>
 <h3>A field inventory, not a 34-column wall of statistics</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Field</th><th>Observed behaviour</th><th>Migration relevance</th><th>Next question</th></tr></thead><tbody>
 <tr><td>CustNo</td><td>High distinctness; repeated examples</td><td>Likely business key</td><td>Confirm grain and key semantics</td></tr>
 <tr><td>Name</td><td>Mostly populated; some long values</td><td>Target name field</td><td>Known 60-character target limit; treatment separate</td></tr>
 <tr><td>Terms</td><td>Coded values incl. 45E</td><td>Payment-term mapping</td><td>Which codes are approved or unresolved?</td></tr>
 <tr><td>Status</td><td>Small coded domain</td><td>Scope and target status</td><td>Source meaning and approved scope</td></tr>
 <tr><td>Country</td><td>Small coded domain incl. ZZZ</td><td>Reference mapping</td><td>Coverage against approved cross-reference</td></tr>
 <tr><td>Rep</td><td>Many coded values</td><td>Sales-owner mapping</td><td>Authority or reference dependency</td></tr>
 <tr><td>CreatedDate</td><td>Date-like values</td><td>Potential scope or audit field</td><td>Are 1899 values real or sentinel/bad data?</td></tr>
 </tbody></table></div>
 <p>Bramwell has 20 customer records with creation dates in 1899. That is an established case-study fact. This lesson does not decide their treatment. It uses them as an example of a field whose behaviour needs explanation.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Field-Inventory-Template.xlsx</strong><p class="small">The same field-by-field shape shown above, ready to fill in for any new dataset.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Field-Inventory-Template.xlsx" download>Download</a></div>`
},
{
 id:"b8",nav:"A date that looks valid",title:"Evidence pack 3 \u2014 A date that looks valid",type:"content",
 html:`<p class="lead">A profiling query reports that every CreatedDate can be converted to a SQL date. That sounds reassuring until you inspect the minimum.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: date range check</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  MIN(TRY_CONVERT(date, CreatedDate)) AS MinCreatedDate,
  MAX(TRY_CONVERT(date, CreatedDate)) AS MaxCreatedDate,
  SUM(CASE WHEN TRY_CONVERT(date, CreatedDate) IS NULL
      THEN 1 ELSE 0 END) AS UnparseableDates
FROM raw.CustomerInvestigation;</code></pre></div>
 <p>Result: zero unparseable dates, but the minimum falls in 1899.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Lesson</div><p>Technical validity is not business plausibility. A value can be a perfectly valid date and still be wrong, defaulted, historic, sentinel or misunderstood.</p></div></div>
 <p>The next query should return the affected records and surrounding context, not automatically replace the date.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: inspect affected records</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT CustNo, Name, CreatedDate, Status, SourceTag
FROM raw.CustomerInvestigation
WHERE TRY_CONVERT(date, CreatedDate) < '1900-01-01'
ORDER BY CreatedDate, CustNo;</code></pre></div>`
},
{
 id:"b9",nav:"Distribution",title:"Distribution is where the dataset starts talking",type:"content",
 html:`<p class="lead">For coded fields, frequency distributions often reveal more than a generic null percentage. Bramwell's established earlier CustomerGroup source distribution was:</p>
 <div class="tp-table-wrap"><table class="tp-table tp-table--mono"><thead><tr><th>CustomerGroup</th><th>Count</th></tr></thead><tbody>
 <tr><td>STANDARD</td><td>14,982</td></tr>
 <tr><td>KEY</td><td>1,936</td></tr>
 <tr><td>EXPORT</td><td>1,244</td></tr>
 <tr><td>INTERNAL</td><td>260</td></tr>
 <tr><td>STD</td><td>61</td></tr>
 <tr><td>STANDARD (trailing space)</td><td>29</td></tr>
 <tr><td>99</td><td>18</td></tr>
 </tbody></table></div>
 <p>The last three values are immediately interesting, but for different reasons.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Value</th><th>Initial interpretation</th><th>What not to do yet</th></tr></thead><tbody>
 <tr><td>STD</td><td>Possible synonym or legacy code</td><td>Do not silently convert without an approved rule</td></tr>
 <tr><td>STANDARD (trailing space)</td><td>Likely whitespace variant</td><td>Do not overwrite the raw evidence</td></tr>
 <tr><td>99</td><td>Known unresolved population, 18 records, for later work</td><td>Do not invent a final mapping</td></tr>
 </tbody></table></div>
 <p>A rare value is not automatically wrong. Bramwell also has a rare GOV CustomerGroup with six customers. Rarity is a reason to inspect, not a reason to delete or standardise.</p>
 <h3>Useful distribution query</h3>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: distribution with share</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  CustomerGroup,
  COUNT(*) AS Rows,
  CAST(100.0 * COUNT(*) / SUM(COUNT(*)) OVER() AS decimal(6,2)) AS Pct
FROM raw.CustomerInvestigation
GROUP BY CustomerGroup
ORDER BY Rows DESC;</code></pre></div>
 <div class="principle"><strong>Consultant judgement</strong><br>Look for dominant values, rare values, near-duplicates, blanks, unexpected codes and changes from previous cycles. Then decide which observations deserve investigation.</div>`
},
{
 id:"b10",nav:"Completeness & relationships",title:"Completeness without context, and what single-table profiling misses",type:"content",
 html:`<p class="lead">A field that is 96% populated may be excellent or unacceptable depending on what the missing 4% represents.</p>
 <ul class="framework-checks">
   <li><strong>Is the field mandatory in the target?</strong> Missing values may block load.</li>
   <li><strong>Mandatory for all records, or only some?</strong> Conditional completeness changes the denominator.</li>
   <li><strong>Is the field derived later?</strong> A source blank may be legitimate.</li>
   <li><strong>Does another authoritative source provide it?</strong> Completeness is source-model dependent.</li>
   <li><strong>Are missing values concentrated in one country, entity or status?</strong> A pattern may reveal the cause.</li>
   <li><strong>Has completeness improved or worsened since the prior cycle?</strong> A trend helps assess remediation.</li>
 </ul>
 <p>Bramwell's known quality examples include 760 active customers initially missing valid payment terms, later improved to 214, with 23 new exceptions. That progression matters more than quoting one percentage in isolation.</p>
 <div class="principle"><strong>Profile the denominator</strong><br>If a rule applies only to active EU customers, measure completeness against active EU customers, not the entire file.</div>
 <h3>Relationships can expose what single-table profiling misses</h3>
 <p>A customer dataset may look structurally clean while failing when related data is considered. You do not need to perform full relationship validation in this lesson, but you should identify dependencies early.</p>
 <ul class="framework-checks">
   <li><strong>Payment terms:</strong> Does every in-scope source code have an approved target treatment?</li>
   <li><strong>Sales rep / owner:</strong> Does the code resolve to the target owner population?</li>
   <li><strong>Country:</strong> Does it resolve through the approved reference?</li>
   <li><strong>Delivery address:</strong> Does every required customer relationship exist?</li>
   <li><strong>Legal entity:</strong> Is the customer assigned to the correct target context?</li>
   <li><strong>Open sales orders:</strong> Will customer keys needed by open orders survive the migration?</li>
 </ul>
 <p>Bramwell previously exposed seven missing key-account delivery addresses after improvement from 31. Later troubleshooting found a transformation-rule defect. At this stage, the lesson is simpler: a customer profile that ignores dependent addresses could miss a migration-critical risk.</p>`
},
{
 id:"b11",nav:"Forming hypotheses",title:"Stop profiling and start forming hypotheses",type:"situations",
 html:`<p class="lead">After the first investigation pass, do not produce 34 pages of statistics. Convert each observation below into a hypothesis that can be tested \u2014 and only that, not a conclusion.</p>`,
 items: hypothesisItems,
 takeawayHtml:`<div class="principle"><strong>This is consultant analysis</strong><br>A profile tells you what is unusual. A hypothesis tells you what to investigate next. Do not present hypotheses as facts.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC2_Hypothesis-Log-Template.xlsx</strong><p class="small">Observation, hypothesis and next evidence needed, one row per finding.</p></div><a class="btn secondary" href="/assets/downloads/DMC2_Hypothesis-Log-Template.xlsx" download>Download</a></div>`
},
{
 id:"b12",nav:"The investigation board",title:"The investigation board \u2014 Decide what matters first",type:"selectAll",
 html:`<p class="lead">Not every anomaly deserves equal attention. Explore each finding below to see how a Data Migration Consultant would prioritise it, based on potential impact and uncertainty together.</p>`,
 options: investigationBoardFindings,
 coaching: investigationBoardCoaching,
 hint:"Explore every finding before continuing.",
 closingHtml:`<div class="principle"><strong>Prioritisation rule</strong><br>Investigate conditions that could invalidate your understanding of the population before polishing individual fields.</div>`
},
{
 id:"b13",nav:"The 60-minute takeover",title:"Practical investigation \u2014 The 60-minute dataset takeover",type:"reflection",
 html:`<p class="lead">You now receive an unfamiliar dataset, <code>Vendor_Extract_A.xlsx</code>, with no detailed handover. You have 60 simulated minutes.</p>
 <h3>Phase A \u2014 Control the artefact</h3>
 <ul class="framework-checks">
   <li>Record filename, received timestamp, row/column counts and intended entity.</li>
   <li>Identify what provenance information is missing.</li>
   <li>State the assumed grain, clearly labelled as an assumption.</li>
   <li>Identify candidate keys and test uniqueness and nullability.</li>
   <li>Create the first version of the Dataset Control Sheet.</li>
 </ul>
 <h3>Phase B \u2014 Interrogate structure</h3>
 <ul class="framework-checks">
   <li>Inspect column names, inferred types and maximum observed lengths.</li>
   <li>Identify fields with mixed parse behaviour.</li>
   <li>Measure NULL, blank and whitespace separately for selected fields.</li>
   <li>Return suspicious records rather than only statistics.</li>
   <li>Identify at least three fields whose meaning cannot be inferred safely from the data alone.</li>
 </ul>
 <h3>Phase C \u2014 Test scope and distributions</h3>
 <ul class="framework-checks">
   <li>Choose three coded fields worth distributing and explain why.</li>
   <li>Identify rare, near-duplicate and unexpected values.</li>
   <li>Segment one completeness issue by a meaningful dimension.</li>
   <li>Identify evidence that the supplied scope description may be incomplete or wrong.</li>
   <li>Write two hypotheses and specify the evidence needed to confirm or refute each.</li>
 </ul>
 <h3>Phase D \u2014 Produce the consultant output</h3>
 <ul class="framework-checks">
   <li>Complete the Dataset Control Sheet.</li>
   <li>Create a one-page Dataset Investigation Summary.</li>
   <li>List the five highest-priority unknowns or risks.</li>
   <li>Separate proven facts, observations, hypotheses and decisions required.</li>
   <li>Write the first five questions you would send to the source owner or SME, each tied to evidence.</li>
 </ul>
 <p class="lead">Write your Dataset Investigation Summary below \u2014 what you'd tell a Project Manager after this first hour.</p>
 <textarea id="reflection" placeholder="The supplied vendor extract contains..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:60,
 checks:[
   { test:/key|grain|unique/i, strength:"You addressed whether the business key and grain are actually proven.", gap:"State what you'd need to see to confirm the candidate key is genuinely unique, not just mostly unique." },
   { test:/scope|population|status/i, strength:"You addressed scope or population as a question, not an assumption.", gap:"Name a specific piece of evidence that would confirm or challenge the stated scope of this file." },
   { test:/hypothes/i, strength:"You framed at least one finding as a hypothesis rather than a conclusion.", gap:"Turn at least one anomaly into an explicit hypothesis, stated as something still to be tested." },
   { test:/question|sme|owner|source/i, strength:"You included a specific, evidence-led question you'd take back to the source owner or SME.", gap:"Write at least one precise question for the source owner, tied to a specific number or record you found, not a general \u201cis this right?\u201d." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The supplied vendor extract contains 12,406 rows, but the proposed VendorNo key is not unique, so the business grain is not yet proven. The file also contains three status codes not described in the handover and 47 rows with blank VendorNo. Before cleansing, we need the extraction criteria, source-key definition and status semantics. Separately, CountryCode contains four low-frequency values not present in the supplied reference list; these are quantified and attached for review. No source values have been altered.</div>
 <p class="small">The specific numbers matter less here than the structure of the conclusion: proven evidence, uncertainty, impact and next action.</p>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This reads exactly like a consultant who did enough analysis to ask a precise question, rather than a general 'is this right?'. SMEs are far more useful when you show them the affected population and the decision you need.":"You have the right instinct. Make sure your summary keeps facts, hypotheses and open questions clearly separate, and that each question you'd send an SME is tied to a specific number or record you actually found."}</div>`
},
{
 id:"b14",nav:"Tools & first-hour discipline",title:"Tools, and what not to do in the first hour",type:"content",
 html:`<p class="lead">This lesson is tool-agnostic by design. The same investigation may use SQL, Excel and Power Query together.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Tool</th><th>Strong use in first-pass investigation</th><th>Watch for</th></tr></thead><tbody>
 <tr><td>SQL</td><td>Counts, distinctness, distributions, joins, cycle comparisons, large datasets</td><td>Querying the wrong grain or scope very efficiently</td></tr>
 <tr><td>Excel</td><td>Rapid visual inspection, filters, pivots, spot checks, SME-friendly extracts</td><td>Type coercion, manual edits, hidden rows or formulas, scale</td></tr>
 <tr><td>Power Query</td><td>Repeatable import, type inspection, profiling, transformation prototypes</td><td>Treating exploratory steps as approved migration logic too early</td></tr>
 <tr><td>Python or other analysis tools</td><td>Large or custom profiling and pattern analysis</td><td>Creating a specialist dependency the team cannot operate</td></tr>
 <tr><td>ETL tool</td><td>Useful once rules become repeatable migration execution</td><td>Too heavy for every exploratory question</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Tool principle</strong><br>Be tool-agnostic but project-specific. Use the tool that gets reliable evidence quickly and leaves enough traceability for the next person.</div>
 <h3>What not to do in the first hour</h3>
 <ul class="framework-checks">
   <li>Do not delete repeated rows because they look like duplicates.</li>
   <li>Do not trim, standardise or default values in the only copy of the received dataset.</li>
   <li>Do not assume the filename describes the true scope.</li>
   <li>Do not treat Excel display formatting as source truth.</li>
   <li>Do not profile every field to the same depth.</li>
   <li>Do not send SMEs a spreadsheet containing thousands of anomalies with no question.</li>
   <li>Do not interpret rare as wrong.</li>
   <li>Do not turn an observation into a business rule.</li>
   <li>Do not build cleansing logic before you know whether the record belongs in scope.</li>
   <li>Do not hide unknowns to make the analysis look complete.</li>
 </ul>
 <div class="to-record">${TPKit.fromField({
   title:"The File That Changed Overnight", name:"Priya", role:"Data Migration Consultant", project:"Healthcare ERP",
   src:"/assets/audio/FileChangedOvernight-Priya.mp3",
   reflection:"What control or habit in this story would you carry into your own migration work?"
 })}</div>`
},
{
 id:"b15",nav:"Reflection",title:"Reflection \u2014 What do you need to know before you touch the data?",type:"reflection",
 html:`<p class="lead">You receive a dataset from a system you have never seen before. Write the six things you would most want to establish before making the first cleansing change.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers usually cover provenance, scope, grain and key, source meaning, target relevance, repeatability and evidence, and ownership. The exact order can vary with the dataset.</p></div></div>
 <textarea id="reflection" placeholder="The six things I would most want to establish are..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/proven|source|origin|where.*(from|came)/i, strength:"You addressed provenance \u2014 where the data actually came from.", gap:"Name what you'd want to know about the file's origin: source system, extraction method, and who produced it." },
   { test:/scope|population/i, strength:"You addressed scope \u2014 whether the right population is even present.", gap:"State how you'd confirm the file represents the population it claims to." },
   { test:/grain|key/i, strength:"You addressed grain and key \u2014 what one row actually represents.", gap:"Name what would prove the candidate key is genuinely unique at the grain you expect." },
   { test:/meaning|semantic|definition/i, strength:"You addressed source meaning \u2014 what fields and codes actually mean in the source system.", gap:"Name a field whose meaning you'd want confirmed before trusting it, rather than assuming from the name." },
   { test:/repeat|evidence|trace|reproduc/i, strength:"You addressed repeatability and evidence \u2014 whether your investigation can be re-run and checked.", gap:"State how you'd keep your investigation reproducible, not just a one-off set of manual checks." },
   { test:/owner|contact|business|sme/i, strength:"You addressed ownership \u2014 who to go to with questions.", gap:"Name who you'd want identified as the dataset's owner or business contact before relying on it." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Before touching the data, I'd want to establish: where it actually came from and how it was extracted; whether it represents the population it claims to; what one row represents, and whether the candidate key is genuinely unique at that grain; what the coded fields and unfamiliar values actually mean in the source system, not just what they look like; how I can keep my investigation reproducible so someone else can check it; and who the named owner or SME contact is for the questions I'll inevitably have.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is a genuinely investigation-ready list. Notice how none of it is about fixing anything yet \u2014 that's exactly the discipline this lesson is built around.":"You have good instincts here. Make sure your six things stay focused on establishing control before quality, rather than jumping ahead to how you'd fix what you've found."}</div>`
},
{
 id:"b16",nav:"Summary",title:"Summary \u2014 Control first, cleanse second",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Treat the received dataset as evidence before treating it as material to fix.</li>
   <li>Separate facts, assumptions, observations, hypotheses and decisions.</li>
   <li>Prove grain and key behaviour before interpreting duplicates.</li>
   <li>Prove scope before investing in field-level cleansing.</li>
   <li>Explain population movement at key level rather than relying on net counts.</li>
   <li>Inspect structural behaviour before deciding business validity.</li>
   <li>Use distributions to discover patterns, but do not equate rarity with error.</li>
   <li>Measure completeness against the population to which the rule actually applies.</li>
   <li>Identify relationships and dependencies that single-table profiling may miss.</li>
   <li>Convert anomalies into testable hypotheses.</li>
   <li>Prioritise findings that threaten your understanding of the population.</li>
   <li>Ask SMEs precise, evidence-led questions.</li>
   <li>Choose tools for the investigation rather than forcing every problem into one tool.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>When an unfamiliar dataset arrives, your first job is not to improve it. Your first job is to make it explainable: what it is, where it came from, what one row means, which population it represents, what you can prove and what you still need to find out.</div>`
},
{
