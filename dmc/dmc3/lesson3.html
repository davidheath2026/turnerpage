 id:"b2",nav:"Four dimensions",title:"Four dimensions of migration correctness",type:"content",
 html:`<p class="lead">A useful post-load validation model asks four different questions.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Dimension</th><th>Question</th><th>Example failure despite successful load</th></tr></thead><tbody>
 <tr><td>Population</td><td>Did the right records migrate?</td><td>Wrong customers included; in-scope customers omitted</td></tr>
 <tr><td>Value</td><td>Did each field contain the intended value?</td><td>Wrong payment term or group accepted</td></tr>
 <tr><td>Relationship</td><td>Does the record point to the right parent/context?</td><td>Correct address linked to wrong customer</td></tr>
 <tr><td>Meaning/context</td><td>Does the target representation preserve business intent?</td><td>UK customer created in Belgian legal entity</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Technical acceptance is a fifth, narrower question</strong><br>Did the target accept what we submitted? It matters, but it does not answer the four questions above.</div>`

 id:"b5",nav:"Fix mechanism, then state",title:"Correct the mechanism, then repair target state",type:"content",
 html:`<p class="lead">A successful-but-wrong load often requires two controlled actions.</p>
 <ol class="framework-checks">
   <li>Correct the migration mechanism so a rerun produces the intended result.</li>
   <li>Determine the approved recovery method for the incorrect target records: remove/reverse/recreate, update through supported process, or reload into a clean target state.</li>
   <li>Preserve the 42 affected business keys.</li>
   <li>Reprocess using the corrected package/entity context.</li>
   <li>Validate each affected key against expected entity.</li>
   <li>Run regression checks on unaffected UK and Belgian populations.</li>
   <li>Reconcile the complete submitted population again.</li>
   <li>Record the corrected build/package/run evidence.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Do not simply edit the 42 target rows</div><p>If the packaging defect remains, the next cycle can reproduce the same error across a different population.</p></div>`
},

 id:"b6",nav:"Patterns 2 & 3",title:"Successful-but-wrong pattern 2 \u2014 The plausible default; pattern 3 \u2014 Silent truncation",type:"content",
 html:`<h3>The plausible default</h3>
 <p>A customer loads successfully with PaymentTerms = NET30. The target accepts NET30. Source Terms = 45E. There is no approved Bramwell target equivalent for 45E.</p>
 <div class="callout misconception"><div class="callout-label">Defect</div><p>The target value is technically valid but migration-invalid because the process invented a business decision.</p></div>
 <p>This is why target-domain validation alone is insufficient.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Validation</th><th>NET30 result</th></tr></thead><tbody>
 <tr><td>Exists in target?</td><td>Yes</td></tr>
 <tr><td>Correct data type?</td><td>Yes</td></tr>
 <tr><td>Load accepted?</td><td>Yes</td></tr>
 <tr><td>Approved for source 45E?</td><td>No</td></tr>
 <tr><td>Migration-correct?</td><td>No</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Semantic validation</strong><br>Ask whether the target value is supported by the approved mapping/rule for that source record, not merely whether the target permits it.</div>
 <h3>Silent truncation</h3>
 <p>A target field allows 60 characters. The migration process truncates every longer customer name to 60. All records load. Bramwell has 27 customer names longer than the target limit, but no approved canonical treatment has been established.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: compare source and target-facing values</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  CustNo, Name_Source, CustomerName_Target,
  LEN(Name_Source) AS SourceLength, LEN(CustomerName_Target) AS TargetLength
FROM audit.CustomerLineage
WHERE RunId=@RunId AND Name_Source <> CustomerName_Target;</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Wrong does not require a rejection</div><p>Data loss can be completely valid according to the target schema and still violate the migration decision.</p></div>`
},
{
 id:"b7",nav:"Patterns 4 & 5",title:"Successful-but-wrong pattern 4 \u2014 Correct code, wrong meaning; pattern 5 \u2014 Wrong parent",type:"content",
 html:`<h3>Correct code, wrong meaning</h3>
 <p>A CustomerGroup target value exists and loads successfully. But the source value was CustomerGroup 99, for which no approved final mapping exists. The target cannot tell you that the migration team lacked authority to choose that value.</p>
 <div class="principle"><strong>Control</strong><br>Post-load validation should sample or reconcile target values against approved mapping lineage, especially for fields where plausible defaults are dangerous.</div>
 <h3>Relationship points to the wrong parent</h3>
 <p>An address record loads successfully and its CustomerNumber exists. Unfortunately, it is linked to the wrong customer. Count checks pass. Mandatory relationship validation passes. Only relationship identity is wrong.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: expected versus actual parent</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  s.AddressId, s.ExpectedCustomerNumber, t.ActualCustomerNumber
FROM stage.ExpectedAddressRelationship s
JOIN audit.TargetAddress t ON t.RunId=s.RunId AND t.AddressId=s.AddressId
WHERE s.RunId=@RunId AND s.ExpectedCustomerNumber <> t.ActualCustomerNumber;</code></pre></div>
 <div class="principle"><strong>Relationship validation</strong><br>Do not ask only 'does the parent exist?' Ask 'is this the intended parent for this child?'</div>`
},
{
 id:"b8",nav:"Patterns 6 & 7",title:"Successful-but-wrong pattern 6 \u2014 Duplicate-but-valid; pattern 7 \u2014 Scope leakage",type:"content",
 html:`<h3>Duplicate-but-valid records</h3>
 <p>Two target customers are created for one source customer under different target IDs. Both records are individually valid. Possible mechanisms: source grain misunderstood; duplicate source rows not controlled; restart created a second record because target key generation changed; same customer entered two packages; deduplication/reference identity logic failed; legal-entity split is legitimate but expected grain was documented incorrectly.</p>
 <p>Validate at the intended business grain, not only target technical key.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: multiplicity check</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT SourceCustomerKey, COUNT(*) AS TargetRecords
FROM audit.SourceTargetCustomerBridge
WHERE RunId=@RunId
GROUP BY SourceCustomerKey
HAVING COUNT(*) <> &lt;expected target multiplicity&gt;;</code></pre></div>
 <h3>Scope leakage</h3>
 <p>Inactive or historical records can load perfectly even if the agreed migration scope excludes them. Conversely, an in-scope record can be absent while total counts still match because an out-of-scope record replaced it.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: scope reconciliation</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>-- In-scope source keys missing from target
SELECT BusinessKey FROM ctl.ApprovedScope
EXCEPT
SELECT SourceBusinessKey FROM audit.TargetBridge;

-- Target source keys not in approved scope
SELECT SourceBusinessKey FROM audit.TargetBridge
EXCEPT
SELECT BusinessKey FROM ctl.ApprovedScope;</code></pre></div>
 <div class="principle"><strong>Scope validation</strong><br>Reconcile business keys against the approved in-scope population. Never use target row count as a substitute for scope identity.</div>`
},
{
 id:"b9",nav:"Validation invariants",title:"Build post-load validation around invariants",type:"content",
 html:`<p class="lead">An invariant is something that should remain true if migration is correct.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Invariant</th><th>Example</th></tr></thead><tbody>
 <tr><td>Population identity</td><td>Every approved in-scope key is accounted for</td></tr>
 <tr><td>Value lineage</td><td>Target PaymentTerms equals the approved mapping result</td></tr>
 <tr><td>Entity context</td><td>Target legal entity equals approved derivation</td></tr>
 <tr><td>Relationship identity</td><td>Address points to intended customer</td></tr>
 <tr><td>Reference validity</td><td>Target code exists and is the approved source-to-target mapping</td></tr>
 <tr><td>No silent data loss</td><td>Source value changes only under an approved rule</td></tr>
 <tr><td>Multiplicity</td><td>One source customer produces expected number of target customers</td></tr>
 <tr><td>Exclusion</td><td>Approved excluded records do not appear</td></tr>
 <tr><td>Control totals</td><td>Financial/quantity totals reconcile where applicable</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Validation design question</strong><br>What could be wrong even if every row loaded successfully? Build checks for those conditions.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Post-Load-Invariants-Checklist.xlsx</strong><p class="small">The nine-invariant structure above, ready to adapt for any entity.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Post-Load-Invariants-Checklist.xlsx" download>Download</a></div>`
},
{
 id:"b10",nav:"Counts are reassuring",title:"Row counts are necessary and dangerously reassuring",type:"content",
 html:`<p class="lead">Consider two populations of 18,573 records. They can have the same count while: 42 records sit in the wrong legal entity; one set of 42 keys is missing and another set duplicated; 27 names have been silently truncated; unresolved codes have been defaulted to valid target values; relationships point to the wrong parents; out-of-scope records have replaced in-scope records.</p>
 <div class="principle"><strong>Count + identity + meaning</strong><br>Use counts to detect quantity differences, keys to detect population differences and semantic controls to detect wrong values/relationships.</div>`
},
{
 id:"b11",nav:"Distribution reconciliation",title:"Distribution reconciliation can reveal semantic drift",type:"content",
 html:`<p class="lead">Bramwell's later target CustomerGroup distribution is established as:</p>
 <div class="tp-table-wrap"><table class="tp-table tp-table--mono"><thead><tr><th>Target CustomerGroup</th><th>Records</th></tr></thead><tbody>
 <tr><td>STANDARD</td><td>15,021</td></tr>
 <tr><td>KEY</td><td>1,984</td></tr>
 <tr><td>INTERNATIONAL</td><td>1,298</td></tr>
 <tr><td>INTERNAL</td><td>270</td></tr>
 <tr><td><strong>Total</strong></td><td><strong>18,573</strong></td></tr>
 </tbody></table></div>
 <p>A distribution comparison can reveal unexpected shifts even when total count is correct.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT CustomerGroup, COUNT(*) AS TargetRecords
FROM audit.TargetCustomer
WHERE RunId=@RunId
GROUP BY CustomerGroup
ORDER BY TargetRecords DESC;</code></pre></div>
 <p>However, a matching distribution still does not prove record-level correctness. Forty-two customers could swap categories and leave every aggregate unchanged.</p>
 <div class="principle"><strong>Use aggregates to find signals, then validate identities</strong><br>Distribution controls are powerful detectors, not complete proof.</div>`
},
{
 id:"b12",nav:"Sampling",title:"Sampling: useful, but not your only proof",type:"content",
 html:`<p class="lead">Business users often validate samples because they understand meaning better than automated checks. Use sampling deliberately.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Sample type</th><th>Purpose</th></tr></thead><tbody>
 <tr><td>High-risk fields</td><td>Terms, tax, legal entity, classifications</td></tr>
 <tr><td>Boundary values</td><td>Maximum lengths, zero, unusual dates</td></tr>
 <tr><td>Rare values</td><td>Uncommon groups/countries</td></tr>
 <tr><td>Changed values</td><td>Source differs from target-facing output</td></tr>
 <tr><td>New mappings</td><td>Recently approved references</td></tr>
 <tr><td>Previously failing records</td><td>Regression evidence</td></tr>
 <tr><td>Random sample</td><td>Broad detection of unexpected issues</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Do not confuse sample success with population proof</strong><br>Automate deterministic checks across the full population where possible; use sampling for judgement and semantics that cannot be fully automated.</div>`
},
{
 id:"b13",nav:"Avoid circular validation",title:"A semantic diff toolkit, and avoiding circular validation",type:"content",
 html:`<p class="lead">For important fields, create a source-expected-target comparison.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: semantic diff</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  x.BusinessKey, x.SourceValue, x.ExpectedTargetValue, x.ActualTargetValue,
  CASE WHEN x.ExpectedTargetValue = x.ActualTargetValue THEN 'MATCH' ELSE 'MISMATCH' END AS ValidationResult
FROM audit.ExpectedVsActual x
WHERE x.RunId=@RunId;</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Independent expectation</div><p>ExpectedTargetValue must come from the controlled mapping/rule/reference baseline, not from the actual transformed output if the transformation itself is under investigation. A validation that calculates expected values using the same faulty code as the transformation can reproduce the defect and report a false pass.</p></div>
 <h3>Avoid circular validation</h3>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Circular check</th><th>Stronger independent check</th></tr></thead><tbody>
 <tr><td>Transform says GB; validation reruns same function and gets GB</td><td>Compare target to approved country cross-reference baseline</td></tr>
 <tr><td>ETL derives entity; validation calls same ETL expression</td><td>Calculate expectation from approved rule independently</td></tr>
 <tr><td>Load file count equals stage output count</td><td>Compare approved source keys to target bridge</td></tr>
 <tr><td>Target value exists in domain</td><td>Compare target value to approved source-to-target decision</td></tr>
 <tr><td>Transformation truncates to 60; validator checks &lt;=60</td><td>Compare against approved treatment and original value</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Principle</strong><br>Validation should challenge the migration, not merely replay it.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Semantic-Diff-SQL.sql</strong><p class="small">The expected-versus-actual comparison pattern above, ready to adapt to any field.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Semantic-Diff-SQL.sql" download>Download</a></div>`
},
{
 id:"b14",nav:"The green-load exercise",title:"The green-load forensic exercise",type:"situations",
 html:`<p class="lead">Six evidence cards. Every record loaded successfully. For each, choose the strongest independent validation check.</p>`,
 items: forensicCards,
 takeawayHtml:`<div class="principle"><strong>What each card should also make you ask</strong><br>Why did the technical load status fail to detect this? Where's the likely failure boundary? What evidence do you need before proposing a fix? What full-population control should be added for future cycles?</div>`
},
{
 id:"b15",nav:"Independent lab",title:"Independent lab \u2014 100% accepted, 97 defects",type:"reflection",
 html:`<p class="lead">This is a synthetic case. A product load submits 185,000 records and all 185,000 are accepted. A validation pack contains evidence of 97 suspected semantic defects across category, unit, site, description and source-to-target identity.</p>
 <p>You receive: approved scope keys; source extract; transformed output; load-package audit; target extract; mapping/rule catalogue; reference baseline; aggregate distributions; a business-user sample report.</p>
 <h3>Required deliverables</h3>
 <ol class="framework-checks">
   <li>Reconcile scope keys to target identities.</li>
   <li>Identify at least four distinct successful-but-wrong defect mechanisms.</li>
   <li>Build an independent expected-versus-actual check for two fields.</li>
   <li>Find one aggregate control that detects a problem and one that falsely appears healthy.</li>
   <li>Trace one defect through source, transformation, package and target.</li>
   <li>Prove the full affected population for each confirmed mechanism.</li>
   <li>Separate migration defects from legitimate target representations.</li>
   <li>Recommend corrections at the correct layer.</li>
   <li>Design post-fix regression checks.</li>
   <li>Produce a concise semantic-validation report.</li>
 </ol>
 <p class="lead">Write your semantic-validation report below.</p>
 <textarea id="reflection" placeholder="Technical acceptance was 100%, but..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Semantic-Validation-Report-Template.docx</strong><p class="small">Confirmed mechanisms, affected populations and corrective layers, ready to fill in.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Semantic-Validation-Report-Template.docx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/185,?000|reconcil|scope keys/i, strength:"You reconciled scope keys to target identities using the actual population.", gap:"State how you reconciled the 185,000 scope keys to what actually landed in the target." },
   { test:/mechanism|defect/i, strength:"You named at least one distinct defect mechanism.", gap:"Name at least one specific successful-but-wrong mechanism you found, not just \u201897 defects.\u2019" },
   { test:/independent|expected.*(value|versus)/i, strength:"You addressed building an independent expected-versus-actual check.", gap:"Describe how your expected value was calculated independently of the transformation under investigation." },
   { test:/aggregate|distribution/i, strength:"You addressed which aggregate control detected a problem and which looked falsely healthy.", gap:"Name one aggregate control that caught something and one that looked healthy despite a real defect." },
   { test:/legitimate|not.*(defect|migration)/i, strength:"You separated migration defects from legitimate target representations.", gap:"State how you distinguished a genuine defect from a difference that's actually an approved, legitimate transformation." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Technical acceptance was 100%, but independent post-load validation identified four confirmed migration defect mechanisms. Population identity controls found scope substitution despite matching counts; field-lineage checks found valid target values unsupported by approved source mappings; relationship checks found children linked to valid but incorrect parents; and package-to-target comparison identified context drift. Each affected population is preserved by business key, corrections are assigned to the causal migration layer, and rerun validation will compare expected versus actual values independently of the production transformation.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is the model semantic-validation report: specific mechanisms, independent checks, and a rerun plan that doesn't just replay the same transformation.":"You have the right structure. Make sure each mechanism you name is distinct, and that your expected-value calculation is genuinely independent of the code under investigation."}</div>`
},
{
 id:"b16",nav:"A strong report",title:"A strong semantic-validation report",type:"content",
 html:`<div class="callout misconception"><div class="callout-label">Weak</div><p>\u201cLoad successful. 97 data-quality issues found during checking. Team to correct.\u201d</p></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Strong</div><p>\u201cTechnical acceptance was 100%, but independent post-load validation identified four confirmed migration defect mechanisms. Population identity controls found scope substitution despite matching counts; field-lineage checks found valid target values unsupported by approved source mappings; relationship checks found children linked to valid but incorrect parents; and package-to-target comparison identified context drift. Each affected population is preserved by business key, corrections are assigned to the causal migration layer, and rerun validation will compare expected versus actual values independently of the production transformation.\u201d</p></div></div>`
},
{
 id:"b17",nav:"Consultant situations",title:"Consultant situations",type:"situations",

 items: consultantSituationsC,

{
 id:"b18",nav:"Reflection",title:"Reflection \u2014 What would you validate if nothing rejected?",type:"reflection",
 html:`<p class="lead">Choose one migration entity you know well. Assume every row loads successfully. Write the five checks most likely to detect a serious business defect anyway.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers usually span population identity, important mapped values, relationship identity, target context and an entity-specific business control rather than five technical field checks.</p></div></div>
 <textarea id="reflection" placeholder="The five checks I'd run are..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/population|scope|identity/i, strength:"You included a population/scope identity check.", gap:"Include a check for population or scope identity, not just field values." },
   { test:/value|mapping|term/i, strength:"You included a check on important mapped values.", gap:"Include a check on at least one important mapped value or field." },
   { test:/relationship|parent/i, strength:"You included a relationship identity check.", gap:"Include a check on relationship identity, not just whether a parent exists." },
   { test:/context|entity|legal/i, strength:"You included a target context check.", gap:"Include a check on target context, like legal entity or similar placement." },
   { test:/business|entity-specific/i, strength:"You included an entity-specific business control, not just a generic technical check.", gap:"Include one check specific to this entity's business meaning, not a generic technical field check." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">For customer: I'd check that every approved in-scope business key is present in the target, exactly once; that PaymentTerms matches the approved mapping lineage, not just a valid target value; that every address points to its actually-intended customer, not merely a valid one; that legal entity matches the approved derivation for each source country; and that CustomerGroup values sourced from unresolved codes like 99 haven't quietly acquired an unapproved target value.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is exactly the spread the lesson is built around: population, value, relationship, context and one entity-specific control, not five variations on the same technical check.":"You have good instincts. Make sure your five checks span different dimensions \u2014 population, value, relationship, context \u2014 rather than five versions of the same kind of check."}</div>`
},
{
 id:"b19",nav:"Summary",title:"Summary \u2014 Success is not correctness",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Technical acceptance proves only that the target accepted what it received.</li>
   <li>Validate population, values, relationships and business context independently.</li>
   <li>Use business keys as well as counts.</li>
   <li>Trace accepted-but-wrong records through source, transformation, package and target.</li>
   <li>Compare wrong accepted records with right accepted controls.</li>
   <li>Find the first point of semantic divergence.</li>
   <li>Do not use target-domain validity as proof of approved mapping correctness.</li>
   <li>Detect silent truncation and plausible defaults through lineage checks.</li>
   <li>Validate intended parent identity, not merely parent existence.</li>
   <li>Reconcile scope identity to detect leakage/substitution.</li>
   <li>Use distributions as detectors, then drill to record identity.</li>
   <li>Avoid circular validation that reuses the same production logic.</li>
   <li>Preserve the full affected population and fix the causal mechanism.</li>
   <li>Add independent post-load controls that make the same defect visible next cycle.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>The most dangerous migration defect may be the one that generates no error at all. Build validation that asks whether the target contains the right business truth, not merely whether the load completed.</div>`
},
{
 id:"b20",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
 html:`<div class="complete"><div class="tick">\u2713</div>
 <p class="lead"><strong>You have completed When the load succeeds but the data is wrong.</strong></p>
 <p>You can now investigate migration defects that produce no technical rejection: wrong values, wrong legal entity, wrong relationships, wrong scope, duplicate-but-valid records and semantically incorrect defaults. You can design post-load checks that compare source intent, transformed output and target state, identify the first point of semantic divergence, prove the affected population and correct the migration without treating "load succeeded" as evidence of correctness.</p>
