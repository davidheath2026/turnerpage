 id:"b2",nav:"Think in a graph",title:"Stop thinking in rows. Think in a dependency graph.",type:"content",
 html:`<p class="lead">Many migration entities are not independent. An order is a node connected to other nodes.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SO-78452's dependency graph</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SO-78452

  +-- Delivery address C10482-DEL-02
  +-- Product PRD-44781
  +-- Site UK01
  +-- Warehouse WH-BRI
  +-- Currency GBP
  +-- Payment term 45E
  +-- Delivery method STDROAD</code></pre></div>
 <p>Some dependencies are parent-child relationships. Others are reference/master-data prerequisites. Some are conditional: warehouse may only be valid within a particular site or legal entity.</p>
 <div class="principle"><strong>Dependency question</strong><br>What must already be correct and available for this record to be valid in the target?</div>`
},

 id:"b3",nav:"Four failure types",title:"Four common dependency failure types",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Type</th><th>What happened</th><th>Typical symptom</th></tr></thead><tbody>
 <tr><td>Missing prerequisite</td><td>Required parent/reference did not migrate</td><td>Parent not found; invalid reference</td></tr>
 <tr><td>Wrong relationship</td><td>Child points to an existing but incorrect parent</td><td>Load may succeed but business result is wrong</td></tr>
 <tr><td>Sequencing/timing</td><td>Prerequisite is valid but not available when child loads</td><td>Intermittent or batch-specific reject</td></tr>
 <tr><td>Context dependency</td><td>Combination is invalid in entity/site/company context</td><td>Each code exists separately, combination fails</td></tr>
 </tbody></table></div>
 <p>A fifth pattern is cascading failure: one upstream defect causes many apparently unrelated downstream failures.</p>`
},

 id:"b6",nav:"Wrong-parent failures",title:"Wrong-parent failures are different",type:"content",
 html:`<p class="lead">Now imagine C10482-DEL-02 exists in the target but is linked to customer C10999. The order can still fail, or worse, it can load against the wrong relationship.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: expected versus actual parent</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  e.AddressId, e.ExpectedCustomerNumber, a.ActualCustomerNumber
FROM ctl.ExpectedAddressParent e
JOIN audit.TargetAddress a ON a.RunId=e.RunId AND a.AddressId=e.AddressId
WHERE e.RunId=@RunId AND e.ExpectedCustomerNumber <> a.ActualCustomerNumber;</code></pre></div>
 <div class="principle"><strong>Relationship identity</strong><br>A dependency is not valid merely because both records exist. The intended relationship must exist.</div>`
},
{
 id:"b7",nav:"Sequencing failures",title:"Sequencing failure \u2014 Everything is correct, just not yet",type:"content",
 html:`<p class="lead">A sales order rejects because customer C10482 is not found. Fifteen minutes later, the customer is visible in target. Possible explanation: the order batch started before the customer load committed.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Evidence to inspect</th><th>Why</th></tr></thead><tbody>
 <tr><td>Customer step start/end</td><td>Was parent processing complete?</td></tr>
 <tr><td>Commit state</td><td>Was accepted data actually committed?</td></tr>
 <tr><td>Order step start</td><td>Did child begin too early?</td></tr>
 <tr><td>Batch parallelism</td><td>Were parent and child allowed to overlap?</td></tr>
 <tr><td>Target visibility delay</td><td>Does target expose committed data immediately?</td></tr>
 <tr><td>Retry behaviour</td><td>Did later records succeed because parent became available?</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: check parent/child step timing</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT Entity, StepName, StartedAt, CompletedAt, CommitState
FROM ctl.MigrationStep
WHERE RunId=@RunId AND Entity IN ('Customer','SalesOrder')
ORDER BY StartedAt;</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Sequencing diagnosis</div><p>Do not change customer or order data when the defect is execution timing.</p></div>
 <h3>Detect sequencing from the rejection pattern</h3>
 <p>Suppose the first 800 orders show a high "customer not found" rate and later orders mostly succeed. Plot or group rejects by submission time/batch.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: rejects by batch over time</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  BatchNo, MIN(SubmittedAt) AS FirstSubmitted, MAX(SubmittedAt) AS LastSubmitted,
  COUNT(*) AS Orders,
  SUM(CASE WHEN RejectCode='CUSTOMER_NOT_FOUND' THEN 1 ELSE 0 END) AS ParentRejects
FROM audit.OrderLoadResult
WHERE RunId=@RunId
GROUP BY BatchNo
ORDER BY BatchNo;</code></pre></div>
 <div class="principle"><strong>Pattern clue</strong><br>A failure rate that changes sharply with time can indicate dependency availability rather than different data quality.</div>`
},
{
 id:"b8",nav:"Context & reference dependency",title:"Context dependency \u2014 Site and warehouse; reference dependency \u2014 Payment terms",type:"content",
 html:`<p class="lead">SO-78452 uses Site UK01 and Warehouse WH-BRI. Both codes may exist in the target, yet the combination can still be invalid.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Check</th><th>Question</th></tr></thead><tbody>
 <tr><td>Site exists</td><td>Is UK01 valid in the target context?</td></tr>
 <tr><td>Warehouse exists</td><td>Does WH-BRI exist?</td></tr>
 <tr><td>Relationship</td><td>Is WH-BRI assigned to UK01?</td></tr>
 <tr><td>Legal entity</td><td>Are both valid in the order's legal entity?</td></tr>
 <tr><td>Effective status</td><td>Are they active for migration date?</td></tr>
 <tr><td>Product relationship</td><td>Can PRD-44781 use the site/warehouse if target requires setup?</td></tr>
 </tbody></table></div>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: valid combination check</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT o.SalesOrderNo
FROM stage.OrderTransformed o
LEFT JOIN ref.ValidSiteWarehouse sw
  ON sw.LegalEntity=o.LegalEntity AND sw.Site=o.Site AND sw.Warehouse=o.Warehouse
WHERE o.RunId=@RunId AND sw.Warehouse IS NULL;</code></pre></div>
 <div class="principle"><strong>Two valid codes can form an invalid pair</strong><br>Reference validation must sometimes test combinations, not individual domains.</div>
 <h3>Reference dependency \u2014 Payment terms</h3>
 <p>SO-78452 has source payment term 45E. Bramwell has no approved target equivalent established for 45E. That means order readiness may depend on a customer/reference decision even if every other order field is valid.</p>
 <div class="callout misconception"><div class="callout-label">Do not default the dependency</div><p>If the order requires an approved target payment term, unresolved 45E remains a controlled exception until the required decision exists. NET30 is not an approved solution.</p></div>
 <p class="small">Dependency mapping should include business-decision prerequisites as well as technical parent records.</p>`
},
{
 id:"b9",nav:"Cascading failures",title:"Cascading failures can distort defect counts",type:"content",
 html:`<p class="lead">One failed product can cause hundreds of order-line rejects. Counting every child reject as a separate root cause exaggerates the problem.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Observed</th><th>Root-cause view</th></tr></thead><tbody>
 <tr><td>1 missing product</td><td>1 upstream prerequisite defect</td></tr>
 <tr><td>286 rejected order lines</td><td>286 downstream affected records</td></tr>
 <tr><td>Several target messages</td><td>Potentially one causal chain</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Separate cause count from impact count</strong><br>One cause can have a large blast radius. Your defect reporting should show both.</div>`
},
{
 id:"b10",nav:"Upstream failure index",title:"Build an upstream failure index",type:"content",
 html:`<p class="lead">For a failed child population, summarise dependencies by missing or failed parent.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  l.ProductNumber, COUNT(*) AS AffectedOrderLines
FROM err.OrderLineReject l
LEFT JOIN ctl.AcceptedProduct p ON p.RunId=l.RunId AND p.ProductNumber=l.ProductNumber
WHERE l.RunId=@RunId AND p.ProductNumber IS NULL
GROUP BY l.ProductNumber
ORDER BY AffectedOrderLines DESC;</code></pre></div>
 <p>Repeat for customer, order header, site/warehouse and other relevant dependencies. The largest concentrations tell you where upstream correction may remove the most downstream noise.</p>`
},
{
 id:"b11",nav:"Status board",title:"Build a dependency status board",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Entity</th><th>Prerequisite</th><th>Expected</th><th>Accepted/available</th><th>Exceptions</th><th>Status</th></tr></thead><tbody>
 <tr><td>Customer address</td><td>Customer</td><td>All required parents</td><td>Measured</td><td>Measured</td><td>Green/Amber/Red</td></tr>
 <tr><td>Sales order</td><td>Customer</td><td>All referenced customers</td><td>Measured</td><td>Measured</td><td>Green/Amber/Red</td></tr>
 <tr><td>Sales order</td><td>Delivery address</td><td>All required addresses</td><td>Measured</td><td>Measured</td><td>Green/Amber/Red</td></tr>
 <tr><td>Order line</td><td>Order header</td><td>All referenced headers</td><td>Measured</td><td>Measured</td><td>Green/Amber/Red</td></tr>
 <tr><td>Order line</td><td>Product</td><td>All referenced products</td><td>Measured</td><td>Measured</td><td>Green/Amber/Red</td></tr>
 <tr><td>Order line</td><td>Site/Warehouse</td><td>All valid combinations</td><td>Measured</td><td>Measured</td><td>Green/Amber/Red</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>This is not a management dashboard</strong><br>It is a consultant control that tells you whether a child entity is technically ready to be attempted and where exceptions are concentrated.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Dependency-Status-Board-Template.xlsx</strong><p class="small">The six-row structure above, ready to fill in for any migration entity set.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Dependency-Status-Board-Template.xlsx" download>Download</a></div>`
},
{
 id:"b12",nav:"Pre-load validation",title:"Pre-load dependency validation",type:"content",
 html:`<p class="lead">Do not wait for target rejects to discover obvious missing parents.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: orders referencing unready customers</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT o.SalesOrderNo, o.CustNo
FROM stage.OrderReady o
LEFT JOIN ctl.CustomerAvailable c ON c.RunId=o.RunId AND c.CustNo=o.CustNo
WHERE o.RunId=@RunId AND c.CustNo IS NULL;</code></pre></div>
 <p>The available-parent set may mean: already present in target and approved for reuse; successfully migrated and committed in the current cycle; included in a guaranteed earlier load step; or otherwise explicitly available under the project design.</p>
 <div class="principle"><strong>Be precise about "exists"</strong><br>Source existence is not enough. A child needs the prerequisite in the state and context required by the target.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Parent-Child-Validation.sql</strong><p class="small">The pre-load and combination-validation queries from this lesson, ready to adapt.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Parent-Child-Validation.sql" download>Download</a></div>`
},
{
 id:"b13",nav:"The rerun boundary",title:"Decide the correct rerun boundary",type:"content",
 html:`<p class="lead">After fixing the address transformation rule, where should you rerun?</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Possible rerun</th><th>Assessment</th></tr></thead><tbody>
 <tr><td>Only SO-78452</td><td>Too narrow: address still absent unless separately repaired</td></tr>
 <tr><td>Only seven target addresses manually</td><td>Bypasses controlled transformation and may miss wider impact</td></tr>
 <tr><td>Address transformation from valid checkpoint, then dependent address load, then affected downstream orders</td><td>Strong</td></tr>
 <tr><td>Everything from source extraction</td><td>May work, but unnecessarily broad unless upstream state changed</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Dependency-aware recovery</strong><br>Rerun from the earliest corrected prerequisite that invalidated downstream output, then replay affected dependants in order.</div>`
},
{
 id:"b14",nav:"Invalidate checkpoints",title:"Invalidate downstream checkpoints when prerequisites change",type:"content",
 html:`<p class="lead">Suppose order transformation used a reference snapshot derived before the address fix. Even if the order data itself did not change, its readiness result may now be stale.</p>
 <p>Ask: which child outputs were calculated from the old parent/reference state? Which load packages contain stale parent identifiers? Which validation results assumed the missing prerequisite? Which checkpoints can safely be reused? Which must be regenerated?</p>
 <div class="principle"><strong>Restartability meets dependency management</strong><br>A technically successful checkpoint is not reusable if an upstream prerequisite it depended on has changed.</div>`
},
{
 id:"b15",nav:"Test matrix",title:"Dependency test matrix",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Test</th><th>Positive case</th><th>Negative case</th><th>Regression case</th></tr></thead><tbody>
 <tr><td>Parent existence</td><td>Valid parent available</td><td>Parent absent</td><td>Unrelated parents unaffected</td></tr>
 <tr><td>Parent identity</td><td>Child points to intended parent</td><td>Child points to wrong valid parent</td><td>Existing correct links stable</td></tr>
 <tr><td>Sequence</td><td>Parent committed first</td><td>Child starts before commit</td><td>Parallel unrelated entity still works</td></tr>
 <tr><td>Reference combination</td><td>Valid site/warehouse pair</td><td>Each exists but pair invalid</td><td>Other valid pairs stable</td></tr>
 <tr><td>Exception behaviour</td><td>Missing prerequisite routed correctly</td><td>Silent child drop prohibited</td><td>Exception count reconciles</td></tr>
 <tr><td>Rerun</td><td>Corrected parent enables child</td><td>Stale child package rejected/regenerated</td><td>No duplicate child creation</td></tr>
 </tbody></table></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Dependency-Test-Matrix-Template.xlsx</strong><p class="small">The six-test structure above, ready to extend for any dependency.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Dependency-Test-Matrix-Template.xlsx" download>Download</a></div>`
},
{
 id:"b16",nav:"The dependency maze",title:"The dependency maze",type:"selectAll",
 html:`<p class="lead">Six failures arrived together. Explore each one to find the hidden cause underneath \u2014 the point isn't treating all six as separate defects.</p>`,
 options: mazeItems,
 coaching: mazeCoaching,
 hint:"Explore every failure before continuing.",
 closingHtml:`<div class="principle"><strong>What this maze actually contains</strong><br>Six observed failures, but nowhere near six root causes. Draw the causal graph before fixing anything \u2014 several of these collapse into the same upstream mechanism.</div>`
},
{
 id:"b17",nav:"Independent lab",title:"Independent lab \u2014 Restore the migration graph",type:"reflection",
 html:`<p class="lead">This is a synthetic migration case. It contains 8,400 customers, 12,900 addresses, 3,600 products, 6 sites, 18 warehouses, 9,250 open orders and 27,600 order lines. After execution, 1,146 child records are rejected across several messages.</p>
 <p>Evidence pack: entity load sequence and timestamps; accepted/rejected business keys by entity; source-to-target bridge tables; site/warehouse relationship reference; run/step commit states; transformation outputs; dependency exception tables; one stale load package; one deliberately misleading target message.</p>
 <h3>Required deliverables</h3>
 <ol class="framework-checks">
   <li>Draw the entity dependency graph.</li>
   <li>Identify the earliest failed prerequisite for each rejection cluster.</li>
   <li>Separate root-cause defects from downstream affected records.</li>
   <li>Prove the blast radius by business key.</li>
   <li>Identify one sequencing defect.</li>
   <li>Identify one wrong-parent defect.</li>
   <li>Identify one invalid reference combination.</li>
   <li>Identify one restart-state dependency defect.</li>
   <li>Define the corrected execution order.</li>
   <li>State which checkpoints/packages are invalidated.</li>
   <li>Create a dependency-aware rerun plan.</li>
   <li>Design pre-load controls that would have detected at least three failures.</li>
   <li>Write a concise technical update explaining why 1,146 rejects do not represent 1,146 independent causes.</li>
 </ol>
 <p class="lead">Write your technical update below.</p>
 <textarea id="reflection" placeholder="The child rejects group into..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Dependency-Impact-Query.sql</strong><p class="small">Blast-radius and upstream-failure-index query shapes from this lesson, ready to adapt.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Dependency-Impact-Query.sql" download>Download</a></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Rerun-Dependency-Plan-Template.xlsx</strong><p class="small">Corrected execution order, invalidated checkpoints and replay sequence, ready to fill in.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Rerun-Dependency-Plan-Template.xlsx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/1,?146|graph|cluster/i, strength:"You addressed the actual 1,146 reject population and grouped it into clusters.", gap:"Reference the actual 1,146 rejected records and how they group into a small number of causal clusters." },
   { test:/sequenc/i, strength:"You identified a sequencing defect.", gap:"Name a specific sequencing defect you found in this dataset." },
   { test:/wrong.parent|wrong parent/i, strength:"You identified a wrong-parent defect.", gap:"Name a specific wrong-parent defect, distinct from a missing-parent one." },
   { test:/restart|rerun/i, strength:"You addressed a restart-state dependency issue and the rerun plan.", gap:"State the restart-state defect you found, and how your rerun plan avoids recreating it." },
   { test:/pre-?load|control/i, strength:"You proposed pre-load controls that would have caught failures earlier.", gap:"Name at least one pre-load control that would have caught a failure before the load ran." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The child rejects group into three upstream dependency mechanisms rather than hundreds of independent data defects. One customer batch was not committed before order submission; one product prerequisite failed reference validation and generated a large order-line blast radius; and a valid-address population was removed upstream by transformation logic. We have preserved the affected child keys, corrected each prerequisite at its causal layer, invalidated dependent packages produced from stale state, and will replay parent-to-child from the earliest corrected boundary with relationship and sequencing controls.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is the model dependency diagnosis: causal clusters named, not 1,146 individual defects, with a rerun plan that replays from the correct boundary.":"You have the right structure. Make sure you're naming distinct causal clusters, not just listing symptoms, and that your rerun plan replays parent-to-child in the correct order."}</div>`
},
{
 id:"b18",nav:"A strong diagnosis",title:"What a strong dependency diagnosis sounds like",type:"content",
 html:`<div class="callout misconception"><div class="callout-label">Weak</div><p>\u201cThe orders failed because customers, addresses and products were missing. We will fix the bad data and rerun.\u201d</p></div>

{

 html:`<p class="lead">Choose three migration entities from a project you know. For each, list the prerequisites that must be available before the entity can be safely loaded and one control that proves each prerequisite.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>Strong answers include business/reference dependencies as well as obvious technical parent-child relationships. They also distinguish "exists in source" from "available and correct in target."</p></div></div>

 <div class="voice-row">

 </div>

 </div>
 <div id="reflectionFeedback"></div>`,

   { test:/prerequisite|depend/i, strength:"You named specific prerequisites for your chosen entities.", gap:"Name the specific prerequisites each of your three entities depends on." },
   { test:/control|prove|check/i, strength:"You named a control that proves each prerequisite, not just that it exists.", gap:"Name one control per entity that would prove the prerequisite is actually available, not just present in source." },
   { test:/exists in source|available.*target|correct in target/i, strength:"You distinguished source existence from target availability.", gap:"State how you'd distinguish a prerequisite existing in source from it being genuinely available and correct in the target." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">Three entities: sales orders depend on the customer being accepted and committed, not just present in source \u2014 proven by checking commit state, not source existence. Order lines depend on the product existing in the correct site/warehouse context \u2014 proven by validating the combination, not each code separately. Customer addresses depend on the customer record itself \u2014 proven by confirming the customer's target identity before the address load runs, not assuming source presence guarantees target availability.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This captures exactly the distinction the lesson is built around: source existence and target availability are different questions.":"You have good instincts. Make sure each control you name actually proves availability in the target, not just presence somewhere in the source."}</div>`
},
{
 id:"b21",nav:"Summary",title:"Summary \u2014 Troubleshoot the graph",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Model dependent migration data as a graph, not isolated rows.</li>
   <li>List parent, reference, sequencing and context prerequisites.</li>
   <li>When a child fails, identify the earliest failed prerequisite.</li>
   <li>Do not change a correct child relationship to compensate for a missing parent.</li>
   <li>Trace dependencies through source, transformation, package, commit state and target.</li>
   <li>Validate intended relationship identity, not merely existence.</li>
   <li>Use timing patterns to detect sequencing failures.</li>
   <li>Validate reference combinations such as site plus warehouse, not only individual codes.</li>
   <li>Separate root-cause count from downstream affected-record count.</li>
   <li>Measure the full blast radius by business key.</li>
   <li>Run pre-load dependency checks where deterministic.</li>
   <li>Correct the prerequisite at its causal layer.</li>
   <li>Invalidate downstream checkpoints/packages that depend on changed upstream state.</li>
   <li>Rerun parent-to-child from the earliest corrected boundary.</li>
   <li>Retest relationships, sequencing, exceptions and duplicate protection.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>When a child record fails, the child may be telling you about somebody else's problem. Follow the dependency chain upstream until you find the first prerequisite that stopped being correct or available.</div>`
},
