   <li>Check whether other customers show the same symptom.</li>
   <li>Record the business keys and expected child/address keys.</li>
   <li>Separate observed sample from proven full affected population.</li>
   <li>Keep the population query so you can rerun it after the fix.</li>
 </ul>

WHERE c.RunId = @RunId

 id:"b4",nav:"The evidence chain",title:"Build the evidence chain",type:"content",
 html:`<p class="lead">For one affected record, C10482, the expected delivery address is C10482-DEL-02. Trace the same business object through the pipeline.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Checkpoint</th><th>Question</th></tr></thead><tbody>
 <tr><td>Source/raw extract</td><td>Did the expected address exist in the received data?</td></tr>
 <tr><td>Raw staging</td><td>Was it ingested correctly?</td></tr>
 <tr><td>Transformation input</td><td>Was it available to the transformation?</td></tr>
 <tr><td>Transformation output</td><td>Did it survive and receive the expected values?</td></tr>
 <tr><td>Load file/package</td><td>Was it submitted?</td></tr>
 <tr><td>Load result/log</td><td>Was it accepted, rejected or skipped?</td></tr>
 <tr><td>Target</td><td>Does the expected record exist and relate correctly?</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Troubleshooting rule 2</strong><br>Find the first checkpoint where the record stops matching expectation. That boundary usually gives you a much smaller problem to investigate.</div>`
},
{

 id:"b6",nav:"Symptom vs root cause",title:"Symptom, mechanism and root cause",type:"content",
 html:`<div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Layer</th><th>Bramwell example</th></tr></thead><tbody>
 <tr><td>Symptom</td><td>Seven reported key accounts have no delivery address in target</td></tr>
 <tr><td>Failure boundary</td><td>Address exists in raw stage but is absent from transformed stage</td></tr>
 <tr><td>Mechanism</td><td>Filter retains only DELIVERY_PRIMARY</td></tr>
 <tr><td>Rule mismatch</td><td>Approved intent is to exclude BILLING_ONLY, not exclude all non-primary delivery addresses</td></tr>
 <tr><td>Root cause</td><td>Transformation eligibility logic incorrectly implements the approved address-purpose rule</td></tr>
 <tr><td>Control weakness</td><td>Silent exclusion produced no exception/control alert</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Why the distinction matters</strong><br>\u2018Missing addresses\u2019 is not the root cause. \u2018Bad filter\u2019 is closer, but the useful diagnosis states exactly how the implemented logic differs from the approved rule and why valid records disappear.</div>`
},
{
 id:"b7",nav:"Beyond the seven",title:"Do not fix only the seven",type:"content",
 html:`<p class="lead">The ticket names seven customers. The rule defect can affect any valid address whose purpose is excluded by the incorrect filter. Your next task is to identify the full affected population.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">SQL: conceptual impact query</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>SELECT
  a.CustNo, a.AddressId, a.AddressPurpose
FROM raw.CustomerAddress a
WHERE a.RunId = @RunId
  AND a.AddressPurpose &lt;&gt; 'BILLING_ONLY'
  AND a.AddressPurpose &lt;&gt; 'DELIVERY_PRIMARY'
  AND NOT EXISTS (
    SELECT 1 FROM stage.CustomerAddressTransformed t
    WHERE t.RunId = a.RunId AND t.AddressId = a.AddressId
  );</code></pre></div>
 <div class="callout misconception"><div class="callout-label">Seven is your starting evidence, not the full picture</div><p>You know seven customers are affected because Customer Service noticed them. You do not yet know the true size of the affected population. Until the impact query above actually runs, resist stating a number you haven't proven.</p></div>`
},
{
 id:"b8",nav:"Define the fix",title:"Define the fix from the approved rule",type:"content",
 html:`<p class="lead">The fix should implement the business rule, not merely add the value that happened to fail.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Weak patch</th><th>Stronger correction</th></tr></thead><tbody>
 <tr><td>Allow DELIVERY_SECONDARY as well as DELIVERY_PRIMARY</td><td>Implement the approved eligibility rule: exclude BILLING_ONLY and retain all other address purposes that satisfy the approved migration rule</td></tr>
 <tr><td>Hard-code C10482-DEL-02</td><td>Correct the rule for the whole applicable population</td></tr>
 <tr><td>Insert seven target rows manually</td><td>Rerun controlled transformation/load from a valid boundary</td></tr>
 <tr><td>Suppress the issue</td><td>Add controls so future silent exclusions are detectable</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Troubleshooting rule 4</strong><br>Fix the faulty mechanism at the correct scope, not the examples that exposed it.</div>`
},
{
 id:"b9",nav:"Retest the diagnosis",title:"Retest the diagnosis, not just the happy path",type:"content",
 html:`<p class="lead">After the rule correction, prove more than "C10482 now appears."</p>
 <ol class="framework-checks">
   <li>Rerun the identified affected population from the valid transformation boundary.</li>
   <li>Confirm C10482-DEL-02 appears in transformed output.</li>
   <li>Confirm the other reported missing delivery addresses are treated as expected.</li>
   <li>Recalculate the full impact query and confirm the defect population is resolved or explicitly explained.</li>
   <li>Confirm BILLING_ONLY addresses remain excluded where required.</li>
   <li>Check that already-correct DELIVERY_PRIMARY records remain stable.</li>
   <li>Reconcile input eligible addresses to transformed + controlled exception/exclusion outcomes.</li>
   <li>Run downstream load/target validation for the corrected population.</li>
   <li>Record the build/rule version used for the successful retest.</li>
 </ol>
 <div class="callout misconception"><div class="callout-label">Regression test</div><p>A fix that restores DELIVERY_SECONDARY but accidentally loads BILLING_ONLY has not solved the problem.</p></div>`
},
{
 id:"b10",nav:"Add the control",title:"Add the missing control",type:"content",
 html:`<p class="lead">The original defect was dangerous because valid records disappeared silently. A useful control compares expected eligible population to transformed outcomes.</p>
 <div class="tp-code"><div class="tp-code-head"><span class="tp-code-lang">The control equation</span><button class="tp-code-copy" type="button">Copy</button></div><pre><code>ExpectedEligible
  = source addresses meeting approved migration eligibility

Accounted
  = transformed addresses
  + approved exclusions
  + controlled exceptions

ExpectedEligible - Accounted = 0</code></pre></div>
 <p>At record level, use business/address keys as well as counts.</p>
 <div class="principle"><strong>The best troubleshooting leaves the process stronger</strong><br>Do not stop at correcting the defect. Add the smallest useful control that would make the same class of failure visible next time.</div>`
},
{
 id:"b11",nav:"The diagnostic ladder",title:"The diagnostic ladder",type:"content",
 html:`<p class="lead">The Bramwell incident illustrates a reusable investigation pattern. It is a ladder, not a rigid script.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Diagnostic question</th><th>Purpose</th></tr></thead><tbody>
 <tr><td>What should have happened?</td><td>Defines expectation</td></tr>
 <tr><td>What actually happened?</td><td>Defines symptom</td></tr>
 <tr><td>Which records are affected?</td><td>Defines scope</td></tr>
 <tr><td>Where is the last known-good checkpoint?</td><td>Narrows boundary</td></tr>
 <tr><td>Where is the first known-bad checkpoint?</td><td>Narrows boundary</td></tr>
 <tr><td>What mechanisms could cause that transition?</td><td>Creates hypotheses</td></tr>
 <tr><td>Which evidence best discriminates between them?</td><td>Prioritises checks</td></tr>
 <tr><td>What does the evidence eliminate?</td><td>Prevents fixation</td></tr>
 <tr><td>What mechanism is now proven?</td><td>Supports diagnosis</td></tr>
 <tr><td>What is the full impact of that mechanism?</td><td>Prevents sample-only fixes</td></tr>
 <tr><td>What is the smallest controlled correction?</td><td>Reduces risk</td></tr>
 <tr><td>What proves the fix and guards regression?</td><td>Closes the incident</td></tr>
 </tbody></table></div>
 <p class="small">In a simple issue you may answer several questions in minutes. In a difficult one you may cycle through them repeatedly.</p>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Diagnostic-Checkpoint-Map-Template.docx</strong><p class="small">The twelve-question ladder above, ready to work through for any incident.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Diagnostic-Checkpoint-Map-Template.docx" download>Download</a></div>`
},

 id:"b13",nav:"Two more incidents",title:"A second incident, and a third",type:"content",
 html:`<h3>The tempting source-data diagnosis</h3>
 <p>Imagine a load rejects 86 records with "invalid country." A developer says the source countries are dirty.</p>
 <p>You inspect three rejected rows. Their source country is UK, which has an approved Bramwell mapping to GB.</p>
 <p>What should you investigate before asking the business to cleanse source data?</p>
 <ul class="framework-checks">
   <li>Was the correct reference version loaded?</li>
   <li>Did the lookup execute for the rejected records?</li>
   <li>Was the normalised match key correct?</li>
   <li>Did the transformed value contain GB before load?</li>
   <li>Did the load file/package contain GB?</li>
   <li>Is the target rejection genuinely about country, or is the error message attached to a wider validation failure?</li>
 </ul>
 <div class="principle"><strong>Lesson</strong><br>A business-looking error can be caused by technical configuration, stale reference data, transformation logic or load packaging. Diagnose the boundary before assigning ownership.</div>
 <h3>It worked on the rerun</h3>
 <p>A batch fails. You rerun it unchanged and it succeeds. Is the issue resolved?</p>
 <div class="callout misconception"><div class="callout-label">No</div><p>You have evidence of non-deterministic or environment-dependent behaviour. Possible causes include transient connectivity, timing/dependency, resource contention, uncommitted state, external service availability or concurrency. Record the failed and successful attempts and investigate what differed.</p></div>
 <p class="small">A successful rerun is an observation, not a root cause.</p>`
},
{
 id:"b14",nav:"The investigation notebook",title:"Your investigation notebook",type:"content",
 html:`<p class="lead">Use a compact log so your reasoning remains visible.</p>
 <div class="tp-table-wrap"><table class="tp-table tp-table--mono"><thead><tr><th>Time</th><th>Evidence / action</th><th>What it proves or eliminates</th><th>Next question</th></tr></thead><tbody>
 <tr><td>10:12</td><td>Seven target addresses reported missing</td><td>Defines observed sample</td><td>Are they present upstream?</td></tr>
 <tr><td>10:24</td><td>C10482-DEL-02 present raw</td><td>Eliminates extract/raw-loss for example</td><td>Present transformed?</td></tr>
 <tr><td>10:31</td><td>Absent transformed; no exception</td><td>Bounds failure to transformation/control</td><td>What transformation conditions differ?</td></tr>
 <tr><td>10:40</td><td>Good vs bad differs on AddressPurpose</td><td>Supports filter hypothesis</td><td>Inspect approved/implemented rule</td></tr>
 <tr><td>10:47</td><td>Implemented filter = DELIVERY_PRIMARY only</td><td>Explains exclusion mechanism</td><td>Does this differ from approved intent?</td></tr>
 <tr><td>10:55</td><td>Approved rule excludes BILLING_ONLY</td><td>Proves rule mismatch</td><td>Find full affected population</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Why timestamps help</strong><br>They are useful during live incidents, but the real value is the evidence trail. Another consultant should be able to see why you changed direction.</div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Investigation-Log-Template.xlsx</strong><p class="small">The four-column notebook shape above, ready to use for any live incident.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Investigation-Log-Template.xlsx" download>Download</a></div>`
},
{
 id:"b15",nav:"Independent case",title:"Independent case \u2014 Diagnose the disappearing orders",type:"reflection",
 html:`<p class="lead">You receive a synthetic migration incident. Expected: 24,380 in-scope open sales orders should reach transformed output. Observed: 24,117 are present. No transformation failure is reported.</p>
 <p>Evidence is released only when requested: source population query and keys; raw-stage counts and samples; transformation SQL; reference coverage report; exception output; run/step logs; good-versus-missing record comparison; previous-cycle output; build/reference versions.</p>
 <h3>Your deliverables</h3>
 <ol class="framework-checks">
   <li>Write a factual defect statement.</li>
   <li>Define the observed and then proven affected population.</li>
   <li>Draw the checkpoint chain.</li>
   <li>Identify last known-good and first known-bad evidence.</li>
   <li>Maintain at least three competing hypotheses until evidence eliminates them.</li>
   <li>Choose the next evidence request and explain why it has high information value.</li>
   <li>State the proven mechanism and root cause separately.</li>
   <li>Identify the full impact population.</li>
   <li>Recommend the smallest controlled fix.</li>
   <li>Design regression tests and a control that would detect recurrence.</li>
   <li>Write a five-line incident update for the DML/project team.</li>
 </ol>
 <p class="lead">Write your five-line incident update below.</p>
 <textarea id="reflection" placeholder="263 expected order keys..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>
 <div class="tp-download" style="margin-top:20px"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Impact-Query-Patterns.sql</strong><p class="small">The affected-population and reconciliation query shapes from this lesson, ready to adapt.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Impact-Query-Patterns.sql" download>Download</a></div>
 <div class="tp-download"><div class="tp-download-icon">&#8681;</div><div class="tp-download-body"><strong>DMC3_Incident-Update-Template.docx</strong><p class="small">A five-line incident update shape, ready to fill in for any live defect.</p></div><a class="btn secondary" href="/assets/downloads/DMC3_Incident-Update-Template.docx" download>Download</a></div>`,
 minLength:60,
 checks:[
   { test:/24,?380|24,?117|expected.*observed|absent/i, strength:"You wrote a factual defect statement grounded in the actual numbers.", gap:"State the defect factually: how many order keys were expected versus actually present in transformed output." },
   { test:/checkpoint|boundary|raw|transform/i, strength:"You addressed the checkpoint chain and where the boundary sits.", gap:"State where in the pipeline the record last matched expectation, and where it first didn't." },
   { test:/hypothes/i, strength:"You maintained multiple hypotheses rather than jumping to one cause.", gap:"Name at least two competing hypotheses you considered, not just the one you settled on." },
   { test:/impact|full population|affected population/i, strength:"You addressed the full impact population, not just the reported sample.", gap:"State how you'd confirm the full population affected by the mechanism, not just the reported gap." },
   { test:/control|regression|recur/i, strength:"You proposed a control that would detect recurrence.", gap:"Name a specific control you'd add so the same failure becomes visible automatically next time." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">263 expected order keys were absent from transformed output but present in the controlled raw-stage population. Comparison of affected and unaffected records isolated the divergence to the transformation eligibility rule. The implemented condition excluded a valid source state that the approved mapping rule includes. The rule has been corrected under a new build version, the full affected population has been reprocessed, expected exclusions remain excluded, and key-level reconciliation now accounts for the complete eligible population.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This reads like a genuine incident update: specific numbers, a proven mechanism, and reconciliation evidence, not a vague 'we think it's fixed.'":"You have the right structure. Make sure your defect statement uses the actual numbers, and that your update states a proven mechanism, not a suspected one."}</div>`
},
{
 id:"b16",nav:"A strong diagnosis",title:"What a strong diagnosis sounds like",type:"content",
 html:`<div class="callout misconception"><div class="callout-label">Weak</div><p>\u201c263 orders were missing because the filter was wrong. We changed it and reran.\u201d</p></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Strong</div><p>\u201c263 expected order keys were absent from transformed output but present in the controlled raw-stage population. Comparison of affected and unaffected records isolated the divergence to the transformation eligibility rule. The implemented condition excluded a valid source state that the approved mapping rule includes. The rule has been corrected under a new build version, the full affected population has been reprocessed, expected exclusions remain excluded, and key-level reconciliation now accounts for the complete eligible population.\u201d</p></div></div>`
},
{
 id:"b17",nav:"Communicating during diagnosis",title:"Consultant communication during diagnosis",type:"content",
 html:`<p class="lead">Do not wait for root cause before communicating, but label certainty correctly.</p>
 <div class="tp-table-wrap"><table class="tp-table"><thead><tr><th>Stage</th><th>Useful language</th></tr></thead><tbody>
 <tr><td>Symptom only</td><td>\u201cWe have confirmed seven affected records; cause not yet established.\u201d</td></tr>
 <tr><td>Boundary found</td><td>\u201cThe records exist in raw stage but are absent after transformation. We are investigating transformation logic and controls.\u201d</td></tr>
 <tr><td>Hypothesis supported</td><td>\u201cAddressPurpose is the main discriminating factor; we are validating the implemented rule against the approved rule.\u201d</td></tr>
 <tr><td>Root cause proven</td><td>\u201cThe transformation retained only DELIVERY_PRIMARY although the approved rule excludes BILLING_ONLY. This silently removed valid secondary delivery addresses.\u201d</td></tr>
 <tr><td>Fix/retest</td><td>\u201cCorrection is implemented; we are rerunning the full affected population and regression controls before closing.\u201d</td></tr>
 </tbody></table></div>
 <div class="principle"><strong>Professional credibility</strong><br>Saying \u2018we do not yet know\u2019 is stronger than presenting an untested theory as fact.</div>
 <div class="to-record">${TPKit.fromField({
   title:"The Fix That Was Too Fast", name:"Sam", role:"Data Migration Consultant", project:"Energy ERP",
   src:"/assets/audio/FixThatWasTooFast-Sam.mp3",
   reflection:"What control or habit in this story would you carry into your own migration work?"
 })}</div>`
},
{
 id:"b18",nav:"Reflection",title:"Reflection \u2014 What evidence would change your mind?",type:"reflection",
 html:`<p class="lead">Think of a migration defect where you feel you already know the likely cause. Write your leading hypothesis, then write two pieces of evidence that would prove you wrong.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Reflection coaching</div><p>This is one of the most useful troubleshooting habits. If you cannot imagine evidence that would change your diagnosis, you may be defending a belief rather than testing a hypothesis.</p></div></div>
 <textarea id="reflection" placeholder="My leading hypothesis is..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/hypothes|cause|believe|think/i, strength:"You stated a specific leading hypothesis.", gap:"State your actual leading hypothesis for a real or imagined defect, not just the topic area." },
   { test:/prove.*wrong|disprove|evidence.*(change|against)/i, strength:"You named specific evidence that would prove your hypothesis wrong.", gap:"Name two specific pieces of evidence that, if you saw them, would make you abandon your current hypothesis." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">My leading hypothesis: a batch of rejected records failed because of a stale reference version. Two things that would prove me wrong: if the run record shows the correct, current reference version was actually loaded for this run; or if the rejected records still fail even after confirming the reference match key was correctly normalised before lookup. If either of those turns up, the reference-version theory is dead and I need a new hypothesis.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is exactly the habit the lesson is built around: naming what would actually change your mind, not just restating your theory more confidently.":"You have the right instinct. Make sure the evidence you named would genuinely disprove your hypothesis, not just add more support to it."}</div>`
},
{
 id:"b19",nav:"Summary",title:"Summary \u2014 Diagnose before you fix",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>State expected versus observed behaviour before proposing a cause.</li>
   <li>Identify business keys and prove the affected population.</li>
   <li>Preserve the failing evidence before changing or rerunning.</li>
   <li>Trace the same record through migration checkpoints.</li>
   <li>Find the last known-good and first known-bad state.</li>
   <li>Generate competing hypotheses that predict checkable evidence.</li>
   <li>Choose the next check for information value, not convenience.</li>
   <li>Distinguish symptom, failure mechanism, root cause and control weakness.</li>
   <li>Find the full population affected by the mechanism, not just the reported examples.</li>
   <li>Fix the approved rule or mechanism at the correct scope.</li>
   <li>Retest affected records, already-correct records and excluded cases.</li>
   <li>Reconcile the population after the fix.</li>
   <li>Add a control that makes recurrence visible.</li>
   <li>Communicate what is known, suspected and proven separately.</li>
 </ul>
 <div class="principle"><strong>The one thing to remember</strong><br>The fastest reliable troubleshooter is not the person who proposes the first fix. It is the person who reduces uncertainty quickly, preserves evidence and can prove where the data first stopped behaving as expected.</div>`
},
