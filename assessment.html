
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turner Page - Lesson 1 Assessment</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;background:#f4f8f8}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
button{padding:10px 18px;border:0;border-radius:8px;background:#006b73;color:#fff;cursor:pointer}
button:disabled{opacity:.4}
.progress{margin-bottom:20px;font-weight:bold}
.option{display:block;margin:10px 0;padding:10px;border:1px solid #ccc;border-radius:8px;cursor:pointer}
.option input{margin-right:10px}
</style>
</head>
<body>
<div class="card">
<h1>Lesson 1 Assessment</h1>
<div id="quiz"></div>
</div>

<script>
const questions=[
{q:"Migration validation is 97% complete. What is the best response?",a:2,o:["Recommend Go","Recommend No-Go","Gather more evidence before recommending","Ask the Technical Lead"]},
{q:"Primary role of a Data Migration Lead?",a:2,o:["Own every task","Approve ETL","Gather evidence and recommend","Decide Go-Live"]},
{q:"Which is NOT part of the Readiness Framework?",a:3,o:["Data","Business","Risk","Budget"]},
{q:"Successful load means data is ready.",a:1,o:["True","False"]},
{q:"97% complete can mislead because...",a:1,o:["Percentages are bad","Remaining 3% may contain highest risk","Testing should stop","ETL failed"]},
{q:"Who decides Go-Live?",a:3,o:["DML","Tech Lead","PM","Programme Governance"]},
{q:"First question?",a:2,o:["Is ETL done?","Any defects?","Do we have enough evidence?","Has testing finished?"]},
{q:"Professional judgement is...",a:1,o:["Quick answers","Evidence-based recommendations","Instinct","Waiting"]},
{q:"Users operating successfully relates to...",a:2,o:["Environment","Risk","Business Readiness","ETL"]},
{q:"Rehearsals prove...",a:1,o:["Data quality","Migration process","Budget","Governance"]},
{q:"Infrastructure belongs to...",a:2,o:["Data","Business","Environment","Risk"]},
{q:"Best statement on risk?",a:2,o:["Remove all","High defect=NoGo","Understand, mitigate, accept","Ignore"]},
{q:"Finance data ownership?",a:1,o:["DML","Finance","PM","ETL"]},
{q:"The DML owns...",a:1,o:["Every task","Migration workstream","Business","All risks"]},
{q:"Leadership means...",a:2,o:["Wait","Hide issues","Surface issues early","Avoid conflict"]},
{q:"Invoice defect: assess...",a:1,o:["Defect count","Business impact","ETL","Environment"]},
{q:"Rehearsals are valuable because...",a:2,o:["Replace docs","Remove risk","Prove execution","Save time"]},
{q:"Evidence is...",a:2,o:["Opinion","Confidence","Information supporting a recommendation","Optimism"]},
{q:"Missing information?",a:2,o:["Guess","Go","Explain what evidence is needed","No-Go"]},
{q:"An experienced DML primarily...",a:3,o:["Writes ETL","Fixes everything","Runs all workstreams","Provides evidence-based recommendations"]}
];

let i=0,score=0,answers=[];
const quiz=document.getElementById("quiz");

function render(){
 if(i>=questions.length){finish();return;}
 const q=questions[i];
 quiz.innerHTML=`<div class="progress">Question ${i+1} of ${questions.length}</div>
 <h2>${q.q}</h2>
 ${q.o.map((x,n)=>`<label class="option"><input type="radio" name="a" value="${n}">${String.fromCharCode(65+n)}. ${x}</label>`).join("")}
 <p><button id="prev" ${i==0?"disabled":""}>Previous</button>
 <button id="next" disabled>Next</button></p>`;
 document.querySelectorAll("input").forEach(r=>{
   if(answers[i]!==undefined && +r.value===answers[i]) r.checked=true;
   r.onchange=()=>{
      answers[i]=+r.value;
      document.getElementById("next").disabled=false;
   };
 });
 document.getElementById("prev").onclick=()=>{i--;render();};
 document.getElementById("next").onclick=()=>{i++;render();};
}
function finish(){
 score=0;
 answers.forEach((a,n)=>{if(a===questions[n].a)score++;});
 const pass=score>=16;
 quiz.innerHTML=`<h2>Assessment Complete</h2>
 <h3>Score: ${score}/20</h3>
 <h2 style="color:${pass?"green":"#b00"}">${pass?"PASS":"NOT PASSED THIS TIME"}</h2>
 <h3>Strengths</h3>
 <ul><li>Evidence-based thinking</li><li>Migration readiness</li><li>Professional judgement</li></ul>
 <h3>Areas to revisit</h3>
 <ul><li>Business readiness</li><li>Residual risk</li><li>Ownership boundaries</li></ul>
 <p>${pass?
 '<button onclick="location.href=\'certificate.html\'">Proceed to Certificate</button>':
 '<button onclick="location.href=\'lesson.html\'">Return to Lesson</button>'}
 </p>`;
}
render();
</script>
</body>
</html>
