<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turner Page — Thinking Like a Data Migration Lead</title>
<style>
:root{--deep:#00586A;--teal:#007C89;--aqua:#6EDBDC;--bright:#00AFC8;--ink:#11333B;--mist:#F4FAFA;--line:#D5EEEE;--good:#087F5B}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--mist);color:var(--ink);line-height:1.55}
button,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:auto;padding:12px 22px;display:flex;align-items:center;gap:18px}.logo{width:46px;height:46px;border-radius:14px;background:var(--deep);color:#fff;display:grid;place-items:center;font-weight:900}
.brand{flex:1}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--teal);font-weight:800}.brand h1{font-size:18px;margin:1px 0}
.bar{height:5px;background:#dff2f2}.bar div{height:100%;background:var(--bright);transition:.3s}
.layout{max-width:1180px;margin:auto;display:grid;grid-template-columns:280px 1fr;gap:24px;padding:28px 22px 70px}.side{position:sticky;top:86px;align-self:start}.card,.lesson{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 22px rgba(0,60,70,.06)}.card{padding:20px}.lesson{padding:42px}
.muted{color:#60777d;font-size:14px}.nav{display:grid;gap:6px;margin-top:14px}.nav button{border:0;background:transparent;border-radius:12px;padding:9px 10px;text-align:left;color:#547077}.nav button.active{background:#e7f8f8;color:var(--deep);font-weight:800}.nav button.done:before{content:"✓ ";color:var(--good)}
h2{font-size:40px;line-height:1.12;margin:10px 0 18px}h3{font-size:23px;margin:28px 0 10px}.lead{font-size:19px;color:#35575f}.quote{border-left:5px solid var(--aqua);background:#effafa;border-radius:0 16px 16px 0;padding:18px 20px;margin:22px 0;font-size:20px;font-weight:750}
.status{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}.status div{border:1px solid var(--line);background:#fbfefe;border-radius:16px;padding:14px}.status b{display:block}
.options{display:grid;gap:10px;margin:16px 0}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px;text-align:left;width:100%;color:var(--ink)}.option.selected{border:2px solid var(--bright);background:#eafafa}.badge{min-width:28px;height:28px;border-radius:50%;background:#e6f5f5;color:var(--deep);display:grid;place-items:center;font-weight:900}
.feedback{border-radius:16px;padding:16px;margin:14px 0;background:#eef9fa;border:1px solid #bce5e7}.good{background:#eaf8f2;border-color:#a4ddc6}.warn{background:#fff8e8;border-color:#ead39e}.principle{background:var(--deep);color:#fff;border-radius:20px;padding:22px;margin:26px 0}
.actions{display:flex;justify-content:space-between;margin-top:34px}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800}.primary{background:var(--deep);color:#fff}.secondary{background:#e7f7f7;color:var(--deep)}.btn:disabled{opacity:.4}
.framework,.mentor{border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;background:#fbfefe}.own{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.own>div{border:1px solid var(--line);border-radius:18px;padding:16px;background:#fbfefe}.behaviour{border-left:4px solid var(--bright);padding-left:16px;margin:18px 0}
textarea{width:100%;min-height:170px;padding:14px;border:1px solid var(--line);border-radius:16px}.complete{text-align:center}.tick{font-size:58px;color:var(--good)}
@media(max-width:840px){.layout{grid-template-columns:1fr;padding:18px 12px}.side{position:static}.nav{display:none}.lesson{padding:24px 18px}.status,.own{grid-template-columns:1fr}h2{font-size:31px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="logo">TP</div><div class="brand"><div class="eyebrow">Turner Page Academy</div><h1>Data Migration Lead Programme</h1></div><strong id="pct">0%</strong></div><div class="bar"><div id="bar"></div></div></header>
<div class="layout"><aside class="side"><div class="card"><div class="eyebrow">Module 1</div><h3>The Data Migration Lead Mindset</h3><p class="muted">Lesson 1 · Thinking Like a Data Migration Lead</p><div class="nav" id="nav"></div></div></aside><main class="lesson" id="lesson"></main></div>
<script>
const K="tp-thinking-l1";let S=JSON.parse(localStorage.getItem(K)||'{"i":0,"done":[],"a":{},"r":""}');
const five=[
["Is the data ready?","Is it sufficiently complete and accurate? Are known issues understood and accepted?"],
["Has the migration process been proven?","Has it been rehearsed? Can it be repeated consistently? Do we trust the process?"],
["Is the business ready?","Can users operate successfully afterwards? Are support teams prepared?"],
["Are the environments ready?","Are infrastructure, security, integrations and permissions ready?"],
["Are the remaining risks understood?","Do we understand their impact, ownership and mitigation?"]
];
const ownQ=[
["ETL packages are behind schedule.","mine","The DMCs may build them, but the DML owns successful delivery of the ETL workstream."],
["Finance data contains invalid payment terms.","other","Finance owns its data. The DML ensures the issue and impact are managed."],
["Validation criteria have not been agreed.","shared","The DML drives the process, but the business and project agree the criteria."],
["The programme needs a migration readiness recommendation.","mine","Providing an evidence-based recommendation is a core DML responsibility."],
["A technical defect requires a code fix.","other","The technical team fixes it. The DML assesses its impact on readiness."],
["The project must decide Go or No-Go.","shared","Governance owns the final decision. The DML provides the evidence and recommendation."]
];
const B=[
{id:"b1",nav:"Challenge",title:"Are We Ready to Migrate?",type:"single",html:`<p class="lead">It's Friday afternoon. Next weekend is the first full migration rehearsal.</p><p>The Programme Manager asks for your recommendation.</p><div class="status"><div><b>ETL development</b>Complete</div><div><b>Migration environments</b>Ready</div><div><b>Migration validation</b>97% complete</div><div><b>Customer data</b>380 records accepted with missing payment terms</div><div><b>Critical defects</b>Two high-priority defects remain open</div></div><div class="quote">“David, are we ready to migrate next weekend?”</div><h3>Your instinctive response</h3>`,opts:["We're ready to migrate.","We're not ready to migrate.","We're ready, provided the remaining risks are resolved.","I need further evidence before I can make a recommendation."],fb:["You may eventually recommend Go, but the status summary does not yet explain the impact of the outstanding issues.","You may eventually recommend No-Go, but the status summary does not yet show that the remaining issues prevent a safe migration.","Go with conditions may be right, but you need more evidence before defining those conditions.","This is the strongest response. You have status information, but not enough evidence to justify a recommendation."]},
{id:"b2",nav:"Why the role exists",title:"Why This Role Exists",type:"content",html:`<p class="lead">Most people imagine the Data Migration Lead as the person responsible for moving data.</p><p>That is only part of the role.</p><p>An experienced DML helps the programme make informed migration decisions. They bring together technical evidence, business readiness, project status and risk.</p><p>The Programme Manager did not ask whether ETL had finished. They asked:</p><div class="quote">“Are we ready?”</div><p>That requires judgement—and judgement must be built on evidence.</p><div class="principle"><strong>Key principle</strong><br>A DML is not there simply to move data. They ensure the programme understands what is required for migration to succeed.</div>`},
{id:"b3",nav:"Five questions",title:"The Five Questions Every DML Asks",type:"framework",html:`<p class="lead">Whenever an experienced DML is asked “Are we ready?”, they build a complete picture.</p><p>Explore all five questions.</p>`},
{id:"b4",nav:"Apply the framework",title:"Return to the Original Scenario",type:"multi",html:`<p>You now have a framework. Which evidence is still missing?</p>`,opts:["The business impact of the missing payment terms.","What the remaining 3% of validation covers.","The impact and mitigation of the two open defects.","Whether the migration process has been rehearsed successfully.","Whether the business has accepted the remaining risks."],fb:`You are no longer guessing from a traffic-light report. You are asking what evidence is needed before recommending.<div class="principle"><strong>That is the first shift from technical specialist to Data Migration Lead.</strong></div>`},
{id:"b5",nav:"Ownership",title:"What Does a Data Migration Lead Own?",type:"content",html:`<p class="lead">The DML owns the migration workstream, but not every task connected with it.</p><div class="own"><div><h3>Owns</h3><ul><li>Migration strategy</li><li>Planning</li><li>Reporting</li><li>Risks</li><li>Readiness recommendation</li></ul></div><div><h3>Influences</h3><ul><li>Business decisions</li><li>Project planning</li><li>Cutover planning</li><li>Governance</li><li>Go-live decisions</li></ul></div><div><h3>Supports</h3><ul><li>DMCs and developers</li><li>Test teams</li><li>Data owners</li><li>Functional consultants</li><li>Infrastructure teams</li></ul></div></div><div class="principle"><strong>Key principle</strong><br>You own the migration workstream. You do not personally own every task required to deliver it.</div>`},
{id:"b6",nav:"Ownership in practice",title:"Ownership in Practice",type:"ownership",html:`<p>For each situation, decide whether it is your responsibility, shared responsibility, or primarily owned elsewhere.</p>`},
{id:"b7",nav:"How great DMLs think",title:"How Great Data Migration Leads Think",type:"content",html:`<p class="lead">Technical ability gets you onto a migration project. Professional judgement earns trust.</p><div class="behaviour"><h3>They seek evidence before recommending.</h3><p>Opinions are useful. Evidence is essential.</p></div><div class="behaviour"><h3>They communicate clearly.</h3><p>Senior stakeholders need the decision, impact and risk—not a technical data dump.</p></div><div class="behaviour"><h3>They surface problems early.</h3><p>Bad news early is manageable. Bad news late becomes a crisis.</p></div><div class="behaviour"><h3>They understand business impact.</h3><p>Success is measured by the business operating successfully afterwards.</p></div><div class="behaviour"><h3>They remain objective under pressure.</h3><p>Trusted DMLs continue to assess evidence honestly as go-live approaches.</p></div>`},
{id:"b8",nav:"New project",title:"A New Project",type:"single",html:`<p class="lead">Different ERP. Different customer. Different pressure.</p><div class="status"><div><b>ETL</b>Complete</div><div><b>Validation</b>100% complete</div><div><b>Business sign-off</b>Complete</div><div><b>Infrastructure</b>Ready</div><div><b>Critical defect</b>One reporting defect remains open</div></div><p>The defect does not affect migration execution, but Purchasing uses the report daily.</p><div class="quote">Programme Manager: “What's your recommendation?”</div>`,opts:["Delay until the report is fixed.","Proceed because migration is unaffected.","Assess operational impact, workaround, ownership and residual risk before recommending.","Ask the Technical Lead to decide."],fb:["You may eventually recommend delay, but first establish the actual impact and available mitigation.","Technical readiness is not the whole picture. The business must be able to operate afterwards.","This is the strongest response. You are using the framework rather than reacting to one issue.","The Technical Lead provides evidence. The DML integrates it into the recommendation."]},
{id:"b9",nav:"Reflection",title:"How Do You Decide Whether You're Ready?",type:"reflection",html:`<p>Return to the original question:</p><div class="quote">“Are we ready to migrate?”</div><p>Explain how a DML should decide.</p><textarea id="r" placeholder="A Data Migration Lead should..."></textarea><div id="rf"></div>`},
{id:"b10",nav:"Summary",title:"If You Remember Nothing Else...",type:"content",html:`<p class="lead">A DML does not simply know the answer.</p><p>They ensure the programme has enough evidence to make the right decision.</p><ul><li>Build a complete picture before recommending.</li><li>Assess data, process, business, environments and risk.</li><li>Own the migration workstream—not every task.</li><li>Understand business impact, not just technical status.</li><li>Remain objective when pressure increases.</li></ul><div class="principle"><strong>Evidence before recommendation.</strong><br>That is the habit at the heart of effective Data Migration Leadership.</div>`},
{id:"b11",nav:"Complete",title:"Congratulations",type:"content",html:`<div class="complete"><div class="tick">✓</div><p class="lead"><strong>You've completed Lesson 1: Thinking Like a Data Migration Lead.</strong></p><p>You now have a practical framework for approaching migration decisions as a leader rather than simply carrying out technical tasks.</p></div><h3>Next lesson</h3><p><strong>The Data Migration Lead Within the ERP Project</strong></p>`}
];
const L=document.getElementById("lesson"),N=document.getElementById("nav");
function save(){localStorage.setItem(K,JSON.stringify(S))}
function mark(id){if(!S.done.includes(id))S.done.push(id)}
function renderNav(){N.innerHTML="";B.forEach((b,i)=>{let x=document.createElement("button");x.textContent=(i+1)+". "+b.nav;x.className=(i===S.i?"active ":"")+(S.done.includes(b.id)?"done":"");x.onclick=()=>{if(i<=S.i||S.done.includes(b.id)){S.i=i;save();render()}};N.appendChild(x)})}
function render(){
 const b=B[S.i];L.innerHTML=`<div class="eyebrow">Lesson 1 · Block ${S.i+1} of ${B.length}</div><h2>${b.title}</h2>${b.html}<div id="dyn"></div><div class="actions"><button id="back" class="btn secondary">Back</button><button id="next" class="btn primary">Continue</button></div>`;
 let ready=b.type==="content",D=document.getElementById("dyn");
 if(b.type==="single"){let s=S.a[b.id];let w=document.createElement("div");w.className="options";b.opts.forEach((o,j)=>{let x=document.createElement("button");x.className="option"+(s===j?" selected":"");x.innerHTML=`<span class="badge">${String.fromCharCode(65+j)}</span><span>${o}</span>`;x.onclick=()=>{S.a[b.id]=j;save();render()};w.appendChild(x)});D.appendChild(w);if(s!==undefined){D.insertAdjacentHTML("beforeend",`<div class="feedback">${b.fb[s]}</div>`);ready=true}}
 if(b.type==="multi"){let s=S.a[b.id]||[];let w=document.createElement("div");w.className="options";b.opts.forEach((o,j)=>{let on=s.includes(j),x=document.createElement("button");x.className="option"+(on?" selected":"");x.innerHTML=`<span class="badge">${on?"✓":"+"}</span><span>${o}</span>`;x.onclick=()=>{let t=new Set(s);t.has(j)?t.delete(j):t.add(j);S.a[b.id]=[...t];save();render()};w.appendChild(x)});D.appendChild(w);if(s.length){D.insertAdjacentHTML("beforeend",`<div class="feedback">${b.fb}</div>`);ready=true}}
 if(b.type==="framework"){let s=S.a.b3||[];five.forEach((f,j)=>{let x=document.createElement("div");x.className="framework";x.innerHTML=`<h3>${j+1}. ${f[0]}</h3>${s.includes(j)?`<p>${f[1]}</p>`:""}<button class="btn secondary">${s.includes(j)?"Hide":"Explore"}</button>`;x.querySelector("button").onclick=()=>{let t=new Set(s);t.has(j)?t.delete(j):t.add(j);S.a.b3=[...t];save();render()};D.appendChild(x)});ready=s.length===five.length}
 if(b.type==="ownership"){let a=S.a.b6||{};ownQ.forEach((q,j)=>{let x=document.createElement("div");x.className="mentor";x.innerHTML=`<div class="eyebrow">Situation ${j+1}</div><h3>${q[0]}</h3>`;[["mine","My responsibility"],["shared","Shared responsibility"],["other","Someone else owns it"]].forEach((v,k)=>{let y=document.createElement("button");y.className="option"+(a[j]===v[0]?" selected":"");y.innerHTML=`<span class="badge">${String.fromCharCode(65+k)}</span><span>${v[1]}</span>`;y.onclick=()=>{a[j]=v[0];S.a.b6=a;save();render()};x.appendChild(y)});if(a[j])x.insertAdjacentHTML("beforeend",`<div class="feedback ${a[j]===q[1]?"good":"warn"}">${a[j]===q[1]?"Your answer aligns with Turner Page thinking.":"Consider the ownership boundary again."}<br>${q[2]}</div>`);D.appendChild(x)});ready=Object.keys(a).length===ownQ.length}
 if(b.type==="reflection"){let r=document.getElementById("r");r.value=S.r||"";r.oninput=()=>{S.r=r.value;save();document.getElementById("next").disabled=r.value.trim().length<40};ready=(S.r||"").trim().length>=40;if(ready){let t=S.r.toLowerCase(),hits=[];/evidence|facts|status|validation/.test(t)&&hits.push("evidence");/risk|impact|mitigat/.test(t)&&hits.push("risk");/business|user|operate/.test(t)&&hits.push("business readiness");/environment|infrastructure|security|integration/.test(t)&&hits.push("environment readiness");document.getElementById("rf").innerHTML=`<div class="feedback"><strong>Turner Page Coach</strong><br>Your answer refers to: ${hits.length?hits.join(", "):"the decision itself"}. A strong answer should explain that the DML builds a complete picture across data, process, business readiness, environments and residual risk before recommending.</div>`}}
 document.getElementById("back").disabled=S.i===0;document.getElementById("back").onclick=()=>{if(S.i>0){S.i--;save();render();scrollTo(0,0)}};document.getElementById("next").disabled=!ready||S.i===B.length-1;document.getElementById("next").onclick=()=>{if(!ready)return;mark(b.id);S.i++;save();render();scrollTo(0,0)};
 let p=Math.round(S.done.length/B.length*100);document.getElementById("bar").style.width=p+"%";document.getElementById("pct").textContent=p+"%";renderNav()
}
renderNav();render();
</script>
</body></html>
