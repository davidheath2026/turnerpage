<style>
:root{
  --ink:#102f36; --deep:#005f6c; --teal:#0b7f8e; --aqua:#7dd8d8;

    <strong id="progressText">0%</strong>
  </div>

<div class="layout">

      <h2>The Data Migration Lead mindset</h2>
      <p class="meta">Lesson 1: Thinking like a Data Migration Lead<br><span class="small">Making evidence-based decisions</span></p>
      <div class="progress-row"><span>Lesson progress</span><strong id="sideProgress">0%</strong></div>
      <div class="lesson-nav" id="lessonNav"></div>
    </div>
  </aside>

  <main class="panel lesson" id="lesson"></main>
</div>

<script>
const STORAGE_KEY="tp_lesson1_premium";
let state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{"index":0,"completed":[],"answers":{},"reflection":"","valuable":""}');

const fiveQuestions=[
  {
    title:"Is the data ready?",
    short:"Completeness, accuracy and accepted issues",
    detail:`<p>This is not the same as asking whether the data loaded successfully.</p>
    <p>A successful load proves that the migration process can move records. It does not prove that the records are complete, accurate or usable.</p>
    <p>An experienced Data Migration Lead asks whether known issues are understood, whether the affected data is material to the business, and whether the right people have accepted the consequences.</p>
    <div class="callout experience"><div class="callout-label">Turner Page insight</div><p>A project once reported that 99.8% of customer records had migrated successfully. The remaining 0.2% included several of the organisation's largest customers. The percentage looked excellent. The business impact did not.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>Data readiness is about usability and understood risk, not a perfect percentage.</div>`
  },
  {
    title:"Has the migration process been proven?",
    short:"Rehearsal, repeatability and reconciliation",
    detail:`<p>A migration process that has never been executed successfully is still unproven.</p>
    <p>Documentation matters, but successful rehearsals provide stronger evidence. They show whether the process can be repeated, whether teams understand their roles, whether reconciliations work, and whether the migration fits inside the available outage window.</p>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>If the runbook is complete, the process is ready.</p><p>A runbook records intent. A successful rehearsal provides evidence.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>Execution confidence comes from rehearsal, not optimism.</div>`
  },
  {
    title:"Is the business ready?",
    short:"Operational continuity and accepted risk",
    detail:`<p>This is often the most underestimated part of migration readiness.</p>
    <p>The technical migration may succeed while the business still struggles on Monday morning. Users may lack access, reports may be unavailable, support teams may be unprepared, or critical processes may rely on data that was never validated properly.</p>
    <p>The Data Migration Lead should understand whether users can operate, whether business owners have signed off the results, and whether remaining risks have been accepted by the people responsible for running the organisation afterwards.</p>
    <div class="principle"><strong>Key takeaway</strong><br>Migration success is measured by business continuity, not records loaded.</div>`
  },
  {
    title:"Are the environments ready?",
    short:"Infrastructure, access, integrations and performance",
    detail:`<p>Even a well-designed migration process can fail in an unstable environment.</p>
    <p>Environment readiness includes infrastructure, security, permissions, connectivity, integrations, performance, monitoring and operational support.</p>
    <p>The right question is not simply whether an environment exists. It is whether the complete technical landscape can support both the migration and the business immediately afterwards.</p>
    <div class="callout experience"><div class="callout-label">Turner Page insight</div><p>Many environment failures are not caused by missing servers. They are caused by overlooked dependencies: expired credentials, incomplete firewall rules, unavailable interfaces or permissions that were tested with the wrong user profile.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>An environment is ready only when the end-to-end process can operate inside it.</div>`
  },
  {
    title:"Are the remaining risks understood?",
    short:"Impact, ownership, mitigation and acceptance",
    detail:`<p>No project reaches migration with zero risk.</p>
    <p>The professional question is whether the remaining risks are understood well enough to be managed. That means knowing what could go wrong, what the business impact would be, who owns the mitigation, and whether governance has accepted the residual risk.</p>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>A high-priority defect automatically means No-Go.</p><p>Not necessarily. Severity labels are useful, but business impact is what matters. A reporting defect with a reliable workaround may be acceptable. A defect that prevents invoices being raised may not be.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>Good projects do not eliminate every risk. They understand and manage risk intelligently.</div>`
  }
];

const blocks=[
{
 id:"b1",nav:"The challenge",title:"Are we ready to migrate?",type:"single",
 html:`<div class="promise">
 <div class="kicker">Our promise</div>
 <h3>The Turner Page Promise</h3>
 <p>We believe professional training should do more than transfer knowledge. It should improve professional judgement.</p>
 <p>Everything in this programme has been chosen because it helps you become a better Data Migration Lead on a real ERP project.</p>
 <div class="promise-lines"><div>Frameworks</div><div>Scenarios</div><div>Reflection</div><div>Assessment</div></div>
 <p><strong>If it does not improve the way you think, communicate or make decisions, it does not belong in this course.</strong></p>
 </div>
 <div class="callout experience">
 <div class="callout-label">Before you begin</div>
 <p>This lesson is not designed to test how much you already know. It is designed to change the way you think.</p>
 <p>By the end, you should approach migration readiness differently from how you did at the start.</p>
 </div>
 <p class="lead">It is Friday afternoon. The first full migration rehearsal is scheduled for next weekend.</p>
 <p>Senior stakeholders want reassurance. You have just reviewed the latest migration status when the Programme Manager asks for your recommendation.</p>
 <div class="status-grid">
   <div class="status-card"><strong>ETL development</strong>Complete</div>
   <div class="status-card"><strong>Migration environments</strong>Ready</div>
   <div class="status-card"><strong>Migration validation</strong>97% complete</div>
   <div class="status-card"><strong>Customer data</strong>380 records accepted with missing payment terms</div>
   <div class="status-card"><strong>Critical defects</strong>Two high-priority defects remain open</div>
 </div>
 <div class="quote">“Are we ready to migrate next weekend?”</div>
 <h3>Your instinctive response</h3>`,
 options:["We are ready to migrate.","We are not ready to migrate.","We are ready, provided the remaining risks are resolved.","I need further evidence before I can make a recommendation."],
 feedback:[
 "You may eventually recommend Go, but the status summary does not yet explain the impact of the outstanding issues.",
 "You may eventually recommend No-Go, but the status summary does not yet show that the remaining issues prevent a safe migration.",
 "Go with conditions may be the right outcome, but you need more evidence before defining those conditions.",
 "This is the strongest response at this stage. You have useful information, but not enough evidence to justify a recommendation."
 ]
},
{
 id:"b2",nav:"Why this role exists",title:"Why this role exists",type:"content",
 html:`<p class="lead">Many people describe the Data Migration Lead as the person responsible for moving data into the new system.</p>
 <p>That is only part of the role.</p>
 <p>The Programme Manager did not ask whether ETL development had finished. They did not ask whether validation had reached 100%. They asked whether the programme was ready to migrate.</p>
 <p>That question crosses technology, business readiness, governance, risk, people and timing. No single status report can answer it.</p>
 <p>The Data Migration Lead becomes valuable by bringing separate pieces of information together and asking:</p>
 <div class="quote">“Taken together, what do these facts tell us about migration readiness?”</div>

 <div class="visual-card">
   <div class="visual-title">From project information to programme decision</div>
   <div class="flow">
     <div class="flow-box"><div><strong>Project evidence</strong><span class="small">Data, business, technical and risk information</span></div></div>
     <div class="arrow">→</div>
     <div class="flow-box"><div><strong>Data Migration Lead</strong><span class="small">Combines, challenges and interprets the evidence</span></div></div>
     <div class="arrow">→</div>
     <div class="flow-box"><div><strong>Recommendation</strong><span class="small">A defensible view for programme governance</span></div></div>
   </div>
 </div>

 <div class="callout experience"><div class="callout-label">Turner Page insight</div>
 <p>One of the biggest mistakes on ERP programmes is confusing status with readiness.</p>
 <p>A project can report green infrastructure, green ETL and green testing, yet still fail because the business cannot operate effectively afterwards.</p>
 </div>

 <div class="callout misconception"><div class="callout-label">Common trap</div>
 <p><strong>The Data Migration Lead decides whether the project goes live.</strong></p>
 <p>Governance makes the decision. The Data Migration Lead provides the migration evidence and recommendation that help governance make the right decision.</p>
 </div>

 <div class="principle"><strong>Key takeaway</strong><br>A Data Migration Lead turns information into evidence and evidence into recommendations.</div>`
},
{
 id:"b3",nav:"The five questions",title:"The five questions every Data Migration Lead asks",type:"framework",
 html:`<p class="lead">Experienced Data Migration Leads develop simple mental frameworks that help them ask the right questions consistently.</p>
 <p>Whenever somebody asks, “Are we ready?”, these five questions help build a complete picture.</p>
 <div class="visual-card">
   <div class="visual-title">The Turner Page migration readiness framework</div>
   <div class="framework-grid">
    ${fiveQuestions.map((q,i)=>`<div class="framework-node"><div class="num">0${i+1}</div><h4>${q.title}</h4><div class="small">${q.short}</div></div>`).join("")}
   </div>
 </div>
 <p>Explore each question in detail before moving on.</p>`
},
{
 id:"b4",nav:"Applying the framework",title:"Applying the five questions framework",type:"coachedMulti",
 html:`<p class="lead">Return to the original scenario.</p>
 <p>Before making a recommendation, review the available evidence again.</p>
 <div class="status-grid">
   <div class="status-card"><strong>ETL development</strong>Complete</div>
   <div class="status-card"><strong>Migration environments</strong>Ready</div>
   <div class="status-card"><strong>Migration validation</strong>97% complete</div>
   <div class="status-card"><strong>Customer data</strong>380 records accepted with missing payment terms</div>
   <div class="status-card"><strong>Critical defects</strong>Two high-priority defects remain open</div>
 </div>
 <h3>Your task</h3>
 <p>Select the additional evidence you would want before making a recommendation.</p>`,
 options:[
 "The business impact of the missing payment terms.",
 "What the remaining 3% of validation actually covers.",
 "The impact and agreed mitigation for the two high-priority defects.",
 "Whether the migration process has been successfully rehearsed.",
 "Whether the business has formally accepted the remaining risks."
 ],
 coaching:[
 "<strong>Yes. This matters.</strong><br>Knowing that payment terms are missing tells you little on its own. Are the customers active? Will invoices fail? Has Finance agreed a workable response? A Data Migration Lead needs to understand business impact, not simply identify a data issue.",
 "<strong>This is important.</strong><br>97% complete sounds reassuring, but percentages can mislead. If the remaining 3% contains critical balances or open orders, the risk may still be significant. Understand what remains, not just how much remains.",
 "<strong>Absolutely.</strong><br>A defect count tells you almost nothing. One defect may stop the business operating while several others may be cosmetic. Establish business impact, ownership and mitigation.",
 "<strong>Essential evidence.</strong><br>A process that has never run successfully is still unproven. Rehearsals show whether the migration can be repeated within the available time and whether the documented process actually works.",
 "<strong>Yes.</strong><br>No project reaches migration with zero risk. The important question is whether the remaining risks are understood, documented and accepted by the appropriate business owners."
 ],
 closing:`<h3>Turner Page coaching</h3>
 <p>You have not tried to answer the Programme Manager immediately. Instead, you have identified the evidence needed before answering.</p>
 <p>Experienced Data Migration Leads build the picture first. Once the picture is complete, the recommendation often becomes clear.</p>
 <div class="principle"><strong>A Data Migration Lead is not judged by how quickly they give an answer.</strong><br>They are judged by whether they can justify that answer with evidence.</div>`
},
{
 id:"b5",nav:"Ownership",title:"What a Data Migration Lead owns",type:"content",
 html:`<p class="lead">The Data Migration Lead owns the migration workstream. That does not mean personally owning every task connected with it.</p>
 <div class="ownership-grid">
   <div class="ownership-card"><h3>Owns</h3><ul><li>Migration strategy</li><li>Migration planning</li><li>Migration reporting</li><li>Migration risks</li><li>Migration readiness recommendation</li></ul></div>
   <div class="ownership-card"><h3>Influences</h3><ul><li>Business decisions</li><li>Project planning</li><li>Cutover planning</li><li>Programme governance</li><li>Go-live decisions</li></ul></div>
   <div class="ownership-card"><h3>Supports</h3><ul><li>Data Migration Consultants</li><li>Test teams</li><li>Business data owners</li><li>Functional consultants</li><li>Infrastructure teams</li></ul></div>
 </div>
 <div class="callout misconception"><div class="callout-label">Common trap</div>
 <p><strong>If an issue affects data migration, the Data Migration Lead owns fixing it.</strong></p>
 <p>No. The Data Migration Lead owns ensuring that the issue, impact, responsibility and mitigation are understood and managed.</p></div>
 <div class="principle"><strong>Key takeaway</strong><br>You own the migration workstream. You do not personally own every task required to deliver it.</div>`
},
{
 id:"b6",nav:"Ownership in practice",title:"Ownership in practice",type:"ownership",
 html:`<p class="lead">Ownership is not about doing every task. It is about ensuring the workstream is delivered successfully.</p>
 <p>For each situation, decide whether it is primarily your responsibility, a shared responsibility, or owned elsewhere.</p>`
},
{
 id:"b7",nav:"How experienced leads think",title:"How experienced Data Migration Leads think",type:"content",
 html:`<p class="lead">Technical ability gets you onto a migration project. Professional judgement earns the programme's trust.</p>
 <div class="behaviour"><h3>They seek evidence before making recommendations</h3><p>Opinions are useful. Evidence is essential.</p></div>
 <div class="behaviour"><h3>They communicate clearly</h3><p>Senior stakeholders need the decision, impact and risk, not a technical data dump.</p></div>
 <div class="behaviour"><h3>They surface problems early</h3><p>Bad news early is manageable. Bad news late becomes a crisis.</p></div>
 <div class="behaviour"><h3>They understand business impact</h3><p>Migration success is measured by the business operating successfully afterwards.</p></div>
 <div class="behaviour"><h3>They remain objective under pressure</h3><p>As go-live approaches, trusted leaders continue to assess the evidence honestly.</p></div>
 <div class="principle"><strong>Trusted Data Migration Leads are not the people with the most confident opinions.</strong><br>They are the people whose recommendations can be defended.</div>`
},
{
 id:"b8",nav:"A new project",title:"A new project",type:"single",
 html:`<p class="lead">Different ERP. Different customer. Different pressure.</p>
 <p>You are four days from go-live.</p>
 <div class="status-grid">
   <div class="status-card"><strong>ETL</strong>Complete</div>
   <div class="status-card"><strong>Validation</strong>100% complete</div>
   <div class="status-card"><strong>Business sign-off</strong>Complete</div>
   <div class="status-card"><strong>Infrastructure</strong>Ready</div>
   <div class="status-card"><strong>Critical defect</strong>One reporting defect remains open</div>
 </div>
 <p>The defect does not affect migration execution, but Purchasing uses the report every day.</p>
 <div class="quote">“What is your recommendation?”</div>`,
 options:[
 "Delay the migration until the report is fixed.",
 "Proceed because the migration itself is unaffected.",
 "Assess operational impact, workaround, ownership and residual risk before recommending.",
 "Ask the Technical Lead to decide."
 ],
 feedback:[
 "You may eventually recommend delay, but first establish the real operational impact and available mitigation.",
 "Technical readiness is not the complete picture. The business must be able to operate afterwards.",
 "This is the strongest response. You are using the framework rather than reacting to one issue.",
 "The Technical Lead provides evidence. The Data Migration Lead integrates that evidence into the recommendation."
 ]
},
{
 id:"b9",nav:"Reflection",title:"How do you decide whether you are ready?",type:"reflection",
 html:`<p>Return to the original question.</p>
 <div class="quote">“Are we ready to migrate?”</div>
 <p>Explain how a Data Migration Lead should decide.</p>
 <textarea id="reflection" placeholder="A Data Migration Lead should..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`
},
{
 id:"b10",nav:"Summary",title:"If you remember nothing else",type:"content",
 html:`<p class="lead">A Data Migration Lead does not simply know the answer.</p>
 <p>They ensure the programme has enough evidence to make the right decision.</p>
 <ul>
   <li>Build a complete picture before recommending.</li>
   <li>Assess data, process, business, environments and risk.</li>
   <li>Own the migration workstream, not every task.</li>
   <li>Understand business impact, not just technical status.</li>
   <li>Remain objective when pressure increases.</li>
 </ul>
 <div class="principle"><strong>Evidence before recommendation.</strong><br>That is the habit at the heart of effective Data Migration Leadership.</div>`
},
{
 id:"b11",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
 html:`<div class="complete"><div class="tick">✓</div>
 <p class="lead"><strong>You have completed Thinking like a Data Migration Lead: Making evidence-based decisions.</strong></p>
 <p>You have not simply learned about migration. You have begun developing the judgement expected of an experienced Data Migration Lead.</p>
 </div>
 <div class="promise">
 <div class="kicker">The Turner Page Promise</div>
 <h3>Learning that improves professional judgement</h3>
 <p>Everything in this lesson was selected because it can improve the decisions you make on a real ERP project.</p>
 </div>
 <h3>What is the single most valuable thing you learned?</h3>
 <p>This is not assessed. It is your opportunity to pause and identify the idea that will matter most on your next project.</p>
 <textarea id="valuableReflection" placeholder="The single most valuable thing I learned was..."></textarea>
 <div class="voice-row">
   <button id="valuableMicButton" class="btn secondary" type="button">Use microphone</button>
   <span id="valuableMicStatus" class="small"></span>
 </div>
 <div id="valuableFeedback"></div>
 <h3>Next lesson</h3>
 <p><strong>The Data Migration Lead within the ERP project</strong></p>`
}
];

const ownershipSituations=[
 {q:"ETL packages are behind schedule.",a:"mine",why:"The Data Migration Consultants may build them, but the Data Migration Lead owns successful delivery of the ETL workstream."},
 {q:"Finance data contains invalid payment terms.",a:"other",why:"Finance owns its data. The Data Migration Lead ensures that the issue and business impact are understood and managed."},
 {q:"Validation criteria have not been agreed.",a:"shared",why:"The Data Migration Lead drives the process, but the business and project must agree what acceptable evidence looks like."},
 {q:"The programme needs a migration readiness recommendation.",a:"mine",why:"Providing an evidence-based recommendation is a core Data Migration Lead responsibility."},
 {q:"A technical defect requires a code fix.",a:"other",why:"The responsible technical team fixes it. The Data Migration Lead assesses the impact on migration readiness."},
 {q:"The project must decide Go or No-Go.",a:"shared",why:"Programme governance owns the final decision. The Data Migration Lead provides the migration evidence and recommendation."}
];

const lesson=document.getElementById("lesson");
const nav=document.getElementById("lessonNav");

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function complete(id){if(!state.completed.includes(id))state.completed.push(id)}
function percentage(){return Math.round(state.completed.length/blocks.length*100)}
function updateChrome(){
 const p=percentage();
 document.getElementById("topProgress").style.width=p+"%";
 document.getElementById("progressText").textContent=p+"%";
 document.getElementById("sideProgress").textContent=p+"%";
 [...nav.children].forEach((el,i)=>{
   el.classList.toggle("active",i===state.index);
   el.classList.toggle("done",state.completed.includes(blocks[i].id));
 });
}
function renderNav(){
 nav.innerHTML="";
 blocks.forEach((b,i)=>{
   const btn=document.createElement("button");
   btn.textContent=(i+1)+". "+b.nav;
   btn.onclick=()=>{if(i<=state.index||state.completed.includes(b.id)){state.index=i;save();render()}};
   nav.appendChild(btn);
 });
}
function shell(b,i){
 return `<div class="step">Lesson 1 · Section ${i+1} of ${blocks.length}</div><h2>${b.title}</h2>${b.html}<div id="dynamic"></div><div class="actions"><button id="back" class="btn secondary">Back</button><button id="next" class="btn primary">Continue</button></div><div class="footer-promise"><strong>The Turner Page Promise</strong><br>Helping Data Migration Leads make better decisions on real ERP projects.</div>`;
}
function render(){
 const b=blocks[state.index], i=state.index;
 lesson.innerHTML=shell(b,i);
 const dynamic=document.getElementById("dynamic");
 const next=document.getElementById("next");
 next.textContent=i===blocks.length-1?"Finish lesson":"Continue";
 let ready=b.type==="content";

 if(b.type==="single"){
   const selected=state.answers[b.id];
   const wrap=document.createElement("div");wrap.className="options";
   b.options.forEach((option,j)=>{
     const btn=document.createElement("button");
     btn.className="option"+(selected===j?" selected":"");
     btn.innerHTML=`<span class="badge">${String.fromCharCode(65+j)}</span><span>${option}</span>`;
     btn.onclick=()=>{state.answers[b.id]=j;save();render()};
     wrap.appendChild(btn);
   });
   dynamic.appendChild(wrap);
   if(selected!==undefined){
     dynamic.insertAdjacentHTML("beforeend",`<div class="feedback">${b.feedback[selected]}</div>`);
     ready=true;
   } else ready=false;
 }

 if(b.type==="framework"){
   const open=state.answers.b3||[];
   fiveQuestions.forEach((q,j)=>{
     const card=document.createElement("div");card.className="framework-detail";
     card.innerHTML=`<div class="kicker">Question ${j+1}</div><h3>${q.title}</h3><p class="small">${q.short}</p>${open.includes(j)?q.detail:""}<button class="btn secondary">${open.includes(j)?"Hide detail":"Explore"}</button>`;
     card.querySelector("button").onclick=()=>{
       const s=new Set(open);s.has(j)?s.delete(j):s.add(j);state.answers.b3=[...s];save();render()
     };
     dynamic.appendChild(card);
   });
   ready=open.length===fiveQuestions.length;
   if(ready) dynamic.insertAdjacentHTML("beforeend",`<div class="principle"><strong>Great Data Migration Leads do not ask whether the project is ready.</strong><br>They ask whether they have enough evidence to justify saying it is ready.</div>`);
 }

 if(b.type==="coachedMulti"){
   const selected=state.answers.b4||[];
   const wrap=document.createElement("div");wrap.className="options";
   b.options.forEach((option,j)=>{
     const chosen=selected.includes(j);
     const holder=document.createElement("div");
     const btn=document.createElement("button");
     btn.className="option"+(chosen?" selected":"");
     btn.innerHTML=`<span class="badge">${chosen?"✓":"+"}</span><span>${option}</span>`;
     btn.onclick=()=>{const s=new Set(selected);s.has(j)?s.delete(j):s.add(j);state.answers.b4=[...s];save();render()};
     holder.appendChild(btn);
     if(chosen)holder.insertAdjacentHTML("beforeend",`<div class="feedback">${b.coaching[j]}</div>`);
     wrap.appendChild(holder);
   });
   dynamic.appendChild(wrap);
   ready=selected.length===b.options.length;
   if(ready)dynamic.insertAdjacentHTML("beforeend",b.closing);
   else dynamic.insertAdjacentHTML("beforeend",`<p class="small">Explore all five evidence areas before continuing.</p>`);
 }

 if(b.type==="ownership"){
   const answers=state.answers.b6||{};
   ownershipSituations.forEach((s,j)=>{
     const box=document.createElement("div");box.className="framework-detail";
     box.innerHTML=`<div class="kicker">Situation ${j+1}</div><h3>${s.q}</h3>`;
     [["mine","My responsibility"],["shared","Shared responsibility"],["other","Someone else owns it"]].forEach((v,k)=>{
       const btn=document.createElement("button");
       btn.className="option"+(answers[j]===v[0]?" selected":"");
       btn.innerHTML=`<span class="badge">${String.fromCharCode(65+k)}</span><span>${v[1]}</span>`;
       btn.onclick=()=>{answers[j]=v[0];state.answers.b6=answers;save();render()};
       box.appendChild(btn);
     });
     if(answers[j])box.insertAdjacentHTML("beforeend",`<div class="feedback ${answers[j]===s.a?"good":"warn"}">${answers[j]===s.a?"Your answer aligns with Turner Page thinking.":"Consider the ownership boundary again."}<br>${s.why}</div>`);
     dynamic.appendChild(box);
   });
   ready=Object.keys(answers).length===ownershipSituations.length;
 }

 if(b.type==="reflection"){
   const area=document.getElementById("reflection");
   const feedback=document.getElementById("reflectionFeedback");
   const analyseButton=document.getElementById("analyseButton");
   const micButton=document.getElementById("micButton");
   const micStatus=document.getElementById("micStatus");
   area.value=state.reflection||"";

   area.oninput=()=>{
     state.reflection=area.value;
     save();
     feedback.innerHTML="";
     analyseButton.disabled=area.value.trim().length<40;
   };

   analyseButton.disabled=area.value.trim().length<40;

   const analyseResponse=()=>{
     const t=area.value.toLowerCase();
     const strengths=[];
     const gaps=[];

     const evidence=/evidence|facts|status|validation|reconciliation/.test(t);
     const risk=/risk|impact|mitigat|defect/.test(t);
     const business=/business|user|operate|operational/.test(t);
     const environment=/environment|infrastructure|security|integration|permission/.test(t);
     const process=/rehears|process|repeat|runbook|cutover/.test(t);
     const recommendation=/recommend|decision|ready|go.?no.?go/.test(t);
     const ownership=/owner|accountab|responsib|accept/.test(t);

     if(evidence)strengths.push("You recognised that recommendations should be based on evidence rather than instinct.");
     if(business)strengths.push("You considered business impact rather than focusing only on technical completion.");
     if(risk)strengths.push("You referred to remaining risk and the need to understand its impact.");
     if(recommendation)strengths.push("You connected the evidence to a clear readiness recommendation.");
     if(process)strengths.push("You considered whether the migration process itself has been proven.");
     if(environment)strengths.push("You included environment readiness in the overall picture.");
     if(ownership)strengths.push("You recognised the importance of ownership or formal acceptance.");

     if(!evidence)gaps.push("Make the role of evidence explicit.");
     if(!process)gaps.push("Include whether the migration process has been rehearsed and proven.");
     if(!business)gaps.push("Consider whether the business can operate successfully afterwards.");
     if(!environment)gaps.push("Include environment and integration readiness.");
     if(!risk)gaps.push("Explain how remaining risks, impact and mitigation should be assessed.");
     if(!ownership)gaps.push("Mention risk ownership or formal business acceptance.");

     const score=Math.max(4,Math.min(10,Math.round((strengths.length/7)*10*10)/10));

     feedback.innerHTML=`
       <div class="score-card">
         <div class="score">${score.toFixed(1)}/10</div>
         <div><strong>Indicative assessment</strong><br><span class="small">Based on the breadth and quality of the reasoning in this response.</span></div>
       </div>
       <div class="feedback good">
         <strong>Strong points</strong>
         <ul>${(strengths.length?strengths:["You gave a direct answer and engaged with the decision."]).map(x=>`<li>${x}</li>`).join("")}</ul>
       </div>
       <div class="feedback">
         <strong>You could strengthen your answer by discussing</strong>
         <ul>${(gaps.length?gaps:["No major gaps detected."]).map(x=>`<li>${x}</li>`).join("")}</ul>
       </div>
       <h3>Turner Page model answer</h3>
       <div class="quote">A Data Migration Lead should gather evidence across data readiness, migration process, business readiness, environment readiness and residual risk before making a recommendation. Their role is not simply to answer yes or no. It is to provide a recommendation that can be justified, explained and defended.</div>
       <div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is strong professional thinking. You are approaching the question as a Data Migration Lead rather than as a technical specialist.":"You have the foundation. Strengthen the answer by covering the complete readiness picture rather than only one or two areas."}</div>
     `;
     ready=true;
     next.disabled=false;
   };

   analyseButton.onclick=()=>{
     if(area.value.trim().length<40)return;
     feedback.innerHTML=`<div class="analysis-state"><div class="spinner"></div><div><strong>Analysing your response</strong><br><span class="small">Reviewing your reasoning against the Turner Page readiness framework.</span></div></div>`;
     analyseButton.disabled=true;
     setTimeout(()=>{analyseResponse();analyseButton.disabled=false;analyseButton.textContent="Analyse revised answer";},2200);
   };

   const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(SpeechRecognition){
     const recognition=new SpeechRecognition();
     recognition.lang="en-GB";
     recognition.continuous=true;
     recognition.interimResults=true;
     let listening=false;
     let baseText=area.value;

     recognition.onstart=()=>{
       listening=true;
       baseText=area.value;
       micButton.textContent="Stop microphone";
       micStatus.textContent="Listening...";
     };
     recognition.onresult=(event)=>{
       let transcript="";
       for(let i=event.resultIndex;i<event.results.length;i++){
         transcript+=event.results[i][0].transcript;
       }
       area.value=(baseText+" "+transcript).trim();
       state.reflection=area.value;
       save();
       analyseButton.disabled=area.value.trim().length<40;
     };
     recognition.onend=()=>{
       listening=false;
       baseText=area.value;
       micButton.textContent="Use microphone";
       micStatus.textContent="";
     };
     recognition.onerror=()=>{
       micStatus.textContent="Microphone input was not available.";
     };
     micButton.onclick=()=>{listening?recognition.stop():recognition.start()};
   }else{
     micButton.disabled=true;
     micStatus.textContent="Microphone input is not supported in this browser.";
   }

   ready=false;
 }

 if(b.type==="valuable"){
   const area=document.getElementById("valuableReflection");
   const feedback=document.getElementById("valuableFeedback");
   const micButton=document.getElementById("valuableMicButton");
   const micStatus=document.getElementById("valuableMicStatus");
   area.value=state.valuable||"";

   const updateValuable=()=>{
     state.valuable=area.value;
     save();
     const ok=area.value.trim().length>=20;
     next.disabled=!ok;
     feedback.innerHTML=ok
       ? `<div class="feedback"><strong>Your takeaway has been saved.</strong><br>Return to it before your next migration-readiness discussion and ask how it should change your behaviour.</div>`
       : "";
   };
   area.oninput=updateValuable;
   ready=(state.valuable||"").trim().length>=20;
   if(ready)updateValuable();

   const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
   if(SpeechRecognition){
     const recognition=new SpeechRecognition();
     recognition.lang="en-GB";
     recognition.continuous=true;
     recognition.interimResults=true;
     let listening=false;
     let baseText=area.value;

     recognition.onstart=()=>{
       listening=true;
       baseText=area.value;
       micButton.textContent="Stop microphone";
       micStatus.textContent="Listening...";
     };
     recognition.onresult=(event)=>{
       let transcript="";
       for(let k=event.resultIndex;k<event.results.length;k++){
         transcript+=event.results[k][0].transcript;
       }
       area.value=(baseText+" "+transcript).trim();
       updateValuable();
     };
     recognition.onend=()=>{
       listening=false;
       baseText=area.value;
       micButton.textContent="Use microphone";
       micStatus.textContent="";
     };
     recognition.onerror=()=>{micStatus.textContent="Microphone input was not available.";};
     micButton.onclick=()=>{listening?recognition.stop():recognition.start();};
   } else {
     micButton.disabled=true;
     micStatus.textContent="Microphone input is not supported in this browser.";
   }
 }

 document.getElementById("back").disabled=i===0;
 document.getElementById("back").onclick=()=>{if(i>0){state.index--;save();render();scrollTo({top:0,behaviour:"smooth"})}};
 next.disabled=!ready;
 next.onclick=()=>{
   const canContinue=b.type==="reflection"?ready:ready;
   if(!canContinue)return;
   complete(b.id);
   if(i<blocks.length-1){
     state.index++;
     save();
     render();
     scrollTo({top:0,behaviour:"smooth"});
   } else {
     save();
     updateChrome();
     next.textContent="Lesson completed";
     next.disabled=true;
   }
 };
 updateChrome();
}
renderNav();render();
</script>
</body>
</html>
