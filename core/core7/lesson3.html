{
 id:"b1",nav:"The challenge",title:"It is only one extra field",type:"mcq",
 html:`<div class="callout experience">
 <div class="callout-label">Before you begin</div>
 <p>Migration work changes constantly. New source values appear, business users ask for additional history, mappings change, target configuration moves and defects expose new dependencies. The professional response is not to prevent all change. It is to make change, problems, uncertainty and decisions visible enough to control their consequences.</p>
 </div>
 <p class="lead">Bramwell customer scope and mapping are approved. Two weeks before the next migration cycle, Sales asks for a legacy "Credit Review Date" to be added to the target customer migration.</p>
 <p>The request sounds small. The source field exists and the target has somewhere it could potentially go.</p>
 <p>But nobody has yet confirmed:</p>
 <ul class="framework-checks">
   <li>Whether the field is required for all four legal entities.</li>
   <li>Whether the source values are reliable.</li>
   <li>What the target field means.</li>
   <li>Whether transformation is required.</li>
   <li>Whether historical blanks are acceptable.</li>
   <li>Whether the field needs business validation.</li>
   <li>Whether adding it changes the approved cycle baseline.</li>
 </ul>
 <div class="quote">"It is just one column. I can add it to the mapping and tell the developer."</div>
 <p class="small">The migration analyst</p>
 <h3>Your decision</h3>`,

{
 id:"b2",nav:"What happens next",title:"What happens next",type:"content",
 html:`<p class="lead">Treating Credit Review Date as a potential scope decision does not mean refusing it. It means finding out what it would actually cost before it quietly becomes part of the build.</p>
 <p>The analyst opens a short assessment rather than a mapping-workbook edit: which legal entities need it, how reliable the source values are, what the target field is meant to represent, and whether historical blanks are acceptable. Nothing changes in the controlled baseline until that assessment and an approval exist.</p>
 <div class="principle"><strong>Turner Page principle</strong><br>Control the consequence, not the size of the request.</div>`
},

{
 id:"b4",nav:"Scope and blast radius",title:"Scope is more than a list of objects",type:"content",
 html:`<p class="lead">Migration scope can include several dimensions, not just which objects are in or out.</p>
 <ul class="framework-checks">
   <li>Objects or entities.</li>
   <li>Legal entities or business units.</li>
   <li>Record populations.</li>
   <li>History period.</li>
   <li>Fields or attributes.</li>
   <li>Attachments or documents.</li>
   <li>Open versus historical transactions.</li>
   <li>Data-quality treatment.</li>
   <li>Migration cycles or environments.</li>
   <li>Validation and reconciliation obligations.</li>
 </ul>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>A scope change can alter data, build, testing, timing and ownership even when the request looks technically small.</p></div></div>
 <h3>Test the blast radius of a change</h3>
 <p>For the proposed Credit Review Date, ask:</p>
 <div class="visual-card">
   <div class="visual-title">Blast radius of Credit Review Date</div>
   <ul class="framework-checks">
     <li><strong>Source:</strong> where is the field populated and how complete or valid is it?</li>
     <li><strong>Meaning:</strong> does source meaning match target meaning?</li>
     <li><strong>Mapping:</strong> direct, transformed, derived, defaulted or excluded?</li>
     <li><strong>Build:</strong> what extraction, staging, transformation or load changes are needed?</li>
     <li><strong>Target:</strong> is configuration or validation required?</li>
     <li><strong>Validation:</strong> how will correctness be proved?</li>
     <li><strong>Population:</strong> which customers or legal entities are affected?</li>
     <li><strong>Cycle:</strong> can it be safely included in the next controlled baseline?</li>
     <li><strong>Business:</strong> who approves meaning and acceptance?</li>
   </ul>
 </div>
 <div class="principle"><strong>Turner Page principle</strong><br>A change is understood when you can describe its blast radius.</div>
 <p>Not every request that touches scope is unreasonable. Bringing over all 240,000 customer attachments, or migrating 22 years of sales invoices instead of the approved history period, are both legitimate questions to raise. Neither is automatically wrong; both need exactly this kind of assessment, given the volume, storage, extraction, validation and business need involved, before anyone commits to it.</p>`
},
{

     <li><strong>Product/site preparation</strong> (risk): could delay the product or open-order critical path. Owned by the functional owner, who needs to prove a readiness checkpoint. Next control point: before the production product step.</li>
     <li><strong>Seven missing delivery addresses</strong> (issue under correction): key-account relationship validation is affected. Owned by the migration team, who needs to reprocess and retest. Next control point: relationship validation.</li>
     <li><strong>OldSales invoices older than 10 years</strong> (unresolved retention and scope decision): whether these invoices are in scope for migration, archive or another treatment has not yet been decided. Owned by the business or data owner for OldSales retention. Next control point: before the retention/scope baseline is confirmed.</li>
   </ul>
 </div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Artefact</div><p>Migration Control View: item, type, affected population or area, impact, owner or action, due or control point, evidence or status.</p></div></div>
 <p>Pick one of the five items above. Explain why it is classified the way it is (scope, issue, risk or decision, or a combination), and what would go wrong if it were classified as something else.</p>
 <textarea id="reflection" placeholder="I have chosen... and it is classified as... because..."></textarea>

 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">The 1,126 LegacyDocs unresolved links are best classified as an issue, not a risk: the broken business-record links exist right now, not as something that might happen later. Classification is also an open decision, since nobody has yet confirmed whether the files can be resolved automatically, need Records Management review, or require business ownership input. If they were classified only as a risk, it would suggest the problem has not happened yet, when in fact the unresolved links already exist today.</div>`,

{
 id:"b6",nav:"Issues and risks",title:"Recording issues and telling risk from fact",type:"content",
 html:`<p class="lead">An issue needs more than a title.</p>
 <div class="callout misconception"><div class="callout-label">Weak issue</div><p>Customer addresses wrong.</p></div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Useful issue</div><p>Seven key-account delivery addresses are absent from transformed output. Source and raw stage contain the records. Root cause identified in the transformation filter: valid DELIVERY_SECONDARY addresses were excluded. Impact: key-account delivery relationship validation fails. Correction: approved rule fixed; full affected population to be reprocessed and retested.</p></div></div>
 <p>A useful migration issue normally states: what is wrong, affected population, evidence or current state, business or migration impact, owner or action, status or next decision, and retest or closure evidence where relevant.</p>
 <div class="principle"><strong>Core principle</strong><br>Record enough context that someone else can understand why the issue matters and what moves it forward.</div>
 <h3>Risk is uncertainty, not a defect that already happened</h3>
 <div class="visual-card">
   <div class="visual-title">Telling fact from risk</div>
   <ul class="framework-checks">
     <li><strong>"Product/site readiness delayed Cycle 3 by 34 minutes":</strong> issue or event evidence from Cycle 3.</li>
     <li><strong>"Product/site readiness may delay the production sequence again if the new checkpoint is not effective":</strong> risk.</li>
     <li><strong>"CustomerGroup 99 has no approved treatment":</strong> current issue and decision required.</li>
     <li><strong>"The decision may miss the mapping baseline freeze and leave 18 records unresolved":</strong> risk arising from the open decision.</li>
     <li><strong>"Open-order recovery procedure succeeded in the last rehearsal":</strong> evidence, not a risk by itself.</li>
   </ul>
 </div>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Issues tell you what is wrong now. Risks tell you what could happen next. One can create the other.</p></div></div>`
},
{
 id:"b7",nav:"Proportionate control",title:"Proportionate control, not bureaucracy",type:"content",
 html:`<p class="lead">A decision is not controlled merely because it appears in meeting minutes.</p>
 <p>Once authorised, it may need to update: scope, the mapping workbook, reference or cross-reference data, transformation logic, test cases, validation rules, cycle or runbook scope, exception treatment, and acceptance evidence.</p>
 <div class="principle"><strong>Turner Page principle</strong><br>A decision is complete only when its consequence is implemented and traceable.</div>
 <h3>Beware the silent scope change</h3>
 <p>Common examples include:</p>
 <ul class="framework-checks">
   <li>"Can we bring over one more field?"</li>
   <li>"Can we include the last five years instead of two?"</li>
   <li>"These attachments should probably come too."</li>
   <li>"Can we migrate closed orders for reporting?"</li>
   <li>"Could we cleanse these records during migration rather than in source?"</li>
   <li>"Can we add another legal entity to the next cycle?"</li>
 </ul>
 <p>None of these is automatically wrong. The problem is allowing the commitment to change without understanding and recording the impact.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Scope creep often arrives disguised as a reasonable small request.</p></div></div>
 <h3>Not every change needs bureaucracy</h3>
 <p>Control should be proportionate. A spelling correction in a non-functional note does not need the same treatment as adding a new transaction population. The migration team should understand whether it changes approved business meaning, whether it changes population or target output, whether it requires build or retest, whether it affects timing or dependencies, and whether it requires new acceptance.</p>
 <div class="principle"><strong>Core principle</strong><br>Use enough control to make consequence visible. Do not turn control into ceremony.</div>
 ${TPKit.fromField({
   title:"The Rule Nobody Approved", name:"Farah", role:"Data Migration Consultant", project:"Telecoms ERP",
   src:"/assets/audio/RuleNobodyApproved-Farah.mp3",
   reflection:"Have you seen proportionate control tip too far in either direction, either ceremony over nothing, or a real change slipping through unassessed? What did that teach you?"
 })}`
},
{
 id:"b8",nav:"Prioritise and escalate",title:"Prioritising, responding to risk and knowing when to escalate",type:"content",
 html:`<div class="visual-card">
   <div class="visual-title">Consequence, not volume, sets priority</div>
   <ul class="framework-checks">
     <li><strong>Higher consequence:</strong> a wrong financial balance. <strong>Lower consequence:</strong> cosmetic description formatting.</li>
     <li><strong>Higher consequence:</strong> a missing key-account delivery relationship. <strong>Lower consequence:</strong> a non-critical report label.</li>
     <li><strong>Higher consequence:</strong> an unknown target commit state. <strong>Lower consequence:</strong> minor log wording.</li>
     <li><strong>Higher consequence:</strong> an incorrect legal-entity classification. <strong>Lower consequence:</strong> a low-impact documentation typo, such as a developer's own fix to a typo in an error message.</li>
     <li><strong>Higher consequence:</strong> an unapproved mapping affecting a large population, such as an unresolved new source code with no approved treatment. <strong>Lower consequence:</strong> a known low-volume exception with an accepted treatment.</li>
   </ul>
 </div>
 <p>Volume alone is not materiality. A small number of records can be critical if they affect key customers, statutory data, financial balances or essential operations. Equally, a product-load timing variance that has not yet been explained is a risk worth watching even before it becomes a confirmed problem.</p>
 <div class="principle"><strong>Turner Page principle</strong><br>Prioritise by business and migration consequence, not simply by record count.</div>
 <h3>A risk needs a response</h3>
 <p>Typical responses include: reduce likelihood through prevention, reduce impact through recovery or contingency, increase evidence through rehearsal or validation, assign a clear owner and trigger, accept the residual risk through the appropriate authority, and avoid the risk by changing scope or approach where justified.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Example</div><p>Risk: product or site preparation could delay open orders. Response: readiness checkpoint before product execution, named owner, backup operator, evidence required before proceeding. Trigger: prerequisite incomplete at agreed cutover time.</p></div></div>
 <div class="principle"><strong>Turner Page insight</strong><br>A risk without a response is only a worry written down.</div>
 <h3>Know when to escalate</h3>
 <p>Escalation may be needed when: scope impact exceeds your authority; a decision misses the point at which build or cycle work depends on it; an issue threatens a success criterion or cutover; a risk exceeds agreed tolerance; owners disagree and the migration team cannot resolve authority; or a change would invalidate previously approved evidence.</p>
 <div class="principle"><strong>Core principle</strong><br>Escalate when the consequence needs authority you do not have.</div>`
},
{

{

 html:`<p class="lead">Which is more dangerous in migration: a large change everyone recognises as a change, or a small request that slips directly into the build without impact assessment?</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Mentor coaching prompt</div><p>Think about visibility. Large changes attract control. Small changes can alter meaning or validation while bypassing it.</p></div></div>

{
 id:"b12",nav:"Summary",title:"Lesson summary",type:"content",
 html:`<ul class="framework-checks lesson-outcomes">
   <li>Scope defines what the migration is committed to deliver.</li>
   <li>An issue is a problem that exists now.</li>
   <li>A risk is uncertainty about what could happen next.</li>
   <li>A decision is an authorised choice that must flow into the migration baseline.</li>
   <li>Migration scope includes populations, history, fields, legal entities, documents and validation obligations, not only object names.</li>
   <li>Assess the blast radius of proposed changes.</li>
   <li>Record issues with population, evidence, impact, owner and closure path.</li>
   <li>Track decisions through mapping, build and validation.</li>
   <li>Watch for silent scope changes disguised as small requests.</li>
   <li>Use proportionate control rather than bureaucracy.</li>
   <li>Prioritise by consequence, not simply by volume.</li>
   <li>Give risks a response, owner and trigger.</li>
   <li>Escalate when consequence requires authority you do not have.</li>
 </ul>
 <div class="principle"><strong>Key takeaway</strong><br>Migration control means keeping commitments, problems, uncertainties and decisions visible enough that changes do not quietly alter the data, the build or the evidence you are relying on.</div>`
},
