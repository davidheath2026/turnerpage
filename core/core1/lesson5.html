const blocks=[
{
 id:"b1",nav:"Migrate everything",title:"Opening scenario: Migrate all our history",type:"mcq",
 html:`<div class="promise-card">
 <div class="promise-lines"><div>Frameworks</div><div>Scenarios</div><div>Reflection</div><div>Assessment</div></div>
 </div>
 <p class="lead">Bramwell Industries is beginning detailed scope discussions. During a workshop, the Finance Director says:</p>
 <div class="quote">\u201cWe've kept the data for a reason. I want all of it in the new system. Customers, suppliers, products, orders, invoices, everything. If we migrate everything, nobody can complain later that something is missing.\u201d</div>
 <p>The migration team establishes that Bramwell has 22 years of sales invoice history, 1.8 million customer records (1.7 million inactive or historical), 18,530 currently active customers, 185,000 product records (63,000 with no activity for over eight years), 42,600 open sales orders, open accounts receivable and payable, legacy reporting systems that will remain accessible after go-live, and statutory retention requirements for some historical information.</p>
 <h3>What is the strongest response from the migration team?</h3>`,

 ]
},
{
 id:"b2",nav:"Scope dimensions",title:"Scope is more than a list of tables",type:"expandableList",
 layout:"grid",
 html:`<p class="lead">Migration scope answers a deceptively simple question: what data will move into the target? A useful answer needs several dimensions. Open each one.</p>`,

   question:"Is \u201cmigrate customers\u201d a sufficiently precise scope statement on its own?",

 }
},
{
 id:"b3",nav:"More data isn't safer",title:"More data is not automatically safer",type:"content",
 html:`<p class="lead">The instinct to migrate everything is understandable \u2014 it feels conservative. If the old system has the data, why take the risk of leaving it behind?</p>
 <p>But every additional record brought into the migration may need to be extracted, profiled, understood, mapped, cleansed, loaded, validated and reconciled, then supported after go-live. Historical data can also contain old codes, obsolete relationships and structures that no longer fit the target.</p>
 <div class="principle"><strong>Core principle</strong><br>The safest scope is not the largest or smallest scope. It is the scope that is justified, agreed, achievable and testable.</div>
 <p><strong>Bramwell's invoice history, weighed as options:</strong> migrating all 22 years makes all history available but brings large volume, legacy structures and heavier reconciliation. Migrating the last 7 years reduces volume but needs another access route for older history. Open items only is operationally simplest but needs legacy/archive access for reporting. A hybrid \u2014 open items plus selected recent history plus archive \u2014 balances both, but needs a clear archive solution.</p>
 <p>The migration professional can analyse these options. The final business scope should be owned and approved by the appropriate stakeholders.</p>`
},
{
 id:"b4",nav:"Downstream consequences",title:"Scope decisions create downstream consequences",type:"content",
 html:`<p class="lead">Scope isn't a document that sits at the front of a project plan. It changes the work throughout the lifecycle. Including 22 years of invoices means higher volumes and broader reconciliation. Excluding inactive customers needs an agreed inactivity rule and evidence that required transactions don't depend on them. Including attachments means extraction, storage and security all need designing and testing. Adding another legal entity brings potential new sources, codes, owners and exceptions into scope.</p>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Treating a scope change as \u2018just a few more fields\u2019 or \u2018one extra table.\u2019 The real impact may run through discovery, mapping, build, testing, timing and cutover \u2014 not just the field count itself.</p></div>`
},
{
 id:"b5",nav:"Rollout strategy",title:"Migration strategy changes how the work is delivered",type:"content",
 html:`<p class="lead">Scope answers what moves. Migration strategy also considers how the organisation transitions to the target. At foundation level, three patterns are useful to understand.</p>
 <p><strong>Big Bang</strong> \u2014 the agreed organisation moves in one main production transition. Can simplify coexistence, but concentrates risk into a narrower window and needs strong dependency readiness.</p>
 <p><strong>Phased or wave-based</strong> \u2014 business units, countries or sites move in stages. Reduces the size of each transition, but creates coexistence and repeated migration requirements, and needs careful cross-wave dependency handling.</p>
 <p><strong>Hybrid</strong> \u2014 many programmes combine both. Each country might have a Big Bang go-live, but countries themselves migrate in waves.</p>
 <div class="callout misconception"><div class="callout-label">Important boundary</div><p>Core learners need to understand how rollout strategy affects migration. Choosing the enterprise rollout strategy and leading the programme-level trade-offs belongs primarily in the Data Migration Lead specialisation.</p></div>`
},
{
 id:"b6",nav:"Strategy changes questions",title:"Strategy changes migration questions",type:"content",
 html:`<p class="lead">Suppose Bramwell has operations in the UK, Norway, Belgium and Germany. The rollout approach changes what migration actually has to answer.</p>
 <ul class="framework-checks">
   <li><strong>All countries go live together</strong> \u2014 can all source populations, dependencies and teams be ready for one cutover? Can volumes fit the window?</li>
   <li><strong>Countries go live one at a time</strong> \u2014 how will migrated and legacy businesses interact, and is the process repeatable for each wave?</li>
   <li><strong>Finance goes first, CRM later</strong> \u2014 which customer attributes must exist in each target at each stage, and how are systems synchronised during coexistence?</li>
   <li><strong>One pilot site, then wider rollout</strong> \u2014 what will genuinely be learned from the pilot, and which rules can actually be reused?</li>
 </ul>
 <div class="principle"><strong>Key takeaway</strong><br>Migration does not operate independently of the wider implementation approach \u2014 the rollout strategy is one of the things that shapes it.</div>`
},
{
 id:"b7",nav:"Who does what",title:"Who does what in a migration?",type:"expandableList",
 layout:"grid",
 html:`<p class="lead">Data migration is cross-functional. No single role should understand, decide and execute everything. Open each role.</p>`,

   feedback:"Correct: actual job titles vary, and one person may perform several roles on a small project. The important question is not the job title \u2014 it's whether analysis, implementation, business decision-making and acceptance each have a clear accountable owner."
 }
},
{
 id:"b8",nav:"Moves data, owns meaning",title:"The migration team moves data; the business owns meaning",type:"content",
 html:`<p class="lead">This distinction is fundamental and returns throughout the Core programme. A consultant may discover that Bramwell has 3,400 apparent duplicate supplier records. The consultant can profile the duplicates, identify matching patterns, quantify the issue, propose cleansing rules, and show examples and consequences.</p>
 <p>But the consultant should not silently decide which legal supplier records the business no longer needs.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page principle</div><p>The migration team moves and transforms data according to agreed rules. The business owns what the data should mean and which business outcomes are acceptable.</p></div></div>
 <p>This doesn't mean the consultant simply waits for instructions. Strong consultants challenge, analyse, recommend and make consequences visible. They make better decisions possible \u2014 they don't manufacture business authority they don't have.</p>`
},
{
 id:"b9",nav:"Whose decision is it?",title:"Whose decision is it?",type:"situations",
 html:`<p class="lead">For each Bramwell situation, decide who should analyse, recommend, decide or implement.</p>`,
 items: ownershipSituations,
 takeawayHtml:`<div class="callout misconception"><div class="callout-label">Common trap</div><p>When a business decision is late, it can be tempting for the migration team to choose a value so build or testing can continue. That may solve today's technical blockage while creating tomorrow's accountability problem.</p></div>`
},
{
 id:"b10",nav:"Build a scope view",title:"Build it yourself: create a first scope view",type:"guidedSteps",
 html:`<p class="lead">Bramwell needs a first-pass scope discussion. Before revealing each one, think about what you'd propose as an initial position, and what still needs deciding before it becomes approved scope.</p>`,

{
 id:"b12",nav:"Core and the two paths",title:"The Core foundation and the two specialist paths",type:"content",
 html:`<p class="lead">Module 1 has deliberately stayed on common ground. Both future career routes need to understand what a migration is, the data it moves, the systems it connects, the lifecycle it follows, and the decisions and people around it.</p>
 <p>Later, the <strong>Data Migration Consultant</strong> deepens into analysing populations and implementing agreed scope rules, building repeatable processes for the chosen rollout strategy, working effectively with business and functional owners, executing detailed migration activities, and turning approved decisions into migration logic and evidence.</p>
 <p>The <strong>Data Migration Lead</strong> deepens into establishing and controlling scope, impact and stakeholder agreement, planning and coordinating migration across waves and teams, creating clarity, governance and escalation, leading readiness and delivery across the lifecycle, and driving timely decisions while managing unresolved risk.</p>
 <div class="principle"><strong>Key takeaway</strong><br>Neither specialist path replaces the Core. The DMC needs enough end-to-end understanding to build the right thing. The DML needs enough delivery understanding to lead work intelligently.</div>`
},
{
 id:"b13",nav:"Would you accept 99.4%?",title:"Module 1 challenge: would you accept 99.4% now?",type:"content",
 html:`<p class="lead">Return to the first screen of Module 1. Bramwell's customer load reported 99.4% technical success. At that point, the headline looked reassuring.</p>
 <p>After five lessons, here's what you'd now want to know before accepting that migration as ready: what exactly was in scope, and what was deliberately excluded? Which source systems contributed customer information? Who owned conflicting attributes and migration decisions? How did source values map to target structures and business meaning? Which reference data and relationships did customers depend on? Were the migration processes designed and tested through the lifecycle? Were rejected and accepted records both investigated properly? Is the data complete, accurate, connected and meaningful? Can Bramwell's business processes actually use it? What evidence exists, and who has accepted the result?</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Module insight</div><p>The number has not changed. Your ability to interpret it has.</p></div></div>`
},

 id:"b15",nav:"Module 1 summary",title:"Module 1 summary: if you remember nothing else",type:"content",
 html:`<p class="lead">Five lessons ago, 99.4% technical success looked like the whole answer. Here's what actually makes a migration succeed.</p>
 <ul class="framework-checks lesson-outcomes">
   <li>Data migration is a controlled business and technical process, not simple file movement.</li>
   <li>Business data is interconnected through master data, transactions, reference/configuration data and relationships.</li>
   <li>Migration translates business meaning between source and target landscapes, and the target imposes structures and rules migration must satisfy.</li>
   <li>Migration runs through Discover, Design, Build, Prove and Cut over, with iteration between stages.</li>
   <li>Scope must be explicit across data objects, populations, history, organisation and treatment, and rollout strategy affects sequence, repeatability and risk.</li>
   <li>Migration is cross-functional: analysis, implementation, business decisions and acceptance all need appropriate ownership, and the migration team should challenge and recommend, never silently assume business authority.</li>
 </ul>
 <div class="principle"><strong>Module 1 takeaway</strong><br>A professional migration starts with understanding: the business, the data, the systems, the lifecycle, the scope, and who owns the decisions.</div>`
