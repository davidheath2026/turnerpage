<script>
/* ==============================================================
   CORE MODULE 1 — LESSON 4 DATA — content only. Built from the
   Core Module 1 Lesson 4 source manuscript (the data migration
   lifecycle). Follows the Turner Page lesson playbook, extended
   with extra content blocks where the five-stage lifecycle
   genuinely needs the room (each stage keeps its own callout).
============================================================== */

const lifecycleStages=[
 {title:"1. Discover",short:"What exists?",
  detail:"Identify sources, data objects, owners, volumes, quality and dependencies. Typical outputs: a data inventory and profiling findings. At Bramwell, the original plan listed only the legacy ERP as the customer source \u2014 discovery is what revealed CRM and regional spreadsheets too."},
 {title:"2. Design",short:"What should happen to it?",
  detail:"Define scope, mappings, transformation and cleansing rules, dependencies and validation approach. This is where migration stops being a vague intention and becomes a set of controlled, explicit rules."},
 {title:"3. Build",short:"How will we move it?",
  detail:"Create repeatable extraction, staging, transformation, load, logging and control processes. The technology varies; the principle doesn't \u2014 a build isn't finished when it works once, it has to be repeatable across cycles."},
 {title:"4. Prove",short:"Does it work?",
  detail:"Run migration cycles, validate and reconcile results, test business usability, investigate defects and refine. The purpose isn't a green result \u2014 it's learning what has to change before production."},
 {title:"5. Cut over",short:"Can we move production safely?",
  detail:"Execute the agreed final migration sequence, validate critical outcomes, obtain required acceptance and stabilise after go-live. By this point, nothing here should be a first attempt."}
];

const activitySteps=[
 {html:`<h4>Step 1 \u2014 Identify that CRM contains customer contacts not held in ERP</h4><p><strong>Primary stage: Discover.</strong> A previously incomplete view of the source landscape is being corrected \u2014 finding out what actually exists is exactly what Discover is for.</p>`},
 {html:`<h4>Step 2 \u2014 Agree that customers inactive for more than seven years will not be migrated</h4><p><strong>Primary stage: Design.</strong> This is a scope rule based on a business decision \u2014 it belongs to Design, where migration intentions become explicit, controlled rules.</p>`},
 {html:`<h4>Step 3 \u2014 Create logic converting legacy country UK to target ISO code GB</h4><p><strong>Primary stage: Build.</strong> The approved transformation is being implemented \u2014 turning an agreed rule into something executable and repeatable.</p>`},
 {html:`<h4>Step 4 \u2014 Compare migrated receivables totals with the agreed legacy baseline</h4><p><strong>Primary stage: Prove.</strong> The result is being reconciled \u2014 this is exactly the evidence-gathering Prove exists to produce.</p>`}
];

const knowledgeCheckItems=[
 {
   title:"Check 1",
   question:"A project manager proposes starting migration one month before go-live, once files arrive from the business. What's the strongest objection?",
   options:[
     {label:"There isn't enough time to code all the transformations.",correct:false,
      feedback:"Build is only one part of migration \u2014 the bigger problem is starting discovery, design and testing that late, not just coding time."},
     {label:"The migration lifecycle needs to begin months earlier, well before the final production extract.",correct:true,
      feedback:"Correct. The final load is the visible tip of a much longer lifecycle that needs to already be underway."}
   ]
 },
 {
   title:"Check 2",
   question:"Which best describes the relationship between the five lifecycle stages in practice?",
   options:[
     {label:"A strict left-to-right sequence, each stage finished before the next begins.",correct:false,
      feedback:"Real migration is iterative \u2014 findings during Prove routinely send the team back into Discover, Design or Build."},
     {label:"A loop, where evidence from later stages often sends the team back to refine earlier decisions.",correct:true,
      feedback:"Correct. Iteration isn't a sign of poor planning \u2014 it's how complex migration work turns assumptions into tested knowledge."}
   ]
 },
 {
   title:"Check 3",
   question:"What's the difference between productive iteration and uncontrolled churn?",
   options:[
     {label:"Productive iteration is driven by owned, documented decisions being refined with new evidence; uncontrolled churn happens because decisions were never properly owned in the first place.",correct:true,
      feedback:"Correct. Repeatedly learning and improving is healthy. Repeatedly changing because nothing was ever controlled is not."},
     {label:"Productive iteration happens early in the project; uncontrolled churn only happens close to go-live.",correct:false,
      feedback:"Timing isn't the distinguishing factor \u2014 the difference is whether the underlying decisions were properly owned and documented."}
   ]
 },
 {
   title:"Check 4",
   question:"Why is treating a mock migration as a purely technical rehearsal a common trap?",
   options:[
     {label:"Because a useful rehearsal has to test the whole end-to-end process, including timing, validation, responsibilities and decision-making, not just whether the data loads.",correct:true,
      feedback:"Correct. A technical-only rehearsal can miss exactly the operational failures a real cutover would expose."},
     {label:"Because mock migrations are unnecessary if the technical build already works.",correct:false,
      feedback:"Mock migrations are exactly how the team proves the process works \u2014 the trap is testing too narrowly, not skipping them."}
   ]
 },
 {
   title:"Check 5",
   question:"Starting discovery two weeks before cutover instead of months earlier mainly changes what?",
   options:[
     {label:"It doesn't really change anything, as long as the same activities eventually happen.",correct:false,
      feedback:"It changes the cost and safety of learning \u2014 the same discoveries become far more expensive and time-critical the later they happen."},
     {label:"It postpones learning until the cost of learning is at its highest.",correct:true,
      feedback:"Correct. Starting early turns uncertainty into evidence while there's still time to act on it."}
   ]
 },
 {
   title:"Check 6",
   question:"Why does the same five-stage lifecycle belong in Core, shared by both future DMCs and DMLs?",
   options:[
     {label:"Because both need the same end-to-end mental model, even though they'll later interact with each stage differently.",correct:true,
      feedback:"Correct. The DMC will later execute many of these activities in detail; the DML will later plan, coordinate and control them \u2014 but both need to understand the whole lifecycle first."},
     {label:"Because DMCs and DMLs do exactly the same job at every stage.",correct:false,
      feedback:"They don't \u2014 their later emphasis differs significantly, even though the foundational understanding is shared."}
   ]
 }
];

const blocks=[
{
 id:"b1",nav:"We can start next month",title:"Opening scenario: We can start migration next month",type:"mcq",
 html:`<div class="promise-card">
 <div class="promise-lines"><div>Frameworks</div><div>Scenarios</div><div>Reflection</div><div>Assessment</div></div>
 </div>
 <p class="lead">Bramwell Industries is eight months from its planned go-live. The new ERP programme is progressing and several functional workstreams have begun configuration and testing.</p>
 <p>At a steering update, a senior manager asks when the data migration work will begin.</p>
 <div class="quote">\u201cThe legacy systems are still running. There's no point migrating data yet. We'll get the final files from the business about a month before go-live, convert them and load them.\u201d \u2014 the project manager</div>
 <p>You already know Bramwell has customer information in its legacy ERP, CRM and regional workbooks, and that source and target structures don't match directly.</p>
 <h3>What is the strongest response?</h3>`,
 options:["That is reasonable. Migration should start only when production data is stable enough for the final load.","Start building the ETL now, because eight months should be enough time to code all the required transformations.","Migration activity needs to be underway already. Discovery, scope, profiling, mapping, build and repeated testing must happen before the final production migration.","Wait until the target system is completely configured, because no migration work can be done until every target field is final."],
 feedback:[
 "Too late. The final production extract happens near go-live, but the migration lifecycle begins much earlier. Waiting would compress discovery, design, build, testing and issue resolution into an unsafe period.",
 "Better timing, wrong emphasis. Build is only one part of migration. Coding before source, scope, mapping and target requirements are understood can create a large amount of fast, repeatable wrong logic.",
 "This is the strongest response. The final migration is the culmination of months of analysis, decisions, build, validation and rehearsal. The team should already be discovering the landscape and progressively proving the approach.",
 "An unnecessary blocker. Target design must be sufficiently understood, but migration and solution design normally develop together. Waiting for absolute finality removes opportunities to find problems early."
 ]
},
{
 id:"b2",nav:"The visible tip",title:"The final load is only the visible tip",type:"content",
 html:`<p class="lead">People outside a migration team often see migration as a go-live activity: extract legacy data, convert it, import it, check the result. That is the visible event. It is not the full migration.</p>
 <p>Before Bramwell can safely execute a final customer load, someone must already have answered questions such as: which systems contain customer information, which records are in scope, which source is authoritative for each attribute, what quality problems exist, how each target field gets populated, which values need cleansing, what must load before customers and what depends on them, how the migration will be executed repeatedly, how completeness will be proved, how long it takes at production volume, and who decides whether unresolved differences are acceptable.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Cutover is not when migration starts. Cutover is when the migration team executes a process it has already designed, built, tested, measured and refined.</p></div></div>`
},
{
 id:"b3",nav:"The five stages",title:"The Turner Page migration lifecycle",type:"expandableList",
 layout:"grid",
 html:`<p class="lead">Projects use different terminology, but the essential migration activities are remarkably consistent. Turner Page groups them into five practical stages. Open each one.</p>`,
 items: lifecycleStages,
 checkpoint:{
   question:"Once a stage is finished, is it safe to hand the work over the wall to the next team and stop thinking about it?",
   options:["Yes \u2014 each stage should be fully closed out before the next begins.","No \u2014 the lifecycle organises thinking, but stages routinely need revisiting as new evidence appears."],
   feedback:"Correct mindset: the lifecycle is a way to organise thinking, not permission to finish one stage completely and throw the work over a wall to the next team."
 }
},
{
 id:"b4",nav:"Discover and Design",title:"Discover and Design, in practice",type:"content",
 html:`<p class="lead"><strong>Discover</strong> is where the migration team establishes what it's actually dealing with. At Bramwell, the initial programme plan listed only the legacy ERP as the customer source \u2014 discovery is what showed CRM and regional spreadsheets held relevant customer information too.</p>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Starting mapping or build from the system list in the project plan without checking whether important business data exists elsewhere. Discovery is not simply a technical inventory exercise \u2014 it's where assumptions meet evidence, and weak discovery contaminates everything that follows.</p></div>
 <p><strong>Design</strong> is where migration decisions become explicit: which records are in scope, which source supplies each attribute, which values need transformation, what the dependency and load sequence is, and which decisions need formal ownership.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>A migration rule that exists only in someone's head, email inbox or ETL code is not a strong migration design. Important decisions need to be visible, explainable and traceable.</p></div></div>`
},
{
 id:"b5",nav:"Build and Prove",title:"Build and Prove, in practice",type:"content",
 html:`<p class="lead"><strong>Build</strong> converts the agreed design into something executable \u2014 whatever the technology, the principles matter more than the tool: extract consistently, stage in a controlled way, apply agreed transformations, log what happened, and make the process repeatable across cycles.</p>
 <div class="principle"><strong>Core principle</strong><br>A migration build is not finished when it works once. It must be capable of producing controlled, explainable and repeatable results across successive cycles.</div>
 <p><strong>Prove</strong> is where attractive assumptions get exposed \u2014 missing records, incorrect mappings, unexpected values, broken relationships, reconciliation differences, or data that loads successfully but fails business testing. The purpose isn't a green result. It's learning what must change before production.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>A migration defect found in an early cycle is useful information. The dangerous defect is the one the team has not yet created the conditions to discover.</p></div></div>`
},
{
 id:"b6",nav:"Cut over",title:"Cut over: execute what has already been proven",type:"content",
 html:`<p class="lead">At production cutover, Bramwell should not be discovering for the first time how to migrate its 18,530 active customers or 42,600 open sales orders. The team should already understand the final scope, extraction method, dependency sequence, expected timings, validation checks, known exceptions and escalation routes.</p>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Treating a mock migration as a technical rehearsal only. A useful rehearsal tests the end-to-end process \u2014 data, dependencies, timing, validation, responsibilities and decision-making \u2014 not just whether the load technically completes.</p></div>
 <div class="principle"><strong>Key takeaway</strong><br>Production will still create pressure and surprises. The purpose of the earlier lifecycle is to reduce avoidable uncertainty, not to eliminate every surprise entirely.</div>`
},
{
 id:"b7",nav:"A loop, not a conveyor",title:"The lifecycle is a loop, not a conveyor belt",type:"content",
 html:`<p class="lead">The five stages make the work understandable, but real migration doesn't move neatly from left to right. Imagine Bramwell's first meaningful migration cycle produces these findings.</p>
 <ul class="framework-checks">
   <li><strong>317 sales orders have no migrated customer</strong> \u2014 sends the team back to Discover (was the source population complete?) and Design (was scope or matching wrong?).</li>
   <li><strong>Payment term 45E maps incorrectly</strong> \u2014 sends the team back to Design (revise the rule) and Build (implement the change).</li>
   <li><strong>Customer load takes six hours instead of two</strong> \u2014 sends the team back to Build, and possibly Design if sequencing needs rethinking.</li>
   <li><strong>A regional spreadsheet is discovered during UAT</strong> \u2014 sends the team all the way back to Discover, then Design and Build again.</li>
 </ul>
 <p>The movement looks less like a straight line and more like: <strong>Discover \u2192 Design \u2192 Build \u2192 Prove \u2192 (learn) \u2192 refine earlier stages \u2192 repeat with greater confidence \u2192 Cut over.</strong></p>
 <div class="principle"><strong>Key takeaway</strong><br>Iteration is not evidence that the team failed to plan \u2014 it's how complex migration work turns assumptions into tested knowledge. The important distinction is between productive iteration (learning, owned and controlled) and uncontrolled churn (decisions that were never owned or documented in the first place).</div>`
},
{
 id:"b8",nav:"Place the activities",title:"Build it yourself: place the activities",type:"guidedSteps",
 html:`<p class="lead">Bramwell is eight months from go-live. Before revealing each answer, think about which lifecycle stage each activity primarily belongs to.</p>`,
 firstLabel:"Start placing activities",
 steps: activitySteps,
 closingHtml:`<div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Nuance</div><p>Some activities legitimately span stages \u2014 profiling can continue during testing, and mapping may change after defects are found. The exercise asks for the primary purpose, not a rigid project-management label.</p></div></div>`
},
{
 id:"b9",nav:"Starting too late",title:"What happens when you start too late?",type:"content",
 html:`<p class="lead">Return to the project manager's proposal from the start of this lesson: wait until a month before go-live. Suppose Bramwell actually follows it.</p>
 <ul class="framework-checks">
   <li>A regional customer workbook appears two weeks before cutover \u2014 a new source must be analysed, mapped and integrated under severe time pressure.</li>
   <li>63,000 obsolete products are discovered in the extract \u2014 scope and cleansing decisions get made hurriedly, or everything gets migrated regardless.</li>
   <li>The target requires CustomerGroup but legacy ERP has no equivalent \u2014 business enrichment has to be invented late, under pressure.</li>
   <li>A full-volume order load takes 11 hours \u2014 a cutover plan that assumed five hours no longer fits.</li>
   <li>Finance reconciliation shows an unexplained variance \u2014 little time remains to isolate whether the cause is source, mapping, transformation or load logic.</li>
 </ul>
 <p>The underlying problem isn't simply that the team is busy. It's that the project has postponed learning until the cost of learning is highest.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Start early so that uncertainty becomes evidence while there is still time to act on it.</p></div></div>`
},
{
 id:"b10",nav:"DMC vs DML later",title:"Shared lifecycle, different later responsibilities",type:"content",
 html:`<p class="lead">The lifecycle belongs in Core because both career routes need to understand the whole migration, even though they'll later interact with it differently.</p>
 <p>Later, the <strong>Data Migration Consultant</strong> goes deeper into inventory, profiling, detailed mapping, implementation, execution, defects and reconciliation. The <strong>Data Migration Lead</strong> goes deeper into ensuring discovery is complete and owned, controlling scope and dependencies, planning capability and delivery risk, setting cycle purpose and coordinating teams, and orchestrating cutover and Go/No-Go evidence.</p>
 <div class="principle"><strong>Key takeaway</strong><br>Neither path needs the specialist depth of the other yet. Both need to understand how their future work contributes to the same end-to-end outcome.</div>`
},
{
 id:"b11",nav:"Reflection",title:"Which stage gets underestimated?",type:"reflection",
 html:`<p>Which lifecycle stage do you think organisations are most tempted to underestimate, and why?</p>
 <div class="quote">\u201cThere's no single required answer \u2014 consider whether the risk comes from invisible work, late business decisions, technical optimism, weak testing, or pressure to focus on go-live.\u201d</div>
 <textarea id="reflection" placeholder="I think the most underestimated stage is..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/discover|discovery/i, strength:"You focused on Discover \u2014 invisible or incomplete groundwork is exactly the kind of risk that stays hidden until much later.", gap:"Consider whether Discover is underestimated because its cost is invisible until a missing source surfaces late." },
   { test:/design/i, strength:"You focused on Design \u2014 late or undocumented business decisions are a real, recurring risk.", gap:"Consider whether Design gets rushed because decisions feel abstract until build makes them concrete." },
   { test:/build/i, strength:"You focused on Build \u2014 technical optimism about repeatability is a genuine common failure mode.", gap:"Consider whether Build gets underestimated because a single successful run feels like proof, when repeatability is the real bar." },
   { test:/prove|testing|test/i, strength:"You focused on Prove \u2014 weak testing is one of the most common ways migrations look ready when they aren't.", gap:"Consider whether Prove gets compressed under time pressure, trading thorough testing for a faster green result." },
   { test:/cut ?over|go.?live/i, strength:"You focused on Cutover \u2014 pressure to focus on go-live can crowd out the earlier work that actually makes it safe.", gap:"Consider whether Cutover gets over-focused on at the expense of the earlier stages that determine whether it goes smoothly." },
   { test:/consequence|later|expensive|risk/i, strength:"You connected your chosen stage to a specific later consequence, not just a general worry.", gap:"Try connecting the stage you chose to a concrete later consequence, the way the lesson's own examples do." }
 ],
 mentorFeedbackHtml:(score)=>`<div class="principle"><strong>Overall coaching</strong><br>${score>=6?"Good reasoning \u2014 you're already connecting a stage to a real downstream consequence, which is exactly what separates a strong answer from a general opinion.":"Solid start. The strongest answers connect the stage you chose to a specific later consequence \u2014 for example, weak discovery is dangerous not because the inventory looks incomplete on paper, but because missing sources emerge later when change is far more expensive."}</div>`
},
{
 id:"kc1",nav:"Knowledge check",title:"Quick knowledge check",type:"situations",
 html:`<p class="lead">A short, ungraded check \u2014 test what stuck, no score, no pressure.</p>`,
 items: knowledgeCheckItems
},
{
 id:"b12",nav:"Summary",title:"If you remember nothing else",type:"content",
 html:`<p class="lead">The final production load is only one event in a much longer migration lifecycle \u2014 understanding the whole shape of it is what this lesson has been building toward.</p>
 <ul class="framework-checks lesson-outcomes">
   <li>Turner Page uses five practical stages: Discover, Design, Build, Prove and Cut over.</li>
   <li>Discovery establishes what exists; Design decides what should happen; Build makes it executable; Prove creates evidence; Cutover executes the proven process.</li>
   <li>The lifecycle is iterative \u2014 testing and new evidence legitimately send the team back to earlier decisions and build.</li>
   <li>Starting migration late postpones learning until changes are more expensive and time-critical.</li>
 </ul>
 <div class="principle"><strong>Key takeaway</strong><br>Cutover is the end of the migration lifecycle, not the beginning of migration activity.</div>`
},
{
 id:"b13",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
 html:`<div class="complete"><div class="tick">\u2713</div>
 <p class="lead"><strong>You have completed The data migration lifecycle.</strong></p>
 <p>You now understand what migration is, the types and dependencies of business data, the relationship between source and target landscapes, and the lifecycle used to turn that understanding into a production migration.</p>
 </div>

   <button id="valuableMicButton" class="btn secondary" type="button">Use microphone</button>

 </div>
 <div id="valuableFeedback"></div>

 <p><strong>Scope, strategy and the migration team \u2014 the final lesson of Core Module 1.</strong></p>`,
 minLength:20,

}
];
