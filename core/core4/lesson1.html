<script>
/* ==============================================================
   CORE MODULE 4 — LESSON 1 DATA. All chrome, styling and engine
   behaviour come from shared/turner-page-kit.css + .js.

   Recurring programme client: Bramwell Industries. Facts used here
   must stay consistent with Modules 1-3 and the story bible: 18,530
   active customers; customer C10482, Harrison Trade Supplies Ltd.
============================================================== */

// Section 8 — "Build it yourself: Bramwell customer pipeline". The
// learner matches each pipeline step to its actual control point.
// Options are reordered per item so the correct answer's position
// does not track the item number.
const controlLabels = [
  "18,530 expected source records",
  "Raw count reconciles to extract",
  "Exceptions separated and counted",
  "Only valid/build-approved records proceed",
  "Output count plus rejected count reconcile to transformed population",
  "Target accepted/rejected counts captured"
];
const pipelineItems = [
  {
   q:"Extract: capture the agreed active-customer scope and required source fields from the legacy ERP.",
   order:[0,2,4,1,5,3], a:0,
   why:"Extraction is only controlled if it can prove it captured the intended population, which for Bramwell means demonstrating 18,530 expected source records."
  },
  {
   q:"Raw stage: retain source values plus source key, extract date and cycle ID in RawCustomer.",
   order:[3,1,5,0,2,4], a:1,
   why:"The raw stage exists to preserve exactly what was received. Its control is that the raw count reconciles to the extract, nothing more and nothing less."
  },
  {
   q:"Transform: apply approved mappings, lookups, standardisation and derivations in CustomerTransform.",
   order:[4,0,2,5,1,3], a:2,
   why:"Transformation should never make exceptions disappear. Its control is that exceptions are separated out and counted, not silently absorbed."
  },
  {
   q:"Validate: check required target values, formats, keys and cross-reference coverage in CustomerValidated.",
   order:[1,3,0,4,2,5], a:3,
   why:"Validation exists to stop known-bad output going further. Its control is that only valid, build-approved records proceed to load preparation."
  },
  {
   q:"Load output: create the target-ready population as a load file, API payload or native import dataset.",
   order:[5,2,1,4,0,3], a:4,
   why:"This step packages the approved output for the target. Its control is that the output count plus the rejected count reconcile back to the transformed population."
  },
  {
   q:"Target load: load the accepted customer records through the target import mechanism.",
   order:[2,4,3,0,1,5], a:5,
   why:"The final handover to the target is only controlled if the accepted and rejected counts coming back from the target are actually captured as evidence."
  }
];
const pipelineSituations = pipelineItems.map((p, idx) => ({
  title:`Step ${idx+1}`,
  question:p.q,
  options: p.order.map(li => ({
    label: controlLabels[li],
    correct: li === p.a,
    feedback: (li === p.a ? "Correct.<br>" : "Not quite. Think about what this specific step is actually there to prove.<br>") + p.why
  }))
}));

const blocks=[
{
 id:"b1",nav:"One script, source to target",title:"Opening scenario: One script from source to target",type:"mcq",
 html:`<p class="lead">Bramwell is ready to begin customer migration build. A developer proposes a fast approach.</p>
 <div class="quote">"Read the customer tables directly from the legacy ERP, transform the values in one script, and insert the final output straight into the target import interface. No intermediate data needs to be retained because the script can simply be rerun."<br><span class="small">Developer, proposed design</span></div>
 <p>The first test run loads 18,112 customer records. The expected active-customer population is 18,530.</p>
 <div class="quote">"418 records must have failed somewhere in the logic. I'll add more error handling and rerun."<br><span class="small">Developer</span></div>
 <h3>Your decision</h3>`,
 options:[
 "Continue with the design. A single process is simpler and therefore less likely to fail.",
 "Add logging to the existing script, but there is no need to change the pipeline structure.",
 "Separate the migration into controlled stages so the team can prove what was extracted, what changed, what was rejected and what was presented to the target.",
 "Load all 18,530 customers without transformation first, then correct the target data after import."
 ],
 _correctIndex:2,
 feedback:[
 "A compact process can still be difficult to explain or recover when extraction, transformation and rejection are all mixed together.",
 "Logs are useful, but retained stage boundaries make populations and transformations easier to inspect, reconcile and rerun.",
 "Correct. A migration pipeline should make the movement and treatment of data visible enough to explain every population change.",
 "Knowingly loading untransformed or invalid data into the target shifts migration problems into the business system and weakens control."
 ]
},
{
 id:"b2",nav:"What happens next",title:"What happens next",type:"content",
 html:`<p class="lead">Suppose the team takes option C and separates the process into controlled stages instead of patching the one-script design.</p>
 <p>The 418-record gap stops being a mystery the moment there are stage boundaries to look between.</p>
 <div class="visual-card">
   <div class="visual-title">What separating the stages reveals</div>
   <ul class="framework-checks">
     <li><strong>Extraction:</strong> 18,530 records genuinely leave the source. The gap is not happening here.</li>
     <li><strong>Transformation:</strong> 114 records produce a known mapping exception, such as unresolved CustomerGroup 99.</li>
     <li><strong>Pre-load validation:</strong> a further set fail a target format or reference check before ever reaching the target.</li>
     <li><strong>Target load:</strong> a small remainder are rejected by the target itself for reasons the pipeline can now name.</li>
   </ul>
 </div>
 <p>418 unexplained records becomes several small, explainable populations, each with its own cause. That is only possible because the stages were separated in the first place.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>A good pipeline lets you explain what happened to the data between source and target.</p></div></div>`
},
{
 id:"b3",nav:"A controlled journey",title:"A migration pipeline is a controlled journey",type:"content",
 html:`<p class="lead">At its simplest, a migration pipeline moves data through a series of deliberate states.</p>
 <div class="visual-card">
   <div class="visual-title">Core flow</div>
   <p style="font-size:20px;font-weight:800;letter-spacing:.02em;text-align:center;margin:6px 0">EXTRACT &rarr; STAGE &rarr; TRANSFORM &rarr; VALIDATE &rarr; LOAD</p>
 </div>
 <p>These labels describe responsibilities, not necessarily five separate technologies or databases.</p>
 <div class="visual-card">
   <div class="visual-title">What each stage is actually for</div>
   <ul class="framework-checks">
     <li><strong>Extract:</strong> capture the agreed source population.</li>
     <li><strong>Stage:</strong> retain a controlled working copy of what was extracted.</li>
     <li><strong>Transform:</strong> apply the approved mapping and cleansing rules.</li>
     <li><strong>Validate:</strong> check that the output is complete, structurally valid and consistent with the rules before load.</li>
     <li><strong>Load:</strong> present or import the approved output into the target.</li>
   </ul>
 </div>
 <div class="principle"><strong>Turner Page principle</strong><br>A good pipeline lets you explain what happened to the data between source and target.</div>
 <p>Separation gives the migration team useful control points: reconciling source counts to extracted counts, inspecting the source snapshot without repeatedly querying the live source, rerunning transformation without re-extracting, comparing raw and transformed values, isolating rejected records, reprocessing only the affected stage, and retaining evidence of what a migration cycle actually used.</p>
 <p>This does not mean every project needs an elaborate architecture. The design should be proportionate to volume, risk and tooling.</p>
 <div class="principle"><strong>Core principle</strong><br>Separate responsibilities enough to make the process observable, repeatable and recoverable.</div>`
},
{
 id:"b4",nav:"Extract and stage",title:"Extract the population you actually intend to migrate, then stage it before changing it",type:"content",
 html:`<p class="lead">Extraction is not simply SELECT * FROM Customer. For Bramwell active customers, extraction should reflect the agreed population definition.</p>
 <div class="visual-card">
   <div class="visual-title">The team needs to know</div>
   <ul class="framework-checks">
     <li>Which source system/object is authoritative</li>
     <li>Which legal entities are included</li>
     <li>How active is defined</li>
     <li>Whether records are filtered by date/status/type</li>
     <li>Which related source attributes are required</li>
     <li>When the extract was taken</li>
     <li>Whether the source can change during extraction</li>
   </ul>
 </div>
 <p>If the expected population is 18,530, the pipeline should be able to demonstrate why the extract contains 18,530, or explain the difference.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>The first reconciliation happens before transformation. Prove that you extracted the intended population before asking whether you transformed it correctly.</p></div></div>
 <p>A raw staging layer then preserves what the migration process received from the source: values retained as extracted, source identifiers retained, an extract timestamp or batch/cycle identifier, the source system/object recorded, minimal or no business transformation, and enough metadata to trace the record back to the source population.</p>
 <div class="principle"><strong>Turner Page principle</strong><br>Keep a copy of what you received before you start changing what it means.</div>`
},
{
 id:"b5",nav:"Transform and validate",title:"Transform from the mapping, not from memory, and validate before you load",type:"content",
 html:`<p class="lead">The transformation layer implements the decisions built in Module 3.</p>
 <div class="visual-card">
   <div class="visual-title">Mapping decision to pipeline treatment</div>
   <ul class="framework-checks">
     <li><strong>UK &rarr; GB:</strong> apply the approved country cross-reference.</li>
     <li><strong>STD &rarr; STANDARD:</strong> apply the approved CustomerGroup standardisation.</li>
     <li><strong>45E &rarr; target payment term:</strong> resolve through the approved payment-term cross-reference.</li>
     <li><strong>SMITHJ &rarr; target SalesOwner:</strong> resolve through the approved worker cross-reference.</li>
     <li><strong>CustomerGroup 99:</strong> produce an exception until an approved treatment exists.</li>
   </ul>
 </div>
 <p>The developer can choose the best technical implementation, but the output should still reflect the approved mapping.</p>
 <div class="principle"><strong>Core principle</strong><br>The mapping tells the build what the data should become. The build should not quietly become a second source of business rules.</div>
 <p>Not every validation belongs after the target import. Before Bramwell sends customer output to the target, the pipeline can already check expected record counts, mandatory target fields populated where required, target field lengths and formats, valid reference/cross-reference values, duplicate target business keys, unresolved mapping exceptions, and relationship keys required by later loads.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Reject early when the pipeline already knows the output cannot satisfy the agreed target rule.</p></div></div>`
},
{
 id:"b6",nav:"Build the pipeline",title:"Build it yourself: Bramwell customer pipeline",type:"situations",
 html:`<p class="lead">Design a simple pipeline for Bramwell's 18,530 active customers. For each step, identify the control point that actually proves it worked.</p>`,
 items: pipelineSituations,
 takeawayHtml:`<div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>The learner is creating a Migration Pipeline View: stage &rarr; input &rarr; treatment &rarr; output &rarr; control/reconciliation point.</p></div></div>`
},
{
 id:"b7",nav:"Every stage should reconcile",title:"Every stage should reconcile, and identity should survive the journey",type:"content",
 html:`<p class="lead">A pipeline should make population movement explainable. Imagine Bramwell's first controlled run.</p>
 <div class="visual-card">
   <div class="visual-title">Bramwell's first controlled run</div>
   <ul class="framework-checks">
     <li><strong>Source active-customer population:</strong> 18,530</li>
     <li><strong>Raw stage:</strong> 18,530</li>
     <li><strong>Transformation output:</strong> 18,530</li>
     <li><strong>Pre-load valid population:</strong> 18,416</li>
     <li><strong>Known transformation/mapping exceptions:</strong> 114</li>
     <li><strong>Target accepted:</strong> 18,402</li>
     <li><strong>Target rejected:</strong> 14</li>
   </ul>
 </div>
 <p>Now the team can explain the numbers: 18,416 + 114 = 18,530 before target load, and 18,402 + 14 = 18,416 presented to the target. The 114 pre-load exceptions are a different population from the 14 target rejections.</p>
 <div class="principle"><strong>Turner Page principle</strong><br>A record should not simply disappear between stages. It should proceed, be rejected, be excluded by an approved rule or remain explicitly accounted for.</div>
 <p>Bramwell customer C10482 should also remain traceable through every stage: CustNo = C10482 at source, SourceKey = C10482 with Cycle = CYCLE01 at raw stage, the same SourceKey carried through transformation, retained on any exception output with a reason, and retained or referenced at target output and validation evidence. Technical surrogate keys may be added, but they should not destroy the ability to identify the source record.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>When a user reports that one migrated customer is wrong, the team should be able to trace that customer backwards through the pipeline without guesswork.</p></div></div>`
},
{
 id:"b8",nav:"Built to run again",title:"Design for repeatability from the beginning, and use cycle and batch identifiers",type:"content",
 html:`<p class="lead">Bramwell will not migrate customers only once. The process will run through development, test cycles, mock migrations and eventually production cutover.</p>
 <div class="visual-card">
   <div class="visual-title">A repeatable pipeline should avoid</div>
   <ul class="framework-checks">
     <li>Manual edits to intermediate files that are not captured as rules</li>
     <li>Hard-coded dates that must be changed by hand</li>
     <li>One-off record fixes inside output files</li>
     <li>Dependencies on a developer remembering the correct run order</li>
     <li>Outputs that cannot be tied to a specific cycle</li>
   </ul>
 </div>
 <div class="principle"><strong>Core principle</strong><br>Build the first pipeline as if you already know you will have to run it again, because you will.</div>
 <p>A simple cycle or batch identifier can become one of the most useful controls in the migration.</p>
 <div class="visual-card">
   <div class="visual-title">Metadata example</div>
   <ul class="framework-checks">
     <li>MigrationCycle = CYCLE01</li>
     <li>ExtractDate = 2026-09-03</li>
     <li>Object = CUSTOMER</li>
     <li>Source = BRAMWELL_ERP</li>
   </ul>
 </div>
 <p>This helps the team separate one run from another, compare results across cycles, tie exceptions to the correct execution, retain evidence of what was loaded, and avoid mixing old and new staging data.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Without run identity, yesterday's data can quietly become today's evidence.</p></div></div>`
},
{
 id:"b9",nav:"People and tools",title:"The pipeline includes people and decisions, and tool choice comes after pipeline logic",type:"content",
 html:`<p class="lead">A pipeline diagram can make migration look purely technical. It is not.</p>
 <div class="visual-card">
   <div class="visual-title">Human/business dependencies along the pipeline</div>
   <ul class="framework-checks">
     <li><strong>Extraction:</strong> scope/population definition approved.</li>
     <li><strong>Transformation:</strong> mapping and business rules approved.</li>
     <li><strong>Exception handling:</strong> business owner resolves or accepts exceptions.</li>
     <li><strong>Pre-load validation:</strong> migration team confirms technical/data readiness.</li>
     <li><strong>Target load:</strong> environment/configuration and load window available.</li>
     <li><strong>Post-load checks:</strong> business/functional users validate usability.</li>
   </ul>
 </div>
 <div class="callout misconception"><div class="callout-label">Core boundary</div><p>The DMC may implement much of the pipeline. The DML may later plan and control the wider execution. Core learners need to understand the whole flow and the responsibilities that make it work.</p></div>
 <p>The same conceptual pipeline can be implemented in many ways: SQL, database copy, flat files, APIs or cloud data services for extract/stage; SQL, SSIS, Power Query, Python or ADF for transform; SQL queries, scripts or reconciliation tools for validate; and target-native import, API or an integration framework for load.</p>
 <div class="callout misconception"><div class="callout-label">Common trap</div><p>Starting with "We are using Tool X, so what pipeline does Tool X give us?" Start with the migration control you need, then design the implementation appropriately.</p></div>
 ${TPKit.fromField({
   title:"The One Script That Explained Nothing", name:"Marcus", role:"Data Migration Consultant", project:"Logistics ERP",
   src:"/assets/audio/core4-lesson1-fromfield-marcus.mp3",
   reflection:"Have you seen a single all-in-one script make it impossible to explain where records actually went missing?"
 })}`
},
{
 id:"b10",nav:"Judgement calls",title:"Judgement calls: is the pipeline controlled?",type:"content",
 html:`<p class="lead">Five situations show what "controlled" actually means in practice.</p>
 <div class="quote">18,530 records are extracted and 18,402 reach the target file. No exception dataset exists.</div>
 <p>Not controlled. The team must explain the 128-record difference before treating the output as ready.</p>
 <div class="quote">A business user manually fixes 40 payment terms in the final load file because the next test starts tomorrow.</div>
 <p>The corrections may be valid, but the pipeline is no longer repeatable. Feed approved corrections back into source, enrichment data or controlled transformation logic.</p>
 <div class="quote">The project loads transformed data directly through a target API and does not create a physical load file.</div>
 <p>That can still be controlled if the staged inputs, transformation outputs, batch identity, API responses and exceptions remain traceable.</p>
 <div class="quote">The team creates fifteen staging layers for a simple 2,000-row reference table because "more control is better".</div>
 <p>Control should be proportionate. Architecture should make the process observable and repeatable without unnecessary complexity.</p>
 <div class="quote">Fourteen customers pass pre-load validation but the target rejects them due to a configuration rule not previously known.</div>
 <p>Capture the target rejection separately, investigate the missing dependency/rule, update the mapping or validation where appropriate, then reprocess deliberately.</p>`
},
{
 id:"b11",nav:"AI and the pipeline",title:"AI can help build and inspect the pipeline",type:"content",
 html:`<p class="lead">AI can accelerate technical work once the pipeline design and business rules are understood.</p>
 <div class="visual-card">
   <div class="visual-title">Useful applications</div>
   <ul class="framework-checks">
     <li>Draft extraction queries</li>
     <li>Generate transformation code from approved mapping rules</li>
     <li>Suggest validation checks</li>
     <li>Review code for missing branches or error handling</li>
     <li>Summarise run logs and exception patterns</li>
     <li>Compare pipeline outputs between runs</li>
   </ul>
 </div>
 <p>Generated code still needs technical review and testing, and client data should only be used with approved tools and controls.</p>
 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">AI principle</div><p>Use AI to accelerate implementation and investigation. Do not let generated code redefine the approved migration logic.</p></div></div>`
},
{
 id:"b12",nav:"Reflection",title:"Where would you look?",type:"reflection",
 html:`<p>Consider a migrated record that disappears somewhere between source and target.</p>
 <div class="quote">How many places in your pipeline could you inspect to explain exactly where and why it disappeared?</div>
 <p>A pipeline is not well controlled because it has many boxes. It is well controlled because each important transition can be explained and reproduced.</p>
 <textarea id="reflection" placeholder="I could inspect..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:40,
 checks:[
   { test:/extract|source|raw/i, strength:"You considered checking the extraction or raw stage first.", gap:"Consider whether the record ever actually left the source in the first place." },
   { test:/transform|rule|mapping/i, strength:"You considered whether transformation or mapping rules could have excluded the record.", gap:"Consider whether a transformation or mapping rule could have quietly excluded the record." },
   { test:/validat|exception|reject/i, strength:"You considered pre-load validation or exception handling as a place to look.", gap:"Consider whether pre-load validation or an exception rule removed the record before it reached the target." },
   { test:/target|load/i, strength:"You considered the target load itself as a possible point of loss.", gap:"Consider whether the target itself rejected the record during load." },
   { test:/explain|reproduce|trace/i, strength:"You connected this to being able to explain and reproduce the answer, not just guess at it.", gap:"Consider what it would actually take to explain and reproduce the answer, not just guess at it." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">I could check whether the record was ever extracted, whether it produced a transformation exception, whether pre-load validation rejected it, or whether the target itself rejected it during load. A well-controlled pipeline should let me answer that question by checking evidence at each stage boundary, not by guessing.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=6?"This is genuinely strong pipeline thinking. You are treating each stage boundary as a place evidence should exist.":"You have made a start. Push further into naming the specific stage boundaries where evidence should exist."}</div>`
},
{
 id:"b13",nav:"Summary",title:"Lesson summary",type:"content",
 html:`<p class="lead">Bramwell now has the shape of a controlled migration process.</p>
 <ul class="framework-checks lesson-outcomes">
   <li>A migration pipeline is the controlled journey from source extraction to target load.</li>
   <li>The core conceptual flow is Extract &rarr; Stage &rarr; Transform &rarr; Validate &rarr; Load.</li>
   <li>Stage boundaries help reconciliation, investigation, rerun and traceability.</li>
   <li>Extraction must represent the agreed migration population.</li>
   <li>Raw staging preserves what was received before business transformation.</li>
   <li>Transformation should implement approved mapping decisions.</li>
   <li>Known invalid output should be identified before target load where possible.</li>
   <li>Every population change should be explainable.</li>
   <li>Source identity and cycle/batch identity should survive through the process.</li>
   <li>Pipeline design should assume repeated execution from the beginning.</li>
   <li>Tool choice should support the required migration controls, not define them.</li>
 </ul>
 <div class="principle"><strong>Key takeaway</strong><br>A professional migration pipeline does more than move data. It makes every important change in the journey visible, repeatable and explainable.</div>`
},
{
 id:"b14",nav:"Knowledge check",title:"Knowledge check: test what stuck",type:"situations",
 html:`<p class="lead">A quick recall check on this lesson. No score, no pressure, and it will not affect your progress or certification, but it is a good way to catch anything that did not quite stick while it is still fresh.</p>`,
 items:[
  {
   title:"Check 1",
   question:"A single script extracts, transforms and loads customer data in one step, and 418 records go missing with no explanation. What is the core problem?",
   options:[
     {label:"The script is too slow", correct:false, feedback:"Not quite. Speed was never the issue here."},
     {label:"There are no stage boundaries where the missing population could be explained", correct:true, feedback:"Correct. Separating responsibilities gives you places to look, not just a place to rerun from."},
     {label:"The script should have been written in a different programming language", correct:false, feedback:"Not quite. The language is irrelevant; the architecture is the problem."}
   ]
  },
  {
   title:"Check 2",
   question:"What is the core conceptual flow of a migration pipeline?",
   options:[
     {label:"Extract, Transform, Load, Stage, Validate", correct:false, feedback:"Not quite. Staging happens right after extraction, before transformation."},
     {label:"Extract, Stage, Transform, Validate, Load", correct:true, feedback:"Correct. This order lets the team retain raw evidence before anything is changed."},
     {label:"Stage, Extract, Validate, Transform, Load", correct:false, feedback:"Not quite. You cannot stage data before it has been extracted."}
   ]
  },
  {
   title:"Check 3",
   question:"18,416 pre-load valid records plus 114 known exceptions should equal what?",
   options:[
     {label:"18,402, the number of target-accepted records", correct:false, feedback:"Not quite. That number also has to account for the 14 target rejections separately."},
     {label:"18,530, the original extracted population", correct:true, feedback:"Correct. A record should not simply disappear between stages; it should be accounted for."},
     {label:"There is no expected relationship between these numbers", correct:false, feedback:"Not quite. Every stage should reconcile to the one before it."}
   ]
  },
  {
   title:"Check 4",
   question:"Why does Bramwell customer C10482 need to remain traceable through every pipeline stage?",
   options:[
     {label:"So a user report about one wrong customer can be traced backwards without guesswork", correct:true, feedback:"Correct. Retained identity is what makes investigation possible."},
     {label:"Because target systems require the same identifier format as the source", correct:false, feedback:"Not quite. Technical surrogate keys can differ; the point is not destroying traceability."},
     {label:"Traceability is optional and only needed for financial data", correct:false, feedback:"Not quite. Traceability matters for any object a business user might query."}
   ]
  },
  {
   title:"Check 5",
   question:"Why does a migration pipeline need a cycle or batch identifier?",
   options:[
     {label:"So different executions can be separated, compared and tied to the correct evidence", correct:true, feedback:"Correct. Without run identity, yesterday's data can quietly become today's evidence."},
     {label:"Because target systems reject data without a batch identifier", correct:false, feedback:"Not quite. Many targets do not require this technically; it is a migration control."},
     {label:"Cycle identifiers are only needed once the migration reaches production", correct:false, feedback:"Not quite. They matter from the very first test cycle."}
   ]
  },
  {
   title:"Check 6",
   question:"Why should tool choice come after pipeline logic, not before?",
   options:[
     {label:"Because starting with a tool can make the team accept whatever pipeline that tool happens to offer, rather than designing the control it actually needs", correct:true, feedback:"Correct. Start with the migration control you need, then design the implementation."},
     {label:"Because all migration tools produce the same pipeline regardless of design", correct:false, feedback:"Not quite. Tools genuinely differ; the point is not to let them dictate the design."},
     {label:"Tool choice is irrelevant to pipeline design", correct:false, feedback:"Not quite. Tooling affects implementation; it should not define the required controls."}
   ]
  }
 ]
},
{
 id:"b15",nav:"Lesson complete",title:"Lesson complete",type:"valuable",
