const blocks = [
{
  id:"b1",nav:"Everything is green",title:"Monday, 09:05: everything is green",type:"mcq",
  html:`<p class="lead">Monday, 09:05. Three weeks before the next migration cycle.</p>
  <p>The project manager asks for your Data Migration status. The dashboard shows green. The technical team says the customer pipeline runs. The business says mapping is nearly complete.</p>
  <p>Then, in the next ten minutes, you learn:</p>
  <ul>
    <li>the business has added historical customer attachments to the requested scope</li>
    <li>nobody can show which customer mappings have actually been approved</li>
    <li>the latest cycle plan still assumes the previous, smaller customer population</li>
    <li>seven delivery addresses disappeared during transformation in the last test</li>
    <li>the finance SME who must decide payment-term treatment is unavailable until Thursday</li>
  </ul>
  <p><strong>Is this workstream controlled?</strong></p>`,
  options:[
    "Yes \u2014 the dashboard is green and the technical pipeline runs, so the fundamentals are sound.",
    "No \u2014 five separate signals just contradicted the green status, and not one of them has an owner or a date yet.",
    "Ask the technical team to reconfirm the pipeline before reacting to the other four points.",
    "It is too early to say. Note the five items and revisit them at the next cycle checkpoint."
  ],
  feedback:[
    "A green dashboard measures one thing: whether the last run executed. None of the five facts you just learned are about execution \u2014 they are about scope, evidence and delivery, and a technical green light cannot answer them.",
    "This is the controlled response. None of the five facts is a crisis on its own, but together they touch all three sides of workstream control, and none has an owner or a decision date yet. That is what \u201cnot controlled\u201d actually looks like \u2014 not an alarm, an absence of ownership.",
    "The pipeline running was never in question \u2014 it is one of the few things that is confirmed. Re-checking it spends time on the one signal that already has evidence, while the other four sit unowned.",
    "Three weeks before a cycle, an unowned scope change, an unapproved mapping set and an unavailable decision-maker will not resolve themselves by the checkpoint. Waiting is itself a choice, and it is the wrong one here."
  ],
  _correctIndex:1
},
{
  id:"b2",nav:"What happens next",title:"From evidence to control",type:"content",
  html:`<p class="lead">You raise all five points before the meeting closes, not after.</p>
  <p>The project manager asks what you actually need. You do not ask for more time or a bigger team. You ask three things: what exactly has been agreed for scope, what evidence supports today's status, and whether the plan can still deliver it. Within a day, the picture is different \u2014 not because the five facts have gone away, but because each one now has an owner and a next step.</p>
  <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Lesson 1 established the habit: do not recommend from instinct, activity or reassurance \u2014 build the evidence first. Lesson 2 answers the next question. Once you own the migration outcome, what do you actually control, every single day?</p></div></div>
  <p><strong>The answer:</strong> you control the obligation, you control the evidence, and you control the path to delivery. That is the DML Control Triangle \u2014 Scope, Evidence and Delivery. None of the five Monday facts was merely a technical issue. Your job is to work out what each one does to the controlled position, and what has to happen next.</p>`
},
{
  id:"b3",nav:"The Control Triangle",title:"The DML Control Triangle",type:"content",
  html:`<p class="lead">A Data Migration Lead needs a simple way to keep a workstream under control while hundreds of details change underneath it.</p>
  <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse">
  <tr><th style="text-align:left;padding:8px 10px">Control dimension</th><th style="text-align:left;padding:8px 10px">Leadership question</th><th style="text-align:left;padding:8px 10px">Failure mode</th></tr>
  <tr><td style="padding:8px 10px"><strong>SCOPE</strong></td><td style="padding:8px 10px">What exactly are we migrating, for whom, and under what agreed boundary?</td><td style="padding:8px 10px">The team works hard on the wrong, or a quietly expanding, problem.</td></tr>
  <tr><td style="padding:8px 10px"><strong>EVIDENCE</strong></td><td style="padding:8px 10px">What proves our status, readiness, quality and decisions?</td><td style="padding:8px 10px">Status becomes opinion, optimism or stale reporting.</td></tr>
  <tr><td style="padding:8px 10px"><strong>DELIVERY</strong></td><td style="padding:8px 10px">Can the agreed scope be completed through the required cycles and cutover window?</td><td style="padding:8px 10px">A theoretically correct migration arrives too late, or cannot be executed safely.</td></tr>
  </table></div>
  <div class="callout misconception"><div class="callout-label">Common trap</div><p>Two sides are strong, so we're basically fine.</p><p>A workstream is not controlled because two sides are strong. Weakness in any one side eventually damages the other two \u2014 Monday's finance delay (evidence) will become a delivery problem the moment it passes its decision-by date, whether or not scope and delivery currently look fine.</p></div>
  <div class="principle"><strong>Key takeaway</strong><br>Scope defines the obligation. Evidence tells you the true state of that obligation. Delivery turns it into a sequence of achievable outcomes.</div>`
},
{
  id:"b4",nav:"Explore the triangle",title:"Explore: the DML Control Triangle",type:"content",
  html:`<p class="lead">This is not three coloured boxes. Select a corner to see the evidence behind it.</p>
  <div class="ctri-wrap" id="ctriWrap">
    <svg class="ctri-lines" viewBox="0 0 400 320" preserveAspectRatio="none" aria-hidden="true">
      <line class="ctri-line" data-corner="scope" x1="200" y1="30" x2="60" y2="290"/>
      <line class="ctri-line" data-corner="evidence" x1="200" y1="30" x2="340" y2="290"/>
      <line class="ctri-line" data-corner="delivery" x1="60" y1="290" x2="340" y2="290"/>
    </svg>
    <div class="ctri-corner" id="ctriScope" data-corner="scope" style="left:50%;top:9%" tabindex="0" role="button" aria-expanded="false">
      <div class="ctri-corner-inner"><div class="ctri-corner-name">SCOPE</div><div class="ctri-corner-q">What exactly are we migrating?</div></div>
    </div>
    <div class="ctri-corner" id="ctriEvidence" data-corner="evidence" style="left:85%;top:91%" tabindex="0" role="button" aria-expanded="false">
      <div class="ctri-corner-inner"><div class="ctri-corner-name">EVIDENCE</div><div class="ctri-corner-q">What proves our status?</div></div>
    </div>
    <div class="ctri-corner" id="ctriDelivery" data-corner="delivery" style="left:15%;top:91%" tabindex="0" role="button" aria-expanded="false">
      <div class="ctri-corner-inner"><div class="ctri-corner-name">DELIVERY</div><div class="ctri-corner-q">Can we still get there?</div></div>
    </div>
  </div>
  <p class="ctri-hint">Select each corner in turn.</p>
  <div class="ctri-panel" id="ctriPanelScope" hidden>
    <h4>Scope: define the obligation</h4>
    <table><tr><th>Weak scope statement</th><th>Controlled scope statement</th></tr>
    <tr><td>Customers</td><td>Active customers for agreed legal entities, defined historical treatment, related in-scope addresses/contacts, explicit exclusions and agreed source systems.</td></tr>
    <tr><td>Attachments</td><td>Named document types, source repositories, date/history boundary, target association rule and volume estimate.</td></tr></table>
    <p style="margin:12px 0 0"><strong>Leadership question:</strong> could two competent people read the scope and independently reach the same conclusion about whether a record is in or out?</p>
  </div>
  <div class="ctri-panel" id="ctriPanelEvidence" hidden>
    <h4>Evidence: status must be provable</h4>
    <table><tr><th>Statement</th><th>Evidence question</th></tr>
    <tr><td>"Mapping is 90% complete."</td><td>90% of what denominator, and what counts as complete?</td></tr>
    <tr><td>"We are ready for cutover."</td><td>Which readiness criteria have passed, and what remains conditional?</td></tr></table>
    <p style="margin:12px 0 0"><strong>Principle:</strong> a status without a denominator, a definition and a source of proof is usually a conversation starter, not a control.</p>
  </div>
  <div class="ctri-panel" id="ctriPanelDelivery" hidden>
    <h4>Delivery: turn scope into a sequence of outcomes</h4>
    <table><tr><th>DML delivery control</th><th>Typical consequence if weak</th></tr>
    <tr><td>Readiness gates</td><td>A cycle begins with known blockers or incomplete evidence.</td></tr>
    <tr><td>Decision-by dates</td><td>A business question becomes an emergency technical workaround.</td></tr></table>
    <p style="margin:12px 0 0"><strong>DML rule:</strong> a date is not a delivery plan. A controlled delivery position shows gates, dependencies, sequence, decision dates, evidence time and recovery margin.</p>
  </div>
  `,
  onMount: ({ lesson }) => {
    const wrap = lesson.querySelector("#ctriWrap");
    if(!wrap) return;
    const corners = [...wrap.querySelectorAll(".ctri-corner")];
    const lines = [...wrap.querySelectorAll(".ctri-line")];
    const panels = {
      scope: lesson.querySelector("#ctriPanelScope"),
      evidence: lesson.querySelector("#ctriPanelEvidence"),
      delivery: lesson.querySelector("#ctriPanelDelivery")
    };
    let openCorner = null;
    function show(name){
      openCorner = name;
      corners.forEach(c=>{
        const on = c.dataset.corner===name;
        c.classList.toggle("active",on);
        c.classList.toggle("pinned",on);
        c.setAttribute("aria-expanded", on ? "true" : "false");
      });
      lines.forEach(l=>l.classList.toggle("active", l.dataset.corner===name));
      Object.keys(panels).forEach(k=>{ if(panels[k]) panels[k].hidden = (k!==name); });
    }
    corners.forEach(c=>{
      c.addEventListener("click",()=>{
        show(openCorner===c.dataset.corner ? c.dataset.corner : c.dataset.corner);
      });
      c.addEventListener("keydown",(e)=>{
        if(e.key==="Enter"||e.key===" "){e.preventDefault();c.click()}
      });
    });
    show("scope");
  }
},
{
  id:"b5",nav:"Tuesday status rescue",title:"Build it yourself: the Tuesday status rescue",type:"reflection",
  html:`<p class="lead">It is Tuesday, 08:00. The steering committee meets at 10:00 and expects a status update on customer migration.</p>
  <p>Using what Monday actually surfaced \u2014 the attachments request, the unapproved mappings, the stale cycle-plan assumption, the seven missing delivery addresses, and the unavailable finance SME \u2014 write the status you would actually give the committee. Do not just list the five facts back. Say what each one does to scope, evidence or delivery, and what you need from the committee to fix it.</p>
  <textarea id="reflection" placeholder="Customer migration is not currently controlled, and I want to be specific about why..."></textarea>
  <div class="voice-row">
    <button id="micButton" class="btn secondary" type="button">Use microphone</button>
    <span id="micStatus" class="small"></span>
  </div>
  <div style="margin-top:16px">
    <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
  </div>
  <div id="reflectionFeedback"></div>`,
  minLength:60,
  checks:[
    { test:/attachment/i, strength:"You named the attachments scope change.", gap:"Name the attachments scope change and what it does to the migration's obligation." },
    { test:/mapping/i, strength:"You named the unapproved mappings.", gap:"Name that customer mappings aren't yet confirmed as approved." },
    { test:/cycle|population/i, strength:"You named the stale cycle-plan assumption.", gap:"Name that the cycle plan still assumes the old, smaller customer population." },
    { test:/address/i, strength:"You named the missing delivery addresses.", gap:"Name the seven delivery addresses lost in the last test." },
    { test:/finance|payment.?term|thursday/i, strength:"You named the finance/payment-term decision.", gap:"Name the unavailable finance SME and the payment-term decision blocked until Thursday." },
    { test:/decision|owner|by (friday|thursday|wednesday|monday|tuesday)|date/i, strength:"You attached an owner or a decision date to at least one item, not just a description of the problem.", gap:"Attach a named owner or a decision date to at least one of the open items \u2014 a status without one is reporting, not control." }
  ],
  modelAnswerHtml:`<h3>Turner Page model status</h3>
  <div class="quote">Customer migration is not currently controlled, and I want to be specific about why. Scope: the business has asked to add historical attachments \u2014 I need that scoped and costed before I can say whether it fits the current cycle. Evidence: I cannot yet confirm how many customer mappings are actually approved, so today's "nearly complete" is not something I can stand behind. Delivery: the live cycle plan still assumes the old customer population, seven delivery addresses were lost in the last test run, and the payment-term decision is blocked until Thursday. None of this is a reason to slip the date today \u2014 it is a reason to get four decisions made this week: mapping sign-off, a scoped attachments answer, a corrected cycle plan, and a payment-term ruling by Friday. I will bring a revised position once those land.</div>`,
  mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This reads as a controlled status, not a reassuring one \u2014 you connected the facts to a side of the triangle and attached an owner or date, which is exactly what turns five worrying facts into four manageable actions.":score>=4?"You captured some of what Monday surfaced, but a controlled status needs all five points connected to a side of the triangle, with at least one clear owner or date attached \u2014 check what's still missing.":"This needs more of Monday's detail. A committee cannot act on a vague \u201cthere are some issues\u201d \u2014 name what changed for scope, evidence and delivery specifically, and attach an owner or a date."}</div>`
},
{
  id:"b6",nav:"Which side is weak?",title:"Diagnose: which side is weak?",type:"situations",
  html:`<p class="lead">For each situation, decide which side of the triangle is actually weak \u2014 not which one feels most urgent.</p>`,
  items:[
    {
      title:"Situation 1",
      question:"Nobody can show which customer mappings have actually been approved.",
      options:[
        {label:"Evidence",correct:true,feedback:"Correct. This is an assertion (\"mapping is nearly complete\") with no denominator, definition or source behind it \u2014 exactly the evidence principle from this lesson."},
        {label:"Scope",correct:false,feedback:"What's in or out of scope isn't in question here \u2014 whether the claimed mapping progress is actually provable is."},
        {label:"Delivery",correct:false,feedback:"The cycle hasn't failed yet \u2014 the problem is that nobody can prove the mapping status is what it's claimed to be."}
      ]
    },
    {
      title:"Situation 2",
      question:"The business has added historical customer attachments to the requested scope, with no agreed boundary yet.",
      options:[
        {label:"Delivery",correct:false,feedback:"This becomes a delivery problem eventually, but right now nothing has been costed against a plan \u2014 the obligation itself hasn't been defined yet."},
        {label:"Evidence",correct:false,feedback:"There's no status claim in question here \u2014 the obligation itself has genuinely changed."},
        {label:"Scope",correct:true,feedback:"Correct. The obligation \u2014 what's actually being migrated \u2014 just changed, and its boundary (document types, history, volumes) hasn't been defined."}
      ]
    },
    {
      title:"Situation 3",
      question:"To protect the cycle date, validation is being compressed from two days to half a day.",
      options:[
        {label:"Delivery",correct:true,feedback:"Correct. This is exactly the pattern this lesson warns about \u2014 schedule pressure quietly removing the controls that prove the result, rather than the plan itself changing."},
        {label:"Evidence",correct:false,feedback:"Weakened validation will produce weaker evidence downstream, but the actual decision being made right now is about the delivery schedule and its controls."},
        {label:"Scope",correct:false,feedback:"Nothing about what's in or out of scope has changed \u2014 the plan to prove it has."}
      ]
    },
    {
      title:"Situation 4",
      question:"The finance SME who must decide the payment-term treatment is unavailable until Thursday, and the cycle needs an answer by Wednesday.",
      options:[
        {label:"Scope",correct:false,feedback:"The payment-term boundary itself isn't in dispute \u2014 what's missing is a decision-by date being met, not a definition of what's in scope."},
        {label:"Delivery",correct:true,feedback:"Correct, and the harder read: a decision-by date is about to be missed. This is a delivery control (decision-by dates protect build and test time), even though the underlying issue started as an evidence gap."},
        {label:"Evidence",correct:false,feedback:"There's no status being misreported here \u2014 the open question is real and known. The problem is what happens if it isn't answered in time."}
      ]
    }
  ]
},
{
  id:"b7",nav:"Scope change isn't the enemy",title:"Scope change is not automatically bad",type:"content",
  html:`<p class="lead">Bramwell has around 240,000 customer files in LegacyDocs. A stakeholder asks: "While we're doing customers, can we bring the files across as well?"</p>
  <div class="callout misconception"><div class="callout-label">Common trap</div><p>Treat every scope change as a threat, and block it.</p><p>Projects discover legitimate requirements. The leadership failure isn't that scope changes \u2014 it's that the workstream absorbs the change without exposing its consequences.</p></div>
  <p><strong>Poor DML response:</strong> "That sounds reasonable. I'll ask the team to include them."</p>
  <p><strong>Controlled response:</strong> "Before I can agree that, I need to know: what document types, how far back, where they'd need to live in the target system, what condition the source files are in, roughly how many, whether there's anything sensitive in them, how we'd actually extract and load that volume, how we'd prove it worked, and what it does to the current cycle date. Once I have that, I'll come back with a real answer \u2014 including what it costs us."</p>
  <div class="principle"><strong>Key takeaway</strong><br>Scope change should expose its consequence before commitment, not after.</div>
  ${TPKit.fromField({
    title:"Three Green Boxes, One Missed Recall",
    name:"Raj", role:"Data Migration Lead", project:"Food & Beverage ERP",
    src:"/assets/audio/lesson2-controltriangle-raj.mp3",
    reflection:"Have you ever seen a status look controlled on paper while one side of the triangle was quietly being taken on trust?"
  })}`
},
{
  id:"b8",nav:"Evidence has levels",title:"Evidence has levels",type:"content",
  html:`<p class="lead">Not all evidence is equal, and a Data Migration Lead should be able to tell the difference on sight.</p>
  <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse">
  <tr><th style="text-align:left;padding:8px 10px">Level</th><th style="text-align:left;padding:8px 10px">Example</th><th style="text-align:left;padding:8px 10px">DML interpretation</th></tr>
  <tr><td style="padding:8px 10px">Assertion</td><td style="padding:8px 10px">"Supplier data is fine."</td><td style="padding:8px 10px">No control yet.</td></tr>
  <tr><td style="padding:8px 10px">Activity</td><td style="padding:8px 10px">"We reviewed supplier data."</td><td style="padding:8px 10px">Work happened, outcome unclear.</td></tr>
  <tr><td style="padding:8px 10px">Metric</td><td style="padding:8px 10px">"37 supplier records fail bank-country validation."</td><td style="padding:8px 10px">A useful, measured state.</td></tr>
  <tr><td style="padding:8px 10px">Trend</td><td style="padding:8px 10px">"37, down from 126 last cycle; 11 are new."</td><td style="padding:8px 10px">Shows movement and recurrence.</td></tr>
  <tr><td style="padding:8px 10px">Decision-linked</td><td style="padding:8px 10px">"26 need source correction; 11 need a Finance decision by Tuesday."</td><td style="padding:8px 10px">Actionable leadership control.</td></tr>
  </table></div>
  <p><strong>Bramwell: a green count that is wrong.</strong> The later customer cycle submitted 18,573 records. All 18,573 were accepted, zero rejects. A dashboard could easily show green. But validation found 42 UK customers assigned to the Belgian legal entity.</p>
  <div class="principle"><strong>Key takeaway</strong><br>The Data Migration Lead does not manage the loader's definition of success. They manage the migration's definition of success.</div>`
},
{
  id:"b9",nav:"Turning scope into delivery",title:"Delivery: milestones with meaning",type:"content",
  html:`<p class="lead">Delivery is not "are we on schedule?" \u2014 it's whether the agreed scope can pass through the required gates, cycles, validation and cutover in a controlled sequence.</p>
  <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse">
  <tr><th style="text-align:left;padding:8px 10px">Weak milestone</th><th style="text-align:left;padding:8px 10px">Useful migration milestone</th></tr>
  <tr><td style="padding:8px 10px">Customer complete</td><td style="padding:8px 10px">Customer scope, mapping and decision baseline ready for build.</td></tr>
  <tr><td style="padding:8px 10px">Cycle 2 done</td><td style="padding:8px 10px">C2 customer population executed, reconciled, validated and defects classified.</td></tr>
  <tr><td style="padding:8px 10px">Fix complete</td><td style="padding:8px 10px">Affected population corrected, rerun and regression evidence passed.</td></tr>
  </table></div>
  <p>A team can be extremely busy while delivery becomes less certain. Three workshops held is not progress \u2014 twelve previously unresolved mapping decisions approved is. The ETL developer working all week is not progress \u2014 the customer transformation passing its agreed controls for the current build is.</p>
  <div class="callout misconception"><div class="callout-label">Common trap</div><p>We hit the date, so delivery is under control.</p><p>A date is not a delivery plan. A controlled delivery position shows gates, dependencies, sequence, decision dates, evidence time and recovery margin \u2014 all a date tells you is where the calendar landed.</p></div>`
},
{
  id:"b10",nav:"Pressure test",title:"Pressure test: protecting the date",type:"mcq",
  html:`<p class="lead">Four days before the next cycle, the project proposes preserving the cycle date by cutting validation from two days to half a day. What is the strongest DML response?</p>`,
  options:[
    "Agree \u2014 the date matters most, and half a day should be enough to catch anything major.",
    "Object outright and insist the two days stay exactly as planned.",
    "Assess what's being cut, whether automation can help, and quantify the consequence first.",
    "Escalate immediately to the steering committee as a red risk."
  ],
  feedback:[
    "This quietly weakens evidence to protect a delivery date \u2014 exactly the failure mode this lesson warns about. \"Should be enough\" is an assertion, not a measured judgement.",
    "Refusing without analysis is no more controlled than agreeing without it \u2014 it doesn't tell anyone what's actually being traded away, or whether there's a better option.",
    "This is the controlled response: ask which validation controls are being removed, which defects they exist to catch, whether automation or parallelism could close the gap without cutting proof, and put a real number on the consequence before anyone decides. That decision then belongs to the right authority, not to silence.",
    "Escalating without first doing the analysis above just moves an unclear decision to someone else \u2014 it doesn't make the trade-off any clearer for them to act on."
  ],
  _correctIndex:2
},
{
  id:"b11",nav:"Controlling or reporting?",title:"Are you controlling, or just reporting?",type:"content",
  html:`<p class="lead">The same facts can be handled two different ways. Only one of them is control.</p>
  <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse">
  <tr><th style="text-align:left;padding:8px 10px">Reporting behaviour</th><th style="text-align:left;padding:8px 10px">Control behaviour</th></tr>
  <tr><td style="padding:8px 10px">Repeats percentage complete</td><td style="padding:8px 10px">Challenges the denominator and definition</td></tr>

  <p>Reporting passes facts along. Control converts them into a named consequence, an owner and a next step \u2014 the same shift you made in Tuesday's status rescue earlier in this lesson.</p>`

{
  id:"b13",nav:"Summary",title:"Control the workstream, not just the task list",type:"content",
  html:`<ul>
    <li>Scope defines the migration obligation and its boundaries.</li>
    <li>Evidence makes status and readiness provable.</li>
    <li>Delivery turns scope into achievable, controlled outcomes.</li>
    <li>Weakness in one side eventually damages the other two.</li>
    <li>A scope change should expose its consequence before commitment, not after.</li>
    <li>A status statement needs a denominator, a definition and a source.</li>
    <li>Technical success is not the same as migration success.</li>
    <li>Schedule pressure must never quietly remove the controls that prove correctness.</li>
    <li>The DML owns workstream control, not every underlying task.</li>
