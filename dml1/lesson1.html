.trm-card{padding:26px 22px 30px;overflow:visible}

.trm-center.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.trm-center.active{box-shadow:0 22px 46px rgba(0,95,108,.4);transform:translate(-50%,-50%) scale(1.06)}
.trm-center-label{display:inline-block;transition:opacity .3s ease}

.trm-pillar{position:absolute;transform:translate(-50%,-50%);width:clamp(118px,19vw,172px);text-align:center;opacity:0;transition:opacity .5s ease;z-index:2;cursor:pointer;outline:none}
.trm-pillar.active,.trm-pillar.pinned,.trm-pillar:focus-within{z-index:7}
.trm-pillar.show{opacity:1}

.trm-pillar.active .trm-pillar-inner,.trm-pillar.pinned .trm-pillar-inner,.trm-pillar:focus-visible .trm-pillar-inner{border-color:var(--teal);box-shadow:0 16px 32px rgba(0,95,108,.18);transform:translateY(-3px)}

const fiveQuestions=[
  {
    title:"Is the data ready?",
    short:"Completeness, accuracy and accepted issues",
    colour:"data",
    checks:["Data quality acceptable","Mapping complete","Ownership defined","Critical data validated","Exceptions understood"],
    detail:`<p>This is not the same as asking whether the data loaded successfully.</p>
    <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Evidence</th><th style="text-align:left;padding:6px 10px">What it tells you</th><th style="text-align:left;padding:6px 10px">What it does not tell you</th></tr>
    <tr><td style="padding:6px 10px">18,573 submitted; 18,573 accepted</td><td style="padding:6px 10px">Execution accepted the submitted population.</td><td style="padding:6px 10px">That every customer is in the correct legal entity or has correct business meaning.</td></tr>
    <tr><td style="padding:6px 10px">42 UK customers in the Belgian legal entity</td><td style="padding:6px 10px">There is a semantic defect despite matching counts.</td><td style="padding:6px 10px">The exact root cause, which must not be invented without evidence.</td></tr>
    <tr><td style="padding:6px 10px">18 German CustomerGroup 99 unresolved</td><td style="padding:6px 10px">A reference-data decision remains open.</td><td style="padding:6px 10px">What the final approved target value should be.</td></tr>
    <tr><td style="padding:6px 10px">45E has no approved target equivalent</td><td style="padding:6px 10px">A business mapping decision is unresolved.</td><td style="padding:6px 10px">That NET30, NET45 or any plausible value is acceptable.</td></tr>
    </table></div>
    <p>An experienced Data Migration Lead asks whether known issues are understood, whether the affected data is material to the business, and whether the right people have accepted the consequences.</p>
    <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>18,573 submitted and 18,573 accepted, with zero rejects, looked like a clean result. It's still true that a count can reconcile perfectly while the migration is semantically wrong \u2014 which is exactly what the 42 UK customers sitting in the Belgian legal entity prove.</p></div></div>
    <div class="principle"><strong>Key takeaway</strong><br>Data readiness is about usable, approved and evidenced data, not a flattering percentage.</div>`
  },
  {
    title:"Has the migration process been proven?",
    short:"Rehearsal, repeatability and reconciliation",
    colour:"process",
    checks:["Strategy defined","Rehearsals completed","Cutover proven","Validation confirmed","Repeatable end-to-end"],
    detail:`<p>A migration process that has never been executed successfully is still unproven.</p>
    <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Weak evidence</th><th style="text-align:left;padding:6px 10px">Stronger evidence</th><th style="text-align:left;padding:6px 10px">Leadership interpretation</th></tr>
    <tr><td style="padding:6px 10px">\u201cThe package is finished.\u201d</td><td style="padding:6px 10px">A controlled end-to-end cycle completed.</td><td style="padding:6px 10px">Build completion is activity; cycle evidence is closer to readiness.</td></tr>
    <tr><td style="padding:6px 10px">\u201cIt ran once.\u201d</td><td style="padding:6px 10px">Repeated runs show stable behaviour and timings.</td><td style="padding:6px 10px">Repeatability reduces cutover uncertainty.</td></tr>
    <tr><td style="padding:6px 10px">\u201cCounts match.\u201d</td><td style="padding:6px 10px">Counts plus semantic and relationship validation.</td><td style="padding:6px 10px">Control totals are necessary but not sufficient.</td></tr>
    <tr><td style="padding:6px 10px">\u201cWe know how to rerun.\u201d</td><td style="padding:6px 10px">Failed populations recovered without duplication or hidden loss.</td><td style="padding:6px 10px">Recovery must be demonstrated, not merely described.</td></tr>
    </table></div>
    <p>Bramwell's own two rehearsal cycles give a concrete example: extract ran in 18 then 17 minutes, transform in 42 then 31, validation in 24 then 22, load in 58 then 49. The trend, not just the latest number, is what a Lead actually reads.</p>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>If the runbook is complete, the process is ready.</p><p>A runbook records intent. A successful rehearsal provides evidence.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>Execution confidence comes from controlled repetition and evidence, not from a completed plan.</div>`
  },
  {
    title:"Is the business ready?",
    short:"Operational continuity and accepted risk",
    colour:"business",
    checks:["Process changes agreed","Users trained","Roles clearly defined","Adoption plan in place","Business sign-off obtained"],
    detail:`<p>This is often the most underestimated part of migration readiness. The technical migration may succeed while the business still struggles on Monday morning.</p>
    <p>Bramwell's seven-address defect is a useful test of this. The rule has been corrected and the affected records reprocessed \u2014 but that is a technical closure, not a business one.</p>
    <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Possible response</th><th style="text-align:left;padding:6px 10px">Why it is weak or strong</th></tr>
    <tr><td style="padding:6px 10px">Mark the defect closed once the rule is fixed and reprocessed.</td><td style="padding:6px 10px">Weak. Technical correction is not the same as business confirmation that the data is now usable.</td></tr>
    <tr><td style="padding:6px 10px">Assume the warehouse and dispatch teams will notice if something is still wrong.</td><td style="padding:6px 10px">Weak. Silence is not sign-off; nobody may be looking.</td></tr>
    <tr><td style="padding:6px 10px">Ask the teams who use delivery addresses daily to confirm the corrected data works for them.</td><td style="padding:6px 10px">Strong. Operational sign-off closes the loop a technical fix cannot close alone.</td></tr>
    <tr><td style="padding:6px 10px">Wait until go-live to find out.</td><td style="padding:6px 10px">Weak. That turns a known question into an avoidable go-live surprise.</td></tr>
    </table></div>
    <p>The same applies to the 18 CustomerGroup 99 records: even once a target value is eventually approved, someone still has to check the business teams handling those accounts know what changed and can operate against it.</p>
    <div class="principle"><strong>Key takeaway</strong><br>Migration success is measured by whether the business can actually operate against the corrected data, not by whether the defect ticket is closed.</div>`
  },
  {
    title:"Are the environments ready?",
    short:"Infrastructure, access, integrations and performance",
    colour:"environment",
    checks:["Infrastructure stable","Performance adequate","Security configured","Access controlled","Monitoring in place"],
    detail:`<p>Even a well-designed migration process can fail in an unstable environment.</p>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>\u201cInfrastructure says the environment is ready.\u201d That is an input, not the complete migration evidence. The DML asks whether the end-to-end migration process can actually operate inside it.</p></div>
    <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Technical owner provides</th><th style="text-align:left;padding:6px 10px">DML integrates</th></tr>
    <tr><td style="padding:6px 10px">Environment health and capacity</td><td style="padding:6px 10px">Whether the next cycle/cutover assumption remains credible</td></tr>
    <tr><td style="padding:6px 10px">Access and security status</td><td style="padding:6px 10px">Whether migration roles can actually execute</td></tr>
    <tr><td style="padding:6px 10px">Interface availability</td><td style="padding:6px 10px">Whether validation and business processes can complete</td></tr>
    <tr><td style="padding:6px 10px">Incident detail</td><td style="padding:6px 10px">Migration consequence, decision need and escalation</td></tr>
    </table></div>
    <div class="principle"><strong>Key takeaway</strong><br>An environment is ready only when the end-to-end process can operate inside it.</div>`
  },
  {
    title:"Are the remaining risks understood?",
    short:"Impact, ownership, mitigation and acceptance",
    colour:"risk",
    checks:["Risks identified and assessed","Mitigations effective","Open issues understood","Decisions documented","Final sign-offs obtained"],
    detail:`<p>No project reaches migration with zero risk.</p>
    <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Risk question</th><th style="text-align:left;padding:6px 10px">Why it matters</th></tr>
    <tr><td style="padding:6px 10px">What can happen?</td><td style="padding:6px 10px">Defines the event, not just the symptom.</td></tr>
    <tr><td style="padding:6px 10px">What is the impact?</td><td style="padding:6px 10px">Connects technical concern to business/programme consequence.</td></tr>
    <tr><td style="padding:6px 10px">How likely is it now?</td><td style="padding:6px 10px">Prevents stale risk ratings.</td></tr>
    <tr><td style="padding:6px 10px">Who owns the mitigation?</td><td style="padding:6px 10px">Stops collective ownership becoming no ownership.</td></tr>
    <tr><td style="padding:6px 10px">Who can accept the residual risk?</td><td style="padding:6px 10px">Separates migration advice from governance authority.</td></tr>
    <tr><td style="padding:6px 10px">What evidence closes or changes the risk?</td><td style="padding:6px 10px">Makes the risk testable rather than rhetorical.</td></tr>
    </table></div>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>A high-priority defect automatically means No-Go.</p><p>Not necessarily. Severity labels are useful, but business impact is what matters.</p></div>
    <div class="principle"><strong>DML discipline</strong><br>Never hide an unresolved decision inside a green RAG. If the programme still needs a decision, make the decision need visible.</div>`
  }
];

const readinessPillars=[
 {id:"data",name:"Data Quality",left:50,top:12.5,
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>`,
  tag:"Is the data complete, accurate and understood?",
  popText:"Data readiness is about usability and accepted risk, not a perfect load percentage.",
  detail:"A successful load proves that records can move. It does not prove they are complete, accurate or usable. Turner Page leads ask whether known issues are understood, whether the affected data matters to the business, and whether the right people have accepted the consequences.",
  bullets:["Completeness and accuracy checked","Mapping validated end-to-end","Known issues documented and accepted","Business impact of gaps understood"]
 },
 {id:"etl",name:"ETL & Migration",left:85.65,top:38.42,
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 4"/><path d="M20 20v-5h-5"/></svg>`,
  tag:"Has the build been rehearsed and proven end-to-end?",
  popText:"A runbook records intent. A successful rehearsal provides evidence.",
  detail:"Documentation matters, but a proven rehearsal is stronger evidence. It shows whether the process is repeatable, whether teams understand their roles, and whether it fits inside the available outage window.",
  bullets:["Extract, transform and load logic tested","Full rehearsal completed in the outage window","Process proven to be repeatable","Roles and responsibilities understood"]
 },
 {id:"validation",name:"Validation & Reconciliation",left:72.05,top:80.33,pop:"up",side:"right",
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>`,
  tag:"Can we prove the data landed correctly, not just assume it?",
  popText:"A high validation percentage can still hide the records that matter most.",
  detail:"Reconciliation turns a completed load into trusted evidence. Totals are checked, exceptions are investigated, and validation criteria are agreed before cutover, not improvised afterwards.",
  bullets:["Reconciliation totals matched","Validation criteria agreed in advance","Exceptions investigated and explained","Evidence retained for governance"]
 },
 {id:"business",name:"Business Readiness",left:27.95,top:80.33,pop:"up",side:"left",
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17" cy="8" r="2.5"/><path d="M16 14.2c2.9.5 5 2.6 5 5.8"/></svg>`,
  tag:"Can the organisation operate the moment migration ends?",
  popText:"Migration success is measured by business continuity, not records loaded.",
  detail:"A technically successful migration can still fail on Monday morning if users cannot work. Turner Page leads check that process changes, training and sign-off are in place before recommending Go.",
  bullets:["Process changes agreed and communicated","Users trained and confident","Business owners have signed off","Support model ready for go-live"]
 },
 {id:"environment",name:"Environment",left:14.35,top:38.42,
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r=".6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r=".6" fill="currentColor" stroke="none"/></svg>`,
  tag:"Is the technical landscape stable enough to support the business?",
  popText:"Most environment failures come from overlooked dependencies, not missing servers.",
  detail:"Environment readiness covers infrastructure, security, permissions, integrations and monitoring. The real question is whether the whole landscape can support the migration and the business immediately afterwards.",
  bullets:["Infrastructure and performance proven","Access, security and permissions configured","Integrations and interfaces tested","Monitoring and support ready"]
 }
];

const ownershipSituations=[
 {q:"Duplicate customer records require business resolution.",a:"other",why:"A business data owner acts, with migration support. The DML owns the impact, the named owner, the due date, the evidence and the consequence of it staying unresolved.",order:["other","mine","shared"]},
 {q:"A transformation rule removes valid delivery addresses.",a:"mine",why:"The technical migration owner or consultant fixes the rule, but the DML owns the scope of impact, the correction evidence, regression and the delivery consequence.",order:["shared","mine","other"]},
 {q:"Finance has not approved a payment-term treatment.",a:"other",why:"Finance authority owns the decision itself. The DML owns the decision need, the escalation, the decision-by date and the migration impact of it remaining open.",order:["mine","shared","other"]},
 {q:"Environment access fails just before a rehearsal cycle.",a:"other",why:"The environment or security owner fixes access. The DML owns the migration consequence, the recovery option and whether the cycle can still proceed.",order:["other","shared","mine"]},
 {q:"The programme asks whether to proceed to go-live.",a:"shared",why:"Governance makes the final Go/No-Go decision. The DML owns producing a defensible migration recommendation supported by evidence \u2014 not the decision itself.",order:["mine","shared","other"]}
];
// "ownership" is really just a 3-option situations exercise (My
// responsibility / Shared / Someone else owns it) — reuse the
// generic `situations` block type instead of a bespoke renderer.
// Each item's own `order` varies which slot the correct answer lands
// in, so position itself never becomes a tell (tp-html-build-guide.md
// §11's lint check flagged the previous fixed My/Shared/Other order,
// which put "Someone else owns it" — the correct answer for 3 of the
// 5 situations — in the same third slot every time).
const ownershipItems = ownershipSituations.map((s, idx) => {
  const labelFor = (key) => key === "mine" ? "My responsibility" : key === "shared" ? "Shared responsibility" : "Someone else owns it";
  return {
    title: `Situation ${idx+1}`,
    question: s.q,
    options: s.order.map(key => ({
      label: labelFor(key),
      correct: key === s.a,
      feedback: (key === s.a ? "Your answer aligns with Turner Page thinking.<br>" : "Consider the ownership boundary again.<br>") + s.why
    }))
  };
});

const blocks=[
{
 id:"b1",nav:"The challenge",title:"Are we ready to migrate?",type:"mcq",
 html:`<div class="promise">
 <div class="kicker">Our mission</div>
 <h3>The Turner Page Mission</h3>
 <p>To develop the next generation of trusted Data Migration professionals through practical learning, sound judgement and real-world thinking.</p>
 <div class="promise-lines"><div>Frameworks</div><div>Scenarios</div><div>Reflection</div><div>Assessment</div></div>
 <p><strong>If it does not improve the way you think, communicate or make decisions, it does not belong in this course.</strong></p>
 </div>
 <div class="callout experience">
 <div class="callout-label">Before you begin</div>
 <p>This lesson is not designed to test how much you already know. It is designed to change the way you think.</p>
 <p>By the end, you should approach migration readiness differently from how you did at the start.</p>
 </div>
 <p class="lead">It is Friday afternoon at Bramwell Industries. The first full migration rehearsal is scheduled for next weekend.</p>
 <p>Senior stakeholders want reassurance. You have just reviewed the latest migration status when the Programme Manager asks for your recommendation.</p>
 <div class="status-grid">
   <div class="status-card"><strong>Customer load</strong>18,573 submitted; 18,573 accepted; zero rejects</div>
   <div class="status-card"><strong>Known defect</strong>A transformation rule removed 7 delivery addresses \u2014 corrected and reprocessed</div>
   <div class="status-card"><strong>Legal entity</strong>42 UK customers loaded into the Belgian legal entity despite matching counts</div>
   <div class="status-card"><strong>CustomerGroup</strong>18 German records with legacy value 99 remain unresolved</div>
   <div class="status-card"><strong>Payment terms</strong>Legacy term 45E has no approved target equivalent</div>
 </div>
 <div class="quote">\u201cAre we ready?\u201d</div>
 <h3>Your instinctive response</h3>`,
 options:["Yes. 18,573 accepted and zero rejects is strong enough.","No. Any unresolved issue means No-Go.","Yes, provided the remaining items are fixed.","I need further evidence before I can make a recommendation."],
 feedback:[
 "Too early. Technical acceptance and count reconciliation do not prove semantic correctness or business readiness \u2014 the 42-record legal-entity defect proves that directly.",
 "Too rigid. Migration leadership is not the elimination of every issue. It is understanding impact, ownership, evidence and residual risk.",
 "Still too early. You have not yet established which items are blockers, which are accepted risks, and what evidence is missing.",
 "Strongest. The available evidence is useful but incomplete. A DML should resist pressure to convert partial evidence into a premature recommendation."
 ]
},
{
 id:"b2",nav:"Why this role exists",title:"Why this role exists",type:"content",
 html:`<p class="lead">Many people describe the Data Migration Lead as the person responsible for moving data into the new system.</p>
 <p>That is only part of the role.</p>
 <p>The Programme Manager did not ask whether ETL development had finished. They asked whether Bramwell was ready to migrate.</p>
 <p>That question crosses technology, business readiness, governance, risk, people and timing. No single status report can answer it.</p>
 <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Activity statement</th><th style="text-align:left;padding:6px 10px">What it does not prove</th><th style="text-align:left;padding:6px 10px">DML challenge</th></tr>
 <tr><td style="padding:6px 10px">\u201cThe mapping workshop is complete.\u201d</td><td style="padding:6px 10px">That decisions were approved and recorded.</td><td style="padding:6px 10px">Which mappings are approved, by whom, and what remains unresolved?</td></tr>
 <tr><td style="padding:6px 10px">\u201cThe customer load succeeded.\u201d</td><td style="padding:6px 10px">That records are correct in the right business context.</td><td style="padding:6px 10px">What reconciliation and semantic validation proves the result?</td></tr>
 <tr><td style="padding:6px 10px">\u201cThe defect is fixed.\u201d</td><td style="padding:6px 10px">That the full affected population was identified and regression-tested.</td><td style="padding:6px 10px">What mechanism caused it, what population was exposed, and what proves closure?</td></tr>
 <tr><td style="padding:6px 10px">\u201cThe business has reviewed it.\u201d</td><td style="padding:6px 10px">That an accountable owner accepted the outcome or risk.</td><td style="padding:6px 10px">Who owns the decision and where is acceptance recorded?</td></tr>
 <tr><td style="padding:6px 10px">\u201cWe are on plan.\u201d</td><td style="padding:6px 10px">That dependencies, evidence time and recovery margin remain viable.</td><td style="padding:6px 10px">Which assumptions make the date achievable, and which have changed?</td></tr>
 </table></div>
 <p>The Data Migration Lead becomes valuable by bringing separate pieces of information together and asking:</p>
 <div class="quote">\u201cTaken together, what do these facts mean for the migration outcome, the business, the next cycle and the programme decision?\u201d</div>

 <div class="visual-card">
   <div class="visual-title">From project information to programme decision</div>
   <div class="flow">
     <div class="flow-box"><div><strong>Project evidence</strong><span class="small">Data, business, technical and risk information</span></div></div>
     <div class="arrow">\u2192</div>
     <div class="flow-box"><div><strong>Data Migration Lead</strong><span class="small">Combines, challenges and interprets the evidence</span></div></div>
     <div class="arrow">\u2192</div>
     <div class="flow-box"><div><strong>Recommendation</strong><span class="small">A defensible view for programme governance</span></div></div>
   </div>
 </div>

 <div class="callout misconception"><div class="callout-label">Common trap</div>
 <p><strong>The Data Migration Lead decides whether the project goes live.</strong></p>
 <p>Governance makes the decision. The Data Migration Lead provides the migration evidence and recommendation that help governance make the right decision.</p>
 </div>

 <div class="principle"><strong>Leadership habit</strong><br>Do not ask only \u201cWhat happened?\u201d. Ask \u201cSo what does that change?\u201d</div>`
},
{
 id:"b3",nav:"The five questions",title:"The five questions every Data Migration Lead asks",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">Turner Page Data Migration Leads use simple mental frameworks that help them ask the right questions consistently.</p>
 <p>Whenever somebody asks, \u201cAre we ready?\u201d, these five questions help build a complete picture.</p>
 <div class="visual-card framework-overview">
   <div class="visual-title">The Turner Page migration readiness framework</div>
   <div class="framework-grid">
    ${fiveQuestions.map((q,i)=>`
      <article class="framework-node ${q.colour}">
        <div class="framework-head">
          <div class="num">0${i+1}</div>
          <div class="framework-icon" aria-hidden="true">${["\u25A6","\u21BB","\uD83D\uDC65","\u25A4","\uD83D\uDEE1"][i]}</div>
        </div>
        <h4>${q.title}</h4>
        <ul class="framework-checks">
          ${q.checks.map(item=>`<li>${item}</li>`).join("")}
        </ul>
      </article>`).join("")}
   </div>
   <div class="callout tp-insight">
     <img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true">
     <div class="tp-insight-content">
       <div class="callout-label">Turner Page insight</div>
       <p>A Turner Page Data Migration Lead does not begin by asking, \u201cAre we ready?\u201d They ask, \u201cWhat evidence do we have that we are ready?\u201d Only after all five readiness areas have been assessed should a recommendation be made.</p>
     </div>
   </div>
 </div>
 ${TPKit.fromField({
   title:"Before I Recommended Go", name:"Zoe", role:"Data Migration Lead", project:"Manufacturing ERP",
   src:"/assets/audio/5Questions-SignOff-Zoe.mp3",
   reflection:"Which of the five questions do you think project teams are most likely to answer with optimism rather than evidence?"
 })}
 <p>Explore each question in detail before moving on.</p>`,
 items: fiveQuestions.map(q => ({ title:q.title, short:q.short, detail:q.detail })),
 takeawayHtml:`<div class="principle"><strong>Great Data Migration Leads do not ask whether the project is ready.</strong><br>They ask whether they have enough evidence to justify saying it is ready.</div>`
},
{
 id:"b4",nav:"Applying the framework",title:"Applying the five questions framework",type:"selectAll",
 html:`<p class="lead">Return to the original scenario.</p>
 <p>Before making a recommendation, review the available evidence again.</p>
 <div class="status-grid">
   <div class="status-card"><strong>Customer load</strong>18,573 submitted; 18,573 accepted; zero rejects</div>
   <div class="status-card"><strong>Known defect</strong>A transformation rule removed 7 delivery addresses \u2014 corrected and reprocessed</div>
   <div class="status-card"><strong>Legal entity</strong>42 UK customers loaded into the Belgian legal entity despite matching counts</div>
   <div class="status-card"><strong>CustomerGroup</strong>18 German records with legacy value 99 remain unresolved</div>
   <div class="status-card"><strong>Payment terms</strong>Legacy term 45E has no approved target equivalent</div>
 </div>
 <h3>Your task</h3>
 <p>Select the additional evidence you would want before making a recommendation.</p>`,
 options:[
 "Whether the 7 observed delivery addresses are necessarily the complete affected population.",
 "What proves the 42 UK customers are a legal-entity defect and not a wider pattern.",
 "Whether Finance has been asked to approve a target treatment for 45E, or whether one is being invented.",
 "Whether the migration process has been successfully rehearsed more than once.",
 "Whether the business has formally accepted the CustomerGroup 99 exception as a residual risk."
 ],
 coaching:[
 "<strong>Yes. This matters.</strong><br>The rule correction fixed the symptom that was observed. It does not prove seven was the complete affected population \u2014 that has to be established from evidence, not assumed from the number that happened to surface first.",
 "<strong>Absolutely.</strong><br>42 records with matching counts is exactly the kind of defect that hides in a clean-looking total. Establishing the mechanism, and the true affected scope, is what separates a contained issue from a wider pattern nobody has checked for yet.",
 "<strong>Essential evidence.</strong><br>45E is a business mapping decision, not a technical one. If nobody has asked Finance to approve a treatment, someone may quietly invent one under pressure \u2014 exactly the failure mode this lesson exists to prevent.",
 "<strong>Yes.</strong><br>A single successful run is still fragile evidence. Repeated runs show whether timings and behaviour are stable, which is what actually reduces cutover uncertainty.",
 "<strong>Yes.</strong><br>18 unresolved records is a small population, but it is still an open business decision. Whether it has been formally accepted as a residual risk, or is just quietly sitting there, changes what a Go recommendation would actually mean."
 ],
 hint:"Explore all five evidence areas before continuing.",
 closingHtml:`<h3>Turner Page coaching</h3>
 <p>You have not tried to answer the Programme Manager immediately. Instead, you have identified the evidence needed before answering.</p>
 <p>Turner Page Data Migration Leads build the picture first. Once the picture is complete, the recommendation often becomes clear.</p>
 <div class="principle"><strong>A Data Migration Lead is not judged by how quickly they give an answer.</strong><br>They are judged by whether they can justify that answer with evidence.</div>`
},
{
 id:"b5",nav:"Build the picture",title:"Exercise: build the Bramwell readiness picture",type:"situations",
 html:`<p class="lead">Return to the opening question. This time, do not jump to an answer. Work through each readiness area in turn, commit to a call on what the evidence actually shows, and only then see how a Data Migration Lead would frame it.</p>`,
 items:[
   {
     title:"Data",
     question:`Evidence available: 18,573 accepted; 42 UK customers misclassified; 18 Group 99 unresolved; 45E unresolved. A stakeholder says: \u201cThe data is ready, the load hit 100% acceptance.\u201d What is the strongest response?`,
     options:[
       {label:"Agree. 100% acceptance means the data is ready.",correct:false,feedback:"Acceptance proves the records moved. It does not prove they are correct \u2014 the 42-record legal-entity defect happened inside a clean-looking total."},
       {label:"Push back. Acceptance is not the same as correctness.",correct:true,feedback:"This is the DML position. A clean load is necessary evidence, not sufficient evidence \u2014 the legal-entity correction, the CustomerGroup 99 treatment and the 45E decision still need to close before this is Green."},
       {label:"Ask for a rerun to double-check the numbers.",correct:false,feedback:"A rerun would repeat the same clean count. The gap here is not a counting error, it is unresolved meaning \u2014 rerunning does not touch that."}
     ]
   },
   {
     title:"Process",
     question:"Evidence available: repeatable cycle timings exist; controlled rerun and validation practices have developed across two cycles. The programme wants to sign off process readiness on that basis. What is missing?",
     options:[
       {label:"Nothing. Two clean cycles is enough evidence.",correct:false,feedback:"Two cycles show the process has worked before. They do not show it will hold for what is coming next."},
       {label:"A third rehearsal cycle, just to be safe.",correct:false,feedback:"Another repeat of the same scope adds confidence in the past pattern. It still does not test the next one."},
       {label:"Confirm the next scope can still hit the same window.",correct:true,feedback:"This is the DML position: repeatability so far is real evidence, but it answers a different question to \u201ccan we do it again under the next conditions.\u201d"}
     ]
   },
   {
     title:"Business",
     question:"Evidence available: the seven-address rule correction has been applied and the affected records reprocessed. Does that mean business readiness is proven?",
     options:[
       {label:"No. A technical fix is not the same as business sign-off.",correct:true,feedback:"This is the DML position: the fix is real evidence, but the people who use the data daily have not yet confirmed it, and CustomerGroup 99 still has no agreed interim process."},
       {label:"Yes. The technical correction proves the issue is resolved.",correct:false,feedback:"It proves the rule was fixed. It does not prove the business teams who rely on the data are actually satisfied with the result."},
       {label:"Only if IT formally signs off on the fix.",correct:false,feedback:"IT can confirm the fix was applied correctly. It cannot confirm the business is ready to operate on it \u2014 that is a different sign-off, from a different owner."}
     ]
   },
   {
     title:"Environment",
     question:"Evidence available: prior cycles produced strong, consistent timings. Does that mean the environment is ready for the next, larger run?",
     options:[
       {label:"Yes. Consistent past performance is the strongest evidence.",correct:false,feedback:"Consistent past performance is real evidence, for the load that already ran. It is not evidence for a bigger or different one."},
       {label:"Not on its own. Past timings are not current readiness.",correct:true,feedback:"This is the DML position: strong history is a good sign, but it is not the same claim as \u201cready for what is coming.\u201d"},
       {label:"Only if infrastructure confirms nothing has changed.",correct:false,feedback:"That is a reasonable check, but it still only rules out regression. It does not confirm readiness for a genuinely bigger run."}
     ]
   },
   {
     title:"Risk",
     question:"Evidence available: the known semantic defect and the unresolved reference/mapping items are all visible on the RAID log. Is that a decision-grade risk picture?",
     options:[
       {label:"Yes. If it is on the log, it is being managed.",correct:false,feedback:"Visible is not the same as managed. A logged risk with no owner or decision date is still just a list."},
       {label:"Only once every item on the list is closed.",correct:false,feedback:"A DML does not need zero open risk to recommend. They need each open item to be decision-grade, which is a different bar."},
       {label:"Not yet. Visible is not the same as decision-grade.",correct:true,feedback:"This is the DML position: visibility is the first step, not the last one. Decision-grade means someone specific can act on it, by when, with a route to acceptance."}
     ]
   }
 ],
 takeawayHtml:`<div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Model DML position</div><p>\u201cI would not recommend a readiness decision from the load result alone. We have strong execution evidence: 18,573 submitted and accepted with zero rejects. However, the 42-record legal-entity defect proves that acceptance and count reconciliation are not sufficient. We also have unresolved business treatments for CustomerGroup 99 and payment term 45E. Before I recommend Go or No-Go, I need the semantic correction and validation evidence, accountable decisions for the unresolved treatments, and confirmation that the next execution context remains viable. Those are decision conditions, not reasons to panic.\u201d</p></div></div>`
},
{
 id:"b6",nav:"Ownership",title:"What a Data Migration Lead owns",type:"content",
 html:`<p class="lead">The Data Migration Lead owns the migration workstream. That does not mean personally owning every task connected with it.</p>
 <div class="ownership-grid">
   <div class="ownership-card"><h3>Owns</h3><ul><li>Migration strategy and control</li><li>Migration scope position</li><li>Migration plan and cycle readiness</li><li>Migration risks and escalation</li><li>Evidence-based readiness recommendation</li><li>Migration reporting and decision visibility</li></ul></div>
   <div class="ownership-card"><h3>Influences</h3><ul><li>Programme planning</li><li>Business decisions</li><li>Cutover planning</li><li>Programme governance</li><li>Prioritisation across workstreams</li></ul></div>
   <div class="ownership-card"><h3>Supports / relies on</h3><ul><li>Data Migration Consultants</li><li>Business data owners / SMEs</li><li>Functional consultants</li><li>Test teams</li><li>Environment/infrastructure teams</li></ul></div>
 </div>
 <div class="callout misconception"><div class="callout-label">Common trap</div>
 <p><strong>If an issue affects data migration, the Data Migration Lead owns fixing it.</strong></p>
 <p>No. Owning bad data does not mean personally cleaning it. The DML ensures the issue, impact, responsible owner and decision are visible and moving.</p></div>
 ${TPKit.fromField({
   title:"Who Owns Bad Data?", name:"Isabel", role:"Data Migration Lead", project:"Retail ERP",
   src:"/assets/audio/DuplicateCustomers-Isabel.mp3",
   reflection:"Where should responsibility sit when a data problem is genuinely the business's to fix, not migration's?"
 })}
 <div class="principle"><strong>Key takeaway</strong><br>The DML owns getting the right decision made. They do not acquire business authority simply because a deadline is close.</div>`
},
{
 id:"b7",nav:"Ownership in practice",title:"Ownership in practice",type:"situations",
 html:`<p class="lead">Ownership is not about doing every task. It is about ensuring the workstream is delivered successfully.</p>
 <p>For each situation, decide whether it is primarily your responsibility, a shared responsibility, or owned elsewhere.</p>`,
 items: ownershipItems
},
{
 id:"b8",nav:"The readiness model",title:"The Turner Page Readiness Model\u2122",type:"content",
 html:`<p class="lead">Technical ability gets you onto a migration project. Professional judgement earns the programme's trust.</p>
 <p>Turner Page Data Migration Leads don't reach a recommendation from instinct or a single dashboard. Watch how a recommendation is actually built.</p>

 <div class="visual-card trm-card">
   <div class="visual-title">The Turner Page Readiness Model\u2122</div>
   <div class="trm-wrap" id="trmWrap">
     <svg class="trm-lines" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
       ${readinessPillars.map(p=>`<line class="trm-line" data-pillar="${p.id}" pathLength="100" x1="300" y1="300" x2="${(p.left/100*600).toFixed(1)}" y2="${(p.top/100*600).toFixed(1)}"></line>`).join("")}
     </svg>
     <div class="trm-center" id="trmCenter"><span class="trm-center-label" id="trmCenterLabel">Collecting Evidence</span></div>
     ${readinessPillars.map(p=>`
       <div class="trm-pillar" data-pillar="${p.id}" data-pop="${p.pop||""}" data-side="${p.side||""}" style="left:${p.left}%;top:${p.top}%" tabindex="0" role="button" aria-expanded="false">
         <div class="trm-pillar-inner">
           <div class="trm-icon" aria-hidden="true">${p.icon}</div>
           <div class="trm-name">${p.name}</div>
           <div class="trm-desc">${p.tag}</div>
         </div>
         <div class="trm-card-pop">
           <strong>${p.name}</strong>
           <p>${p.popText}</p>
         </div>
       </div>`).join("")}
   </div>
 </div>

 <div class="callout tp-insight">
   <img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true">
   <div class="tp-insight-content">
     <div class="callout-label">The Turner Page Insight</div>
     <p>\u201cProfessional Data Migration Leads don't make recommendations from instinct or a single dashboard. They combine evidence from five distinct areas before reaching a professional recommendation.\u201d</p>
   </div>
 </div>

 <button id="trmExploreBtn" class="btn secondary" type="button" aria-expanded="false">Explore the Five Pillars</button>
 <div class="trm-pillar-cards" id="trmPillarCards" hidden>
   ${readinessPillars.map(p=>`
     <div class="trm-detail-card">
       <div class="trm-detail-icon" aria-hidden="true">${p.icon}</div>
       <h4>${p.name}</h4>
       <p>${p.detail}</p>
       <ul class="framework-checks">${p.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>
     </div>`).join("")}
 </div>

 <div class="principle"><strong>Trusted Data Migration Leads are not the people with the most confident opinions.</strong><br>They are the people whose recommendations can be defended, because they gathered evidence across all five pillars first.</div>`,
 // This diagram is a genuinely one-off visual (see AUTHORING-GUIDE.md
 // §6) — its interactivity is wired here via onMount rather than a
 // shared renderer, since no other lesson uses this component.
 onMount: ({ lesson }) => {
   const wrap = lesson.querySelector("#trmWrap");
   if(!wrap) return;
   const center = lesson.querySelector("#trmCenter");
   const centerLabel = lesson.querySelector("#trmCenterLabel");
   const pillars = [...wrap.querySelectorAll(".trm-pillar")];
   const lines = [...wrap.querySelectorAll(".trm-line")];
   const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
   let pinned = null;

   function highlight(name){
     pillars.forEach(p=>p.classList.toggle("active",p.dataset.pillar===name));
     lines.forEach(l=>l.classList.toggle("active",l.dataset.pillar===name));
     center.classList.toggle("active",!!name);
   }
   pillars.forEach(p=>{
     p.setAttribute("aria-expanded","false");
     p.addEventListener("mouseenter",()=>{if(!pinned)highlight(p.dataset.pillar)});
     p.addEventListener("mouseleave",()=>{if(!pinned)highlight(null)});
     p.addEventListener("focus",()=>{if(!pinned)highlight(p.dataset.pillar)});
     p.addEventListener("blur",()=>{if(!pinned)highlight(null)});
     p.addEventListener("click",(e)=>{
       e.stopPropagation();
       if(pinned===p.dataset.pillar){
         pinned=null;p.classList.remove("pinned");p.setAttribute("aria-expanded","false");highlight(null);
       }else{
         pillars.forEach(o=>{o.classList.remove("pinned");o.setAttribute("aria-expanded","false")});
         pinned=p.dataset.pillar;p.classList.add("pinned");p.setAttribute("aria-expanded","true");highlight(pinned);
       }
     });
     p.addEventListener("keydown",(e)=>{
       if(e.key==="Enter"||e.key===" "){e.preventDefault();p.click()}
     });
   });
   document.addEventListener("click",()=>{
     if(pinned){
       pinned=null;
       pillars.forEach(o=>{o.classList.remove("pinned");o.setAttribute("aria-expanded","false")});
       highlight(null);
     }
   });

   function run(){
     center.classList.add("show");
     pillars.forEach((p,idx)=>{
       setTimeout(()=>p.classList.add("show"),reduced?0:380+idx*160);
     });
     const lineDelay=reduced?0:380+pillars.length*160+250;
     setTimeout(()=>lines.forEach(l=>l.classList.add("drawn")),lineDelay);
     const textDelay=lineDelay+(reduced?0:1150);
     setTimeout(()=>{
       centerLabel.classList.add("fade");
       setTimeout(()=>{
         centerLabel.textContent="Professional Judgement \u2192 Migration Recommendation";
         centerLabel.classList.remove("fade");
       },reduced?0:280);
     },textDelay);
   }
   run();

   const exploreBtn = lesson.querySelector("#trmExploreBtn");
   const cardsWrap = lesson.querySelector("#trmPillarCards");
   if(exploreBtn && cardsWrap){
     exploreBtn.onclick=()=>{
       const opening=cardsWrap.hasAttribute("hidden");
       if(opening)cardsWrap.removeAttribute("hidden");else cardsWrap.setAttribute("hidden","");
       exploreBtn.textContent=opening?"Hide the Five Pillars":"Explore the Five Pillars";
       exploreBtn.setAttribute("aria-expanded",opening?"true":"false");
     };
   }
 }
},
{
 id:"b9",nav:"Detail to consequence",title:"Turning a technical fact into a leadership consequence",type:"content",
 html:`<p class="lead">The seven delivery addresses restored earlier this week are a useful worked example of a habit every DML needs: following a technical fact all the way to its consequence.</p>
 <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Level</th><th style="text-align:left;padding:6px 10px">Question</th><th style="text-align:left;padding:6px 10px">Bramwell example</th></tr>
 <tr><td style="padding:6px 10px">Technical fact</td><td style="padding:6px 10px">What happened?</td><td style="padding:6px 10px">Seven observed delivery addresses disappeared during transformation.</td></tr>
 <tr><td style="padding:6px 10px">Mechanism</td><td style="padding:6px 10px">Why did it happen?</td><td style="padding:6px 10px">The intended BILLING_ONLY exclusion also excluded records unless AddressPurpose was exactly DELIVERY_PRIMARY; DELIVERY_SECONDARY was valid.</td></tr>
 <tr><td style="padding:6px 10px">Affected scope</td><td style="padding:6px 10px">What population could the mechanism affect?</td><td style="padding:6px 10px">Must be established from evidence. Do not assume the seven observed records are the complete population.</td></tr>
 <tr><td style="padding:6px 10px">Evidence</td><td style="padding:6px 10px">What proves correction?</td><td style="padding:6px 10px">Corrected approved rule, affected-population analysis, rerun and regression evidence.</td></tr>
 <tr><td style="padding:6px 10px">Business / programme consequence</td><td style="padding:6px 10px">What does this invalidate or threaten?</td><td style="padding:6px 10px">Potential address completeness, dependent validation and confidence in the next cycle gate.</td></tr>
 <tr><td style="padding:6px 10px">Leadership action</td><td style="padding:6px 10px">What happens next?</td><td style="padding:6px 10px">Assign technical correction/retest, track evidence, expose consequence and close only when release criteria are met.</td></tr>
 </table></div>
 <div class="principle"><strong>The DML move</strong><br>Technical fact \u2192 affected scope \u2192 evidence \u2192 consequence \u2192 leadership action.</div>`
},
{
 id:"b10",nav:"Decision-grade language",title:"Turning detail into decision-grade language",type:"content",
 html:`<p class="lead">The habits below are what separate a status update from something governance can actually act on.</p>
 <div class="visual-card">
   <div class="visual-title">Behaviours that build trust</div>
   <ul class="framework-checks">
     <li><strong>Seek evidence before recommending</strong> \u2014 ask what proves the status, not who feels confident.</li>
     <li><strong>Make unknowns visible</strong> \u2014 an explicit unknown with an owner is safer than an unsupported assumption.</li>
     <li><strong>Translate detail into consequence</strong> \u2014 explain what a defect changes for scope, evidence, delivery or business operation.</li>
     <li><strong>Surface bad news early</strong> \u2014 escalate while there are still choices.</li>
     <li><strong>Stay inside decision authority</strong> \u2014 do not invent business rules to rescue a schedule.</li>
     <li><strong>Separate recommendation from governance decision</strong> \u2014 advise clearly; let the authorised forum accept the risk or make the Go/No-Go decision.</li>
     <li><strong>Remain objective under pressure</strong> \u2014 do not lower the evidence bar simply because the date is close.</li>
   </ul>
 </div>
 <div class="tp-table-wrap" style="overflow-x:auto"><table class="framework-checks" style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:6px 10px">Weak</th><th style="text-align:left;padding:6px 10px">Strong</th></tr>
 <tr><td style="padding:6px 10px">\u201cCustomer migration is green.\u201d</td><td style="padding:6px 10px">\u201c18,573 were accepted, but the 42-record legal-entity defect means acceptance is not sufficient evidence of semantic correctness.\u201d</td></tr>
 <tr><td style="padding:6px 10px">\u201c45E needs fixing.\u201d</td><td style="padding:6px 10px">\u201c45E has no approved target equivalent. Finance authority must approve treatment; migration should not manufacture a value.\u201d</td></tr>
 <tr><td style="padding:6px 10px">\u201cAddress issue resolved.\u201d</td><td style="padding:6px 10px">\u201cThe seven observed addresses reappear after correction, but closure requires evidence of the mechanism-based affected population and regression.\u201d</td></tr>
 <tr><td style="padding:6px 10px">\u201cWe should probably go.\u201d</td><td style="padding:6px 10px">\u201cRecommendation is conditional on named evidence and decisions, with explicit change triggers.\u201d</td></tr>
 </table></div>
 <div class="principle"><strong>Key takeaway</strong><br>A recommendation is judged by the language and evidence behind it, not by how confidently it is delivered.</div>`
},
{
 id:"b11",nav:"Pressure test",title:"When \u201cready\u201d isn't ready",type:"mcq",
 html:`<p class="lead">Four days before go-live, Bramwell's Purchasing team flags that a reporting defect is still open.</p>
 <div class="status-grid">
   <div class="status-card"><strong>ETL</strong>Complete</div>
   <div class="status-card"><strong>Validation</strong>100% complete</div>
   <div class="status-card"><strong>Business sign-off</strong>Complete</div>
   <div class="status-card"><strong>Infrastructure</strong>Ready</div>
   <div class="status-card"><strong>Critical defect</strong>One reporting defect remains open</div>
 </div>
 <p>The defect does not affect migration execution, but Purchasing uses the report every day.</p>
 <div class="quote">\u201cWhat is your recommendation?\u201d</div>
 ${TPKit.fromField({
   title:`When "Ready" Isn't Ready`, name:"Darren", role:"Data Migration Lead", project:"Distribution ERP",
   src:"/assets/audio/InvoicingIssue-Darren.mp3",
   reflection:"Would you have recommended Go if a report the business relies on daily was still unavailable?"
 })}`,
 options:[
 "Delay the migration until the report is fixed.",
 "Proceed because the migration itself is unaffected.",
 "Assess operational impact, workaround, ownership and residual risk before recommending.",
 "Ask the Technical Lead to decide."
 ],
 feedback:[
 "You may eventually recommend delay, but first establish the real operational impact and available mitigation.",
 "Technical readiness is not the complete picture. The business must be able to operate afterwards.",
 "This is the strongest response. You are using the framework rather than reacting to one issue: \u201cThe defect may not prevent migration execution, but if the business relies on the output from day one, it is relevant to the readiness recommendation. I need the operational impact, workaround, owner and residual-risk acceptance before I treat it as non-blocking.\u201d",
 "The Technical Lead provides evidence. The Data Migration Lead integrates that evidence into the recommendation."
 ]
},
{
 id:"b12",nav:"Evidence brief",title:"Your turn: produce a DML evidence brief",type:"reflection",
 html:`<p class="lead">Do not copy the model wording from earlier in this lesson. Build your own evidence brief from the established Bramwell facts and defend the recommendation.</p>
 <div class="quote">\u201cAre we ready?\u201d</div>
 <p>Write the answer you would now give as a Data Migration Lead. Your response should explain how you would decide, not merely state Go or No-Go. Cover what is proved, what remains open, who owns each open item, and what would change your answer.</p>
 <textarea id="reflection" placeholder="I would not recommend a readiness decision from..."></textarea>
 <div class="voice-row">
   <button id="micButton" class="btn secondary" type="button">Use microphone</button>
   <span id="micStatus" class="small"></span>
 </div>
 <div style="margin-top:16px">
   <button id="analyseButton" class="btn primary" type="button">Get AI feedback</button>
 </div>
 <div id="reflectionFeedback"></div>`,
 minLength:60,
 checks:[
   { test:/18,573|42|belgian|legal entity/i, strength:"You grounded your brief in the actual Bramwell evidence rather than a generic statement.", gap:"Reference the specific evidence: 18,573 accepted, and the 42-record legal-entity defect." },
   { test:/99|45e|unresolved|open|decision/i, strength:"You kept the unresolved items genuinely open rather than resolving them yourself.", gap:"Name the specific unresolved items: CustomerGroup 99 and payment term 45E." },
   { test:/owner|finance|accountab|approve/i, strength:"You named who actually owns each open decision.", gap:"Say who owns each open decision, not just that one exists." },
   { test:/change|trigger|condition|before/i, strength:"You stated what evidence or decision would change your recommendation.", gap:"State explicitly what would need to happen before your answer would change." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">18,573 customers were submitted and accepted, with zero rejects, but that number alone proves nothing about correctness \u2014 the 42 UK customers sitting in the Belgian legal entity show a clean count can still be semantically wrong. Two business decisions are still open: what CustomerGroup 99 should become for the 18 affected German records, and what payment term 45E should translate to, and migration cannot resolve either on its own. My recommendation is conditional, not a Go or a No-Go: I need the semantic correction evidence for the legal-entity defect, a named owner and decision date for each of the two open treatments, and proof that the next execution cycle can still hit its window. Any one of those three failing to land would change my answer.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is strong professional thinking. You are approaching the question as a Data Migration Lead rather than as a technical specialist.":"You have the foundation. Strengthen the answer by naming the specific Bramwell evidence and owners rather than describing the approach in general terms."}</div>`
},
{
 id:"b13",nav:"Reflection",title:"How do you decide whether you are ready?",type:"reflection",
 html:`<p>You have just drafted a structured brief. Step back for a moment.</p>
 <div class="quote">\u201cAre we ready to migrate?\u201d</div>

 </div>
 <div style="margin-top:16px">

 <div id="reflectionFeedback"></div>`,

 checks:[
   { test:/evidence|facts|status|validation|reconciliation/i, strength:"You recognised that recommendations should be based on evidence rather than instinct.", gap:"Make the role of evidence explicit." },
   { test:/rehears|process|repeat|runbook|cutover/i, strength:"You considered whether the migration process itself has been proven.", gap:"Include whether the migration process has been rehearsed and proven." },
   { test:/business|user|operate|operational/i, strength:"You considered business impact rather than focusing only on technical completion.", gap:"Consider whether the business can operate successfully afterwards." },
   { test:/environment|infrastructure|security|integration|permission/i, strength:"You included environment readiness in the overall picture.", gap:"Include environment and integration readiness." },
   { test:/risk|impact|mitigat|defect/i, strength:"You referred to remaining risk and the need to understand its impact.", gap:"Explain how remaining risks, impact and mitigation should be assessed." },
   { test:/owner|accountab|responsib|accept/i, strength:"You recognised the importance of ownership or formal acceptance.", gap:"Mention risk ownership or formal business acceptance." },
   { test:/recommend|decision|ready|go.?no.?go/i, strength:"You connected the evidence to a clear readiness recommendation.", gap:"Connect the evidence clearly to a readiness recommendation." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">A Data Migration Lead should gather evidence across data readiness, migration process, business readiness, environment readiness and residual risk before making a recommendation. Their role is not simply to answer yes or no. It is to provide a recommendation that can be justified, explained and defended.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is strong professional thinking. You are approaching the question as a Data Migration Lead rather than as a technical specialist.":"You have the foundation. Strengthen the answer by covering the complete readiness picture rather than only one or two areas."}</div>`
},
{
 id:"b14",nav:"Summary",title:"If you remember nothing else",type:"content",
 html:`<p class="lead">A Data Migration Lead does not simply know the answer.</p>
 <p>They ensure the programme has enough trustworthy evidence to make the right decision.</p>
 <ul class="framework-checks lesson-outcomes">
   <li>Build a complete picture before recommending.</li>
   <li>Assess data, process, business, environments and risk.</li>
   <li>Own the migration workstream, not every task.</li>
   <li>Understand business impact, not just technical status.</li>
   <li>Follow a technical fact through to affected scope, evidence and consequence.</li>
   <li>Remain objective when pressure increases.</li>
 </ul>
 <div class="principle"><strong>Evidence before recommendation.</strong><br>A Data Migration Lead is not rewarded for answering fastest. They are trusted when the answer can be defended.</div>`
},
