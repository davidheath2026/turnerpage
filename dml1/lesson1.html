.trm-pillar.show{opacity:1}

.trm-pillar.active .trm-pillar-inner,.trm-pillar.pinned .trm-pillar-inner,.trm-pillar:focus-visible .trm-pillar-inner{border-color:var(--teal);box-shadow:0 16px 32px rgba(0,95,108,.18);transform:translateY(-3px)}

.trm-pillar.active .trm-card-pop,.trm-pillar.pinned .trm-card-pop{opacity:1;transform:translate(-50%,14px);pointer-events:auto}

.trm-pillar[data-pop="up"][data-side="right"].active .trm-card-pop,.trm-pillar[data-pop="up"][data-side="right"].pinned .trm-card-pop{transform:translate(0,-16px)}

const fiveQuestions=[
  {
    title:"Is the data ready?",
    short:"Completeness, accuracy and accepted issues",
    colour:"data",
    checks:["Data quality acceptable","Mapping complete","Ownership defined","Critical data validated","Exceptions understood"],
    detail:`<p>This is not the same as asking whether the data loaded successfully.</p>
    <p>A successful load proves that the migration process can move records. It does not prove that the records are complete, accurate or usable.</p>
    <p>An experienced Data Migration Lead asks whether known issues are understood, whether the affected data is material to the business, and whether the right people have accepted the consequences.</p>
    <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>A project once reported that 99.8% of customer records had migrated successfully. The remaining 0.2% included several of the organisation's largest customers. The percentage looked excellent. The business impact did not.</p></div></div>
    <div class="principle"><strong>Key takeaway</strong><br>Data readiness is about usability and understood risk, not a perfect percentage.</div>`
  },
  {
    title:"Has the migration process been proven?",
    short:"Rehearsal, repeatability and reconciliation",
    colour:"process",
    checks:["Strategy defined","Rehearsals completed","Cutover proven","Validation confirmed","Repeatable end-to-end"],
    detail:`<p>A migration process that has never been executed successfully is still unproven.</p>
    <p>Documentation matters, but successful rehearsals provide stronger evidence. They show whether the process can be repeated, whether teams understand their roles, whether reconciliations work, and whether the migration fits inside the available outage window.</p>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>If the runbook is complete, the process is ready.</p><p>A runbook records intent. A successful rehearsal provides evidence.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>Execution confidence comes from rehearsal, not optimism.</div>`
  },
  {
    title:"Is the business ready?",
    short:"Operational continuity and accepted risk",
    colour:"business",
    checks:["Process changes agreed","Users trained","Roles clearly defined","Adoption plan in place","Business sign-off obtained"],
    detail:`<p>This is often the most underestimated part of migration readiness.</p>
    <p>The technical migration may succeed while the business still struggles on Monday morning. Users may lack access, reports may be unavailable, support teams may be unprepared, or critical processes may rely on data that was never validated properly.</p>
    <p>The Data Migration Lead should understand whether users can operate, whether business owners have signed off the results, and whether remaining risks have been accepted by the people responsible for running the organisation afterwards.</p>
    <div class="principle"><strong>Key takeaway</strong><br>Migration success is measured by business continuity, not records loaded.</div>`
  },
  {
    title:"Are the environments ready?",
    short:"Infrastructure, access, integrations and performance",
    colour:"environment",
    checks:["Infrastructure stable","Performance adequate","Security configured","Access controlled","Monitoring in place"],
    detail:`<p>Even a well-designed migration process can fail in an unstable environment.</p>
    <p>Environment readiness includes infrastructure, security, permissions, connectivity, integrations, performance, monitoring and operational support.</p>
    <p>The right question is not simply whether an environment exists. It is whether the complete technical landscape can support both the migration and the business immediately afterwards.</p>
    <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>Many environment failures are not caused by missing servers. They are caused by overlooked dependencies: expired credentials, incomplete firewall rules, unavailable interfaces or permissions that were tested with the wrong user profile.</p></div></div>
    <div class="principle"><strong>Key takeaway</strong><br>An environment is ready only when the end-to-end process can operate inside it.</div>`
  },
  {
    title:"Are the remaining risks understood?",
    short:"Impact, ownership, mitigation and acceptance",
    colour:"risk",
    checks:["Risks identified and assessed","Mitigations effective","Open issues understood","Decisions documented","Final sign-offs obtained"],
    detail:`<p>No project reaches migration with zero risk.</p>
    <p>The professional question is whether the remaining risks are understood well enough to be managed. That means knowing what could go wrong, what the business impact would be, who owns the mitigation, and whether governance has accepted the residual risk.</p>
    <div class="callout misconception"><div class="callout-label">Common trap</div><p>A high-priority defect automatically means No-Go.</p><p>Not necessarily. Severity labels are useful, but business impact is what matters. A reporting defect with a reliable workaround may be acceptable. A defect that prevents invoices being raised may not be.</p></div>
    <div class="principle"><strong>Key takeaway</strong><br>Good projects do not eliminate every risk. They understand and manage risk intelligently.</div>`
  }
];

const readinessPillars=[
 {id:"data",name:"Data Quality",left:50,top:12.5,
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>`,
  tag:"Is the data complete, accurate and understood?",
  popText:"Data readiness is about usability and accepted risk, not a perfect load percentage.",
  detail:"A successful load proves that records can move. It does not prove they are complete, accurate or usable. Turner Page leads ask whether known issues are understood, whether the affected data matters to the business, and whether the right people have accepted the consequences.",
  bullets:["Completeness and accuracy checked","Mapping validated end-to-end","Known issues documented and accepted","Business impact of gaps understood"]
 },
 {id:"etl",name:"ETL & Migration",left:85.65,top:38.42,
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.9 4"/><path d="M20 20v-5h-5"/></svg>`,
  tag:"Has the build been rehearsed and proven end-to-end?",
  popText:"A runbook records intent. A successful rehearsal provides evidence.",
  detail:"Documentation matters, but a proven rehearsal is stronger evidence. It shows whether the process is repeatable, whether teams understand their roles, and whether it fits inside the available outage window.",
  bullets:["Extract, transform and load logic tested","Full rehearsal completed in the outage window","Process proven to be repeatable","Roles and responsibilities understood"]
 },
 {id:"validation",name:"Validation & Reconciliation",left:72.05,top:80.33,pop:"up",side:"right",
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>`,
  tag:"Can we prove the data landed correctly, not just assume it?",
  popText:"A high validation percentage can still hide the records that matter most.",
  detail:"Reconciliation turns a completed load into trusted evidence. Totals are checked, exceptions are investigated, and validation criteria are agreed before cutover, not improvised afterwards.",
  bullets:["Reconciliation totals matched","Validation criteria agreed in advance","Exceptions investigated and explained","Evidence retained for governance"]
 },
 {id:"business",name:"Business Readiness",left:27.95,top:80.33,pop:"up",side:"left",
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3.1-6 7-6s7 2.7 7 6"/><circle cx="17" cy="8" r="2.5"/><path d="M16 14.2c2.9.5 5 2.6 5 5.8"/></svg>`,
  tag:"Can the organisation operate the moment migration ends?",
  popText:"Migration success is measured by business continuity, not records loaded.",
  detail:"A technically successful migration can still fail on Monday morning if users cannot work. Turner Page leads check that process changes, training and sign-off are in place before recommending Go.",
  bullets:["Process changes agreed and communicated","Users trained and confident","Business owners have signed off","Support model ready for go-live"]
 },
 {id:"environment",name:"Environment",left:14.35,top:38.42,
  icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r=".6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r=".6" fill="currentColor" stroke="none"/></svg>`,
  tag:"Is the technical landscape stable enough to support the business?",
  popText:"Most environment failures come from overlooked dependencies, not missing servers.",
  detail:"Environment readiness covers infrastructure, security, permissions, integrations and monitoring. The real question is whether the whole landscape can support the migration and the business immediately afterwards.",
  bullets:["Infrastructure and performance proven","Access, security and permissions configured","Integrations and interfaces tested","Monitoring and support ready"]
 }
];

const ownershipSituations=[
 {q:"ETL packages are behind schedule.",a:"mine",why:"The Data Migration Consultants may build them, but the Data Migration Lead owns successful delivery of the ETL workstream."},
 {q:"Finance data contains invalid payment terms.",a:"other",why:"Finance owns its data. The Data Migration Lead ensures that the issue and business impact are understood and managed."},
 {q:"Validation criteria have not been agreed.",a:"shared",why:"The Data Migration Lead drives the process, but the business and project must agree what acceptable evidence looks like."},
 {q:"The programme needs a migration readiness recommendation.",a:"mine",why:"Providing an evidence-based recommendation is a core Data Migration Lead responsibility."},
 {q:"A technical defect requires a code fix.",a:"other",why:"The responsible technical team fixes it. The Data Migration Lead assesses the impact on migration readiness."},
 {q:"The project must decide Go or No-Go.",a:"shared",why:"Programme governance owns the final decision. The Data Migration Lead provides the migration evidence and recommendation."}
];
// "ownership" is really just a 3-option situations exercise (My
// responsibility / Shared / Someone else owns it) — reuse the
// generic `situations` block type instead of a bespoke renderer.
const ownershipItems = ownershipSituations.map((s, idx) => {
  const labelFor = (key) => key === "mine" ? "My responsibility" : key === "shared" ? "Shared responsibility" : "Someone else owns it";
  return {
    title: `Situation ${idx+1}`,
    question: s.q,
    options: ["mine","shared","other"].map(key => ({
      label: labelFor(key),
      correct: key === s.a,
      feedback: (key === s.a ? "Your answer aligns with Turner Page thinking.<br>" : "Consider the ownership boundary again.<br>") + s.why
    }))
  };
});

const blocks=[
{
 id:"b1",nav:"The challenge",title:"Are we ready to migrate?",type:"mcq",
 html:`<div class="promise">
 <div class="kicker">Our promise</div>
 <h3>The Turner Page Promise</h3>
 <p>We believe professional training should do more than transfer knowledge. It should improve professional judgement.</p>
 <p>Everything in this programme has been chosen because it helps you become a better Data Migration Lead on a real ERP project.</p>
 <div class="promise-lines"><div>Frameworks</div><div>Scenarios</div><div>Reflection</div><div>Assessment</div></div>
 <p><strong>If it does not improve the way you think, communicate or make decisions, it does not belong in this course.</strong></p>
 </div>
 <div class="callout experience">
 <div class="callout-label">Before you begin</div>
 <p>This lesson is not designed to test how much you already know. It is designed to change the way you think.</p>
 <p>By the end, you should approach migration readiness differently from how you did at the start.</p>
 </div>
 <p class="lead">It is Friday afternoon. The first full migration rehearsal is scheduled for next weekend.</p>
 <p>Senior stakeholders want reassurance. You have just reviewed the latest migration status when the Programme Manager asks for your recommendation.</p>
 <div class="status-grid">
   <div class="status-card"><strong>ETL development</strong>Complete</div>
   <div class="status-card"><strong>Migration environments</strong>Ready</div>
   <div class="status-card"><strong>Migration validation</strong>97% complete</div>
   <div class="status-card"><strong>Customer data</strong>380 records accepted with missing payment terms</div>
   <div class="status-card"><strong>Critical defects</strong>Two high-priority defects remain open</div>
 </div>
 <div class="quote">“Are we ready to migrate next weekend?”</div>
 <h3>Your instinctive response</h3>`,
 options:["We are ready to migrate.","We are not ready to migrate.","We are ready, provided the remaining risks are resolved.","I need further evidence before I can make a recommendation."],
 feedback:[
 "You may eventually recommend Go, but the status summary does not yet explain the impact of the outstanding issues.",
 "You may eventually recommend No-Go, but the status summary does not yet show that the remaining issues prevent a safe migration.",
 "Go with conditions may be the right outcome, but you need more evidence before defining those conditions.",
 "This is the strongest response at this stage. You have useful information, but not enough evidence to justify a recommendation."
 ]
},
{
 id:"b2",nav:"Why this role exists",title:"Why this role exists",type:"content",
 html:`<p class="lead">Many people describe the Data Migration Lead as the person responsible for moving data into the new system.</p>
 <p>That is only part of the role.</p>
 <p>The Programme Manager did not ask whether ETL development had finished. They did not ask whether validation had reached 100%. They asked whether the programme was ready to migrate.</p>
 <p>That question crosses technology, business readiness, governance, risk, people and timing. No single status report can answer it.</p>
 <p>The Data Migration Lead becomes valuable by bringing separate pieces of information together and asking:</p>
 <div class="quote">“Taken together, what do these facts tell us about migration readiness?”</div>

 <div class="visual-card">
   <div class="visual-title">From project information to programme decision</div>
   <div class="flow">
     <div class="flow-box"><div><strong>Project evidence</strong><span class="small">Data, business, technical and risk information</span></div></div>
     <div class="arrow">→</div>
     <div class="flow-box"><div><strong>Data Migration Lead</strong><span class="small">Combines, challenges and interprets the evidence</span></div></div>
     <div class="arrow">→</div>
     <div class="flow-box"><div><strong>Recommendation</strong><span class="small">A defensible view for programme governance</span></div></div>
   </div>
 </div>

 <div class="callout tp-insight"><img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true"><div class="tp-insight-content"><div class="callout-label">Turner Page insight</div><p>One of the biggest mistakes on ERP programmes is confusing status with readiness.</p>
 <p>A project can report green infrastructure, green ETL and green testing, yet still fail because the business cannot operate effectively afterwards.</p></div></div>

 <div class="callout misconception"><div class="callout-label">Common trap</div>
 <p><strong>The Data Migration Lead decides whether the project goes live.</strong></p>
 <p>Governance makes the decision. The Data Migration Lead provides the migration evidence and recommendation that help governance make the right decision.</p>
 </div>

 <div class="principle"><strong>Key takeaway</strong><br>A Data Migration Lead turns information into evidence and evidence into recommendations.</div>`
},
{
 id:"b3",nav:"The five questions",title:"The five questions every Data Migration Lead asks",type:"expandableList",
 layout:"loop",
 html:`<p class="lead">Turner Page Data Migration Leads use simple mental frameworks that help them ask the right questions consistently.</p>
 <p>Whenever somebody asks, “Are we ready?”, these five questions help build a complete picture.</p>
 <div class="visual-card framework-overview">
   <div class="visual-title">The Turner Page migration readiness framework</div>
   <div class="framework-grid">
    ${fiveQuestions.map((q,i)=>`
      <article class="framework-node ${q.colour}">
        <div class="framework-head">
          <div class="num">0${i+1}</div>
          <div class="framework-icon" aria-hidden="true">${["▦","↻","👥","▤","🛡"][i]}</div>
        </div>
        <h4>${q.title}</h4>
        <ul class="framework-checks">
          ${q.checks.map(item=>`<li>${item}</li>`).join("")}
        </ul>
      </article>`).join("")}
   </div>
   <div class="callout tp-insight">
     <img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true">
     <div class="tp-insight-content">
       <div class="callout-label">Turner Page insight</div>
       <p>A Turner Page Data Migration Lead does not begin by asking, “Are we ready?” They ask, “What evidence do we have that we are ready?” Only after all five readiness areas have been assessed should a recommendation be made.</p>
     </div>
   </div>
 </div>
 ${TPKit.fromField({
   title:"Before I Recommended Go", name:"Zoe", role:"Data Migration Lead", project:"Manufacturing ERP",
   src:"/assets/audio/5Questions-SignOff-Zoe.mp3",
   reflection:"Would you have recommended Go before working through all five readiness areas?"
 })}
 <p>Explore each question in detail before moving on.</p>`,
 items: fiveQuestions.map(q => ({ title:q.title, short:q.short, detail:q.detail })),
 takeawayHtml:`<div class="principle"><strong>Great Data Migration Leads do not ask whether the project is ready.</strong><br>They ask whether they have enough evidence to justify saying it is ready.</div>`
},
{
 id:"b4",nav:"Applying the framework",title:"Applying the five questions framework",type:"selectAll",
 html:`<p class="lead">Return to the original scenario.</p>
 <p>Before making a recommendation, review the available evidence again.</p>
 <div class="status-grid">
   <div class="status-card"><strong>ETL development</strong>Complete</div>
   <div class="status-card"><strong>Migration environments</strong>Ready</div>

   <div class="status-card"><strong>Critical defects</strong>Two high-priority defects remain open</div>
 </div>
 <h3>Your task</h3>
 <p>Select the additional evidence you would want before making a recommendation.</p>`,
 options:[
 "The business impact of the missing payment terms.",
 "What the remaining 3% of validation actually covers.",
 "The impact and agreed mitigation for the two high-priority defects.",
 "Whether the migration process has been successfully rehearsed.",
 "Whether the business has formally accepted the remaining risks."
 ],
 coaching:[
 "<strong>Yes. This matters.</strong><br>Knowing that payment terms are missing tells you little on its own. Are the customers active? Will invoices fail? Has Finance agreed a workable response? A Data Migration Lead needs to understand business impact, not simply identify a data issue.",
 "<strong>This is important.</strong><br>97% complete sounds reassuring, but percentages can mislead. If the remaining 3% contains critical balances or open orders, the risk may still be significant. Understand what remains, not just how much remains.",
 "<strong>Absolutely.</strong><br>A defect count tells you almost nothing. One defect may stop the business operating while several others may be cosmetic. Establish business impact, ownership and mitigation.",
 "<strong>Essential evidence.</strong><br>A process that has never run successfully is still unproven. Rehearsals show whether the migration can be repeated within the available time and whether the documented process actually works.",
 "<strong>Yes.</strong><br>No project reaches migration with zero risk. The important question is whether the remaining risks are understood, documented and accepted by the appropriate business owners."
 ],
 hint:"Explore all five evidence areas before continuing.",

},
{

 id:"b7",nav:"The readiness model",title:"The Turner Page Readiness Model™",type:"content",
 html:`<p class="lead">Technical ability gets you onto a migration project. Professional judgement earns the programme's trust.</p>
 <p>Turner Page Data Migration Leads don't reach a recommendation from instinct or a single dashboard. Watch how a recommendation is actually built.</p>

 <div class="visual-card trm-card">
   <div class="visual-title">The Turner Page Readiness Model™</div>
   <div class="trm-wrap" id="trmWrap">
     <svg class="trm-lines" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
       ${readinessPillars.map(p=>`<line class="trm-line" data-pillar="${p.id}" pathLength="100" x1="300" y1="300" x2="${(p.left/100*600).toFixed(1)}" y2="${(p.top/100*600).toFixed(1)}"></line>`).join("")}
     </svg>
     <div class="trm-center" id="trmCenter"><span class="trm-center-label" id="trmCenterLabel">Collecting Evidence</span></div>
     ${readinessPillars.map(p=>`
       <div class="trm-pillar" data-pillar="${p.id}" data-pop="${p.pop||""}" data-side="${p.side||""}" style="left:${p.left}%;top:${p.top}%" tabindex="0" role="button" aria-expanded="false">
         <div class="trm-pillar-inner">
           <div class="trm-icon" aria-hidden="true">${p.icon}</div>
           <div class="trm-name">${p.name}</div>
           <div class="trm-desc">${p.tag}</div>
         </div>
         <div class="trm-card-pop">
           <strong>${p.name}</strong>
           <p>${p.popText}</p>
         </div>
       </div>`).join("")}
   </div>
 </div>

 <div class="callout tp-insight">
   <img class="tp-insight-mark" src="/assets/turner-page-monogram.png" alt="" aria-hidden="true">
   <div class="tp-insight-content">
     <div class="callout-label">The Turner Page Insight</div>
     <p>“Professional Data Migration Leads don't make recommendations from instinct or a single dashboard. They combine evidence from five distinct areas before reaching a professional recommendation.”</p>
   </div>
 </div>

 <button id="trmExploreBtn" class="btn secondary" type="button" aria-expanded="false">Explore the Five Pillars</button>
 <div class="trm-pillar-cards" id="trmPillarCards" hidden>
   ${readinessPillars.map(p=>`
     <div class="trm-detail-card">
       <div class="trm-detail-icon" aria-hidden="true">${p.icon}</div>
       <h4>${p.name}</h4>
       <p>${p.detail}</p>
       <ul class="framework-checks">${p.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>
     </div>`).join("")}
 </div>

 <div class="principle"><strong>Trusted Data Migration Leads are not the people with the most confident opinions.</strong><br>They are the people whose recommendations can be defended, because they gathered evidence across all five pillars first.</div>`,
 // This diagram is a genuinely one-off visual (see AUTHORING-GUIDE.md
 // §6) — its interactivity is wired here via onMount rather than a
 // shared renderer, since no other lesson uses this component.
 onMount: ({ lesson }) => {
   const wrap = lesson.querySelector("#trmWrap");
   if(!wrap) return;
   const center = lesson.querySelector("#trmCenter");
   const centerLabel = lesson.querySelector("#trmCenterLabel");
   const pillars = [...wrap.querySelectorAll(".trm-pillar")];
   const lines = [...wrap.querySelectorAll(".trm-line")];
   const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
   let pinned = null;

   function highlight(name){
     pillars.forEach(p=>p.classList.toggle("active",p.dataset.pillar===name));
     lines.forEach(l=>l.classList.toggle("active",l.dataset.pillar===name));
     center.classList.toggle("active",!!name);
   }
   pillars.forEach(p=>{
     p.setAttribute("aria-expanded","false");
     p.addEventListener("mouseenter",()=>{if(!pinned)highlight(p.dataset.pillar)});
     p.addEventListener("mouseleave",()=>{if(!pinned)highlight(null)});
     p.addEventListener("focus",()=>{if(!pinned)highlight(p.dataset.pillar)});
     p.addEventListener("blur",()=>{if(!pinned)highlight(null)});
     p.addEventListener("click",(e)=>{
       e.stopPropagation();
       if(pinned===p.dataset.pillar){
         pinned=null;p.classList.remove("pinned");p.setAttribute("aria-expanded","false");highlight(null);
       }else{
         pillars.forEach(o=>{o.classList.remove("pinned");o.setAttribute("aria-expanded","false")});
         pinned=p.dataset.pillar;p.classList.add("pinned");p.setAttribute("aria-expanded","true");highlight(pinned);
       }
     });
     p.addEventListener("keydown",(e)=>{
       if(e.key==="Enter"||e.key===" "){e.preventDefault();p.click()}
     });
   });
   document.addEventListener("click",()=>{
     if(pinned){
       pinned=null;
       pillars.forEach(o=>{o.classList.remove("pinned");o.setAttribute("aria-expanded","false")});
       highlight(null);
     }
   });

   function run(){
     center.classList.add("show");
     pillars.forEach((p,idx)=>{
       setTimeout(()=>p.classList.add("show"),reduced?0:380+idx*160);
     });
     const lineDelay=reduced?0:380+pillars.length*160+250;
     setTimeout(()=>lines.forEach(l=>l.classList.add("drawn")),lineDelay);
     const textDelay=lineDelay+(reduced?0:1150);
     setTimeout(()=>{
       centerLabel.classList.add("fade");
       setTimeout(()=>{
         centerLabel.textContent="Professional Judgement → Migration Recommendation";
         centerLabel.classList.remove("fade");
       },reduced?0:280);
     },textDelay);
   }
   run();

   const exploreBtn = lesson.querySelector("#trmExploreBtn");
   const cardsWrap = lesson.querySelector("#trmPillarCards");
   if(exploreBtn && cardsWrap){
     exploreBtn.onclick=()=>{
       const opening=cardsWrap.hasAttribute("hidden");
       if(opening)cardsWrap.removeAttribute("hidden");else cardsWrap.setAttribute("hidden","");
       exploreBtn.textContent=opening?"Hide the Five Pillars":"Explore the Five Pillars";
       exploreBtn.setAttribute("aria-expanded",opening?"true":"false");
     };
   }
 }
},

 minLength:40,
 checks:[

   { test:/rehears|process|repeat|runbook|cutover/i, strength:"You considered whether the migration process itself has been proven.", gap:"Include whether the migration process has been rehearsed and proven." },
   { test:/business|user|operate|operational/i, strength:"You considered business impact rather than focusing only on technical completion.", gap:"Consider whether the business can operate successfully afterwards." },
   { test:/environment|infrastructure|security|integration|permission/i, strength:"You included environment readiness in the overall picture.", gap:"Include environment and integration readiness." },
   { test:/risk|impact|mitigat|defect/i, strength:"You referred to remaining risk and the need to understand its impact.", gap:"Explain how remaining risks, impact and mitigation should be assessed." },
   { test:/owner|accountab|responsib|accept/i, strength:"You recognised the importance of ownership or formal acceptance.", gap:"Mention risk ownership or formal business acceptance." },
   { test:/recommend|decision|ready|go.?no.?go/i, strength:"You connected the evidence to a clear readiness recommendation.", gap:"Connect the evidence clearly to a readiness recommendation." }
 ],
 modelAnswerHtml:`<h3>Turner Page model answer</h3>
 <div class="quote">A Data Migration Lead should gather evidence across data readiness, migration process, business readiness, environment readiness and residual risk before making a recommendation. Their role is not simply to answer yes or no. It is to provide a recommendation that can be justified, explained and defended.</div>`,
 mentorFeedbackHtml: (score) => `<div class="principle"><strong>Overall coaching</strong><br>${score>=8?"This is strong professional thinking. You are approaching the question as a Data Migration Lead rather than as a technical specialist.":"You have the foundation. Strengthen the answer by covering the complete readiness picture rather than only one or two areas."}</div>`
},
{

 html:`<p class="lead">A Data Migration Lead does not simply know the answer.</p>
