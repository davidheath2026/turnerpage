{
 id:"b1",nav:"Welcome",title:"Owning the migration workstream",type:"content",
 html:`<p class="lead">In Lesson 1, you learned how successful Data Migration Leads think.</p>
 <p>Now it's time to explore what they actually own.</p>
 <p>Many people believe the role is about organising meetings, chasing actions and reporting progress.</p>
 <p>Those activities matter. But they are not the job.</p>
 <p>A Data Migration Lead owns the successful delivery of the migration workstream.</p>
 <p>That means taking responsibility for readiness, quality, governance, communication, risk and successful delivery, not simply ensuring that tasks are completed.</p>
 <div class="promise">
  <div class="kicker">By the end of this lesson</div>
  <h3>You will be able to</h3>
  <ul class="framework-checks lesson-outcomes">
    <li>Explain the difference between managing tasks and owning a workstream.</li>
    <li>Understand what a Data Migration Lead is accountable for.</li>
    <li>Make better decisions when balancing scope, time and quality.</li>
    <li>Think like a workstream owner rather than a task manager.</li>
  </ul>
 </div>
 <div class="callout experience">
 <div class="callout-label">Before you begin</div>
 <p>This lesson moves quickly. From the next screen onwards, you'll be making real judgement calls, not just reading about them.</p>
 <p>By the end, you should notice yourself asking different questions than you did at the start.</p>

{
 id:"b3",nav:"Explore",title:"From task manager to workstream owner",type:"content",
 html:`<p class="lead">The biggest transition you'll make as a Data Migration Lead is changing how you measure success.</p>
 <p>A task manager asks:</p>
 <div class="quote">“What have we completed today?”</div>
 <p>A Data Migration Lead asks:</p>
 <div class="quote">“Are we more ready today than we were yesterday?”</div>
 <p>That difference sounds small.</p>
 <p>In reality, it changes almost every decision you make.</p>

 <h3>What do you actually own?</h3>
 <p>Although other specialists perform much of the migration work, you remain accountable for the overall health of the workstream.</p>
 <p>You own:</p>
 <ul class="framework-checks lesson-outcomes">
   <li>Migration scope.</li>
   <li>Governance and decision making.</li>
   <li>Delivery risks.</li>
   <li>The critical path.</li>
   <li>Migration quality.</li>
   <li>Executive reporting.</li>
   <li>Overall migration readiness.</li>
 </ul>
 <p>Notice something important.</p>
 <p>You do not need to complete every activity yourself. Instead, your responsibility is ensuring the right work happens, at the right time, by the right people, while continually moving the migration towards a successful go-live.</p>

 <h3>Think one level higher</h3>
 <p>Imagine an ETL developer reports:</p>
 <div class="quote">“The Customer load failed.”</div>
 <p>A technical consultant immediately asks:</p>
 <div class="quote">“Why did it fail?”</div>
 <p>A Data Migration Lead first asks:</p>
 <div class="quote">“What impact does this have on the project?”</div>
 <p>That question changes everything.</p>

 <details class="tp-details">
   <summary>See how a Data Migration Lead thinks this through</summary>
   <div class="tp-details-body">
     <p>Perhaps:</p>
     <ul class="framework-checks lesson-outcomes">
       <li>SIT can still continue.</li>
       <li>Another object can be migrated first.</li>
       <li>The failure only affects one country.</li>
       <li>The critical path remains unchanged.</li>
     </ul>
     <p>Or perhaps none of those are true. Your role is to understand the consequence before deciding the response.</p>
   </div>
 </details>

 <h3>The mindset shift</h3>
 <p>Instead of asking:</p>
 <div class="quote">Which task is late?</div>
 <p>Start asking:</p>
 <ul class="framework-checks lesson-outcomes">
   <li>Which milestone is threatened?</li>
   <li>Which business decision is outstanding?</li>
   <li>Which dependency worries me most?</li>
   <li>What does the Steering Committee need to know?</li>
 </ul>
 <p>That is the difference between managing migration activities and leading a migration workstream.</p>
 <div class="principle"><strong>Turner Page insight</strong><br>Outstanding Data Migration Leads spend less time managing today's tasks and more time ensuring tomorrow's migration succeeds.</div>`
},
