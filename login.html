<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turner Page Academy | Login</title>
<style>
:root{--deep:#005f6c;--teal:#0b7f8e;--line:#d9e8e8;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#f8fcfc,#eef7f7);color:#12343b}
.wrapper{max-width:680px;margin:60px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:42px;box-shadow:0 16px 40px rgba(0,0,0,.08)}
.logo{text-align:center;margin-bottom:18px}.logo img{height:56px}
.kicker{text-align:center;color:var(--teal);font-size:.8rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase}
h1{text-align:center;color:var(--deep);margin:10px 0 8px}
p{text-align:center;color:#5b7076;margin-bottom:28px}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:14px;border:1px solid #ccd;border-radius:10px;font-size:16px}
button{width:100%;margin-top:26px;padding:15px;border:0;border-radius:10px;background:var(--deep);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.error{margin-top:16px;color:#b00020;text-align:center;font-weight:600;min-height:22px}
.footer{text-align:center;margin-top:24px}
.footer a{color:var(--deep);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrapper">
<div class="card">
<div class="logo"><img src="assets/turner-page-logo.png" alt="Turner Page"></div>
<div class="kicker">Turner Page Academy</div>
<h1>Welcome back</h1>
<p>Sign in to continue your learning.</p>

<label>Email address</label>
<input id="email" type="email" autocomplete="email">

<label>Password</label>
<input id="password" type="password" autocomplete="current-password">

<button onclick="login()">Login</button>

<div id="error" class="error"></div>

<div class="footer">
Don't have an account?
<a href="enrol.html">Create one here</a>
</div>

</div>
</div>

<script>
function login(){
 const learner = JSON.parse(localStorage.getItem("tpLearner") || "{}");
 const email = document.getElementById("email").value.trim().toLowerCase();
 const password = document.getElementById("password").value;
 const error = document.getElementById("error");

 error.textContent = "";

 if(!learner.email){
   error.textContent = "No learner account found. Please enrol first.";
   return;
 }

 if(email !== learner.email || password !== learner.password){
   error.textContent = "Incorrect email or password.";
   return;
 }

 localStorage.setItem("tpCurrentLearner", JSON.stringify(learner));
 window.location.href = "lesson.html";
}
</script>
</body>
</html>
