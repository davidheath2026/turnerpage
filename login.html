<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turner Page Academy | Login</title>
<style>
:root{--tp:#005f6c;--line:#d8e9e9;}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef7f7}
.wrap{max-width:640px;margin:60px auto;padding:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:40px;box-shadow:0 12px 35px rgba(0,0,0,.08)}
.logo{text-align:center}.logo img{height:60px}
h1{text-align:center;color:var(--tp)}
label{display:block;margin:18px 0 6px;font-weight:600}
input{width:100%;padding:14px;border:1px solid #ccd;border-radius:10px;font-size:16px}
.password-row{position:relative}
#togglePwd{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px}
button.login{width:100%;margin-top:24px;padding:14px;border:0;border-radius:10px;background:var(--tp);color:#fff;font-weight:700;cursor:pointer}
.links{display:flex;justify-content:space-between;margin-top:18px;font-size:.95rem}
.links a{text-decoration:none;color:var(--tp)}
#error{margin-top:16px;color:#b00020;text-align:center;font-weight:600;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<div class="logo"><img src="assets/turner-page-logo.png"></div>
<h1>Sign in to Turner Page Academy</h1><p style='text-align:center;color:#5b7076;margin-top:-6px;margin-bottom:24px'>Continue your Data Migration learning journey.</p>

<form id="loginForm">
<label>Email address</label>
<input id="email" type="email" autocomplete="username">

<label>Password</label>
<div class="password-row">
<input id="password" type="password" autocomplete="current-password">
<button type="button" id="togglePwd">👁</button>
</div>

<button class="login" type="submit">Login</button>
</form>

<div id="error"></div>

<div class="links">
<a href="enrol.html">Create account</a>
<a href="#" onclick="alert('Forgot password will be available soon.');return false;">Forgot password?</a>
</div>

</div>
</div>

<script>
const email=document.getElementById('email');
const password=document.getElementById('password');
const error=document.getElementById('error');

email.value=localStorage.getItem("tpLastEmail")||"";
(email.value?password:email).focus();

document.getElementById("togglePwd").onclick=()=>{
 password.type=password.type==="password"?"text":"password";
 document.getElementById("togglePwd").textContent=password.type==="password"?"👁":"🙈";
};

document.getElementById("loginForm").addEventListener("submit",function(e){
 e.preventDefault();

 const learner=JSON.parse(localStorage.getItem("tpLearner")||"{}");
 const entered=email.value.trim().toLowerCase();
 const pwd=password.value;

 localStorage.setItem("tpLastEmail",entered);

 if(!learner.email){
   error.textContent="No learner account found. Please enrol first.";
   return;
 }

 if(entered!==learner.email||pwd!==learner.password){
   error.textContent="Incorrect email or password.";
   password.value="";
   password.focus();
   return;
 }

 localStorage.setItem("tpCurrentLearner",JSON.stringify(learner));
 window.location="lesson1.html";
});
</script>
</body>
</html>
